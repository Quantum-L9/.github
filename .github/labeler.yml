# Path-based PR auto-labeling config for actions/labeler.
# Complements .github/CODEOWNERS blast-radius paths where they overlap
# (ops/, community health, profile/, issue templates). Also covers paths
# CODEOWNERS does not yet list (docs/adr/, .github/workflows/). Keep
# labels.yml area:* names in sync with the keys below.

area:governance:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/adr/**"

area:ops:
  - changed-files:
      - any-glob-to-any-file: "ops/**"

area:issue-templates:
  - changed-files:
      - any-glob-to-any-file: ".github/ISSUE_TEMPLATE/**"

area:community-health:
  - changed-files:
      - any-glob-to-any-file:
          - "CODE_OF_CONDUCT.md"
          - "CONTRIBUTING.md"
          - "SECURITY.md"
          - "SUPPORT.md"
          - "PULL_REQUEST_TEMPLATE.md"

area:org-profile:
  - changed-files:
      - any-glob-to-any-file: "profile/**"

area:ci-self:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"
