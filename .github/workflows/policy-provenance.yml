name: Organization policy provenance

# Signs the policy bytes with the repository's GitHub OIDC identity.
# A signature from a pull request, or a signature without an owner admission,
# is not a release. This workflow does not write an admission record.

on:
  pull_request:
    paths:
      - policies/**
      - .github/workflows/policy-provenance.yml
  push:
    branches:
      - main
    paths:
      - policies/**
      - .github/workflows/policy-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attest:
    name: Attest organization policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/attest@e59cbc1ad1ac2d59339667419eb8cdde6eb61e3d # v3.2.0
        id: attest
        with:
          subject-path: policies/ORG_INVARIANTS.yaml
          predicate-type: https://github.com/Quantum-L9/.github/attestations/quantum-l9.org-governance-policy/v1
          predicate-path: policies/provenance-predicate.json

  release:
    name: Require an admitted default-branch release
    needs: attest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fail unless the default-branch signature and owner admission verify
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: 'cryptography==50.0.2'
          python3 policies/verify_release.py --subject policies/ORG_INVARIANTS.yaml --require-release
