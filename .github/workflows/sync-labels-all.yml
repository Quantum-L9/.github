# Syncs the org-standard label taxonomy to all active repos.
# Runs weekly (after governance-report) and on manual dispatch.
# Creates or updates labels; never deletes (additive only).
#
# This is the org-wide sweep. A newly born repository does not wait for it:
# repo-birth-bootstrap.yml applies the same labels at birth. Both read the
# desired label set from each repository's compiled governance plan
# (ops/compile-repo-governance.js), so labels land only where the repository's
# class enables remote_apply.labels.
name: Sync labels (org-wide)

on:
  schedule:
    - cron: "30 9 * * 1"  # Monday 09:30 UTC, after governance report
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only sync repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            // Label applicability is a class decision, made only by the
            // governance-plan compiler (docs/adr/0001-one-governance-brain.md).
            // Each repository gets its own verified plan; the sweep applies
            // plan.remote_apply.labels through the same helper the birth
            // bootstrap uses, so a birth and a sweep can never disagree.
            const {
              loadAuthority,
              GovernanceCompileError,
              gatherTargetFacts,
              compileVerifiedPlan,
              applyPlanLabels,
              remoteReader,
            } = require('./ops/plan-adapter.js');
            const DRY = process.env.DRY_RUN === 'true';
            const FILTER = process.env.FILTER;
            // The exact revision actions/checkout put on disk (GOV-019).
            const AUTHORITY_SHA = process.env.GITHUB_SHA;
            const authority = loadAuthority(fs);

            // Fail closed (ops/plan-adapter.js remoteReader): only a 404 is
            // "absent"; any other read failure fails that repository below.
            const exists = (owner, repo, path) => remoteReader(github, owner, repo).exists(path);
            const readText = (owner, repo, path) => remoteReader(github, owner, repo).readText(path);

            // Get all active repos
            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: 'Quantum-L9', type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            const rows = [];
            const failed = [];
            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              let plan;
              try {
                const facts = await gatherTargetFacts({
                  exists: (p) => exists(o, n, p),
                  readText: (p) => readText(o, n, p),
                }, authority.classes.marker_path);
                plan = compileVerifiedPlan({
                  fs, authority, authoritySha: AUTHORITY_SHA, repository: `${o}/${n}`, facts,
                });
              } catch (e) {
                // A sweep does not stop for one repository: an unresolvable
                // class is skipped and reported, never labelled as default.
                if (e instanceof GovernanceCompileError && e.code === 'class_resolution') {
                  rows.push([n, 'unresolved', `skipped: ${e.message}`]);
                  continue;
                }
                failed.push(n);
                rows.push([n, '?', `failed: ${e.message}`.slice(0, 160)]);
                continue;
              }
              const r = await applyPlanLabels({ github, owner: o, repo: n, plan, dry: DRY });
              const digest = plan.digest.value.slice(0, 12);
              if (!r.enabled) {
                rows.push([n, plan.repo_class.name, `SKIP: class does not remote-apply labels (plan ${digest})`]);
              } else if (DRY) {
                rows.push([n, plan.repo_class.name, `dry-run: would apply ${r.total} (plan ${digest})`]);
              } else {
                rows.push([n, plan.repo_class.name, `+${r.created} ~${r.updated} !${r.failed} of ${r.total} (plan ${digest})`]);
              }
            }

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Label sync (${mode}) — ${targets.length} repos`, 2)
              .addRaw(`**Governance authority:** \`${AUTHORITY_SHA}\`\n\n`)
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Class', header: true}, {data: 'Result', header: true}],
                ...rows.map(r => r.map(String))
              ])
              .write();

            if (failed.length) {
              core.setFailed(`${failed.length} repo(s) could not be planned: ${failed.join(', ')} — see job summary`);
            }
