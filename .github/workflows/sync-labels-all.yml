# Syncs the org-standard label taxonomy to all active repos, including this one.
# Runs weekly (after governance-report) and on manual dispatch.
# Creates or updates labels; never deletes (additive only).
#
# Auth: the governance GitHub App, whose GOVERNANCE_APP_ID /
# GOVERNANCE_APP_PRIVATE_KEY live on this repo's `governance-distribution`
# environment (CANONICAL_LAW §14). Environment values resolve only for a job
# that declares the environment; this job did not, so vars.GOVERNANCE_APP_ID
# was empty, every scheduled run failed at the token step, and the taxonomy
# never reached a repository.
#
# This is the org-wide sweep. A newly born repository does not wait for it:
# repo-birth-bootstrap.yml applies the same taxonomy, through the same parser
# (ops/label-taxonomy.js), at birth.
name: Sync labels (org-wide)

on:
  schedule:
    - cron: "30 9 * * 1"  # Monday 09:30 UTC, after governance report
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only sync repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require governance App credentials
        env:
          APP_ID: ${{ vars.GOVERNANCE_APP_ID }}
          APP_KEY: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID:-}" ] || [ -z "${APP_KEY:-}" ]; then
            echo "::error::GOVERNANCE_APP_ID / GOVERNANCE_APP_PRIVATE_KEY did not resolve — they must be visible to environment governance-distribution (CANONICAL_LAW §14)"
            exit 1
          fi

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            const { parseLabels } = require('./ops/label-taxonomy.js');
            const DRY = process.env.DRY_RUN === 'true';
            const FILTER = process.env.FILTER;

            // One parser, shared with repo-birth-bootstrap.yml and
            // scripts/sync-labels.sh — a birth and a sweep must never disagree
            // about what the taxonomy is.
            const labels = parseLabels(fs.readFileSync('.github/labels.yml', 'utf8'));

            if (labels.length === 0) {
              core.setFailed('No labels parsed from .github/labels.yml');
              return;
            }
            core.info(`Parsed ${labels.length} labels from .github/labels.yml`);

            // Get all active repos
            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: 'Quantum-L9', type: 'all', per_page: 100
            });
            // `.github` included: the repo that declares the taxonomy is not
            // exempt from carrying it.
            const targets = all.filter(r =>
              !r.archived && !r.fork &&
              (!FILTER || r.name.includes(FILTER))
            );

            const why = (e) => `${e.status || 'error'} ${String(e.message || e).split('\n')[0]}`;
            const rows = [];
            let failedRepos = 0;
            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              let created = 0, updated = 0, skipped = 0;
              const errors = [];

              for (const label of labels) {
                if (DRY) { skipped++; continue; }
                try {
                  await github.rest.issues.createLabel({
                    owner: o, repo: n,
                    name: label.name,
                    color: label.color,
                    description: label.description
                  });
                  created++;
                } catch (e) {
                  if (e.status === 422) {
                    // Already exists — update
                    try {
                      await github.rest.issues.updateLabel({
                        owner: o, repo: n,
                        name: label.name,
                        color: label.color,
                        description: label.description
                      });
                      updated++;
                    } catch (ue) {
                      errors.push(`update ${label.name}: ${why(ue)}`);
                    }
                  } else {
                    errors.push(`create ${label.name}: ${why(e)}`);
                  }
                }
              }
              if (errors.length) failedRepos++;
              rows.push([
                n,
                DRY ? 'dry-run' : `+${created} ~${updated} !${errors.length}`,
                errors.slice(0, 3).join('; '),
              ]);
            }

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Label sync (${mode}) — ${targets.length} repos, ${labels.length} labels`, 2)
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Result', header: true}, {data: 'Errors', header: true}],
                ...rows.map(r => r.map(String))
              ])
              .write();

            // A refused write is a red run. The old sweep counted every
            // non-422 error as "skipped" and stayed green, so a sweep that
            // wrote nothing looked like one with nothing to do.
            if (failedRepos) {
              core.setFailed(`${failedRepos} of ${targets.length} repositories had label write failures — see the job summary`);
            }
