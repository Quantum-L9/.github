name: Governance — PR

on:
  workflow_call:
    inputs:
      strict:
        type: boolean
        default: false   # ADVISORY BY DEFAULT — young infrastructure.
                         # Callers opt in per repo with `with: {strict: true}`.
                         # See docs/ADVISORY.md for the promotion ladder.
      gates:
        type: boolean
        default: true    # pr-files.yml (this repo) runs only the body job;
                         # pr-gates.yml already judges this repo's bodies.
      composer_from_cache:
        type: boolean
        default: false   # This repo's PR caller restores the composer the
                         # default-branch fetch saved. Other callers check
                         # the pin out themselves.
    secrets:
      # Optional. Pull-request callers use the cache and do not pass it.
      # Callers that check the pin out pass it as the checkout token.
      L9_GITHUB_READ_TOKEN:
        required: false

# Read-only by default; the one job that edits the PR body asks for write
# itself. `gates` reads the event payload and writes only the job summary.
permissions:
  contents: read

jobs:
  gates:
    if: inputs.gates && github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Never interpolate an Actions expression into script:. A boolean
          # input arrives as the string "true" or "false".
          STRICT: ${{ inputs.strict }}
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const fail = [];
            const sec = n => (body.match(new RegExp(`##\\s*${n}([\\s\\S]*?)(?=\\n##\\s|$)`,'i'))||[,''])[1];

            const problem = sec('Problem').replace(/<!--[\s\S]*?-->/g,'').replace(/Closes #\d*/i,'').trim();
            if (problem.length < 30) fail.push('**Problem** empty or boilerplate.');

            const risk = [...sec('Risk').matchAll(/^\s*-\s*\[([ xX])\]/gm)].filter(m => m[1] !== ' ');
            if (risk.length !== 1) fail.push(`**Risk**: check exactly one (found ${risk.length}).`);

            if (!/```[\s\S]*?```/.test(sec('Evidence')) && !/actions\/runs\/\d+/.test(sec('Evidence')))
              fail.push('**Evidence**: paste output or link a CI run.');

            for (const line of sec('Gates').split('\n')) {
              const m = line.match(/^\s*-\s*\[ \]\s*(.+)$/);
              if (m && !/(n\/a|not applicable|—|--|:)\s*\S{4,}/i.test(m[1]))
                fail.push(`**Gate** unchecked without reason: _${m[1].slice(0,60)}_`);
            }

            if (fail.length) {
              core.summary.addHeading('Governance gates',2).addList(fail).write();
              if (process.env.STRICT === "true") {
                core.setFailed(`${fail.length} gate issue(s).`);
              } else {
                core.notice(`${fail.length} advisory gate finding(s) — not blocking. See job summary.`);
              }
            }

  # Machine-owned PR-body regions (Changes by intent paths, Files touched,
  # Evidence staleness) follow every push, whoever made it: make pr, another
  # client, a bot, a web edit, a base change. The renderer is the one make pr
  # uses — Cursor-Governance ops/scripts/compose_pr_body.py at a pinned commit —
  # so there is no second implementation here. Reviewer text outside the
  # regions is never rewritten; an unchanged body is never PATCHed.
  body:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: pr-body-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      # Re-pin together with the ref below; docs/DISTRIBUTION.md "PR body".
      COMPOSER: Quantum-L9/Cursor-Governance@5039c379d8ba1263f504cfa527487386205e056c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false

      # Saved by validate-starters-composer.yml on the default branch, at
      # .cache/composer/ops/scripts. The cache version includes that path, so
      # a different restore path is a miss even when the key exists. A hit
      # means this job does not check out the private repository.
      - name: Restore pinned composer
        id: composer-cache
        if: inputs.composer_from_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/composer/ops/scripts
          key: l9-composer-5039c379d8ba1263f504cfa527487386205e056c
      - name: Require the pinned composer
        if: inputs.composer_from_cache && steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::pinned composer cache miss for key l9-composer-5039c379d8ba1263f504cfa527487386205e056c at path .cache/composer/ops/scripts; a miss includes a path or version mismatch"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ !inputs.composer_from_cache }}
        with:
          repository: Quantum-L9/Cursor-Governance
          ref: 5039c379d8ba1263f504cfa527487386205e056c
          path: composer
          # compose_pr_body.py imports org_dotgithub at load; both are stdlib-only.
          sparse-checkout: |
            ops/scripts/compose_pr_body.py
            ops/scripts/org_dotgithub.py
          sparse-checkout-cone-mode: false
          token: ${{ secrets.L9_GITHUB_READ_TOKEN }}
          persist-credentials: false
      # Quantum-L9/.github is private. The org PR template the derived sections
      # are recomposed from is checked out here, sparse to that one file, and
      # handed to the composer as a local file (--template). The composer runs
      # this PR's own code, so no credential ever enters its environment and it
      # makes no network read. github.token covers the org repository itself;
      # its own PRs compose from their own head and skip this checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.repository != format('{0}/.github', github.repository_owner)
        with:
          repository: ${{ github.repository_owner }}/.github
          path: org-template
          sparse-checkout: |
            .github/pull_request_template.md
          sparse-checkout-cone-mode: false
          token: ${{ secrets.L9_GITHUB_READ_TOKEN || github.token }}
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STRICT: ${{ inputs.strict }}
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const number = context.payload.pull_request.number;
            const cachedComposer = '.cache/composer/ops/scripts/compose_pr_body.py';
            const checkoutComposer = 'composer/ops/scripts/compose_pr_body.py';
            const composer = fs.existsSync(cachedComposer) ? cachedComposer : checkoutComposer;
            const report = async (status, detail) => {
              core.info(`${status}: ${detail}`);
              await core.summary.addHeading('PR body refresh', 2)
                .addTable([[{ data: 'status', header: true }, { data: 'detail', header: true }], [status, detail]])
                .write();
            };
            // The composer runs this PR's own validate_root_file_protection.py,
            // so it gets an allowlisted environment: not github-script's
            // INPUT_GITHUB-TOKEN (pull-requests: write) or the runner's ACTIONS_*
            // tokens. It reads the org template from the local checkout above
            // (--template), never over the network.
            const keep = new Set(['PATH', 'HOME', 'LANG', 'TMPDIR', 'TEMP', 'TMP', 'LD_LIBRARY_PATH', 'pythonLocation']);
            const env = Object.fromEntries(Object.entries(process.env)
              .filter(([k, v]) => (keep.has(k) || k.startsWith('LC_')) && typeof v === 'string'));
            env.GIT_TERMINAL_PROMPT = '0';
            const name = context.repo.repo;
            const run = (args) => execFileSync('python3', [composer, '--workspace', 'pr', ...args],
              { encoding: 'utf8', env, maxBuffer: 64 * 1024 * 1024 });
            // The org repository composes from the template at its own PR head;
            // every other repository from the org template checked out above.
            const template = name === '.github'
              ? 'pr/.github/pull_request_template.md'
              : 'org-template/.github/pull_request_template.md';
            if (!fs.existsSync(template)) {
              core.setFailed(`org PR template is not checked out at ${template}; the body is not refreshed without it`);
              return;
            }

            // The event payload can be older than the PR. Read the live PR and
            // refuse to describe a head this job did not check out.
            const checkedOut = execFileSync('git', ['-C', 'pr', 'rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const live = (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data;
            if (live.state !== 'open') return report('SKIPPED_CLOSED', `PR #${number} is ${live.state}`);
            if (live.head.sha !== checkedOut) {
              return report('SKIPPED_STALE_EVENT', `checked out ${checkedOut}, PR head is ${live.head.sha}; the newer event refreshes it`);
            }

            // Render from the body as it is now. If a reviewer edits it while
            // this runs, render again from their text rather than PATCH over it.
            // PATCH /pulls takes no precondition, so the residual window is the
            // final GET -> PATCH round trip; every other gap is closed here.
            let current = live;
            let next;
            let status;
            for (let attempt = 1; ; attempt += 1) {
              fs.writeFileSync('body.md', current.body || '');
              try {
                // --template: the template the derived sections (Type of Change,
                // Fix, Risk, Gates, Semantic change) are recomposed from on a new head.
                next = run(['--pr-base', live.base.sha, '--refresh-body', 'body.md', '--remote',
                  '--template', template, '--status-file', 'status.json']);
              } catch (e) {
                core.setFailed(`composer failed (${process.env.COMPOSER}): ${e.stderr || e.message}`);
                return;
              }
              status = JSON.parse(fs.readFileSync('status.json', 'utf8')).status;
              if (status === 'unmanaged') {
                return report('UNMANAGED', 'body has no machine-owned regions and was not composed by make pr; left as written');
              }
              if (status === 'unchanged') break;
              const now = (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data;
              if (now.head.sha !== live.head.sha || now.base.sha !== live.base.sha) {
                return report('SKIPPED_MOVED', 'the PR head or base changed during the refresh; the next event refreshes it');
              }
              if ((now.body || '') !== (current.body || '')) {
                if (attempt >= 3) {
                  return report('SKIPPED_MOVED', 'the body kept changing during the refresh; the next edit event refreshes it');
                }
                current = now;
                continue;
              }
              try {
                await github.rest.pulls.update({ ...context.repo, pull_number: number, body: next });
              } catch (e) {
                if (e.status === 403 || e.status === 404) {
                  core.warning(`PR body not refreshed: this token cannot edit PR #${number} (HTTP ${e.status}); fork PRs get a read-only token.`);
                  return report('BLOCKED_PERMISSION', `HTTP ${e.status}`);
                }
                throw e;
              }
              break;
            }

            // The inventory must equal the diff after the refresh, whatever wrote it.
            fs.writeFileSync('body.md', next);
            try {
              run(['--pr-base', live.base.sha, '--check-body', 'body.md']);
            } catch (e) {
              const msg = `Changes by intent does not match the diff: ${(e.stderr || e.message).trim()}`;
              if (process.env.STRICT === 'true') core.setFailed(msg); else core.notice(msg);
              return report('INVENTORY_MISMATCH', msg);
            }
            await report(status === 'unchanged' ? 'UNCHANGED' : status.toUpperCase(), `head ${live.head.sha} base ${live.base.sha}`);
