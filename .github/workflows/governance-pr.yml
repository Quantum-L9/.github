name: Governance — PR

on:
  workflow_call:
    inputs:
      strict:
        type: boolean
        default: false   # ADVISORY BY DEFAULT — young infrastructure.
                         # Callers opt in per repo with `with: {strict: true}`.
                         # See docs/ADVISORY.md for the promotion ladder.

permissions:
  contents: read
  pull-requests: write

jobs:
  gates:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const fail = [];
            const sec = n => (body.match(new RegExp(`##\\s*${n}([\\s\\S]*?)(?=\\n##\\s|$)`,'i'))||[,''])[1];

            // Drop the template's own "paste the error" fence, as pr-gates.yml does:
            // it is over 30 characters, so an untouched template passed this check.
            const problem = sec('Problem').replace(/<!--[\s\S]*?-->/g,'')
              .replace(/```[\s\S]*?```/g, m => m.includes('paste the error') ? '' : m)
              .replace(/Closes #\d*/i,'').trim();
            if (problem.length < 30) fail.push('**Problem** empty or boilerplate.');

            const risk = [...sec('Risk').matchAll(/^\s*-\s*\[([ xX])\]/gm)].filter(m => m[1] !== ' ');
            if (risk.length !== 1) fail.push(`**Risk**: check exactly one (found ${risk.length}).`);

            if (!/```[\s\S]*?```/.test(sec('Evidence')) && !/actions\/runs\/\d+/.test(sec('Evidence')))
              fail.push('**Evidence**: paste output or link a CI run.');

            // An unchecked gate needs a reason on the line: a separator (—, --, :) or
            // "n/a" / "not applicable", then at least 4 non-space characters. The
            // old /(sep)\s*\S{4,}/ demanded one 4+ character WORD right after the
            // separator, so "— no IAM change" and "— n/a — not this change" failed
            // while stating a reason. Bare "— n/a" (3 characters) still fails.
            const reasoned = item => {
              const m = item.match(/(?:—|--|:|\bn\/a\b|\bnot applicable\b)([\s\S]*)$/i);
              return !!m && m[1].replace(/\s+/g, '').length >= 4;
            };
            for (const line of sec('Gates').split('\n')) {
              const m = line.match(/^\s*-\s*\[ \]\s*(.+)$/);
              if (m && !reasoned(m[1].trim()))
                fail.push(`**Gate** unchecked without reason: _${m[1].slice(0,60)}_`);
            }

            if (fail.length) {
              core.summary.addHeading('Governance gates',2).addList(fail).write();
              if (${{ inputs.strict }}) {
                core.setFailed(`${fail.length} gate issue(s).`);
              } else {
                core.notice(`${fail.length} advisory gate finding(s) — not blocking. See job summary.`);
              }
            }
