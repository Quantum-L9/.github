# Audits all org repos for floating/non-SHA-pinned GitHub Actions references.
# Runs monthly. Reports findings as a GitHub issue.
name: SHA-pin audit (org-wide)

on:
  schedule:
    - cron: "0 12 15 * *"  # 15th of every month, 12:00 UTC
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only audit repos containing this string (blank = all)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          script: |
            const ORG = 'Quantum-L9';
            const FILTER = process.env.FILTER;
            // SHA pattern: 40 hex chars
            const SHA_RE = /^[0-9a-f]{40}$/;
            // uses: line pattern
            const USES_RE = /^\s*uses:\s+([^\s]+)@([^\s#]+)/;

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            const findings = [];

            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;

              // List workflow files
              let files;
              try {
                const resp = await github.rest.repos.getContent({
                  owner: o, repo: n, path: '.github/workflows'
                });
                files = resp.data.filter(f => f.name.endsWith('.yml') || f.name.endsWith('.yaml'));
              } catch (e) {
                continue; // No workflows directory
              }

              for (const file of files) {
                try {
                  const content = await github.rest.repos.getContent({
                    owner: o, repo: n, path: file.path
                  });
                  const text = Buffer.from(content.data.content, 'base64').toString('utf8');

                  for (const line of text.split('\n')) {
                    const m = line.match(USES_RE);
                    if (!m) continue;
                    const [, action, ref] = m;

                    // Skip docker:// and local actions
                    if (action.startsWith('docker://') || action.startsWith('./')) continue;

                    // Check if ref is a SHA
                    if (!SHA_RE.test(ref)) {
                      // Distinguish internal vs external
                      const isInternal = action.startsWith('Quantum-L9/');
                      findings.push({
                        repo: n,
                        file: file.name,
                        action,
                        ref,
                        severity: isInternal ? 'HIGH' : 'MEDIUM',
                        reason: isInternal
                          ? 'Internal action must be SHA-pinned'
                          : 'External action should be SHA-pinned'
                      });
                    }
                  }
                } catch (e) {
                  // Skip unreadable files
                }
              }
            }

            // Build report
            const high = findings.filter(f => f.severity === 'HIGH');
            const medium = findings.filter(f => f.severity === 'MEDIUM');

            const body = [
              '# SHA-Pin Audit Report',
              '',
              `**Date:** ${new Date().toISOString().slice(0, 10)}`,
              `**Repos scanned:** ${targets.length}`,
              `**Findings:** ${findings.length} (${high.length} HIGH, ${medium.length} MEDIUM)`,
              '',
              findings.length === 0
                ? '✅ All actions are SHA-pinned across the org.'
                : '',
              high.length > 0 ? '## HIGH — Internal actions not SHA-pinned\n' : '',
              high.length > 0
                ? '| Repo | File | Action | Current Ref |\n| --- | --- | --- | --- |'
                : '',
              ...high.map(f => `| \`${f.repo}\` | ${f.file} | \`${f.action}\` | \`@${f.ref}\` |`),
              '',
              medium.length > 0 ? '## MEDIUM — External actions not SHA-pinned\n' : '',
              medium.length > 0
                ? '| Repo | File | Action | Current Ref |\n| --- | --- | --- | --- |'
                : '',
              ...medium.map(f => `| \`${f.repo}\` | ${f.file} | \`${f.action}\` | \`@${f.ref}\` |`),
              '',
              '---',
              '_Generated by audit-pins-org.yml. Run `ops/pin-actions-sha.sh` to fix._',
            ].join('\n');

            // Create or update issue
            const TITLE = 'SHA-Pin Audit: org-wide findings';
            const existing = await github.rest.issues.listForRepo({
              owner: ORG, repo: '.github', state: 'open',
              labels: 'area:ci', per_page: 10
            });
            const prev = existing.data.find(i => i.title === TITLE);

            if (prev) {
              await github.rest.issues.update({
                owner: ORG, repo: '.github', issue_number: prev.number, body
              });
              core.info(`Updated issue #${prev.number}`);
            } else if (findings.length > 0) {
              const issue = await github.rest.issues.create({
                owner: ORG, repo: '.github', title: TITLE, body, labels: ['area:ci']
              });
              core.info(`Created issue #${issue.data.number}`);
            }

            core.summary.addRaw(body).write();
