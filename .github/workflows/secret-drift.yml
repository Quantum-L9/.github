# Secret drift: org Actions and Dependabot secret NAMES and update times
# compared with Infisical (project cursor-governance). It never writes a
# secret.
#
# Serves Quantum-L9/Cursor-Governance#870 and #892. The comparison is
# Cursor-Governance's ops/secrets/sync_actions_secrets.py in `--check` mode,
# with this frozen interface:
#
#   python3 ops/secrets/sync_actions_secrets.py --org <ORG> \
#     --app {actions,dependabot} [--check] [--report-json PATH] [NAME ...]
#
# `--check` reads names and `updated_at` only, never values. Exit 0 = in sync,
# 1 = drift or missing, 2 = plan or transport error. `--report-json` writes
# {"schema":"l9.secret-drift.v1","org","app","rows":[{"name",
# "org_updated_at","vault_updated_at","verdict"}]}.
#
# Auth, all from the governance-distribution environment (CANONICAL_LAW §14):
#   - the l9-governance-seeder App (GOVERNANCE_APP_ID variable +
#     GOVERNANCE_APP_PRIVATE_KEY secret), minted the same way
#     continuous-sync.yml does it. The App needs "Organization secrets: Read"
#     and "Dependabot secrets: Read".
#   - the Infisical machine identity (L9_INFISICAL_CLIENT_ID +
#     L9_INFISICAL_CLIENT_SECRET environment secrets), which capability_bind
#     reads in-process.
#
# This is a read-only report, not a seeding workflow, so it runs on a weekly
# schedule as well as on dispatch. Any drift, missing secret or tool error
# fails the job. The job summary and the uploaded JSON reports name the rows.

name: Secret drift (org secrets vs Infisical)

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 06:17 UTC.
    - cron: "17 6 * * 2"

permissions:
  contents: read

concurrency:
  group: secret-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-distribution
    steps:
      # One token per secret store, each limited to this repository. Org
      # secret endpoints need no repository access.
      - id: token-actions
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9
          repositories: .github
          permission-organization-secrets: read

      # create-github-app-token v3.3.0 (the latest v3) has no input for the
      # organization Dependabot secrets permission, and listing the permissions
      # a token may hold would drop that one. So this token carries the
      # installation's own permissions, still limited to this repository. It
      # is used only by the read-only `--check` below.
      - id: token-dependabot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # zizmor: ignore[github-app] -- v3.3.0; see the comment above
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9
          repositories: .github

      # The tool, read-only, at Cursor-Governance main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/Cursor-Governance
          ref: main
          path: governance
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Require credentials
        env:
          L9_INFISICAL_CLIENT_ID: ${{ secrets.L9_INFISICAL_CLIENT_ID }}
          L9_INFISICAL_CLIENT_SECRET: ${{ secrets.L9_INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${L9_INFISICAL_CLIENT_ID:-}" ] || missing+=(L9_INFISICAL_CLIENT_ID)
          [ -n "${L9_INFISICAL_CLIENT_SECRET:-}" ] || missing+=(L9_INFISICAL_CLIENT_SECRET)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::governance-distribution is missing environment secret(s): ${missing[*]} — add the Infisical machine identity"
            exit 1
          fi
          if [ ! -f governance/ops/secrets/sync_actions_secrets.py ]; then
            echo "::error::Cursor-Governance main has no ops/secrets/sync_actions_secrets.py"
            exit 1
          fi

      - name: Check org secrets against Infisical (names and update times only)
        working-directory: governance
        env:
          TOKEN_ACTIONS: ${{ steps.token-actions.outputs.token }}
          TOKEN_DEPENDABOT: ${{ steps.token-dependabot.outputs.token }}
          L9_INFISICAL_CLIENT_ID: ${{ secrets.L9_INFISICAL_CLIENT_ID }}
          L9_INFISICAL_CLIENT_SECRET: ${{ secrets.L9_INFISICAL_CLIENT_SECRET }}
          REPORT_DIR: ${{ runner.temp }}/secret-drift
        run: |
          set -uo pipefail
          mkdir -p "$REPORT_DIR"
          worst=0
          for app in actions dependabot; do
            if [ "$app" = actions ]; then token="$TOKEN_ACTIONS"; else token="$TOKEN_DEPENDABOT"; fi
            GH_TOKEN="$token" GITHUB_TOKEN="$token" \
            python3 ops/secrets/sync_actions_secrets.py \
              --org Quantum-L9 --app "$app" --check \
              --report-json "$REPORT_DIR/$app.json"
            rc=$?
            echo "$rc" > "$REPORT_DIR/$app.exit"
            case "$rc" in
              0) echo "$app: in sync" ;;
              1) echo "::error::$app: drift or missing secret(s) (exit 1)" ;;
              2) echo "::error::$app: plan or transport error (exit 2)" ;;
              *) echo "::error::$app: unexpected exit $rc" ;;
            esac
            [ "$rc" -eq 0 ] || worst=1
          done
          exit "$worst"

      - name: Write job summary
        if: always()
        env:
          REPORT_DIR: ${{ runner.temp }}/secret-drift
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib
          d = pathlib.Path(os.environ["REPORT_DIR"])
          print("## Secret drift — Quantum-L9 org secrets vs Infisical\n")
          print("Names and update times only; no value is read or written.\n")
          for app in ("actions", "dependabot"):
              code = (d / f"{app}.exit").read_text().strip() if (d / f"{app}.exit").exists() else "not run"
              print(f"### `{app}` (exit {code})\n")
              p = d / f"{app}.json"
              try:
                  report = json.loads(p.read_text())
              except (OSError, ValueError) as err:
                  print(f"No report: {type(err).__name__} reading {p.name}.\n")
                  continue
              if report.get("schema") != "l9.secret-drift.v1":
                  print(f"Report schema is {report.get('schema')!r}, not l9.secret-drift.v1.\n")
                  continue
              rows = report.get("rows") or []
              if not rows:
                  print("No rows.\n")
                  continue
              print("| name | verdict | org updated_at | vault updated_at |")
              print("|---|---|---|---|")
              for r in rows:
                  cells = [str(r.get(k) or "-").replace("|", "\\|") for k in ("name", "verdict", "org_updated_at", "vault_updated_at")]
                  print("| " + " | ".join(cells) + " |")
              print()
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: secret-drift-reports
          path: ${{ runner.temp }}/secret-drift/
          if-no-files-found: warn
          retention-days: 30
