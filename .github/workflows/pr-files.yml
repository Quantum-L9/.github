name: PR files touched

# This repository's own PRs get the same machine-owned body refresh every
# consumer gets through governance.yml -> governance-pr.yml. One renderer:
# Cursor-Governance ops/scripts/compose_pr_body.py, pinned in governance-pr.yml.
# The body checks stay in pr-gates.yml (strict here), so only the body job runs.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  body:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/governance-pr.yml
    with:
      strict: true
      gates: false
