name: PR files touched

# This repository's own PRs get the same machine-owned body refresh every
# consumer gets through governance.yml -> governance-pr.yml. One renderer:
# Cursor-Governance ops/scripts/compose_pr_body.py, pinned in governance-pr.yml.
# The body checks stay in pr-gates.yml (strict here), so only the body job runs.
#
# The composer files come from the cache validate-starters-composer.yml saves
# on the default branch. This pull_request workflow does not name the read
# token and does not run as pull_request_target.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  body:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/governance-pr.yml
    with:
      strict: true
      gates: false
      composer_from_cache: true
