# Scheduled preflight check — detects org-wide configuration drift.
# Runs monthly and on manual dispatch. Reports findings as a GitHub issue.
# Read-only: makes no changes, only observes.
name: Preflight (scheduled)

on:
  schedule:
    - cron: "0 10 1 * *"  # 1st of every month, 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Same pinned parser enforce-policies.yml reads policies/mandatory-files.yml with.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          pip install --only-binary=:all: "pyyaml==6.0.2"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const {
              loadRepoClasses,
              assessMandatoryFiles,
              summarizeMandatoryCoverage,
              describeMandatoryCoverage,
            } = require('./ops/repo-class-profile.js');
            const ORG = 'Quantum-L9';
            const findings = [];
            const info = (msg) => { core.info(msg); findings.push(`✓ ${msg}`); };
            const warn = (msg) => { core.warning(msg); findings.push(`⚠️ ${msg}`); };

            // 1. Check .github repo is public (inheritance requires it)
            const dotGithub = await github.rest.repos.get({ owner: ORG, repo: '.github' });
            if (dotGithub.data.private) {
              warn('.github repo is PRIVATE — all inheritance is disabled org-wide');
            } else {
              info('.github repo is public — inheritance active');
            }

            // 2. Mandatory-file compliance across repos, class-aware.
            // The class decision, waivers and exceptions are the ones
            // enforce-policies.yml enforces (ops/repo-class-profile.js); this
            // job only observes. Raw presence of the two seeded files is kept
            // as a separate, explicitly non-compliance number.
            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const active = all.filter(r => !r.archived && !r.fork && r.name !== '.github');

            // Only a 404 is absence; 403/5xx/not-a-file throw and stay unobserved.
            const readerFor = (repo) => {
              const cache = new Map();
              return (path) => {
                if (!cache.has(path)) {
                  cache.set(path, github.rest.repos.getContent({ owner: ORG, repo, path }).then(
                    (res) => {
                      if (!res.data || Array.isArray(res.data) || typeof res.data.content !== 'string') {
                        throw Object.assign(new Error(`${path} is not a readable file`), { status: 'NOT_A_FILE' });
                      }
                      return Buffer.from(res.data.content, 'base64').toString('utf8');
                    },
                    (e) => { if (e.status === 404) return null; throw e; },
                  ));
                }
                return cache.get(path);
              };
            };

            let policyError = null;
            let classes = null;
            let filesPolicy = null;
            try {
              classes = loadRepoClasses(fs);
              filesPolicy = JSON.parse(execSync(
                'python3 -c "import yaml,json,sys; print(json.dumps(yaml.safe_load(open(sys.argv[1]))))" policies/mandatory-files.yml',
                { encoding: 'utf8' },
              ));
            } catch (e) {
              policyError = e.message;
            }

            const RAW = ['.github/CODEOWNERS', '.github/dependabot.yml'];
            let rawBoth = 0;
            const rawUnobserved = [];
            const assessments = [];
            for (const repo of active) {
              const readText = readerFor(repo.name);
              const raw = await Promise.all(RAW.map(p => readText(p).then(t => t !== null, () => null)));
              if (raw.includes(null)) rawUnobserved.push(repo.name);
              else if (raw.every(Boolean)) rawBoth++;
              if (!policyError) {
                try {
                  assessments.push(await assessMandatoryFiles({ doc: classes, filesPolicy, repoName: repo.name, readText }));
                } catch (e) {
                  policyError = e.message;
                }
              }
            }

            const coverage = policyError ? null : summarizeMandatoryCoverage(assessments);
            const described = describeMandatoryCoverage(coverage, { policyError });
            (described.level === 'info' ? info : warn)(described.line);
            const rawLine = `Raw presence (not compliance): ${rawBoth}/${active.length} repos carry both ${RAW.join(' and ')}` +
              (rawUnobserved.length ? ` (${rawUnobserved.length} unobserved)` : '');
            findings.push(`ℹ️ ${rawLine}`);

            // 3. Check Actions permissions (org-level)
            try {
              const perms = await github.rest.actions.getGithubActionsPermissionsOrganization({ org: ORG });
              if (perms.data.allowed_actions === 'all') {
                info('Actions policy: all actions allowed org-wide');
              } else if (perms.data.allowed_actions === 'local_only') {
                warn('Actions policy: LOCAL_ONLY — cross-repo reusable workflows will FAIL');
              } else {
                warn(`Actions policy: ${perms.data.allowed_actions} — verify Quantum-L9/* is in allow-list`);
              }
            } catch (e) {
              findings.push(`? Actions policy: cannot read (${e.status || 'unknown'})`);
            }

            // Build report
            const body = [
              '# Preflight Report',
              '',
              `**Date:** ${new Date().toISOString().slice(0, 10)}`,
              `**Active repos:** ${active.length}`,
              coverage
                ? `**Mandatory-file compliance:** ${coverage.eligible ? `${coverage.compliant.length}/${coverage.eligible} eligible (${coverage.pct}%)` : 'not computed — no eligible repos'}`
                : '**Mandatory-file compliance:** UNOBSERVED',
              `**Raw presence (CODEOWNERS + dependabot, not compliance):** ${rawBoth}/${active.length}`,
              '',
              '## Findings',
              '',
              ...findings,
              '',
              ...described.sections.flatMap(sec => [sec, '']),
              '---',
              '_Generated by preflight-scheduled.yml. No changes were made._',
            ].join('\n');

            // Create or update the preflight issue
            const TITLE = 'Preflight: org configuration status';
            const existing = await github.rest.issues.listForRepo({
              owner: ORG, repo: '.github', state: 'open',
              labels: 'area:ops', per_page: 10
            });
            const prev = existing.data.find(i => i.title === TITLE);

            if (prev) {
              await github.rest.issues.update({
                owner: ORG, repo: '.github',
                issue_number: prev.number,
                body
              });
              core.info(`Updated issue #${prev.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: ORG, repo: '.github',
                title: TITLE,
                body,
                labels: ['area:ops']
              });
              core.info(`Created issue #${issue.data.number}`);
            }

            core.summary.addRaw(body).write();
