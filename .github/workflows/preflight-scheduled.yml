# Scheduled preflight check — detects org-wide configuration drift.
# Runs monthly and on manual dispatch. Reports findings as a GitHub issue.
# Read-only: makes no changes, only observes.
name: Preflight (scheduled)

on:
  schedule:
    - cron: "0 10 1 * *"  # 1st of every month, 10:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const ORG = 'Quantum-L9';
            const findings = [];
            const info = (msg) => { core.info(msg); findings.push(`✓ ${msg}`); };
            const warn = (msg) => { core.warning(msg); findings.push(`⚠️ ${msg}`); };

            // 1. Check .github repo is public (inheritance requires it)
            const dotGithub = await github.rest.repos.get({ owner: ORG, repo: '.github' });
            if (dotGithub.data.private) {
              warn('.github repo is PRIVATE — all inheritance is disabled org-wide');
            } else {
              info('.github repo is public — inheritance active');
            }

            // 2. Check seeding coverage across repos
            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const active = all.filter(r => !r.archived && !r.fork && r.name !== '.github');

            let seeded = 0, unseeded = [];
            for (const repo of active) {
              const checks = await Promise.all([
                github.rest.repos.getContent({ owner: ORG, repo: repo.name, path: '.github/CODEOWNERS' })
                  .then(() => true).catch(() => false),
                github.rest.repos.getContent({ owner: ORG, repo: repo.name, path: '.github/dependabot.yml' })
                  .then(() => true).catch(() => false),
              ]);
              if (checks.every(Boolean)) {
                seeded++;
              } else {
                unseeded.push(repo.name);
              }
            }

            const pct = Math.round((seeded / active.length) * 100);
            if (pct >= 90) {
              info(`Seeding coverage: ${pct}% (${seeded}/${active.length} repos)`);
            } else {
              warn(`Seeding coverage: ${pct}% (${seeded}/${active.length} repos) — ${unseeded.length} unseeded`);
            }

            // 3. Check Actions permissions (org-level)
            try {
              const perms = await github.rest.actions.getGithubActionsPermissionsOrganization({ org: ORG });
              if (perms.data.allowed_actions === 'all') {
                info('Actions policy: all actions allowed org-wide');
              } else if (perms.data.allowed_actions === 'local_only') {
                warn('Actions policy: LOCAL_ONLY — cross-repo reusable workflows will FAIL');
              } else {
                warn(`Actions policy: ${perms.data.allowed_actions} — verify Quantum-L9/* is in allow-list`);
              }
            } catch (e) {
              findings.push(`? Actions policy: cannot read (${e.status || 'unknown'})`);
            }

            // Build report
            const body = [
              '# Preflight Report',
              '',
              `**Date:** ${new Date().toISOString().slice(0, 10)}`,
              `**Active repos:** ${active.length}`,
              `**Seeded:** ${seeded} (${pct}%)`,
              '',
              '## Findings',
              '',
              ...findings,
              '',
              unseeded.length > 0 ? `## Unseeded repos\n\n${unseeded.map(r => `- \`${r}\``).join('\n')}` : '',
              '',
              '---',
              '_Generated by preflight-scheduled.yml. No changes were made._',
            ].join('\n');

            // Create or update the preflight issue
            const TITLE = 'Preflight: org configuration status';
            const existing = await github.rest.issues.listForRepo({
              owner: ORG, repo: '.github', state: 'open',
              labels: 'area:ops', per_page: 10
            });
            const prev = existing.data.find(i => i.title === TITLE);

            if (prev) {
              await github.rest.issues.update({
                owner: ORG, repo: '.github',
                issue_number: prev.number,
                body
              });
              core.info(`Updated issue #${prev.number}`);
            } else {
              const issue = await github.rest.issues.create({
                owner: ORG, repo: '.github',
                title: TITLE,
                body,
                labels: ['area:ops']
              });
              core.info(`Created issue #${issue.data.number}`);
            }

            core.summary.addRaw(body).write();
