# Continuous Sync: detects governance file drift and auto-opens PRs to restore.
# Runs weekly. The managed set is each repository's compiled governance plan
# (mandatory files with mode `managed`, after class waivers); if one drifts from
# its org template, a remediation PR restores it. A file the class waives or
# forbids is never restored. Repos can opt out with a .l9/no-sync marker file.
name: Continuous Sync (drift remediation)

on:
  schedule:
    - cron: "0 11 * * 2"  # Tuesday 11:00 UTC
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only check repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report drift only, no PRs)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            // Which files are managed for a repository is its compiled
            // governance plan's answer (docs/adr/0001-one-governance-brain.md):
            // plan.mandatory_files.effective entries with mode `managed`. A
            // file the repository's class waives or forbids is not in that set,
            // so drift repair can never restore it (GOV-016).
            const {
              loadAuthority,
              GovernanceCompileError,
              gatherTargetFacts,
              compileVerifiedPlan,
              managedRequirements,
              probeContent,
              remoteReader,
            } = require('./ops/plan-adapter.js');
            const DRY = process.env.DRY_RUN === 'true';
            const FILTER = process.env.FILTER;
            const BRANCH = 'chore/governance-sync';
            const ORG = 'Quantum-L9';
            // The exact revision actions/checkout put on disk (GOV-019).
            const AUTHORITY_SHA = process.env.GITHUB_SHA;
            const authority = loadAuthority(fs);
            // Org template bytes, read once per source the plans name.
            const templateCache = new Map();
            const template = (source) => {
              if (!templateCache.has(source)) templateCache.set(source, fs.readFileSync(source, 'utf8'));
              return templateCache.get(source);
            };
            // Fail closed (ops/plan-adapter.js remoteReader): only a 404 is
            // "absent". An unreadable opt-out, marker, or managed file fails
            // that repository — it is never "not opted out", "default class",
            // or "missing, restore it".
            const exists = (owner, repo, path) => remoteReader(github, owner, repo).exists(path);
            const readText = (owner, repo, path) => remoteReader(github, owner, repo).readText(path);

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            const rows = [];
            // Repositories this run could not evaluate or repair. Any entry
            // fails the run: green must mean every repository was checked.
            const failed = [];
            const unresolved = [];
            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              try {
                // Check for opt-out marker
                const optOut = await exists(o, n, '.l9/no-sync');

                if (optOut) {
                  rows.push([n, 'opted out (.l9/no-sync)']);
                  continue;
                }

                // The repository's plan decides what is managed. An unresolvable
                // class is skipped and reported — never repaired as default.
                let plan;
                try {
                  const facts = await gatherTargetFacts({
                    exists: (p) => exists(o, n, p),
                    readText: (p) => readText(o, n, p),
                  }, authority.classes.marker_path);
                  plan = compileVerifiedPlan({
                    fs, authority, authoritySha: AUTHORITY_SHA, repository: `${o}/${n}`, facts,
                  });
                } catch (e) {
                  if (e instanceof GovernanceCompileError && e.code === 'class_resolution') {
                    unresolved.push(n);
                    rows.push([n, `skipped: unresolvable repo class: ${e.message}`]);
                    continue;
                  }
                  // Missing authority SHA, a template defect, a failed read:
                  // this run's failure, never a quiet row.
                  throw e;
                }
                const managed = managedRequirements(plan);
                if (!managed.length) {
                  rows.push([n, `nothing managed for class ${plan.repo_class.name}`]);
                  continue;
                }

                // Check each managed file for drift
                const drifted = [];
                for (const { path, source } of managed) {
                  const expected = template(source);
                  const observed = await probeContent(github, { owner: o, repo: n, path });
                  if (observed.state === 'ERROR') {
                    // Unknown is not drift and not in-sync: fail the repository.
                    const err = observed.error || {};
                    throw new Error(`cannot read ${path}${err.status ? ` (HTTP ${err.status})` : ''}: ${err.message || err}`);
                  }
                  if (observed.state === 'ABSENT') {
                    drifted.push({ path, sha: null, expected });
                    continue;
                  }
                  if (!observed.data || Array.isArray(observed.data) || typeof observed.data.content !== 'string') {
                    throw new Error(`cannot compare ${path}: present but not a readable file`);
                  }
                  const actual = Buffer.from(observed.data.content, 'base64').toString('utf8');
                  if (actual.trim() !== expected.trim()) {
                    drifted.push({ path, sha: observed.data.sha, expected });
                  }
                }

                if (drifted.length === 0) {
                  rows.push([n, 'in sync']);
                  continue;
                }

                if (DRY) {
                  rows.push([n, `drift: ${drifted.map(d => d.path).join(', ')}`]);
                  continue;
                }

                // Open remediation PR
                try {
                  const base = repo.default_branch;

                  // An open PR on the sync branch is work in flight: it may carry
                  // review fixes, maintainer commits, or agent remediation. The
                  // reset below rebuilds the branch as "default branch tip", so
                  // anything else on it is discarded by construction, not by
                  // conflict. This check therefore MUST precede the ref write --
                  // it used to sit after it, so the branch was already clobbered
                  // by the time the workflow noticed the PR and reported
                  // "PR already open" (issue #60).
                  const openPR = await github.rest.pulls.list({
                    owner: o, repo: n, head: `${ORG}:${BRANCH}`, state: 'open'
                  });
                  if (openPR.data.length) {
                    rows.push([n, `PR #${openPR.data[0].number} already open — branch left alone`]);
                    continue;
                  }

                  const ref = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });

                  // Create or reset branch. Safe only because no PR is open on it:
                  // see the guard above.
                  try {
                    await github.rest.git.createRef({
                      owner: o, repo: n, ref: `refs/heads/${BRANCH}`, sha: ref.data.object.sha
                    });
                  } catch (e) {
                    if (e.status === 422) {
                      await github.rest.git.updateRef({
                        owner: o, repo: n, ref: `heads/${BRANCH}`, sha: ref.data.object.sha, force: true
                      });
                    } else throw e;
                  }

                  for (const d of drifted) {
                    const existing = await probeContent(github, { owner: o, repo: n, path: d.path, ref: BRANCH });
                    if (existing.state === 'ERROR') {
                      throw new Error(`cannot read ${d.path} on ${BRANCH}: ${(existing.error || {}).message || existing.error}`);
                    }

                    await github.rest.repos.createOrUpdateFileContents({
                      owner: o, repo: n, path: d.path, branch: BRANCH,
                      message: `chore(governance): restore ${d.path} to org standard`,
                      content: Buffer.from(d.expected).toString('base64'),
                      sha: existing.state === 'PRESENT' ? existing.data.sha : undefined,
                    });
                  }

                  // No open-PR branch here: the guard above returned early for
                  // those, so this always opens a fresh PR.
                  {
                    const pr = await github.rest.pulls.create({
                      owner: o, repo: n, head: BRANCH, base,
                      title: 'chore(governance): restore drifted governance files',
                      body: [
                        'Governance files have drifted from the org standard.',
                        '',
                        `**Repo class:** \`${plan.repo_class.name}\` (${plan.repo_class.resolved_from}) · governance plan: authority \`${plan.authority.sha}\`, digest \`${plan.digest.value}\`.`,
                        '',
                        '**Restored:**',
                        ...drifted.map(d => `- \`${d.path}\``),
                        '',
                        'This is advisory — merge at your convenience.',
                        'To opt out of automatic sync, create `.l9/no-sync` in your repo.',
                        '',
                        '_Opened by Quantum-L9/.github continuous-sync._',
                      ].join('\n'),
                    });
                    rows.push([n, `PR #${pr.data.number} (${drifted.length} files)`]);
                  }
                } catch (e) {
                  failed.push(n);
                  rows.push([n, `failed: ${(e.message || '').slice(0, 60)}`]);
                }

              } catch (e) {
                failed.push(n);
                const msg = `${e.message || e}`.replace(/\s+/g, ' ').slice(0, 160);
                core.error(`${n}: not evaluated: ${msg}`);
                rows.push([n, `FAILED — not evaluated: ${msg}`]);
              }
            }

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Continuous Sync (${mode}) — ${targets.length} repos`, 2)
              .addRaw(`**Governance authority:** \`${AUTHORITY_SHA}\`\n\n`)
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Status', header: true}],
                ...rows.map(r => r.map(String))
              ])
              .write();

            if (unresolved.length) {
              core.warning(
                `${unresolved.length} repo(s) declare an unresolvable class and were not synced: ` +
                  `${unresolved.join(', ')} — fix the marker`,
              );
            }
            if (failed.length) {
              core.setFailed(`${failed.length} repo(s) could not be evaluated or repaired: ${failed.join(', ')} — see job summary`);
            }
