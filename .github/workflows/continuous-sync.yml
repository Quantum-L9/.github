# Manual Update: detects governance file drift and opens PRs to restore it.
# Manual only (workflow_dispatch). Nothing schedules it and no push starts it.
#   Preview (dry_run=true, the default): reports drift per repo, writes nothing.
#   Apply   (dry_run=false):             one reviewable PR per drifted repo.
# Repos can opt out with a .l9/no-sync marker file.
# Rollout of the rendered dependabot.yml (ADR 0019): do not run Apply on a
# .github revision without ops/render-dependabot.js; the older verbatim copy
# overwrites legitimate uv / pip / pre-commit entries with actions-only bytes.
# Until the renderer is merged, a repo with extra ecosystems opts out with
# .l9/no-sync. After it is merged, Preview one repo at a time and Apply per
# repo only on explicit operator approval (docs/DISTRIBUTION.md).
#
# Auth: the l9-governance-seeder App. Its GOVERNANCE_APP_ID variable and
# GOVERNANCE_APP_PRIVATE_KEY secret live on the governance-distribution
# environment (CANONICAL_LAW §14), so the job must run in that environment;
# outside it both resolve empty and token minting fails before any read.
#
# Class first: the repo's class (policies/repo-classes.yml, marker > override
# > default) and its root CODEOWNERS are resolved before anything is planned,
# and a path is eligible only when the class-filtered seed payload
# (ops/build-seed-payload.js) carries it. A malformed marker plans nothing.
# Managed (overwrite, not missing-only — docs/DISTRIBUTION.md):
#   .github/CODEOWNERS, .github/dependabot.yml   exact bytes, where the class
#     materializes them (self_governed does not; a root CODEOWNERS wins).
#     dependabot.yml is RENDERED per repository root by
#     ops/render-dependabot.js (ADR docs/adr/0019-dependabot-managed-rendered.md):
#     github-actions, plus uv / pip / pre-commit by what the root holds. The
#     root listing is read at the pinned base; a listing that is not a readable
#     directory is UNREACHABLE, never an actions-only render.
#   .github/pull_request_template.md             by repo class: a class that
#     seeds `pr-templates` carries the canonical bytes; a class that INHERITS
#     it carries no copy. A local copy that is byte-identical to the org
#     template is removed; a divergent one is BLOCKED_OWNERSHIP, never deleted
#   .github/workflows/governance.yml             re-pinned only: the
#     governance-pr/-issue `uses:` SHAs follow policies/governance-caller.yml;
#     the rest of a consumer's caller (e.g. `strict: true`) is theirs
# Alternate templates (PULL_REQUEST_TEMPLATE/, root or docs/ copies) are
# reported per repo for classification, never edited. A path another open PR
# already changes is BLOCKED_CONFLICT. Writes are one atomic commit per repo,
# moved by ops/seed-branch-safety.js (provenance + CAS).
name: Manual Update (governance drift remediation)

on:
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only check repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Preview: report drift only, no PRs. Uncheck to Apply."
        type: boolean
        default: true

permissions:
  contents: read

# One fleet writer at a time: two runs would race on the same sync branches.
concurrency:
  group: continuous-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          # Only an explicit Apply (dry_run=false) writes; anything else previews.
          DRY_RUN: ${{ inputs.dry_run }}
          FILTER: ${{ inputs.repo_filter || '' }}
          # The App's commit identity: an installation token cannot call /user,
          # so branch provenance is checked against `<app-slug>[bot]`.
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            const {
              loadRepoClasses, classForRepo, resolveProfile, matchPattern,
            } = require('./ops/repo-class-profile.js');
            const {
              SYNC_COMMIT_SUBJECT, assessSeedBranch, assessOpenPrOverlap, moveSeedBranch,
            } = require('./ops/seed-branch-safety.js');
            const { buildSeedPayload, seedNeedsRepoShape, probeRepoShape } = require('./ops/build-seed-payload.js');
            const DRY = process.env.DRY_RUN !== 'false';
            const FILTER = process.env.FILTER;
            const BRANCH = 'chore/governance-sync';
            const ORG = 'Quantum-L9';
            const TEMPLATE = '.github/pull_request_template.md';
            const CALLER = '.github/workflows/governance.yml';
            const SYNC_LOGIN = process.env.APP_SLUG ? `${process.env.APP_SLUG}[bot]` : '';
            const SOURCE_SHA = process.env.GITHUB_SHA || 'unknown';
            // Any ref form (full SHA, tag, branch, short SHA): only the
            // canonical full SHA is in sync.
            const PIN_RE = /(Quantum-L9\/\.github\/\.github\/workflows\/governance-(?:pr|issue)\.yml@)([^\s#'"]+)/g;
            const ALT_NAME = /^pull_request_template(\.md)?$/i;

            const classes = loadRepoClasses(fs);
            const canonicalTemplate = fs.readFileSync(TEMPLATE, 'utf8');
            const canonicalPin = (fs.readFileSync('policies/governance-caller.yml', 'utf8')
              .match(/governance-pr\.yml@([0-9a-f]{40})/) || [])[1];
            if (!canonicalPin) {
              core.setFailed('policies/governance-caller.yml carries no governance-pr.yml@<sha> pin');
              return;
            }
            // Fully managed, exact bytes, where the class payload carries them.
            const MANAGED = ['.github/CODEOWNERS', '.github/dependabot.yml'];

            // 404 is an answer ("absent"). Anything else is not, and must not
            // be read as "in sync" — that used to report unreadable repos as clean.
            // Every read names the pinned base sha; an unpinned read is refused.
            const read = async (o, n, path, ref) => {
              if (!ref) throw Object.assign(new Error(`${path}: read without a pinned base`), { phase: 'read' });
              try {
                const r = await github.rest.repos.getContent({ owner: o, repo: n, path, ref });
                if (Array.isArray(r.data)) return { state: 'dir', entries: r.data };
                return { state: 'present', sha: r.data.sha, text: Buffer.from(r.data.content || '', 'base64').toString('utf8') };
              } catch (e) {
                if (e.status === 404) return { state: 'absent' };
                throw Object.assign(e, { phase: 'read' });
              }
            };
            // Exact bytes: whitespace-only drift is drift.
            const same = (a, b) => a === b;

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            const rows = [];
            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              let klass = '-';
              const notes = [];
              const row = (status, detail) => rows.push([n, klass, status, [detail, ...notes].filter(Boolean).join('; ')]);
              try {
                // The whole plan — the .l9/no-sync opt-out included — is read at
                // one pinned commit; the base is re-checked just before the ref
                // move, so nothing planned can change underneath it unseen. An
                // opt-out committed after the pin moves the base: BASE_MOVED.
                const base = repo.default_branch;
                let baseSha;
                try {
                  baseSha = (await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` })).data.object.sha;
                } catch (e) {
                  if (e.status === 409 && /^Git Repository is empty\.?$/i.test(String(e.message || '').trim())) {
                    row('UNINITIALIZED', 'Git Repository is empty — nothing to sync');
                    continue;
                  }
                  throw Object.assign(e, { phase: 'read' });
                }
                if (typeof baseSha !== 'string' || !baseSha) {
                  throw Object.assign(new Error(`${base} could not be pinned to a commit`), { phase: 'read' });
                }

                const noSync = await read(o, n, '.l9/no-sync', baseSha);
                if (noSync.state === 'dir') throw Object.assign(new Error('.l9/no-sync is a directory'), { phase: 'read' });
                if (noSync.state === 'present') {
                  row('OPTED_OUT', '.l9/no-sync');
                  continue;
                }

                // Class before plan: a declared class that cannot be honoured
                // plans nothing at all, managed files included.
                const marker = await read(o, n, classes.marker_path, baseSha);
                if (marker.state === 'dir') throw Object.assign(new Error(`${classes.marker_path} is a directory`), { phase: 'read' });
                const decided = classForRepo(classes, n, marker.state === 'present' ? marker.text : null);
                if (decided.error) {
                  klass = 'unresolved';
                  row('BLOCKED_POLICY', `class: ${decided.error} — nothing planned`);
                  continue;
                }
                const profile = resolveProfile(classes, decided.name);
                if (decided.name) profile.resolved_from = decided.source;
                klass = profile.name;
                const rootOwners = await read(o, n, 'CODEOWNERS', baseSha);
                if (rootOwners.state === 'present') notes.push('root CODEOWNERS present; .github/CODEOWNERS not managed');
                // The root listing, at the pin. It decides the rendered
                // dependabot ecosystems and is reused for the alternate-template
                // report below. Not a readable directory = not an answer.
                const rootListing = await read(o, n, '', baseSha);
                if (rootListing.state !== 'dir') {
                  throw Object.assign(new Error(`repository root is not a readable directory (${rootListing.state})`), { phase: 'read' });
                }
                let repoShape = null;
                if (seedNeedsRepoShape({ profile })) {
                  try {
                    repoShape = await probeRepoShape({
                      listRoot: async () => rootListing.entries,
                      readText: async (p) => {
                        const r = await read(o, n, p, baseSha);
                        if (r.state === 'dir') throw new Error(`${p} is a directory`);
                        return r.state === 'present' ? r.text : null;
                      },
                    });
                  } catch (e) {
                    throw Object.assign(e, { phase: 'read' });
                  }
                }
                // What this class materializes, from the one shared builder.
                const eligible = buildSeedPayload({
                  fs, profile, hasRootCodeowners: rootOwners.state === 'present', repository: `${o}/${n}`, repoShape,
                });

                // What this repository should carry: path -> {action, content, why, existed}.
                const plan = [];
                for (const path of MANAGED) {
                  if (!(path in eligible)) continue;
                  const cur = await read(o, n, path, baseSha);
                  if (cur.state !== 'present' || !same(cur.text, eligible[path])) {
                    plan.push({ path, action: 'write', content: eligible[path], why: 'restore', existed: cur.state === 'present' });
                  }
                }

                let inherited = false;
                let ownershipBlocked = false;
                const tpl = await read(o, n, TEMPLATE, baseSha);
                if (matchPattern(profile.inherit || [], TEMPLATE)) {
                  inherited = true;
                  // A local copy blocks inheritance. Only a byte-identical copy
                  // of the org template is provably ours to remove.
                  if (tpl.state === 'present') {
                    if (same(tpl.text, canonicalTemplate)) {
                      plan.push({ path: TEMPLATE, action: 'delete', why: 'remove', existed: true });
                    } else {
                      ownershipBlocked = true;
                      notes.push(`BLOCKED_OWNERSHIP ${TEMPLATE}: divergent local template, ownership unproven (reported, not deleted)`);
                    }
                  }
                } else if (TEMPLATE in eligible) {
                  if (tpl.state !== 'present' || !same(tpl.text, eligible[TEMPLATE])) {
                    plan.push({ path: TEMPLATE, action: 'write', content: eligible[TEMPLATE], why: 'restore', existed: tpl.state === 'present' });
                  }
                }
                if (CALLER in eligible) {
                  const caller = await read(o, n, CALLER, baseSha);
                  if (caller.state === 'present') {
                    const repinned = caller.text.replace(PIN_RE, `$1${canonicalPin}`);
                    if (!PIN_RE.test(caller.text)) {
                      notes.push('governance caller calls neither governance-pr.yml nor governance-issue.yml (reported, not edited)');
                    } else if (repinned !== caller.text) {
                      plan.push({ path: CALLER, action: 'write', content: repinned, why: 're-pin', existed: true });
                    }
                    PIN_RE.lastIndex = 0;
                  } else {
                    notes.push('governance caller absent (seeded missing-only by seed-governance)');
                  }
                }

                // GitHub also honours root and docs/ templates and a
                // PULL_REQUEST_TEMPLATE/ directory. Report them; never edit.
                for (const dir of ['', '.github', 'docs']) {
                  const listing = dir === '' ? rootListing : await read(o, n, dir, baseSha);
                  for (const e of listing.state === 'dir' ? listing.entries : []) {
                    const p = dir ? `${dir}/${e.name}` : e.name;
                    if (p !== TEMPLATE && (ALT_NAME.test(e.name) || /^pull_request_template$/i.test(e.name))) {
                      notes.push(`alternate template ${e.type === 'dir' ? 'dir ' : ''}${p} (reported, not edited)`);
                    }
                  }
                }

                if (plan.length === 0) {
                  row(ownershipBlocked ? 'BLOCKED_OWNERSHIP' : inherited ? 'INHERITED' : 'CANONICAL_COPY', 'in sync');
                  continue;
                }
                const summary = plan.map(d => `${d.why} ${d.path}`).join(', ');

                // Another open PR already changing a planned path would turn
                // this PR into a merge conflict. Refuse before any write.
                const overlap = await assessOpenPrOverlap({
                  github, owner: o, repo: n, branch: BRANCH, paths: plan.map(d => d.path),
                });
                if (overlap.action === 'block') {
                  row(overlap.status, `${overlap.reason} (${summary})`);
                  continue;
                }

                if (DRY) {
                  row('DRIFT', `dry run: ${summary}`);
                  continue;
                }

                // An open PR on the sync branch is work in flight: it may carry
                // review fixes, maintainer commits, or agent remediation. The
                // reset below rebuilds the branch as "default branch tip", so
                // anything else on it is discarded by construction, not by
                // conflict. This check therefore MUST precede the ref write --
                // it used to sit after it, so the branch was already clobbered
                // by the time the workflow noticed the PR and reported
                // "PR already open" (issue #60).
                const openPR = await github.rest.pulls.list({
                  owner: o, repo: n, head: `${ORG}:${BRANCH}`, state: 'open'
                });
                if (openPR.data.length) {
                  row('UPDATE_PENDING_MERGE', `PR #${openPR.data[0].number} already open — branch left alone (${summary})`);
                  continue;
                }

                // The branch is rebuilt as "default branch + one sync commit"
                // through the seeders' guarded path: it is replaced only when it
                // holds nothing but this workflow's own verified commit (subject,
                // committer identity, signature), and the move is a server-side
                // compare-and-swap on the sha that verdict was computed from.
                const gate = await assessSeedBranch({
                  github, owner: o, repo: n, base, branch: BRANCH,
                  subject: SYNC_COMMIT_SUBJECT, seederLogin: SYNC_LOGIN,
                });
                if (gate.action === 'skip') {
                  row('BLOCKED_POLICY', `${gate.reason} (${summary})`);
                  continue;
                }

                const baseCommit = await github.rest.git.getCommit({ owner: o, repo: n, commit_sha: baseSha });
                const treeItems = [];
                for (const d of plan) {
                  if (d.action === 'delete') {
                    treeItems.push({ path: d.path, mode: '100644', type: 'blob', sha: null });
                    continue;
                  }
                  const blob = await github.rest.git.createBlob({
                    owner: o, repo: n, content: Buffer.from(d.content).toString('base64'), encoding: 'base64',
                  });
                  treeItems.push({ path: d.path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }
                const tree = await github.rest.git.createTree({
                  owner: o, repo: n, base_tree: baseCommit.data.tree.sha, tree: treeItems,
                });
                const commit = await github.rest.git.createCommit({
                  owner: o, repo: n,
                  message: [
                    `chore(governance): sync ${plan.length} org-managed file(s)`,
                    '',
                    ...plan.map(d => `${d.why} ${d.path}`),
                  ].join('\n'),
                  tree: tree.data.sha,
                  parents: [baseSha],
                });
                // The commit is built on baseSha. If the default branch moved
                // since, do not publish it: the next Apply replans.
                const baseNow = (await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` })).data.object.sha;
                if (baseNow !== baseSha) {
                  row('BASE_MOVED', `${base} moved ${baseSha.slice(0, 7)} → ${baseNow.slice(0, 7)} during the run — branch not moved; re-run Apply (${summary})`);
                  continue;
                }
                const moved = await moveSeedBranch({
                  github, owner: o, repo: n, branch: BRANCH,
                  expectedSha: gate.sha, commitSha: commit.data.sha,
                });
                if (!moved.moved) {
                  row('BLOCKED_POLICY', `${moved.reason} (${summary})`);
                  continue;
                }

                // No open-PR branch here: the guard above returned early for
                // those, so this always opens a fresh PR.
                // Update-specific body in the sections governance-pr.yml
                // checks. Facts only: what changes, on which exact base, from
                // which source; nothing claims a check this run did not make.
                const additive = plan.every(d => d.action === 'write' && !d.existed);
                const pr = await github.rest.pulls.create({
                  owner: o, repo: n, head: BRANCH, base,
                  title: 'chore(governance): restore drifted governance files',
                  body: [
                    '## Problem',
                    '',
                    `${plan.length} governance file(s) managed by ${ORG}/.github have drifted from the org standard for this repository's class \`${klass}\` (${profile.resolved_from}) — see \`policies/repo-classes.yml\`.`,
                    '',
                    '## Fix',
                    '',
                    ...plan.map(d => `- **${d.why}** \`${d.path}\`` + (
                      d.action === 'delete' ? ` — this class inherits it live from ${ORG}/.github; this local copy is byte-identical to the org template and blocks that`
                        : d.why === 're-pin' ? ` — \`uses:\` pins moved to \`${canonicalPin}\`; the rest of the file is unchanged`
                          : ' — replaced with the org bytes')),
                    ...notes.filter(t => /^BLOCKED_OWNERSHIP/.test(t)).map(t => `- not changed: ${t}`),
                    '',
                    'Review and merge. To opt out of governance sync, create `.l9/no-sync` in your repo.',
                    '',
                    '## Risk',
                    '',
                    `- [${additive ? 'x' : ' '}] Low — additive, reversible, no data or contract change`,
                    `- [${additive ? ' ' : 'x'}] Medium — touches shared code, config, or a public interface`,
                    '- [ ] High — breaking change, migration, IAM/network, or irreversible',
                    '',
                    '## Evidence',
                    '',
                    '```text',
                    `source: ${ORG}/.github@${SOURCE_SHA}`,
                    `base:   ${base}@${baseSha}`,
                    `class:  ${klass} (${profile.resolved_from})`,
                    `changes (${plan.length}):`,
                    ...plan.map(d => `  ${d.action === 'delete' ? 'delete' : d.existed ? 'modify' : 'add'}  ${d.path}`),
                    '```',
                    '',
                    '## Gates',
                    '',
                    '- [x] No other open PR changed these paths when the update was planned (a PR opened later is not covered)',
                    "- [ ] Consumer CI passes on this PR — unverified: Manual Update neither runs nor observes this repository's checks",
                    '',
                    '_Opened by a manual Apply of Quantum-L9/.github continuous-sync.yml._',
                  ].join('\n'),
                });
                row('UPDATE_PR_OPEN', `PR #${pr.data.number} (${summary})`);
              } catch (e) {
                const status = e.status === 403 ? 'BLOCKED_PERMISSION' : e.phase === 'read' ? 'UNREACHABLE' : 'UNVERIFIED';
                row(status, `${e.status || ''} ${(e.message || '').slice(0, 80)}`.trim());
              }
            }

            const counts = {};
            for (const r of rows) counts[r[2]] = (counts[r[2]] || 0) + 1;
            const mode = DRY ? 'PREVIEW' : 'APPLY';
            core.summary
              .addHeading(`Manual Update (${mode}) — ${targets.length} repos`, 2)
              .addRaw(Object.entries(counts).map(([k, v]) => `${k}: ${v}`).join(' · ') + '\n\n')
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Class', header: true},
                 {data: 'Status', header: true}, {data: 'Detail', header: true}],
                ...rows.map(r => r.map(String))
              ])
              .write();
            // A repository nobody could read or write is not synchronized, and
            // the run must not read as if it were.
            const unresolved = rows.filter(r => ['UNREACHABLE', 'BLOCKED_PERMISSION', 'UNVERIFIED'].includes(r[2]));
            if (unresolved.length) {
              core.setFailed(`${unresolved.length} repo(s) not synchronized: ${unresolved.map(r => `${r[0]} (${r[2]})`).join(', ')}`);
            }
