# Continuous Sync: detects governance file drift and auto-opens PRs to restore.
# Runs weekly, on every main push that changes a managed source, and on demand.
# Repos can opt out with a .l9/no-sync marker file.
#
# Managed (overwrite, not missing-only — docs/DISTRIBUTION.md):
#   .github/CODEOWNERS, .github/dependabot.yml   every repo, exact bytes
#   .github/pull_request_template.md             by repo class
#     (policies/repo-classes.yml): a class that seeds `pr-templates` carries
#     the canonical bytes; a class that INHERITS it carries no copy, so a
#     divergent one is removed and GitHub serves this repo's template live
#   .github/workflows/governance.yml             re-pinned only: the
#     governance-pr/-issue `uses:` SHAs follow policies/governance-caller.yml;
#     the rest of a consumer's caller (e.g. `strict: true`) is theirs
# Alternate templates (PULL_REQUEST_TEMPLATE/, root or docs/ copies) are
# reported per repo for classification, never edited.
name: Continuous Sync (drift remediation)

on:
  schedule:
    - cron: "0 11 * * 2"  # Tuesday 11:00 UTC
  push:
    branches: [main]
    paths:
      - .github/pull_request_template.md
      - policies/governance-caller.yml
      - policies/CODEOWNERS
      - .github/dependabot.yml
      - policies/repo-classes.yml
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only check repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report drift only, no PRs)"
        type: boolean
        default: true

permissions:
  contents: read

# One fleet writer at a time: two runs would race on the same sync branches.
concurrency:
  group: continuous-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            const {
              loadRepoClasses, classForRepo, resolveProfile, matchPattern,
            } = require('./ops/repo-class-profile.js');
            const DRY = process.env.DRY_RUN === 'true';
            const FILTER = process.env.FILTER;
            const BRANCH = 'chore/governance-sync';
            const ORG = 'Quantum-L9';
            const TEMPLATE = '.github/pull_request_template.md';
            const CALLER = '.github/workflows/governance.yml';
            // Subjects this workflow writes. A sync branch carrying any other
            // commit holds someone's work and is never reset (fail closed).
            const SYNC_SUBJECT = /^chore\(governance\): (?:restore|remove|re-pin) \S/;
            const PIN_RE = /(Quantum-L9\/\.github\/\.github\/workflows\/governance-(?:pr|issue)\.yml@)([0-9a-f]{40})/g;
            const ALT_NAME = /^pull_request_template(\.md)?$/i;

            const classes = loadRepoClasses(fs);
            const canonicalTemplate = fs.readFileSync(TEMPLATE, 'utf8');
            const canonicalPin = (fs.readFileSync('policies/governance-caller.yml', 'utf8')
              .match(/governance-pr\.yml@([0-9a-f]{40})/) || [])[1];
            if (!canonicalPin) {
              core.setFailed('policies/governance-caller.yml carries no governance-pr.yml@<sha> pin');
              return;
            }
            // Managed for every repository, exact bytes (unchanged contract).
            const MANAGED = {
              '.github/CODEOWNERS': fs.readFileSync('policies/CODEOWNERS', 'utf8'),
              '.github/dependabot.yml': fs.readFileSync('.github/dependabot.yml', 'utf8'),
            };

            // 404 is an answer ("absent"). Anything else is not, and must not
            // be read as "in sync" — that used to report unreadable repos as clean.
            const read = async (o, n, path, ref) => {
              try {
                const r = await github.rest.repos.getContent({ owner: o, repo: n, path, ...(ref ? { ref } : {}) });
                if (Array.isArray(r.data)) return { state: 'dir', entries: r.data };
                return { state: 'present', sha: r.data.sha, text: Buffer.from(r.data.content || '', 'base64').toString('utf8') };
              } catch (e) {
                if (e.status === 404) return { state: 'absent' };
                throw Object.assign(e, { phase: 'read' });
              }
            };
            const same = (a, b) => a.trim() === b.trim();

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            const rows = [];
            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              let klass = '-';
              const notes = [];
              const row = (status, detail) => rows.push([n, klass, status, [detail, ...notes].filter(Boolean).join('; ')]);
              try {
                if ((await read(o, n, '.l9/no-sync')).state === 'present') {
                  row('OPTED_OUT', '.l9/no-sync');
                  continue;
                }

                // What this repository should carry: path -> {action, content, sha, why}.
                const plan = [];
                for (const [path, expected] of Object.entries(MANAGED)) {
                  const cur = await read(o, n, path);
                  if (cur.state !== 'present' || !same(cur.text, expected)) {
                    plan.push({ path, action: 'write', content: expected, why: 'restore' });
                  }
                }

                const marker = await read(o, n, classes.marker_path);
                const decided = classForRepo(classes, n, marker.state === 'present' ? marker.text : null);
                let inherited = false;
                if (decided.error) {
                  // A declared class we cannot honour: touch nothing class-dependent.
                  klass = 'unresolved';
                  notes.push(`class: ${decided.error}`);
                } else {
                  const profile = resolveProfile(classes, decided.name);
                  klass = profile.name;
                  const seeds = profile.seed_categories || [];
                  const tpl = await read(o, n, TEMPLATE);
                  if (matchPattern(profile.inherit || [], TEMPLATE)) {
                    inherited = true;
                    // A local copy blocks inheritance and is, by policy, not theirs.
                    if (tpl.state === 'present') {
                      plan.push({ path: TEMPLATE, action: 'delete', why: 'remove' });
                    }
                  } else if (seeds.includes('pr-templates') && !matchPattern(profile.forbid || [], TEMPLATE)) {
                    if (tpl.state !== 'present' || !same(tpl.text, canonicalTemplate)) {
                      plan.push({ path: TEMPLATE, action: 'write', content: canonicalTemplate, why: 'restore' });
                    }
                  }
                  if (seeds.includes('governance') && !matchPattern(profile.forbid || [], CALLER)) {
                    const caller = await read(o, n, CALLER);
                    if (caller.state === 'present') {
                      const repinned = caller.text.replace(PIN_RE, `$1${canonicalPin}`);
                      if (repinned !== caller.text) {
                        plan.push({ path: CALLER, action: 'write', content: repinned, why: 're-pin' });
                      }
                    } else {
                      notes.push('governance caller absent (seeded missing-only by seed-governance)');
                    }
                  }
                }

                // GitHub also honours root and docs/ templates and a
                // PULL_REQUEST_TEMPLATE/ directory. Report them; never edit.
                for (const dir of ['', '.github', 'docs']) {
                  const listing = await read(o, n, dir);
                  for (const e of listing.state === 'dir' ? listing.entries : []) {
                    const p = dir ? `${dir}/${e.name}` : e.name;
                    if (p !== TEMPLATE && (ALT_NAME.test(e.name) || /^pull_request_template$/i.test(e.name))) {
                      notes.push(`alternate template ${e.type === 'dir' ? 'dir ' : ''}${p} (reported, not edited)`);
                    }
                  }
                }

                if (plan.length === 0) {
                  row(decided.error ? 'BLOCKED_POLICY' : inherited ? 'INHERITED' : 'CANONICAL_COPY', 'in sync');
                  continue;
                }
                const summary = plan.map(d => `${d.why} ${d.path}`).join(', ');
                if (DRY) {
                  row('DRIFT', `dry run: ${summary}`);
                  continue;
                }

                const base = repo.default_branch;

                // An open PR on the sync branch is work in flight: it may carry
                // review fixes, maintainer commits, or agent remediation. The
                // reset below rebuilds the branch as "default branch tip", so
                // anything else on it is discarded by construction, not by
                // conflict. This check therefore MUST precede the ref write --
                // it used to sit after it, so the branch was already clobbered
                // by the time the workflow noticed the PR and reported
                // "PR already open" (issue #60).
                const openPR = await github.rest.pulls.list({
                  owner: o, repo: n, head: `${ORG}:${BRANCH}`, state: 'open'
                });
                if (openPR.data.length) {
                  row('UPDATE_PENDING_MERGE', `PR #${openPR.data[0].number} already open — branch left alone (${summary})`);
                  continue;
                }

                const ref = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });

                // Create, or reset an existing branch only when every commit on
                // it is one this workflow writes. A closed PR's branch can still
                // carry a person's commits; those are never discarded.
                try {
                  await github.rest.git.createRef({
                    owner: o, repo: n, ref: `refs/heads/${BRANCH}`, sha: ref.data.object.sha
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                  const cmp = await github.rest.repos.compareCommits({
                    owner: o, repo: n, basehead: `${base}...${BRANCH}`
                  }).then(r => r.data).catch(() => null);
                  const foreign = !cmp || !Array.isArray(cmp.commits)
                    || cmp.commits.some(c => !SYNC_SUBJECT.test(((c.commit && c.commit.message) || '').split('\n')[0]));
                  if (foreign) {
                    row('BLOCKED_POLICY', `${BRANCH} carries commits this workflow did not write (or could not be compared); left alone`);
                    continue;
                  }
                  await github.rest.git.updateRef({
                    owner: o, repo: n, ref: `heads/${BRANCH}`, sha: ref.data.object.sha, force: true
                  });
                }

                for (const d of plan) {
                  const onBranch = await read(o, n, d.path, BRANCH);
                  const sha = onBranch.state === 'present' ? onBranch.sha : undefined;
                  if (d.action === 'delete') {
                    if (sha) {
                      await github.rest.repos.deleteFile({
                        owner: o, repo: n, path: d.path, branch: BRANCH, sha,
                        message: `chore(governance): remove ${d.path} (inherited from ${ORG}/.github)`,
                      });
                    }
                    continue;
                  }
                  await github.rest.repos.createOrUpdateFileContents({
                    owner: o, repo: n, path: d.path, branch: BRANCH,
                    message: `chore(governance): ${d.why} ${d.path} to org standard`,
                    content: Buffer.from(d.content).toString('base64'),
                    sha,
                  });
                }

                // No open-PR branch here: the guard above returned early for
                // those, so this always opens a fresh PR.
                const pr = await github.rest.pulls.create({
                  owner: o, repo: n, head: BRANCH, base,
                  title: 'chore(governance): restore drifted governance files',
                  body: [
                    `Governance files have drifted from the ${ORG}/.github standard (class \`${klass}\`).`,
                    '',
                    ...plan.map(d => `- **${d.why}** \`${d.path}\`` + (
                      d.action === 'delete' ? ` — this class inherits it live from ${ORG}/.github; a local copy blocks that`
                        : d.why === 're-pin' ? ` — \`uses:\` pins moved to \`${canonicalPin}\`; the rest of the file is unchanged`
                          : ' — replaced with the org bytes')),
                    '',
                    'Review and merge. To opt out of automatic sync, create `.l9/no-sync` in your repo.',
                    '',
                    '_Opened by Quantum-L9/.github continuous-sync._',
                  ].join('\n'),
                });
                row('UPDATE_PR_OPEN', `PR #${pr.data.number} (${summary})`);
              } catch (e) {
                const status = e.status === 403 ? 'BLOCKED_PERMISSION' : e.phase === 'read' ? 'UNREACHABLE' : 'UNVERIFIED';
                row(status, `${e.status || ''} ${(e.message || '').slice(0, 80)}`.trim());
              }
            }

            const counts = {};
            for (const r of rows) counts[r[2]] = (counts[r[2]] || 0) + 1;
            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            core.summary
              .addHeading(`Continuous Sync (${mode}) — ${targets.length} repos`, 2)
              .addRaw(Object.entries(counts).map(([k, v]) => `${k}: ${v}`).join(' · ') + '\n\n')
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Class', header: true},
                 {data: 'Status', header: true}, {data: 'Detail', header: true}],
                ...rows.map(r => r.map(String))
              ])
              .write();
            // A repository nobody could read or write is not synchronized, and
            // the run must not read as if it were.
            const unresolved = rows.filter(r => ['UNREACHABLE', 'BLOCKED_PERMISSION', 'UNVERIFIED'].includes(r[2]));
            if (unresolved.length) {
              core.setFailed(`${unresolved.length} repo(s) not synchronized: ${unresolved.map(r => `${r[0]} (${r[2]})`).join(', ')}`);
            }
