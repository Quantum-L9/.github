name: Validate starters

# Semantic closure on every event. The starter suite runs here only for a
# pull request, using the composer cache saved on the default branch. This
# file does not name the read token. A cache miss fails closed.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-starters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-starters.sh
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned YAML parser and schema validator
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2" "jsonschema==4.23.0"
      - name: Restore pinned composer
        id: composer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/composer/ops/scripts
          key: l9-composer-5039c379d8ba1263f504cfa527487386205e056c
      - name: Require the pinned composer
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::the default branch has not saved the pinned composer cache"
          exit 1
      - name: Run ops/validate-starters.sh
        env:
          SEED_COMPOSER_ROOT: .cache/composer
        run: |
          chmod +x ops/validate-starters.sh
          ops/validate-starters.sh

  semantics:
    # Semantic Foundation closure (SC-*/RC-* checks). Same validator and
    # parser pin as the Makefile `validate` target; observational, fail-closed.
    name: validate-semantics.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned YAML parser
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"
      - name: Run scripts/validate-semantics.py
        run: |
          python3 scripts/validate-semantics.py
