name: Validate starters

# Semantic closure only. The starter suite checks out private
# Cursor-Governance, so it lives in validate-starters-composer.yml, which
# runs from the default branch and does not name the read token in a
# pull_request workflow.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-starters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantics:
    # Semantic Foundation closure (SC-*/RC-* checks). Same validator and
    # parser pin as the Makefile `validate` target; observational, fail-closed.
    name: validate-semantics.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned YAML parser
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"
      - name: Run scripts/validate-semantics.py
        run: |
          python3 scripts/validate-semantics.py
