name: Validate starters

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-starters-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-starters.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # ops/test-governance-report.js projects the real repository registry
      # through the same pinned parser governance-report.yml uses.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the pinned YAML parser
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"
      # ops/test-seed-pr-body.js renders seed PR bodies with the real PR-body
      # composer at the commit governance-pr.yml pins (the trigger suite keeps
      # this ref equal to that pin).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Quantum-L9/Cursor-Governance
          ref: 1a57fe7bdcb0e4001feabfddfa28b787d9df2156
          path: .cache/composer
          sparse-checkout: ops/scripts/compose_pr_body.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Run ops/validate-starters.sh
        env:
          SEED_COMPOSER_ROOT: .cache/composer
        run: |
          chmod +x ops/validate-starters.sh
          ops/validate-starters.sh

  semantics:
    # Semantic Foundation closure (SC-*/RC-* checks). Same validator and
    # parser pin as the Makefile `validate` target; observational, fail-closed.
    name: validate-semantics.py
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the pinned YAML parser
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"
      - name: Run scripts/validate-semantics.py
        run: |
          python3 scripts/validate-semantics.py
