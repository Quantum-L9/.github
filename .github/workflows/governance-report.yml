name: Governance report (advisory)

# Read-only weekly posture report. Opens/updates ONE issue in this repo.
#
# SCOPE BOUNDARY: this workflow does NOT run tests, lint, typecheck, scan code, or
# parse build logs. It reads governance METADATA only. Test/lint/build execution is
# owned by l9-ci-sdk and l9-ci-core; CI failure diagnosis by l9-ci-debt-resolver.
# See docs/BOUNDARIES.md.

on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The governed census is read from semantics/repository_registry.yaml with
      # the same pinned parser scripts/validate-semantics.py validates it with.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the pinned YAML parser
        run: |
          python3 -m pip install --disable-pip-version-check --only-binary=:all: "pyyaml==6.0.2"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const {
              STATES,
              pythonYamlParser,
              loadGovernedCensus,
              reconcileDiscovery,
              callerRefs,
              reusableWorkflowActionRefs,
              classifyActionsPermission,
              buildPostureReport,
            } = require('./ops/governance-report.js');
            const ORG = 'Quantum-L9';

            // Membership is the registry's admission decision, read at this
            // run's commit. A census that cannot be derived assesses nothing.
            let census;
            try {
              census = loadGovernedCensus({
                readBytes: (p) => fs.readFileSync(p),
                parseYaml: pythonYamlParser(execFileSync),
                revision: context.sha,
              });
            } catch (e) {
              core.warning(`governed census not derived: ${e.message}`);
              census = { error: e.message };
            }

            // GitHub discovery is an observation, reconciled against the census;
            // it never adds or removes a member.
            let discovered = null;
            if (!census.error) {
              try {
                discovered = await github.paginate(github.rest.repos.listForOrg, { org: ORG, type: 'all', per_page: 100 });
              } catch (e) {
                census.discoveryError = String(e.status || 'error');
                core.warning(`GitHub discovery failed: ${e.message}`);
              }
            }
            const plan = census.error ? { members: [], unregistered: [], caseDrift: [] } : reconcileDiscovery(census, discovered, ORG);
            census.unregistered = plan.unregistered;
            census.caseDrift = plan.caseDrift;

            // Raw presence: true present, false absent (404 only), null unobserved.
            const has = async (owner, repo, path) =>
              github.rest.repos.getContent({ owner, repo, path })
                .then(() => true, (e) => (e.status === 404 ? false : null));

            // What a consumer's Actions policy must admit: the caller's own refs.
            const refs = callerRefs(fs.readFileSync('policies/governance-caller.yml', 'utf8'));
            // ...and the actions those reusable workflows run, read at the exact
            // commit the caller pins (not this checkout); null means unread (UNKNOWN).
            const readPinned = async ({ owner, repo, path, ref }) => {
              const res = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (!res.data || Array.isArray(res.data) || typeof res.data.content !== 'string') {
                throw new Error(`${path}@${ref} is not a readable file`);
              }
              return Buffer.from(res.data.content, 'base64').toString('utf8');
            };
            let actionRefs = null;
            try {
              actionRefs = await reusableWorkflowActionRefs(refs, readPinned);
            } catch (e) {
              core.warning(`reusable workflow actions unread: ${e.message}`);
            }

            const rows = [];
            for (const { member, repo, reason } of plan.members) {
              const { organization: owner, repository: name } = member.coordinate;
              const row = { ...member, name, reason, archived: repo?.archived, fork: repo?.fork };
              if (!repo) {
                // Not observed: a 404 here could mean "not visible", not "absent".
                rows.push({ ...row, co: null, caller: null, dep: null, actions: { state: STATES.UNKNOWN, detail: reason } });
                continue;
              }
              const [co, caller, dep] = await Promise.all([
                has(owner, name, '.github/CODEOWNERS'),
                has(owner, name, '.github/workflows/governance.yml'),
                has(owner, name, '.github/dependabot.yml'),
              ]);
              // ALLOWED only when demonstrably allowed; a read failure is UNKNOWN.
              const actions = await classifyActionsPermission({
                readPermissions: async () =>
                  (await github.rest.actions.getGithubActionsPermissionsRepository({ owner, repo: name })).data,
                readSelected: async () =>
                  (await github.rest.actions.getAllowedActionsRepository({ owner, repo: name })).data,
                refs,
                actionRefs,
              });
              rows.push({ ...row, co, caller, dep, actions });
            }

            const { body, refresh } = buildPostureReport(rows, { date: new Date().toISOString().slice(0, 10), census });

            const TITLE = 'Governance posture (advisory, weekly)';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'advisory', per_page: 20 });
            const existing = open.data.find(i => i.title === TITLE);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: refresh });
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: ['advisory'] });
            }
            core.summary.addRaw(body).write();
