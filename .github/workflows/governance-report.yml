name: Governance report (advisory)

# Read-only weekly posture report. Opens/updates ONE issue in this repo.
#
# SCOPE BOUNDARY: this workflow does NOT run tests, lint, typecheck, scan code, or
# parse build logs. It reads governance METADATA only. Test/lint/build execution is
# owned by l9-ci-sdk and l9-ci-core; CI failure diagnosis by l9-ci-debt-resolver.
# See docs/BOUNDARIES.md.

on:
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const {
              callerRefs,
              reusableWorkflowActionRefs,
              classifyActionsPermission,
              buildPostureReport,
            } = require('./ops/governance-report.js');
            const ORG = 'Quantum-L9';
            const repos = (await github.paginate(github.rest.repos.listForOrg, { org: ORG, type: 'all', per_page: 100 }))
              .filter(r => !r.archived && !r.fork);

            // Raw presence: true present, false absent (404 only), null unobserved.
            const has = async (repo, path) =>
              github.rest.repos.getContent({ owner: ORG, repo, path })
                .then(() => true, (e) => (e.status === 404 ? false : null));

            // What a consumer's Actions policy must admit: the caller's own refs.
            const refs = callerRefs(fs.readFileSync('policies/governance-caller.yml', 'utf8'));
            // ...and the actions those reusable workflows run; null means unread (UNKNOWN).
            let actionRefs = null;
            try {
              actionRefs = reusableWorkflowActionRefs(refs, (p) => fs.readFileSync(p, 'utf8'));
            } catch (e) {
              core.warning(`reusable workflow actions unread: ${e.message}`);
            }

            const rows = [];
            for (const r of repos) {
              const [co, caller, dep] = await Promise.all([
                has(r.name, '.github/CODEOWNERS'),
                has(r.name, '.github/workflows/governance.yml'),
                has(r.name, '.github/dependabot.yml'),
              ]);
              // ALLOWED only when demonstrably allowed; a read failure is UNKNOWN.
              const actions = await classifyActionsPermission({
                readPermissions: async () =>
                  (await github.rest.actions.getGithubActionsPermissionsRepository({ owner: ORG, repo: r.name })).data,
                readSelected: async () =>
                  (await github.rest.actions.getAllowedActionsRepository({ owner: ORG, repo: r.name })).data,
                refs,
                actionRefs,
              });
              rows.push({ name: r.name, co, caller, dep, actions });
            }

            const { body, refresh } = buildPostureReport(rows, { date: new Date().toISOString().slice(0, 10) });

            const TITLE = 'Governance posture (advisory, weekly)';
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'advisory', per_page: 20 });
            const existing = open.data.find(i => i.title === TITLE);
            if (existing) {
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body: refresh });
            } else {
              await github.rest.issues.create({ ...context.repo, title: TITLE, body, labels: ['advisory'] });
            }
            core.summary.addRaw(body).write();
