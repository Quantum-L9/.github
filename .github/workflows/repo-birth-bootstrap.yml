# Targeted post-birth REMOTE APPLY + attestation for exactly one repository.
#
# `make new-repo` in Quantum-L9/l9-repo-template creates and pushes the
# repository, then dispatches this workflow and waits for it. That is the
# difference between a repository that is created and a repository that is
# born: labels, settings, and the org policy attestation happen now, not on
# the next weekly sweep.
#
# Scope is deliberately narrow. This workflow applies the capabilities a class
# marks REMOTE APPLY (GitHub API state, not files) and then attests. File
# MATERIALIZE stays with auto-seed-new-repo.yml: once the attestation passes,
# this workflow dispatches `repo_created` for exactly this repository, so the
# seed PR opens at birth rather than on the next weekly sweep — one owner per
# capability, never two.
#
# Auth: org secret GH_TOKEN (AWS openclaw-igorbot/github#token), same as the
# other org-write workflows.
name: Repo birth bootstrap

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository name to bootstrap (without owner)"
        type: string
        required: true
      repo_class:
        description: "Force a repo class (blank = resolve from the repo's .l9/org-birth-profile.yaml)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only, no writes)"
        type: boolean
        default: false
  repository_dispatch:
    types: [repo_birth]

permissions:
  contents: read

concurrency:
  group: repo-birth-bootstrap-${{ inputs.target_repo || github.event.client_payload.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Literal block scalar: the ": " inside --only-binary=:all: is invalid
        # YAML in the plain-flow form. Same fix as enforce-policies.yml.
        run: |
          pip install --only-binary=:all: "pyyaml==6.0.2"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
          REPO_CLASS: ${{ inputs.repo_class || github.event.client_payload.repo_class || '' }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const {
              loadRepoClasses,
              parseClassMarker,
              classForRepo,
              resolveProfile,
            } = require('./ops/repo-class-profile.js');
            const { parseLabels } = require('./ops/label-taxonomy.js');

            const ORG = 'Quantum-L9';
            const DRY = process.env.DRY_RUN === 'true';
            const TARGET = (process.env.TARGET_REPO || '').trim();
            const FORCED_CLASS = (process.env.REPO_CLASS || '').trim();

            if (!TARGET) {
              core.setFailed('target_repo is required');
              return;
            }

            // getContent returns an array for a directory and an object with
            // `content` for a file, so a directory probe needs its own call.
            // Only a 404 is "absent". A 403, 409 or 5xx throws: read as absent it
            // would classify the repo `default` (the widest class) and let the
            // FORBID attestation pass an unreadable path as "not leaked".
            const pathExists = async (path) => {
              try {
                await github.rest.repos.getContent({ owner: ORG, repo: TARGET, path });
                return true;
              } catch (e) {
                if (e.status === 404) return false;
                throw e;
              }
            };

            const readText = async (path) => {
              let res;
              try {
                res = await github.rest.repos.getContent({ owner: ORG, repo: TARGET, path });
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
              if (res.data && typeof res.data.content === 'string' && !Array.isArray(res.data)) {
                return Buffer.from(res.data.content, 'base64').toString('utf8');
              }
              return null; // a directory, or a file too large to inline
            };

            const classes = loadRepoClasses(fs);
            if (FORCED_CLASS) resolveProfile(classes, FORCED_CLASS, { strict: true });

            // Existence first: a failed fetch must not read as "absent" and
            // fall through to the widest class. See ops/repo-class-profile.js.
            let marker = null;
            if (!FORCED_CLASS && (await pathExists(classes.marker_path))) {
              marker = (await readText(classes.marker_path)) ?? '';
            }
            const decided = FORCED_CLASS
              ? { name: FORCED_CLASS, source: 'operator input', error: null }
              : classForRepo(classes, TARGET, marker);
            if (decided.error) {
              core.setFailed(`${ORG}/${TARGET}: ${decided.error}`);
              return;
            }
            const profile = resolveProfile(classes, decided.name);
            if (decided.name) profile.resolved_from = decided.source;
            core.info(`repo class: ${profile.name} (${profile.resolved_from})`);

            const repo = await github.rest.repos.get({ owner: ORG, repo: TARGET });
            const attest = [];
            let failures = 0;

            const record = (name, ok, detail) => {
              attest.push([name, ok ? 'PASS' : 'FAIL', detail]);
              if (!ok) failures += 1;
            };

            // ── REMOTE APPLY: labels ───────────────────────────────────────
            if (profile.remote_apply.labels) {
              const labels = parseLabels(fs.readFileSync('.github/labels.yml', 'utf8'));
              if (!labels.length) {
                record('labels', false, 'no labels parsed from .github/labels.yml');
              } else if (DRY) {
                record('labels', true, `would apply ${labels.length} labels (dry run)`);
              } else {
                let created = 0, updated = 0, failed = 0;
                for (const label of labels) {
                  try {
                    await github.rest.issues.createLabel({
                      owner: ORG, repo: TARGET,
                      name: label.name, color: label.color, description: label.description,
                    });
                    created += 1;
                  } catch (e) {
                    if (e.status !== 422) { failed += 1; continue; }
                    try {
                      await github.rest.issues.updateLabel({
                        owner: ORG, repo: TARGET,
                        name: label.name, color: label.color, description: label.description,
                      });
                      updated += 1;
                    } catch { failed += 1; }
                  }
                }
                record('labels', failed === 0, `+${created} ~${updated} !${failed} of ${labels.length}`);
              }
            } else {
              attest.push(['labels', 'SKIP', `class ${profile.name} does not remote-apply labels`]);
            }

            // ── REMOTE APPLY: repository settings ──────────────────────────
            if (profile.remote_apply.repo_settings) {
              const { execSync } = require('child_process');
              // No native YAML in actions/github-script; same shell-out as
              // enforce-policies.yml, which owns the same policy file.
              const settingsPolicy = JSON.parse(execSync(
                'python3 -c "import yaml,json,sys; print(json.dumps(yaml.safe_load(open(sys.argv[1]))))" "policies/repo-settings.yml"',
                { encoding: 'utf8' },
              ));
              const defaults = settingsPolicy.defaults || {};
              const overrides = (settingsPolicy.overrides || [])
                .filter((o) => o.repos && o.repos.includes(TARGET))
                .reduce((acc, o) => ({ ...acc, ...o, repos: undefined }), {});
              const expected = { ...defaults, ...overrides };
              delete expected.repos;
              delete expected.default_branch;  // never auto-change the default branch

              const drift = Object.entries(expected)
                .filter(([k, v]) => repo.data[k] !== v)
                .map(([k, v]) => ({ key: k, expected: v, actual: repo.data[k] }));

              if (!drift.length) {
                record('repo_settings', true, 'already matches org policy');
              } else if (DRY) {
                record('repo_settings', true,
                  `would fix ${drift.map((d) => `${d.key}=${d.actual}→${d.expected}`).join(', ')}`);
              } else {
                const patch = {};
                for (const d of drift) patch[d.key] = d.expected;
                try {
                  await github.rest.repos.update({ owner: ORG, repo: TARGET, ...patch });
                  record('repo_settings', true, `fixed ${drift.map((d) => d.key).join(', ')}`);
                } catch (e) {
                  record('repo_settings', false, `${e.message}`.slice(0, 80));
                }
              }
            } else {
              attest.push(['repo_settings', 'SKIP', `class ${profile.name} does not remote-apply settings`]);
            }

            // ── ATTESTATION: the remote, not the local assembly ────────────
            // A birth that only checks what it built locally proves nothing
            // about what GitHub actually holds. Every check below reads the
            // remote back.
            // The marker is not required: an override-classed repository has
            // none, and the marker:class check below fails a contradicting one.
            for (const path of ['README.md', 'LICENSE']) {
              const present = (await readText(path)) != null;
              record(`present:${path}`, present, present ? 'on remote HEAD' : 'missing on remote HEAD');
            }

            // A repository classed by an org override legitimately carries no
            // marker; only a marker that CONTRADICTS the resolved class is a
            // failure. Demanding one would fail every override-classed repo.
            const markerClass = parseClassMarker(await readText(classes.marker_path));
            if (markerClass) {
              record('marker:class', markerClass === profile.name, `marker says ${markerClass}`);
            } else {
              attest.push(['marker:class', 'SKIP', `no marker; class from ${profile.resolved_from}`]);
            }

            // FORBID is an attestation, not only a build-time filter: a
            // repository can acquire a forbidden path from any source after
            // birth — a hand-added workflow, a sweep that predates its class,
            // a copy-paste from a sibling repo.
            const leaked = [];
            for (const pattern of profile.forbid) {
              // A `dir/**` pattern is probed at the directory itself: the
              // contents API returns a listing for a directory that exists and
              // 404s for one that does not.
              const probe = pattern.endsWith('/**') ? pattern.slice(0, -3) : pattern;
              if ((await readText(probe)) != null || (await pathExists(probe))) {
                leaked.push(pattern);
              }
            }
            record(
              'forbid',
              leaked.length === 0,
              leaked.length
                ? `org CI distribution present on remote: ${leaked.join(', ')}`
                : `${profile.forbid.length} pattern(s) probed, none present`,
            );

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Repo birth bootstrap (${mode}) — ${ORG}/${TARGET}`, 2)
              .addRaw(`**Class:** \`${profile.name}\` (${profile.resolved_from})\n\n`)
              .addTable([
                [
                  { data: 'Check', header: true },
                  { data: 'Result', header: true },
                  { data: 'Detail', header: true },
                ],
                ...attest.map((r) => r.map(String)),
              ])
              .write();

            if (failures) {
              core.setFailed(`${failures} birth attestation check(s) failed for ${ORG}/${TARGET}`);
            }

      # MATERIALIZE at birth: hand exactly this repository to the seeder now.
      # Runs only after a passing attestation and never on a dry run; the
      # seeder resolves the class itself and stays missing-only.
      - name: Chain file seeding (repo_created)
        # inputs.dry_run is a boolean (null for repository_dispatch); compare it
        # as one. A string comparison is always unequal and would chain a dry run.
        if: ${{ success() && inputs.dry_run != true }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
          REPO_CLASS: ${{ inputs.repo_class || github.event.client_payload.repo_class || '' }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const repository = process.env.TARGET_REPO.trim();
            if (!/^[A-Za-z0-9._-]+$/.test(repository)) {
              core.setFailed(`refusing to dispatch seeding for invalid repository name ${JSON.stringify(repository)}`);
              return;
            }
            const client_payload = { repository };
            if (process.env.REPO_CLASS.trim()) client_payload.repo_class = process.env.REPO_CLASS.trim();
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'repo_created',
              client_payload,
            });
            core.notice(`dispatched repo_created for ${context.repo.owner}/${repository} (auto-seed-new-repo.yml)`);

  # REGISTER at birth (ADR-039): turn the newborn's attested birth record into
  # one reviewable repository-registry PR on this repository. The entry is
  # derived only from the factory's receipt, root commit and integrity
  # verifier (ops/register-birth.py), never from operator input; the owner's
  # merge of that exact entry is the admission decision, and this job never
  # merges. Runs only after a passing, non-dry-run attestation.
  register:
    needs: bootstrap
    if: ${{ success() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-distribution
    concurrency:
      group: birth-registry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: |
          pip install --only-binary=:all: "pyyaml==6.0.2"

      - name: Clone the newborn and the factory (full history)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
        run: |
          set -euo pipefail
          if ! [[ "${TARGET_REPO}" =~ ^[A-Za-z0-9._-]{1,100}$ ]]; then
            echo "::error::invalid repository name '${TARGET_REPO}'"
            exit 1
          fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          mkdir -p "${RUNNER_TEMP}/birth"
          # Full clones: the root commit and the factory history are the evidence.
          git -c "http.https://github.com/.extraheader=${auth}" clone --quiet \
            "https://github.com/Quantum-L9/${TARGET_REPO}.git" "${RUNNER_TEMP}/birth/newborn"
          git -c "http.https://github.com/.extraheader=${auth}" clone --quiet \
            "https://github.com/Quantum-L9/l9-repo-template.git" "${RUNNER_TEMP}/birth/template"

      - name: Verify the birth and render the registration
        env:
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
        run: |
          set -euo pipefail
          python3 ops/register-birth.py apply \
            --newborn "${RUNNER_TEMP}/birth/newborn" \
            --template "${RUNNER_TEMP}/birth/template" \
            --repository "${TARGET_REPO}" \
            --checkout "${GITHUB_WORKSPACE}" \
            --changes-out "${RUNNER_TEMP}/birth/registration.json"

      - name: Open or update the registration PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          RESULT_PATH: ${{ runner.temp }}/birth/registration.json
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_PATH, 'utf8'));
            const { owner, repo } = context.repo;
            const base = process.env.BASE_BRANCH;
            const entry = result.entry;
            const target = entry.coordinate.repository;
            if (result.status === 'present') {
              core.notice(`${owner}/${target} is already registered on ${base}; nothing to do`);
              return;
            }
            if (result.status !== 'added' || !result.changed_paths.length) {
              core.setFailed(`unexpected registration result ${JSON.stringify(result.status)}`);
              return;
            }
            const branch = `birth-registry/${target}`;
            const subject = `chore(registry): register factory-born ${owner}/${target}`;
            const baseSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const baseCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: baseSha });

            let branchSha = null;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
              branchSha = ref.data.object.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            // Never discard work the registrar did not author: every commit the
            // branch carries beyond the base must be a registration commit.
            if (branchSha) {
              const cmp = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${baseSha}...${branchSha}`,
              });
              const foreign = cmp.data.commits.filter(
                (c) => !c.commit.message.startsWith(subject),
              );
              if (foreign.length) {
                core.setFailed(
                  `${branch} carries ${foreign.length} commit(s) the registrar did not author; ` +
                  'refusing to rewrite it — resolve that PR by hand',
                );
                return;
              }
            }

            const tree = await github.rest.git.createTree({
              owner, repo,
              base_tree: baseCommit.data.tree.sha,
              tree: result.changed_paths.map((path) => ({
                path, mode: '100644', type: 'blob',
                content: fs.readFileSync(path, 'utf8'),
              })),
            });
            let unchanged = false;
            if (branchSha) {
              const head = await github.rest.git.getCommit({ owner, repo, commit_sha: branchSha });
              unchanged = head.data.tree.sha === tree.data.sha;
            }
            if (unchanged) {
              core.notice(`${branch} already carries this registration`);
            } else {
              const prov = entry.birth_provenance;
              const message = [
                subject,
                '',
                `Entry ${entry.id} (${entry.class_ref}, lifecycle ${entry.lifecycle}),`,
                `release ${result.release}, from factory receipt ${prov.receipt_digest}`,
                `(root commit ${prov.root_commit}, template ${prov.template_sha}).`,
              ].join('\n');
              // A stale branch is advanced by a merge commit over the current
              // base, never force-pushed: its tree is the registration
              // recomputed on base.
              const commit = await github.rest.git.createCommit({
                owner, repo, message, tree: tree.data.sha,
                parents: branchSha ? [branchSha, baseSha] : [baseSha],
              });
              if (branchSha) {
                await github.rest.git.updateRef({
                  owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false,
                });
              } else {
                await github.rest.git.createRef({
                  owner, repo, ref: `refs/heads/${branch}`, sha: commit.data.sha,
                });
              }
            }

            const prov = entry.birth_provenance;
            const body = [
              `Registers factory-born \`${owner}/${target}\` in \`semantics/repository_registry.yaml\` (ADR-039).`,
              '',
              '| Field | Value |',
              '| --- | --- |',
              `| id | \`${entry.id}\` |`,
              `| class_ref | \`${entry.class_ref}\` |`,
              `| lifecycle | \`${entry.lifecycle}\` |`,
              ...Object.entries(prov).map(([k, v]) => `| birth_provenance.${k} | \`${v}\` |`),
              `| release record | \`docs/semantic-foundation/${result.release}/\` |`,
              '',
              'Derived only from the newborn\'s committed `.l9/birth-receipt.json`, its root commit and the',
              'factory\'s `verify_birth_integrity.py --require-receipt` at the template commit the receipt names',
              '(`ops/register-birth.py`). The semantic validator passed on this tree before the PR was opened.',
              '',
              'Registration is repository identity and RepositoryClass assignment only — not product admission.',
              'Merging this exact entry is the admission decision. This workflow never merges.',
            ].join('\n');
            const open = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${branch}`, base,
            });
            if (open.data.length) {
              await github.rest.pulls.update({ owner, repo, pull_number: open.data[0].number, body });
              core.notice(`updated ${open.data[0].html_url}`);
            } else {
              const pr = await github.rest.pulls.create({
                owner, repo, head: branch, base, title: subject, body,
              });
              core.notice(`opened ${pr.data.html_url}`);
            }
