# THE targeted governance front door for exactly one repository
# (docs/adr/0004-single-targeted-bootstrap-front-door.md).
#
# `make birth` here, or `make new-repo` in Quantum-L9/l9-repo-template, runs
# this workflow for one repository. It is one governance transaction bound to
# one immutable authority (docs/adr/0003-immutable-authority-binding.md):
#
#   1. check out Quantum-L9/.github at the exact `authority_sha`;
#   2. gather the target's facts and compile its governance plan;
#   3. refuse before ANY mutation unless the recomputed plan digest equals
#      `expected_plan_digest` (a stale plan, a moved target, or a tampered
#      caller all fail here);
#   4. materialize plan files (seed PR, via ops/seed-plan-pr.js — the same
#      machinery and seed branch as auto-seed-new-repo.yml);
#   5. apply plan REMOTE APPLY state (labels, settings);
#   6. read the remote back and attest it against plan.attestation;
#   7. report one terminal result carrying the authority SHA and plan digest.
#
# Obtaining the digest: run with `dry_run: true` and no digest. That compiles
# the plan at `authority_sha`, reports its digest, and mutates nothing. Then run
# again with the digest. If the target changed in between, the digest no longer
# matches and nothing is written — recompile and retry.
#
# `auto-seed-new-repo.yml` remains the hourly repair sweep, not a targeted
# entry point.
#
# Auth: org secret GH_TOKEN (AWS openclaw-igorbot/github#token), same as the
# other org-write workflows.
name: Repo birth bootstrap

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository name to bootstrap (without owner)"
        type: string
        required: true
      authority_sha:
        description: "Exact 40-hex Quantum-L9/.github commit whose policy governs this transaction"
        type: string
        required: true
      expected_plan_digest:
        description: "Plan digest to apply (blank only with dry_run: compiles and reports it)"
        type: string
        default: ""
      repo_class:
        description: "Force a repo class (blank = resolve from the repo's .l9/org-birth-profile.yaml)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only, no writes)"
        type: boolean
        default: false
  repository_dispatch:
    types: [repo_birth]

permissions:
  contents: read

concurrency:
  group: repo-birth-bootstrap-${{ inputs.target_repo || github.event.client_payload.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-distribution
    steps:
      # The authority revision, not the tip of main: policy is read from
      # exactly the commit the caller named. A SHA that does not exist fails
      # here, before any mutation.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.authority_sha || github.event.client_payload.authority_sha || github.sha }}

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Literal block scalar: the ": " inside --only-binary=:all: is invalid
        # YAML in the plain-flow form. Same fix as enforce-policies.yml.
        run: |
          pip install --only-binary=:all: "pyyaml==6.0.2"

      - id: bootstrap
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || github.event.client_payload.dry_run || 'false' }}
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
          REPO_CLASS: ${{ inputs.repo_class || github.event.client_payload.repo_class || '' }}
          AUTHORITY_SHA: ${{ inputs.authority_sha || github.event.client_payload.authority_sha || '' }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.expected_plan_digest || github.event.client_payload.expected_plan_digest || '' }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            // Policy is interpreted only by the governance-plan compiler
            // (docs/adr/0001-one-governance-brain.md). This workflow gathers
            // facts, verifies the one plan it was asked to apply, executes it,
            // and attests the remote against it.
            const {
              loadAuthority,
              gatherTargetFacts,
              compileVerifiedPlan,
              applyPlanLabels,
              settingsDrift,
              markerClassOf,
            } = require('./ops/plan-adapter.js');
            const { verifyPlan } = require('./ops/compile-repo-governance.js');
            const { seedPlanPR } = require('./ops/seed-plan-pr.js');

            const ORG = 'Quantum-L9';
            const DRY = process.env.DRY_RUN === 'true';
            const TARGET = (process.env.TARGET_REPO || '').trim();
            const FORCED_CLASS = (process.env.REPO_CLASS || '').trim();
            const AUTHORITY_SHA = (process.env.AUTHORITY_SHA || '').trim();
            const EXPECTED_DIGEST = (process.env.EXPECTED_PLAN_DIGEST || '').trim();

            // ── Transaction preconditions: all before any read of the target ──
            if (!TARGET) {
              core.setFailed('target_repo is required');
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(AUTHORITY_SHA)) {
              core.setFailed(`authority_sha must be an exact 40-hex Quantum-L9/.github commit, got "${AUTHORITY_SHA}"`);
              return;
            }
            // The policy on disk must be the policy the caller named. Absolute
            // git path: resolving it through PATH would let a writable PATH
            // entry substitute the binary.
            const head = execFileSync('/usr/bin/git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (head !== AUTHORITY_SHA) {
              core.setFailed(`checked-out authority is ${head}, not the requested ${AUTHORITY_SHA}`);
              return;
            }
            if (EXPECTED_DIGEST && !/^[0-9a-f]{64}$/.test(EXPECTED_DIGEST)) {
              core.setFailed(`expected_plan_digest must be 64 hex chars, got "${EXPECTED_DIGEST}"`);
              return;
            }
            if (!DRY && !EXPECTED_DIGEST) {
              core.setFailed(
                'expected_plan_digest is required to mutate. Run with dry_run: true (no digest) to compile ' +
                  'the plan at this authority_sha and obtain its digest, then run again with it.',
              );
              return;
            }

            // getContent returns an array for a directory and an object with
            // `content` for a file, so a directory probe needs its own call.
            const pathExists = async (path) => {
              try {
                await github.rest.repos.getContent({ owner: ORG, repo: TARGET, path });
                return true;
              } catch {
                return false;
              }
            };
            const readText = async (path) => {
              try {
                const res = await github.rest.repos.getContent({ owner: ORG, repo: TARGET, path });
                if (res.data && res.data.content) {
                  return Buffer.from(res.data.content, 'base64').toString('utf8');
                }
              } catch { /* missing */ }
              return null;
            };

            const authority = loadAuthority(fs);
            // Existence first: a failed fetch of a marker that exists is a
            // malformed declaration the compiler refuses — never "absent".
            const facts = await gatherTargetFacts({ exists: pathExists, readText }, authority.classes.marker_path);
            let plan;
            try {
              plan = compileVerifiedPlan({
                fs, authority, authoritySha: AUTHORITY_SHA,
                repository: `${ORG}/${TARGET}`, facts, requestedClass: FORCED_CLASS || null,
              });
              if (EXPECTED_DIGEST) {
                verifyPlan(plan, {
                  schema: authority.schema, authoritySha: AUTHORITY_SHA,
                  repository: `${ORG}/${TARGET}`, digest: EXPECTED_DIGEST,
                });
              }
            } catch (e) {
              const computed = plan ? ` (plan compiled now: ${plan.digest.value})` : '';
              core.setFailed(`${ORG}/${TARGET}: refused before any mutation — ${e.message}${computed}`);
              return;
            }
            core.setOutput('plan_digest', plan.digest.value);
            core.setOutput('authority_sha', plan.authority.sha);

            const attest = [];
            let failures = 0;
            const record = (name, ok, detail) => {
              attest.push([name, ok ? 'PASS' : 'FAIL', detail]);
              if (!ok) failures += 1;
            };
            const summarize = async (mode) => {
              await core.summary
                .addHeading(`Repo birth bootstrap (${mode}) — ${ORG}/${TARGET}`, 2)
                .addRaw(`**Class:** \`${plan.repo_class.name}\` (${plan.repo_class.resolved_from})\n\n`)
                .addRaw(`**Governance plan:** authority \`${plan.authority.sha}\`, digest \`${plan.digest.value}\`\n\n`)
                .addTable([
                  [
                    { data: 'Check', header: true },
                    { data: 'Result', header: true },
                    { data: 'Detail', header: true },
                  ],
                  ...attest.map((r) => r.map(String)),
                ])
                .write();
            };

            // Plan-only: compile and report, touch nothing on the target.
            if (DRY && !EXPECTED_DIGEST) {
              attest.push(['plan', 'INFO', `compiled at ${AUTHORITY_SHA}; digest ${plan.digest.value}`]);
              await summarize('PLAN ONLY');
              core.info(`plan digest: ${plan.digest.value}`);
              return;
            }
            record('plan', true, `digest ${plan.digest.value} matches expected`);

            const repo = await github.rest.repos.get({ owner: ORG, repo: TARGET });

            // ── MATERIALIZE: plan files, as a seed PR (shared with auto-seed) ─
            try {
              const seeded = await seedPlanPR({
                github, owner: ORG, repo: TARGET, base: repo.data.default_branch, plan, dry: DRY,
              });
              record('materialize', true, `${seeded.outcome}: ${seeded.detail}`);
            } catch (e) {
              record('materialize', false, `${e.message}`.slice(0, 120));
            }

            // ── REMOTE APPLY: labels (plan.remote_apply.labels) ────────────
            if (plan.remote_apply.labels.enabled) {
              const r = await applyPlanLabels({ github, owner: ORG, repo: TARGET, plan, dry: DRY });
              if (DRY) {
                record('labels', true, `would apply ${r.total} labels (dry run)`);
              } else {
                record('labels', r.failed === 0, `+${r.created} ~${r.updated} !${r.failed} of ${r.total}`);
              }
            } else {
              attest.push(['labels', 'SKIP', `class ${plan.repo_class.name} does not remote-apply labels`]);
            }

            // ── REMOTE APPLY: repository settings (plan desired state) ─────
            if (plan.remote_apply.repo_settings.enabled) {
              const drift = settingsDrift(plan, repo.data);
              if (!drift.length) {
                record('repo_settings', true, 'already matches org policy');
              } else if (DRY) {
                record('repo_settings', true,
                  `would fix ${drift.map((d) => `${d.key}=${d.actual}→${d.expected}`).join(', ')}`);
              } else {
                const patch = {};
                for (const d of drift) patch[d.key] = d.expected;
                try {
                  await github.rest.repos.update({ owner: ORG, repo: TARGET, ...patch });
                  record('repo_settings', true, `fixed ${drift.map((d) => d.key).join(', ')}`);
                } catch (e) {
                  record('repo_settings', false, `${e.message}`.slice(0, 80));
                }
              }
            } else {
              attest.push(['repo_settings', 'SKIP', `class ${plan.repo_class.name} does not remote-apply settings`]);
            }

            // ── ATTESTATION: the remote, not the local assembly ────────────
            // Every check reads the remote back, against plan.attestation.
            for (const path of plan.attestation.required_present) {
              const present = (await readText(path)) != null;
              record(`present:${path}`, present, present ? 'on remote HEAD' : 'missing on remote HEAD');
            }

            // A repository classed by an org override legitimately carries no
            // marker; only a marker that CONTRADICTS the plan's class fails.
            const markerClass = plan.attestation.verify_class_marker
              ? markerClassOf(await readText(authority.classes.marker_path))
              : null;
            if (markerClass) {
              record('marker:class', markerClass === plan.repo_class.name, `marker says ${markerClass}`);
            } else {
              attest.push(['marker:class', 'SKIP', `no marker; class from ${plan.repo_class.resolved_from}`]);
            }

            // FORBID is an attestation, not only a build-time filter (GOV-010).
            const leaked = [];
            for (const pattern of plan.attestation.required_absent) {
              // A `dir/**` pattern is probed at the directory itself.
              const probe = pattern.endsWith('/**') ? pattern.slice(0, -3) : pattern;
              if ((await readText(probe)) != null || (await pathExists(probe))) {
                leaked.push(pattern);
              }
            }
            record(
              'forbid',
              leaked.length === 0,
              leaked.length
                ? `org CI distribution present on remote: ${leaked.join(', ')}`
                : `${plan.attestation.required_absent.length} pattern(s) probed, none present`,
            );

            await summarize(DRY ? 'DRY RUN' : 'APPLIED');
            if (failures) {
              core.setFailed(`${failures} birth attestation check(s) failed for ${ORG}/${TARGET}`);
            }
