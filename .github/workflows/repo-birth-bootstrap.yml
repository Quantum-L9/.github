# Targeted post-birth REMOTE APPLY + attestation for exactly one repository.
#
# `make new-repo` in Quantum-L9/l9-repo-template creates and pushes the
# repository, then dispatches this workflow and waits for it. That is the
# difference between a repository that is created and a repository that is
# born: labels, settings, and the org policy attestation happen now, not on
# the next hourly sweep.
#
# Scope is deliberately narrow. This workflow applies the capabilities a class
# marks REMOTE APPLY (GitHub API state, not files) and then attests. File
# MATERIALIZE stays with auto-seed-new-repo.yml, which this workflow can chain
# to via repository_dispatch — one owner per capability, never two.
#
# Auth: org secret GH_TOKEN (AWS openclaw-igorbot/github#token), same as the
# other org-write workflows.
name: Repo birth bootstrap

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Repository name to bootstrap (without owner)"
        type: string
        required: true
      repo_class:
        description: "Force a repo class (blank = resolve from the repo's .l9/org-birth-profile.yaml)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only, no writes)"
        type: boolean
        default: false
  repository_dispatch:
    types: [repo_birth]

permissions:
  contents: read

concurrency:
  group: repo-birth-bootstrap-${{ inputs.target_repo || github.event.client_payload.repository }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
          REPO_CLASS: ${{ inputs.repo_class || github.event.client_payload.repo_class || '' }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            // Policy is interpreted only by the governance-plan compiler
            // (docs/adr/0001-one-governance-brain.md). This workflow gathers
            // the target's facts, compiles one verified plan, applies its
            // REMOTE APPLY desired state, and attests against the same plan.
            const {
              loadAuthority,
              gatherTargetFacts,
              compileVerifiedPlan,
              applyPlanLabels,
              settingsDrift,
              markerClassOf,
              planIdentity,
              remoteReader,
            } = require('./ops/plan-adapter.js');

            const ORG = 'Quantum-L9';
            const DRY = process.env.DRY_RUN === 'true';
            const TARGET = (process.env.TARGET_REPO || '').trim();
            const FORCED_CLASS = (process.env.REPO_CLASS || '').trim();
            // The exact revision actions/checkout put on disk (GOV-019).
            const AUTHORITY_SHA = process.env.GITHUB_SHA;

            if (!TARGET) {
              core.setFailed('target_repo is required');
              return;
            }

            // Every read of the target fails closed (ops/plan-adapter.js
            // remoteReader): only a 404 is "absent". getContent answers a
            // directory with a listing, so `exists` also probes directories.
            const { exists: pathExists, readText } = remoteReader(github, ORG, TARGET);

            const authority = loadAuthority(fs);
            // Facts and the plan are settled before any write; a fact that
            // cannot be observed refuses the birth here.
            let plan;
            try {
              const facts = await gatherTargetFacts({ exists: pathExists, readText }, authority.classes.marker_path);
              plan = compileVerifiedPlan({
                fs, authority, authoritySha: AUTHORITY_SHA,
                repository: `${ORG}/${TARGET}`, facts, requestedClass: FORCED_CLASS || null,
              });
            } catch (e) {
              core.setFailed(`${ORG}/${TARGET}: refused before any mutation — ${e.message}`);
              return;
            }
            core.info(`${TARGET}: ${planIdentity(plan)}`);

            const repo = await github.rest.repos.get({ owner: ORG, repo: TARGET });
            const attest = [];
            let failures = 0;

            const record = (name, ok, detail) => {
              attest.push([name, ok ? 'PASS' : 'FAIL', detail]);
              if (!ok) failures += 1;
            };

            // ── REMOTE APPLY: labels (plan.remote_apply.labels) ────────────
            if (plan.remote_apply.labels.enabled) {
              const r = await applyPlanLabels({ github, owner: ORG, repo: TARGET, plan, dry: DRY });
              if (DRY) {
                record('labels', true, `would apply ${r.total} labels (dry run)`);
              } else {
                record('labels', r.failed === 0, `+${r.created} ~${r.updated} !${r.failed} of ${r.total}`);
              }
            } else {
              attest.push(['labels', 'SKIP', `class ${plan.repo_class.name} does not remote-apply labels`]);
            }

            // ── REMOTE APPLY: repository settings (plan desired state) ─────
            if (plan.remote_apply.repo_settings.enabled) {
              const drift = settingsDrift(plan, repo.data);
              if (!drift.length) {
                record('repo_settings', true, 'already matches org policy');
              } else if (DRY) {
                record('repo_settings', true,
                  `would fix ${drift.map((d) => `${d.key}=${d.actual}→${d.expected}`).join(', ')}`);
              } else {
                const patch = {};
                for (const d of drift) patch[d.key] = d.expected;
                try {
                  await github.rest.repos.update({ owner: ORG, repo: TARGET, ...patch });
                  record('repo_settings', true, `fixed ${drift.map((d) => d.key).join(', ')}`);
                } catch (e) {
                  record('repo_settings', false, `${e.message}`.slice(0, 80));
                }
              }
            } else {
              attest.push(['repo_settings', 'SKIP', `class ${plan.repo_class.name} does not remote-apply settings`]);
            }

            // ── ATTESTATION: the remote, not the local assembly ────────────
            // A birth that only checks what it built locally proves nothing
            // about what GitHub actually holds. Every check below reads the
            // remote back, against the expectations in plan.attestation.
            // An observation that fails is a FAIL, never a pass by omission.
            const observe = async (name, probe) => {
              try {
                return await probe();
              } catch (e) {
                record(name, false, `${e.message}`.slice(0, 120));
                return undefined;
              }
            };
            for (const path of plan.attestation.required_present) {
              const present = await observe(`present:${path}`, () => pathExists(path));
              if (present !== undefined) {
                record(`present:${path}`, present, present ? 'on remote HEAD' : 'missing on remote HEAD');
              }
            }

            // A repository classed by an org override legitimately carries no
            // marker; only a marker that CONTRADICTS the plan's class is a
            // failure. Demanding one would fail every override-classed repo.
            const markerText = plan.attestation.verify_class_marker
              ? await observe('marker:class', () => readText(authority.classes.marker_path))
              : null;
            // undefined: the read failed and observe() already recorded FAIL.
            if (markerText === null) {
              attest.push(['marker:class', 'SKIP', `no marker; class from ${plan.repo_class.resolved_from}`]);
            } else if (markerText !== undefined) {
              const markerClass = markerClassOf(markerText);
              record(
                'marker:class',
                markerClass === plan.repo_class.name,
                markerClass ? `marker says ${markerClass}` : 'marker present but declares no parseable profile',
              );
            }

            // FORBID is an attestation, not only a build-time filter: a
            // repository can acquire a forbidden path from any source after
            // birth — a hand-added workflow, a sweep that predates its class,
            // a copy-paste from a sibling repo.
            const leaked = [];
            for (const pattern of plan.attestation.required_absent) {
              // A `dir/**` pattern is probed at the directory itself: the
              // contents API returns a listing for a directory that exists and
              // 404s for one that does not.
              const probe = pattern.endsWith('/**') ? pattern.slice(0, -3) : pattern;
              const present = await observe(`forbid:${pattern}`, () => pathExists(probe));
              if (present) leaked.push(pattern);
            }
            record(
              'forbid',
              leaked.length === 0,
              leaked.length
                ? `org CI distribution present on remote: ${leaked.join(', ')}`
                : `${plan.attestation.required_absent.length} pattern(s) probed, none present`,
            );

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Repo birth bootstrap (${mode}) — ${ORG}/${TARGET}`, 2)
              .addRaw(`**Class:** \`${plan.repo_class.name}\` (${plan.repo_class.resolved_from})\n\n`)
              .addRaw(`**Governance plan:** authority \`${plan.authority.sha}\`, digest \`${plan.digest.value}\`\n\n`)
              .addTable([
                [
                  { data: 'Check', header: true },
                  { data: 'Result', header: true },
                  { data: 'Detail', header: true },
                ],
                ...attest.map((r) => r.map(String)),
              ])
              .write();

            if (failures) {
              core.setFailed(`${failures} birth attestation check(s) failed for ${ORG}/${TARGET}`);
            }
