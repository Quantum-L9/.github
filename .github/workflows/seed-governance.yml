name: Seed org templates into consumers

# Physically seeds ownership files, SECURITY.md, and templates. CI is never
# seeded. Default `all` omits labels.yml (org sync-labels-all), LICENSE, the
# inherited community-health files (CODE_OF_CONDUCT.md, CONTRIBUTING.md,
# SUPPORT.md, FUNDING.yml, VULNERABILITY_REPORT.yml), and duplicate issue
# templates.
#
# Repo-class aware, same as auto-seed-new-repo.yml: every target resolves its
# class from `.l9/org-birth-profile.yaml` against policies/repo-classes.yml
# (marker > override > default; a malformed or unknown marker is skipped and
# reported, never widened to default). `all` means the class's own
# seed_categories. An explicit category list still passes through the class:
# INHERIT destinations drop, and a FORBID destination skips that repo with the
# class and path named — it is never written.
#
# Matches ops/sync-org-files.sh. CI is not distributed from here — see
# docs/BOUNDARIES.md.
#
# Auth: org secret `GH_TOKEN` (SSOT = AWS openclaw-igorbot/github#token).
# A fine-grained PAT / classic admin PAT can write `.github/workflows/*`.
# The l9-governance-seeder App also requests workflows:write, but an org install
# only gains that scope after a browser "Accept new permissions" — there is no
# REST accept endpoint. Prefer the PAT so seed is not blocked on that click.
#
# Default behavior: add missing files, and replace a managed file
# (MANAGED_SEED_PATHS in ops/build-seed-payload.js: .github/CODEOWNERS and the
# rendered .github/dependabot.yml) whose text differs from the current org
# version. Every other existing file is left as it is. `.github/CODEOWNERS` is
# seeded whether or not the repository carries a root CODEOWNERS: GitHub reads
# `.github/CODEOWNERS` first, so the org file is the one that applies. A
# repository opts out of managed replacement with `.l9/no-sync`.
#
# Targets: every active Quantum-L9 repository, plus `extra_targets` in
# policies/repo-classes.yml (repositories outside the org, seeded with the same
# GH_TOKEN; one it cannot read is reported, not skipped silently).
#
# Manual only (workflow_dispatch). It stays manual until a seed PR is proven
# green and complete.
#
# Branch safety: the seed branch is rebuilt as "default branch + one seed
# commit", so ops/seed-branch-safety.js gates every ref move. A branch with an
# open PR, or carrying any commit the seeder did not author, is left alone.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run lists targets only; seed opens PRs.
        type: choice
        options: [dry-run, seed]
        default: dry-run
      repo_filter:
        description: Optional substring filter, e.g. "l9-repo-template".
        type: string
        default: ""
      categories:
        description: >-
          Comma-separated categories, or "all" (= each repo's class
          seed_categories; default class: codeowners, dependabot, coderabbit,
          governance, community-health, issue-templates, pr-templates).
          Opt-in: labels.
          A category a repo's class forbids skips that repo. Retired (fail
          closed): on-org-update.
        type: string
        default: all
      extra_targets:
        description: >-
          Also seed the repositories outside the org listed in
          policies/repo-classes.yml `extra_targets` (e.g. cryptoxdog/IB-Odoo_19).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      # The one PR-body renderer (Cursor-Governance ops/scripts/compose_pr_body.py)
      # at the commit governance-pr.yml pins; ops/test-distribution-triggers.js
      # keeps the pins equal. Seed PR bodies are composed from the org template
      # by it, never hand-built (ops/seed-pr-body.js).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Quantum-L9/Cursor-Governance
          ref: 5039c379d8ba1263f504cfa527487386205e056c
          path: composer
          # compose_pr_body.py imports org_dotgithub at load; both are stdlib-only.
          sparse-checkout: |
            ops/scripts/compose_pr_body.py
            ops/scripts/org_dotgithub.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Fetches the seed commit for the composer, as an HTTP header via env.
          SEED_GIT_TOKEN: ${{ secrets.GH_TOKEN }}
          # Pass dispatch inputs via env — never interpolate into script: (CodeQL js/actions/code-injection)
          SEED_MODE: ${{ inputs.mode }}
          SEED_REPO_FILTER: ${{ inputs.repo_filter }}
          SEED_CATEGORIES: ${{ inputs.categories }}
          SEED_EXTRA_TARGETS: ${{ inputs.extra_targets }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const {
              buildSeedPayload,
              parseCategories,
              ALL_CATEGORIES,
              DEFAULT_CATEGORIES,
              selectSeedWrites,
              classSeedPaths,
              MANAGED_SEED_PATHS,
              seedNeedsRepoShape,
              probeRepoShape,
            } = require('./ops/build-seed-payload.js');
            const {
              assessSeedBranch,
              assessOpenPrOverlap,
              moveSeedBranch,
              seedPayloadDigest,
              PAYLOAD_TRAILER,
              isEmptyRepoError,
            } = require('./ops/seed-branch-safety.js');
            const {
              loadRepoClasses,
              classForRepo,
              resolveProfile,
            } = require('./ops/repo-class-profile.js');
            const {
              TEMPLATE_PATH,
              seedCommitMessage,
              seedNarrative,
              renderSeedPrBody,
            } = require('./ops/seed-pr-body.js');
            const { execFileSync } = require('child_process');
            const CANONICAL_TEMPLATE = fs.readFileSync(TEMPLATE_PATH, 'utf8');

            const MODE = process.env.SEED_MODE || 'dry-run';
            const FILTER = process.env.SEED_REPO_FILTER || '';
            const BRANCH = 'chore/seed-governance';
            const classes = loadRepoClasses(fs);

            // `all` is not a category list: it means "whatever this repo's
            // class materializes". Only an explicit list is parsed here, and
            // it still passes through the class (INHERIT drops, FORBID skips).
            const rawCategories = (process.env.SEED_CATEGORIES || 'all').trim();
            let explicitCategories = null;
            if (rawCategories && rawCategories !== 'all') {
              try {
                explicitCategories = parseCategories(rawCategories);
              } catch (e) {
                core.setFailed(e.message);
                return;
              }
            }
            const categoriesLabel = explicitCategories
              ? explicitCategories.join(',')
              : 'all (per repo class)';

            // Only a 404 means "absent". 403, 409, 5xx, or a directory where a
            // file belongs are not answers: they throw, so an unreadable repo
            // can never be planned as if its files were missing.
            // Every read names the pinned base sha (see the pin below); a read
            // without one would describe whatever the branch is by then.
            const readFile = async (owner, repo, path, ref) => {
              if (!ref) throw Object.assign(new Error(`${path}: read without a pinned base`), { status: 'UNPINNED' });
              let res;
              try {
                res = await github.rest.repos.getContent({ owner, repo, path, ref });
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
              const d = res.data;
              if (!d || Array.isArray(d) || (d.type && d.type !== 'file') || typeof d.content !== 'string') {
                throw Object.assign(new Error(`${path} is not a readable file (got ${Array.isArray(d) ? 'a directory' : (d && d.type) || 'no content'})`), { status: 'NOT_A_FILE' });
              }
              return Buffer.from(d.content, 'base64').toString('utf8');
            };
            const exists = async (owner, repo, path, ref) => (await readFile(owner, repo, path, ref)) !== null;
            // The root listing, for the dependabot shape. Same answers as
            // readFile: 404 -> null, anything else that is not a directory
            // listing throws. A repo whose root cannot be listed gets no
            // dependabot render at all, never a github-actions-only one.
            const listRoot = async (owner, repo, ref) => {
              if (!ref) throw Object.assign(new Error('root listing without a pinned base'), { status: 'UNPINNED' });
              let res;
              try {
                res = await github.rest.repos.getContent({ owner, repo, path: '', ref });
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
              if (!Array.isArray(res.data)) {
                throw Object.assign(new Error('repository root is not a directory listing'), { status: 'NOT_A_DIR' });
              }
              return res.data;
            };
            const shapeOf = async (owner, repo, ref) => probeRepoShape({
              listRoot: async () => {
                const entries = await listRoot(owner, repo, ref);
                if (entries === null) throw Object.assign(new Error('repository root listing returned 404'), { status: 'NO_ROOT' });
                return entries;
              },
              readText: (p) => readFile(owner, repo, p, ref),
            });
            const SOURCE_SHA = process.env.GITHUB_SHA || 'unknown';

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: 'Quantum-L9', type: 'all', per_page: 100,
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' && (!FILTER || r.name.includes(FILTER)));

            const rows = [];
            const uninitialized = [];
            const unresolved = [];
            const forbidden = [];
            const conflicts = [];
            let failures = 0;

            // Repositories outside the org, named in policies/repo-classes.yml
            // `extra_targets`. Each must be readable with this GH_TOKEN; one
            // that is not is a failure row, never silently dropped.
            const EXTRA = process.env.SEED_EXTRA_TARGETS !== 'false' ? (classes.extra_targets || []) : [];
            for (const full of EXTRA) {
              const [eo, en] = String(full).split('/');
              if (!eo || !en) {
                failures += 1;
                rows.push([full, '-', 'failed: extra target is not owner/name']);
                continue;
              }
              if (FILTER && !en.includes(FILTER)) continue;
              try {
                const r = (await github.rest.repos.get({ owner: eo, repo: en })).data;
                if (r.archived) {
                  rows.push([full, '-', 'skipped (archived)']);
                  continue;
                }
                targets.push(r);
              } catch (e) {
                failures += 1;
                rows.push([full, '-', `failed: extra target unreadable with GH_TOKEN (${e.status || 'error'})`]);
              }
            }

            core.info(`categories=${categoriesLabel} (default class ${DEFAULT_CATEGORIES.join(',')}; all known ${ALL_CATEGORIES.join(',')})`);

            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              let profile = null;
              try {
                // Pin the base before any policy read. Root CODEOWNERS, the class
                // marker and every destination are read at this one sha, the
                // commit is built on it, and the final BASE_MOVED check compares
                // against it, so the plan cannot describe a different tree than
                // the one the seed commit lands on. No sha, no plan.
                const base = repo.default_branch;
                const baseRef = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });
                const baseSha = baseRef && baseRef.data && baseRef.data.object && baseRef.data.object.sha;
                if (typeof baseSha !== 'string' || !baseSha) {
                  throw Object.assign(new Error(`${base} could not be pinned to a commit`), { status: 'UNPINNED' });
                }

                const hasRootCodeowners = await exists(o, n, 'CODEOWNERS', baseSha);

                // Same class probe as auto-seed-new-repo.yml: null only on a
                // 404. A failed fetch throws instead of falling through to
                // `default` — the widest payload.
                const marker = await readFile(o, n, classes.marker_path, baseSha);
                const decided = classForRepo(classes, n, marker);
                if (decided.error) {
                  rows.push([n, 'unresolved', `skipped: ${decided.error}`]);
                  unresolved.push(n);
                  continue;
                }
                profile = resolveProfile(classes, decided.name);
                if (decided.name) profile.resolved_from = decided.source;

                const categories = explicitCategories ?? undefined;
                const repoShape = seedNeedsRepoShape({ categories, profile }) ? await shapeOf(o, n, baseSha) : null;
                let payload;
                try {
                  payload = buildSeedPayload({
                    fs,
                    // null lets the class's seed_categories decide; an explicit
                    // list is still filtered by the class (INHERIT) and refused
                    // on a FORBID hit.
                    categories,
                    profile,
                    repository: `${o}/${n}`,
                    repoShape,
                  });
                } catch (e) {
                  if (!/violates repo class/.test(e.message || '')) throw e;
                  // An explicit category this class forbids: report the class
                  // and the path, write nothing, and keep sweeping.
                  const why = String(e.message).replace(/\s+/g, ' ').slice(0, 200);
                  rows.push([n, profile.name, `skipped (class forbids requested category): ${why}`]);
                  forbidden.push(n);
                  continue;
                }
                const paths = Object.keys(payload);

                if (!paths.length) {
                  rows.push([n, profile.name, 'skipped (nothing safe to seed)']);
                  continue;
                }

                // Managed paths are compared by text, so an older or edited copy
                // is replaced with the current org version; `.l9/no-sync` keeps
                // them missing-only. Every other path stays missing-only.
                const optedOut = await exists(o, n, '.l9/no-sync', baseSha);
                const managed = optedOut ? [] : MANAGED_SEED_PATHS.filter((p) => p in payload);
                const existingByPath = {};
                for (const p of paths) {
                  const text = await readFile(o, n, p, baseSha);
                  if (text === null) {
                    existingByPath[p] = null;
                    continue;
                  }
                  existingByPath[p] = managed.includes(p) ? text : true;
                }
                const { writes, replaced } = selectSeedWrites(payload, existingByPath, { managed });
                if (!writes.length) {
                  rows.push([n, profile.name, optedOut ? 'already seeded (.l9/no-sync: managed files not replaced)' : 'already seeded']);
                  continue;
                }

                // ── Seed-branch safety gate ────────────────────────────────
                // The rebuild below constructs the branch as "current default
                // branch + one seed commit", so anything else already on that
                // branch would be discarded by construction rather than by
                // conflict. ops/seed-branch-safety.js decides, read-only,
                // before any git write; both seeders share that one decision.
                // allowedPaths: an unsigned seeder commit is proven by touching
                // only seed paths. payloadDigest: a PR declining exactly these
                // bytes is not re-proposed.
                const payloadDigest = seedPayloadDigest(payload, writes);
                const gate = await assessSeedBranch({
                  github, owner: o, repo: n, base, branch: BRANCH,
                  // Every class seed path, not just this run's: a narrower
                  // explicit run must still recognise a broader run's branch.
                  allowedPaths: [...new Set([...Object.keys(payload), ...classSeedPaths({ fs, profile, repository: `${o}/${n}` })])],
                  payloadDigest,
                });
                if (gate.action === 'skip') {
                  rows.push([n, profile.name, gate.declined ? `DECLINED: ${gate.reason}` : gate.reason]);
                  continue;
                }
                const branchSha = gate.sha;

                // A different open PR already changing a path this seed would
                // add makes the seed PR a merge conflict. Refuse before any write.
                const overlap = await assessOpenPrOverlap({
                  github, owner: o, repo: n, branch: BRANCH, paths: writes,
                });
                if (overlap.action === 'block') {
                  rows.push([n, profile.name, `${overlap.status}: ${overlap.reason}`]);
                  if (overlap.status === 'BLOCKED_CONFLICT') conflicts.push(n);
                  else failures += 1;
                  continue;
                }

                if (MODE === 'dry-run') {
                  const note = [
                    replaced.length ? `; replace ${replaced.join(', ')}` : '',
                    hasRootCodeowners && writes.includes('.github/CODEOWNERS') ? '; root CODEOWNERS is shadowed by .github/CODEOWNERS' : '',
                  ].join('');
                  const preview = writes.length <= 6
                    ? writes.join(', ')
                    : `${writes.slice(0, 6).join(', ')} (+${writes.length - 6} more)`;
                  const onto = branchSha ? `; rebuild ${BRANCH}` : '';
                  rows.push([n, profile.name, `would seed ${writes.length} file(s): ${preview}${note}${onto}`]);
                  continue;
                }
                const baseCommit = await github.rest.git.getCommit({ owner: o, repo: n, commit_sha: baseSha });

                // Atomic single commit: all writes or none (no orphan partial branches).
                const treeItems = [];
                // `writes` was planned from reads pinned at baseSha; re-reading
                // the same commit cannot change it, and a moved base is refused
                // before the branch moves (BASE_MOVED).
                for (const path of writes) {
                  const blob = await github.rest.git.createBlob({
                    owner: o, repo: n,
                    content: Buffer.from(payload[path]).toString('base64'),
                    encoding: 'base64',
                  });
                  treeItems.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }

                if (!treeItems.length) {
                  rows.push([n, profile.name, 'already seeded']);
                  continue;
                }

                // Additions, plus managed files replaced with the org version.
                const restored = treeItems.map(t => t.path).filter((p) => replaced.includes(p));
                const added = treeItems.map(t => t.path).filter((p) => !replaced.includes(p));
                const story = seedNarrative({
                  added, restored, profile, branch: BRANCH, sourceSha: SOURCE_SHA,
                  seeder: 'seed-governance.yml', hasRootCodeowners,
                });

                const tree = await github.rest.git.createTree({
                  owner: o, repo: n,
                  base_tree: baseCommit.data.tree.sha,
                  tree: treeItems,
                });
                const commit = await github.rest.git.createCommit({
                  owner: o, repo: n,
                  message: seedCommitMessage({
                    subject: `ci(governance): seed ${treeItems.length} org template file(s)`,
                    problem: story.problem,
                    details: story.details,
                    trailers: [`${PAYLOAD_TRAILER}: ${payloadDigest}`],
                  }),
                  tree: tree.data.sha,
                  parents: [baseSha],
                });

                // The commit is built on baseSha. If the default branch moved
                // since, do not publish it: the next run replans from the new tip.
                const baseNow = (await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` })).data.object.sha;
                if (baseNow !== baseSha) {
                  rows.push([n, profile.name, `BASE_MOVED: ${base} moved ${baseSha.slice(0, 7)} → ${baseNow.slice(0, 7)} during the run — branch not moved; next run replans`]);
                  continue;
                }

                const moved = await moveSeedBranch({
                  github, owner: o, repo: n, branch: BRANCH,
                  expectedSha: branchSha, commitSha: commit.data.sha,
                });
                if (!moved.moved) {
                  rows.push([n, profile.name, moved.reason]);
                  continue;
                }

                // The body is the org PR template, composed by the one renderer
                // against the seed commit just published; an incomplete body
                // stops here and no PR opens (the next run rebuilds the branch).
                const rendered = renderSeedPrBody({
                  exec: execFileSync, fs,
                  remoteUrl: `https://github.com/${o}/${n}.git`,
                  branch: BRANCH, headSha: commit.data.sha, baseSha,
                  template: CANONICAL_TEMPLATE,
                  composerRoot: 'composer',
                  token: process.env.SEED_GIT_TOKEN || '',
                });

                let prNumber;
                try {
                  const pr = await github.rest.pulls.create({
                    owner: o, repo: n, head: BRANCH, base,
                    title: 'ci(governance): seed org templates from Quantum-L9/.github',
                    body: rendered.body,
                  });
                  prNumber = pr.data.number;
                } catch (e) {
                  if (e.status === 422 && /pull request already exists/i.test(e.message || '')) {
                    const open = await github.rest.pulls.list({
                      owner: o, repo: n, head: `${o}:${BRANCH}`, state: 'open',
                    });
                    prNumber = open.data[0]?.number;
                    if (!prNumber) throw e;
                  } else {
                    throw e;
                  }
                }
                rows.push([n, profile.name, `PR #${prNumber} (${treeItems.length} file(s))`]);
              } catch (e) {
                // An empty repository has no default branch to seed onto: it is
                // reported, not failed (same contract as auto-seed-new-repo.yml).
                if (isEmptyRepoError(e)) {
                  uninitialized.push(n);
                  rows.push([n, '-', 'UNINITIALIZED_NOT_SEEDED: Git Repository is empty — nothing written']);
                  continue;
                }
                failures += 1;
                const msg = `${e.status || ''} ${e.message || e}`.replace(/\s+/g, ' ').slice(0, 200);
                const needsWorkflows = /Resource not accessible|must have .*workflows|Workflows/i.test(msg)
                  || /\.github\/workflows\//.test(msg);
                const hint = needsWorkflows
                  ? ' — grant App permission Workflows: Read and write, then re-accept the install'
                  : '';
                const line = `failed: ${msg}${hint}`;
                core.error(`${n}: ${line}`);
                rows.push([n, profile ? profile.name : '?', line]);
              }
            }

            await core.summary
              .addHeading(`Seed (${MODE}) — ${rows.length} repos`, 2)
              .addRaw(`\nCategories: \`${categoriesLabel}\`\n`)
              .addTable([
                [
                  { data: 'repo', header: true },
                  { data: 'class', header: true },
                  { data: 'result', header: true },
                ],
                ...rows.map(r => r.map(String)),
              ])
              .write();

            if (uninitialized.length) {
              core.warning(
                `${uninitialized.length} repo(s) have no commits and were NOT seeded: ${uninitialized.join(', ')}`,
              );
            }
            if (unresolved.length) {
              core.warning(
                `${unresolved.length} repo(s) declare an unresolvable class and were skipped: ` +
                  `${unresolved.join(', ')} — fix the marker; they are NOT seeded under default`,
              );
            }
            if (conflicts.length) {
              core.warning(
                `${conflicts.length} repo(s) not seeded because another open PR changes a path the seed would add: ` +
                  `${conflicts.join(', ')} — nothing was written; the next run replans`,
              );
            }
            if (forbidden.length) {
              core.warning(
                `${forbidden.length} repo(s) skipped because their class forbids a requested category: ` +
                  `${forbidden.join(', ')} — nothing was written to them; run with categories=all to seed what each class allows`,
              );
            }

            if (failures > 0) {
              core.setFailed(`${failures} repo(s) failed seeding — see job summary`);
            }
