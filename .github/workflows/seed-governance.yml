name: Seed org templates into consumers

# Physically seeds templates/ health files plus the l9-ci-pack Core hub:
# CODEOWNERS, dependabot, governance caller, labels, community-health,
# issue/PR templates, on-org-update receiver, l9-analysis.yml, lint callers,
# .github/governance/*.yaml, and the locked TypeScript Biome contract
# (biome.json, .biomeignore, .editorconfig, .vscode/extensions.json).
#
# Matches ops/sync-org-files.sh + templates/README.md. This repo distributes
# Core pack callers; l9-ci-core executes CI — see docs/BOUNDARIES.md.
#
# Auth: org secret `GH_TOKEN` (SSOT = AWS openclaw-igorbot/github#token).
# A fine-grained PAT / classic admin PAT can write `.github/workflows/*`.
# The l9-governance-seeder App also requests workflows:write, but an org install
# only gains that scope after a browser "Accept new permissions" — there is no
# REST accept endpoint. Prefer the PAT so seed is not blocked on that click.
#
# Default behavior: add missing files only (never overwrite existing content),
# except replace a stock ESLint l9-lint-test-node.yml with the Biome caller.
# Root CODEOWNERS takes precedence — .github/CODEOWNERS is not seeded over it.
#
# Branch safety: the seed branch is rebuilt as "default branch + one seed
# commit", so ops/seed-branch-safety.js gates every ref move. A branch with an
# open PR, or carrying any commit the seeder did not author, is left alone.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run lists targets only; seed opens PRs.
        type: choice
        options: [dry-run, seed]
        default: dry-run
      repo_filter:
        description: Optional substring filter, e.g. "l9-repo-template".
        type: string
        default: ""
      categories:
        description: >-
          Comma-separated categories, or "all". Options: codeowners, dependabot,
          governance, labels, community-health, issue-templates, pr-templates,
          on-org-update, l9-ci-pack.
        type: string
        default: all

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: governance-distribution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # Pass dispatch inputs via env — never interpolate into script: (CodeQL js/actions/code-injection)
          SEED_MODE: ${{ inputs.mode }}
          SEED_REPO_FILTER: ${{ inputs.repo_filter }}
          SEED_CATEGORIES: ${{ inputs.categories }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const {
              buildSeedPayload,
              parseCategories,
              ALL_CATEGORIES,
              STOCK_ESLINT_NODE_DEST,
              selectSeedWrites,
            } = require('./ops/build-seed-payload.js');
            const { classifySeedBranch } = require('./ops/seed-branch-safety.js');

            const MODE = process.env.SEED_MODE || 'dry-run';
            const FILTER = process.env.SEED_REPO_FILTER || '';
            const BRANCH = 'chore/seed-governance';

            let categories;
            try {
              categories = parseCategories(process.env.SEED_CATEGORIES || 'all');
            } catch (e) {
              core.setFailed(e.message);
              return;
            }

            const exists = async (owner, repo, path, ref) => {
              try {
                await github.rest.repos.getContent({ owner, repo, path, ...(ref ? { ref } : {}) });
                return true;
              } catch {
                return false;
              }
            };

            const readText = async (owner, repo, path) => {
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path });
                if (res.data && res.data.content) {
                  return Buffer.from(res.data.content, 'base64').toString('utf8');
                }
              } catch { /* missing */ }
              return null;
            };

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: 'Quantum-L9', type: 'all', per_page: 100,
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' && (!FILTER || r.name.includes(FILTER)));

            const rows = [];
            const failed = [];

            core.info(`categories=${categories.join(',')} (of ${ALL_CATEGORIES.join(',')})`);

            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              try {
                const hasRootCodeowners = await exists(o, n, 'CODEOWNERS');
                const payload = buildSeedPayload({ fs, categories, hasRootCodeowners });
                const paths = Object.keys(payload);

                if (!paths.length) {
                  rows.push([n, 'skipped (nothing safe to seed)']);
                  continue;
                }

                const existingByPath = {};
                for (const p of paths) {
                  if (!(await exists(o, n, p))) {
                    existingByPath[p] = null;
                    continue;
                  }
                  existingByPath[p] = p === STOCK_ESLINT_NODE_DEST
                    ? await readText(o, n, p)
                    : true;
                }
                const { writes, replaced } = selectSeedWrites(payload, existingByPath);
                if (!writes.length) {
                  rows.push([n, hasRootCodeowners
                    ? 'already seeded (root CODEOWNERS preserved)'
                    : 'already seeded']);
                  continue;
                }

                const base = repo.default_branch;

                // ── Seed-branch safety gate ──────────────────────────────
                // Runs before any git write. The seed commit below is built on
                // the default branch, so moving the branch onto it discards
                // anything else already there. Prove the branch is still
                // pristine seeder output, or leave it alone.
                const openPRs = await github.rest.pulls.list({
                  owner: o, repo: n, head: `${o}:${BRANCH}`, state: 'open',
                });
                if (openPRs.data.length) {
                  rows.push([n, `PR #${openPRs.data[0].number} already open — left alone`]);
                  continue;
                }

                let branchSha = null;
                try {
                  const ref = await github.rest.git.getRef({
                    owner: o, repo: n, ref: `heads/${BRANCH}`,
                  });
                  branchSha = ref.data.object.sha;
                } catch (e) {
                  if (e.status !== 404) throw e;
                }

                if (branchSha) {
                  // Raw REST: no dependency on an octokit method alias.
                  const cmp = await github.request(
                    'GET /repos/{owner}/{repo}/compare/{basehead}',
                    { owner: o, repo: n, basehead: `${base}...${BRANCH}` },
                  );
                  const verdict = classifySeedBranch({
                    aheadBy: cmp.data.ahead_by,
                    commits: (cmp.data.commits || []).map(c => ({
                      sha: c.sha, message: c.commit && c.commit.message,
                    })),
                  });
                  if (!verdict.safeToReplace) {
                    rows.push([n, `branch ${BRANCH} ${verdict.reason} — left alone`]);
                    continue;
                  }
                }

                if (MODE === 'dry-run') {
                  const note = hasRootCodeowners ? '; preserve root CODEOWNERS' : '';
                  const upgrade = replaced.length ? `; replace stock ESLint ${replaced.join(', ')}` : '';
                  const preview = writes.length <= 6
                    ? writes.join(', ')
                    : `${writes.slice(0, 6).join(', ')} (+${writes.length - 6} more)`;
                  const onto = branchSha ? `; rebuild ${BRANCH}` : '';
                  rows.push([n, `would seed ${writes.length} file(s): ${preview}${upgrade}${note}${onto}`]);
                  continue;
                }

                const baseRef = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });
                const baseSha = baseRef.data.object.sha;
                const baseCommit = await github.rest.git.getCommit({ owner: o, repo: n, commit_sha: baseSha });

                // Atomic single commit: all writes or none (no orphan partial branches).
                const treeItems = [];
                for (const path of writes) {
                  if (!replaced.includes(path) && await exists(o, n, path, base)) continue;
                  const blob = await github.rest.git.createBlob({
                    owner: o, repo: n,
                    content: Buffer.from(payload[path]).toString('base64'),
                    encoding: 'base64',
                  });
                  treeItems.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }

                if (!treeItems.length) {
                  rows.push([n, 'already seeded']);
                  continue;
                }

                const tree = await github.rest.git.createTree({
                  owner: o, repo: n,
                  base_tree: baseCommit.data.tree.sha,
                  tree: treeItems,
                });
                const commit = await github.rest.git.createCommit({
                  owner: o, repo: n,
                  message: `chore(governance): seed ${treeItems.length} org template file(s)`,
                  tree: tree.data.sha,
                  parents: [baseSha],
                });

                if (branchSha === null) {
                  try {
                    await github.rest.git.createRef({
                      owner: o, repo: n, ref: `refs/heads/${BRANCH}`, sha: commit.data.sha,
                    });
                  } catch (e) {
                    if (e.status !== 422) throw e;
                    // Appeared mid-run — it was not covered by the gate above.
                    rows.push([n, `branch ${BRANCH} appeared during the run — left alone`]);
                    continue;
                  }
                } else {
                  // Compare-and-swap: the verdict above is only valid for the
                  // sha it was computed from.
                  const now = await github.rest.git.getRef({
                    owner: o, repo: n, ref: `heads/${BRANCH}`,
                  });
                  if (now.data.object.sha !== branchSha) {
                    rows.push([n, `branch ${BRANCH} moved during the run — left alone`]);
                    continue;
                  }
                  // Force is required (the rebuild is not a fast-forward) and
                  // safe: the branch was proven to hold only the seeder commit.
                  await github.rest.git.updateRef({
                    owner: o, repo: n, ref: `heads/${BRANCH}`, sha: commit.data.sha, force: true,
                  });
                }

                const listed = treeItems.map(t => `- \`${t.path}\``);
                const bodyLines = [
                  'Seeds org template files from `Quantum-L9/.github/templates/` plus the `l9-ci-pack/` Core hub (physical copy).',
                  '',
                  `Categories: \`${categories.join('`, `')}\`.`,
                  '',
                  '### Files in this PR',
                  ...listed,
                  hasRootCodeowners
                    ? '- root `CODEOWNERS` already present — **not** overwritten by `.github/CODEOWNERS`'
                    : '',
                  '',
                  'Existing files were left untouched (missing-only seed), except a stock ESLint `l9-lint-test-node.yml` which is replaced with the Biome SDK caller.',
                  '`.github/workflows/governance.yml` is **advisory** (`strict` defaults false).',
                  'Core pack callers (`l9-analysis.yml`, lint templates, `.github/governance/`) and the locked Biome contract (`biome.json`) are distributed here; `l9-ci-core` executes CI.',
                  '',
                  'Source map: `templates/README.md` · pack: `l9-ci-pack/` · sync twin: `ops/sync-org-files.sh`.',
                ].filter((line, idx, arr) => !(line === '' && arr[idx - 1] === ''));

                let prNumber;
                try {
                  const pr = await github.rest.pulls.create({
                    owner: o, repo: n, head: BRANCH, base,
                    title: 'chore(governance): seed org templates from Quantum-L9/.github',
                    body: bodyLines.join('\n'),
                  });
                  prNumber = pr.data.number;
                } catch (e) {
                  if (e.status === 422 && /pull request already exists/i.test(e.message || '')) {
                    const open = await github.rest.pulls.list({
                      owner: o, repo: n, head: `${o}:${BRANCH}`, state: 'open',
                    });
                    prNumber = open.data[0]?.number;
                    if (!prNumber) throw e;
                  } else {
                    throw e;
                  }
                }
                rows.push([n, `PR #${prNumber} (${treeItems.length} file(s))`]);
              } catch (e) {
                failed.push(n);
                const msg = `${e.status || ''} ${e.message || e}`.replace(/\s+/g, ' ').slice(0, 200);
                const needsWorkflows = /Resource not accessible|must have .*workflows|Workflows/i.test(msg)
                  || /\.github\/workflows\//.test(msg);
                const hint = needsWorkflows
                  ? ' — grant App permission Workflows: Read and write, then re-accept the install'
                  : '';
                const line = `failed: ${msg}${hint}`;
                core.error(`${n}: ${line}`);
                rows.push([n, line]);
              }
            }

            await core.summary
              .addHeading(`Seed (${MODE}) — ${rows.length} repos`, 2)
              .addRaw(`\nCategories: \`${categories.join('`, `')}\`\n`)
              .addTable([
                [{ data: 'repo', header: true }, { data: 'result', header: true }],
                ...rows.map(r => r.map(String)),
              ])
              .write();

            if (failed.length) {
              core.setFailed(
                `${failed.length} repo(s) failed seeding: ${failed.join(', ')} — see job summary`,
              );
            }
