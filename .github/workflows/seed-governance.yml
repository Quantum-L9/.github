name: Seed org templates into consumers

# Physically seeds ownership files, SECURITY.md, and templates. CI is never
# seeded. Default `all` omits labels.yml (org sync-labels-all), LICENSE, the
# inherited community-health files (CODE_OF_CONDUCT.md, CONTRIBUTING.md,
# SUPPORT.md, FUNDING.yml, VULNERABILITY_REPORT.yml), and duplicate issue
# templates.
#
# Repo-class aware, same as auto-seed-new-repo.yml: every target resolves its
# class from `.l9/org-birth-profile.yaml` against policies/repo-classes.yml
# (marker > override > default; a malformed or unknown marker is skipped and
# reported, never widened to default). `all` means the class's own
# seed_categories. An explicit category list still passes through the class:
# INHERIT destinations drop, and a FORBID destination skips that repo with the
# class and path named — it is never written.
#
# Matches ops/sync-org-files.sh. CI is not distributed from here — see
# docs/BOUNDARIES.md.
#
# Auth: org secret `GH_TOKEN` (SSOT = AWS openclaw-igorbot/github#token).
# A fine-grained PAT / classic admin PAT can write `.github/workflows/*`.
# The l9-governance-seeder App also requests workflows:write, but an org install
# only gains that scope after a browser "Accept new permissions" — there is no
# REST accept endpoint. Prefer the PAT so seed is not blocked on that click.
#
# Default behavior: add missing files only (never overwrite existing content).
# Root CODEOWNERS takes precedence — .github/CODEOWNERS is not seeded over it.
#
# Branch safety: the seed branch is rebuilt as "default branch + one seed
# commit", so ops/seed-branch-safety.js gates every ref move. A branch with an
# open PR, or carrying any commit the seeder did not author, is left alone.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run lists targets only; seed opens PRs.
        type: choice
        options: [dry-run, seed]
        default: dry-run
      repo_filter:
        description: Optional substring filter, e.g. "l9-repo-template".
        type: string
        default: ""
      categories:
        description: >-
          Comma-separated categories, or "all" (= each repo's class
          seed_categories; default class: codeowners, dependabot, governance,
          community-health, issue-templates, pr-templates). Opt-in: labels.
          A category a repo's class forbids skips that repo. Retired (fail
          closed): on-org-update.
        type: string
        default: all

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Pass dispatch inputs via env — never interpolate into script: (CodeQL js/actions/code-injection)
          SEED_MODE: ${{ inputs.mode }}
          SEED_REPO_FILTER: ${{ inputs.repo_filter }}
          SEED_CATEGORIES: ${{ inputs.categories }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const {
              buildSeedPayload,
              parseCategories,
              ALL_CATEGORIES,
              DEFAULT_CATEGORIES,
              selectSeedWrites,
            } = require('./ops/build-seed-payload.js');
            const {
              assessSeedBranch,
              moveSeedBranch,
            } = require('./ops/seed-branch-safety.js');
            const {
              loadRepoClasses,
              classForRepo,
              resolveProfile,
            } = require('./ops/repo-class-profile.js');

            const MODE = process.env.SEED_MODE || 'dry-run';
            const FILTER = process.env.SEED_REPO_FILTER || '';
            const BRANCH = 'chore/seed-governance';
            const classes = loadRepoClasses(fs);

            // `all` is not a category list: it means "whatever this repo's
            // class materializes". Only an explicit list is parsed here, and
            // it still passes through the class (INHERIT drops, FORBID skips).
            const rawCategories = (process.env.SEED_CATEGORIES || 'all').trim();
            let explicitCategories = null;
            if (rawCategories && rawCategories !== 'all') {
              try {
                explicitCategories = parseCategories(rawCategories);
              } catch (e) {
                core.setFailed(e.message);
                return;
              }
            }
            const categoriesLabel = explicitCategories
              ? explicitCategories.join(',')
              : 'all (per repo class)';

            const exists = async (owner, repo, path, ref) => {
              try {
                await github.rest.repos.getContent({ owner, repo, path, ...(ref ? { ref } : {}) });
                return true;
              } catch {
                return false;
              }
            };

            const readText = async (owner, repo, path) => {
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path });
                if (res.data && res.data.content) {
                  return Buffer.from(res.data.content, 'base64').toString('utf8');
                }
              } catch { /* missing */ }
              return null;
            };

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: 'Quantum-L9', type: 'all', per_page: 100,
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' && (!FILTER || r.name.includes(FILTER)));

            const rows = [];
            const unresolved = [];
            const forbidden = [];
            let failures = 0;

            core.info(`categories=${categoriesLabel} (default class ${DEFAULT_CATEGORIES.join(',')}; all known ${ALL_CATEGORIES.join(',')})`);

            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              let profile = null;
              try {
                const hasRootCodeowners = await exists(o, n, 'CODEOWNERS');
                const hasPython = (await exists(o, n, 'pyproject.toml'))
                  || (await exists(o, n, 'requirements.txt'));
                const hasPackageJson = await exists(o, n, 'package.json');

                // Same class probe as auto-seed-new-repo.yml: existence first,
                // because readText() returns null for both a missing file and a
                // failed fetch, and a transient fetch error must not fall
                // through to `default` — the widest payload.
                let marker = null;
                if (await exists(o, n, classes.marker_path)) {
                  marker = (await readText(o, n, classes.marker_path)) ?? '';
                }
                const decided = classForRepo(classes, n, marker);
                if (decided.error) {
                  rows.push([n, 'unresolved', `skipped: ${decided.error}`]);
                  unresolved.push(n);
                  continue;
                }
                profile = resolveProfile(classes, decided.name);
                if (decided.name) profile.resolved_from = decided.source;

                let payload;
                try {
                  payload = buildSeedPayload({
                    fs,
                    // null lets the class's seed_categories decide; an explicit
                    // list is still filtered by the class (INHERIT) and refused
                    // on a FORBID hit.
                    categories: explicitCategories ?? undefined,
                    profile,
                    hasRootCodeowners,
                    hasPython,
                    hasPackageJson,
                    repository: `${o}/${n}`,
                  });
                } catch (e) {
                  if (!/violates repo class/.test(e.message || '')) throw e;
                  // An explicit category this class forbids: report the class
                  // and the path, write nothing, and keep sweeping.
                  const why = String(e.message).replace(/\s+/g, ' ').slice(0, 200);
                  rows.push([n, profile.name, `skipped (class forbids requested category): ${why}`]);
                  forbidden.push(n);
                  continue;
                }
                const paths = Object.keys(payload);

                if (!paths.length) {
                  rows.push([n, profile.name, 'skipped (nothing safe to seed)']);
                  continue;
                }

                const existingByPath = {};
                for (const p of paths) {
                  if (!(await exists(o, n, p))) {
                    existingByPath[p] = null;
                    continue;
                  }
                  existingByPath[p] = true;
                }
                const { writes } = selectSeedWrites(payload, existingByPath);
                if (!writes.length) {
                  rows.push([n, profile.name, hasRootCodeowners
                    ? 'already seeded (root CODEOWNERS preserved)'
                    : 'already seeded']);
                  continue;
                }

                const base = repo.default_branch;

                // ── Seed-branch safety gate ────────────────────────────────
                // The rebuild below constructs the branch as "current default
                // branch + one seed commit", so anything else already on that
                // branch would be discarded by construction rather than by
                // conflict. ops/seed-branch-safety.js decides, read-only,
                // before any git write; both seeders share that one decision.
                const gate = await assessSeedBranch({
                  github, owner: o, repo: n, base, branch: BRANCH,
                });
                if (gate.action === 'skip') {
                  rows.push([n, profile.name, gate.reason]);
                  continue;
                }
                const branchSha = gate.sha;

                if (MODE === 'dry-run') {
                  const note = hasRootCodeowners ? '; preserve root CODEOWNERS' : '';
                  const preview = writes.length <= 6
                    ? writes.join(', ')
                    : `${writes.slice(0, 6).join(', ')} (+${writes.length - 6} more)`;
                  const onto = branchSha ? `; rebuild ${BRANCH}` : '';
                  rows.push([n, profile.name, `would seed ${writes.length} file(s): ${preview}${note}${onto}`]);
                  continue;
                }
                const baseRef = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });
                const baseSha = baseRef.data.object.sha;
                const baseCommit = await github.rest.git.getCommit({ owner: o, repo: n, commit_sha: baseSha });

                // Atomic single commit: all writes or none (no orphan partial branches).
                const treeItems = [];
                for (const path of writes) {
                  if (await exists(o, n, path, base)) continue;
                  const blob = await github.rest.git.createBlob({
                    owner: o, repo: n,
                    content: Buffer.from(payload[path]).toString('base64'),
                    encoding: 'base64',
                  });
                  treeItems.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }

                if (!treeItems.length) {
                  rows.push([n, profile.name, 'already seeded']);
                  continue;
                }

                const tree = await github.rest.git.createTree({
                  owner: o, repo: n,
                  base_tree: baseCommit.data.tree.sha,
                  tree: treeItems,
                });
                const commit = await github.rest.git.createCommit({
                  owner: o, repo: n,
                  message: `chore(governance): seed ${treeItems.length} org template file(s)`,
                  tree: tree.data.sha,
                  parents: [baseSha],
                });

                const moved = await moveSeedBranch({
                  github, owner: o, repo: n, branch: BRANCH,
                  expectedSha: branchSha, commitSha: commit.data.sha,
                });
                if (!moved.moved) {
                  rows.push([n, profile.name, moved.reason]);
                  continue;
                }

                const listed = treeItems.map(t => `- \`${t.path}\``);
                const bodyLines = [
                  'Seeds org health and ownership files from `Quantum-L9/.github`. CI is not distributed from this repository.',
                  '',
                  `**Repo class:** \`${profile.name}\` (${profile.resolved_from}) — see \`policies/repo-classes.yml\`.`,
                  profile.inherit.length
                    ? `Inherited from the org \`.github\` repo and deliberately **not** copied here: ${profile.inherit.map(p => `\`${p}\``).join(', ')}.`
                    : '',
                  '',
                  `Categories: \`${categoriesLabel}\`.`,
                  '',
                  '### Files in this PR',
                  ...listed,
                  hasRootCodeowners
                    ? '- root `CODEOWNERS` already present — **not** overwritten by `.github/CODEOWNERS`'
                    : '',
                  '',
                  'Existing files were left untouched (missing-only seed).',
                  '`.github/workflows/governance.yml` is **advisory** (`strict` defaults false).',
                  'CI callers are not distributed from this repository. See `docs/BOUNDARIES.md`.',
                  '',
                  'Source map: `policies/mandatory-files.yml` · sync twin: `ops/sync-org-files.sh`.',
                  '',
                  'While this PR is open the seeder leaves the branch alone — commit review fixes onto it freely.',
                ].filter((line, idx, arr) => !(line === '' && arr[idx - 1] === ''));

                let prNumber;
                try {
                  const pr = await github.rest.pulls.create({
                    owner: o, repo: n, head: BRANCH, base,
                    title: 'chore(governance): seed org templates from Quantum-L9/.github',
                    body: bodyLines.join('\n'),
                  });
                  prNumber = pr.data.number;
                } catch (e) {
                  if (e.status === 422 && /pull request already exists/i.test(e.message || '')) {
                    const open = await github.rest.pulls.list({
                      owner: o, repo: n, head: `${o}:${BRANCH}`, state: 'open',
                    });
                    prNumber = open.data[0]?.number;
                    if (!prNumber) throw e;
                  } else {
                    throw e;
                  }
                }
                rows.push([n, profile.name, `PR #${prNumber} (${treeItems.length} file(s))`]);
              } catch (e) {
                failures += 1;
                const msg = `${e.status || ''} ${e.message || e}`.replace(/\s+/g, ' ').slice(0, 200);
                const needsWorkflows = /Resource not accessible|must have .*workflows|Workflows/i.test(msg)
                  || /\.github\/workflows\//.test(msg);
                const hint = needsWorkflows
                  ? ' — grant App permission Workflows: Read and write, then re-accept the install'
                  : '';
                const line = `failed: ${msg}${hint}`;
                core.error(`${n}: ${line}`);
                rows.push([n, profile ? profile.name : '?', line]);
              }
            }

            await core.summary
              .addHeading(`Seed (${MODE}) — ${rows.length} repos`, 2)
              .addRaw(`\nCategories: \`${categoriesLabel}\`\n`)
              .addTable([
                [
                  { data: 'repo', header: true },
                  { data: 'class', header: true },
                  { data: 'result', header: true },
                ],
                ...rows.map(r => r.map(String)),
              ])
              .write();

            if (unresolved.length) {
              core.warning(
                `${unresolved.length} repo(s) declare an unresolvable class and were skipped: ` +
                  `${unresolved.join(', ')} — fix the marker; they are NOT seeded under default`,
              );
            }
            if (forbidden.length) {
              core.warning(
                `${forbidden.length} repo(s) skipped because their class forbids a requested category: ` +
                  `${forbidden.join(', ')} — nothing was written to them; run with categories=all to seed what each class allows`,
              );
            }

            if (failures > 0) {
              core.setFailed(`${failures} repo(s) failed seeding — see job summary`);
            }
