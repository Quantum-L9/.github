# Auto-seeds applicable org capabilities into newly created repositories.
# Same payload as seed-governance.yml (ops/build-seed-payload.js).
# Auth: org secret GH_TOKEN (AWS openclaw-igorbot/github#token) — see seed-governance.yml.
# Advisory only — opens a PR, never pushes directly to main.
#
# Repo-class aware: each target resolves its class from
# `.l9/org-birth-profile.yaml` against policies/repo-classes.yml. The seed is
# the class's applicable capabilities, NOT every template file. A repo with no
# marker resolves to `default`, whose payload is what this workflow always sent.
# This is what keeps the seeder from writing `.github/workflows/governance.yml`
# into an l9-repo-template repository, where
# scripts/inventory_check.py fails closed on exactly those paths.
#
# Create-time path: an hourly cron lists org repos and seeds anything
# missing (or still carrying the stock ESLint node caller). That does not
# depend on an org webhook or App repository events.
# repository_dispatch type repo_created remains as an optional fast path
# if an App/webhook is installed later.
#
# Branch safety: the seed branch is rebuilt as "default branch + one seed
# commit", so ops/seed-branch-safety.js gates every ref move. A branch with an
# open PR, or carrying any commit the seeder did not author, is left alone.
# A sweep takes ~10 minutes org-wide; hourly leaves headroom and the
# concurrency group keeps two sweeps from holding org-wide write at once.
name: Auto-seed new repository

on:
  schedule:
    - cron: '20 * * * *'
  repository_dispatch:
    types: [repo_created]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Specific repo name to seed (blank = all unseeded repos)"
        type: string
        default: ""
      repo_class:
        description: "Force a repo class (blank = resolve from each repo's .l9/org-birth-profile.yaml)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only, no PRs)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: auto-seed-new-repo
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-distribution
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require org GH_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::org secret GH_TOKEN is empty — sync from AWS openclaw-igorbot/github#token"
            exit 1
          fi

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
          REPO_CLASS: ${{ inputs.repo_class || github.event.client_payload.repo_class || '' }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const fs = require('fs');
            const {
              buildSeedPayload,
              selectSeedWrites,
            } = require('./ops/build-seed-payload.js');
            const {
              assessSeedBranch,
              assessOpenPrOverlap,
              moveSeedBranch,
            } = require('./ops/seed-branch-safety.js');
            const {
              loadRepoClasses,
              parseClassMarker,
              classForRepo,
              resolveProfile,
            } = require('./ops/repo-class-profile.js');

            const DRY = process.env.DRY_RUN === 'true';
            const TARGET = process.env.TARGET_REPO;
            const FORCED_CLASS = (process.env.REPO_CLASS || '').trim();
            const classes = loadRepoClasses(fs);
            // A forced class is an operator statement, so a typo must stop the
            // run rather than silently fall back to the wider default payload.
            if (FORCED_CLASS) resolveProfile(classes, FORCED_CLASS, { strict: true });
            const BRANCH = 'chore/auto-seed-governance';

            // Only a 404 means "absent". 403, 409, 5xx, or a directory where a
            // file belongs are not answers: they throw, so an unreadable repo
            // can never be planned as if its files were missing.
            const readFile = async (owner, repo, path, ref) => {
              let res;
              try {
                res = await github.rest.repos.getContent({ owner, repo, path, ...(ref ? { ref } : {}) });
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
              const d = res.data;
              if (!d || Array.isArray(d) || (d.type && d.type !== 'file') || typeof d.content !== 'string') {
                throw Object.assign(new Error(`${path} is not a readable file (got ${Array.isArray(d) ? 'a directory' : (d && d.type) || 'no content'})`), { status: 'NOT_A_FILE' });
              }
              return Buffer.from(d.content, 'base64').toString('utf8');
            };
            const exists = async (owner, repo, path, ref) => (await readFile(owner, repo, path, ref)) !== null;
            const SOURCE_SHA = process.env.GITHUB_SHA || 'unknown';
            // GitHub's exact answer for a repository with no commits. Only this
            // 409 means "nothing to seed onto yet"; any other 409 is a failure.
            const isEmptyRepo = (e) => e && e.status === 409 && /^Git Repository is empty\.?$/i.test(String(e.message || '').trim());

            let targets;
            if (TARGET) {
              const repo = await github.rest.repos.get({ owner: 'Quantum-L9', repo: TARGET });
              targets = [repo.data];
            } else {
              const all = await github.paginate(github.rest.repos.listForOrg, {
                org: 'Quantum-L9', type: 'all', per_page: 100
              });
              targets = all.filter(r => !r.archived && !r.fork && r.name !== '.github');
            }

            const rows = [];
            const failed = [];
            const unresolved = [];
            const uninitialized = [];
            const conflicts = [];

            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              try {
                const hasRootCodeowners = await exists(o, n, 'CODEOWNERS');

                // The repository declares its own class; the organization
                // honours it. Absent and unreadable are different answers:
                // readFile() returns null only on a 404 and throws otherwise,
                // so a transient API error never falls through to `default` —
                // the widest payload. Only a genuinely absent marker reaches
                // the override/default path.
                const marker = FORCED_CLASS ? null : await readFile(o, n, classes.marker_path);
                const decided = FORCED_CLASS
                  ? { name: FORCED_CLASS, source: 'operator input', error: null }
                  : classForRepo(classes, n, marker);

                // A repository that declared a class we cannot honor is skipped
                // and reported. Seeding it under `default` would widen exactly
                // what its declaration was trying to narrow.
                if (decided.error) {
                  rows.push([n, 'unresolved', `skipped: ${decided.error}`]);
                  unresolved.push(n);
                  continue;
                }

                const profile = resolveProfile(classes, decided.name);
                if (decided.name) profile.resolved_from = decided.source;

                const payload = buildSeedPayload({
                  fs,
                  profile,
                  hasRootCodeowners,
                  repository: `${o}/${n}`,
                });
                const paths = Object.keys(payload);
                if (!paths.length) {
                  rows.push([n, profile.name, 'skipped (nothing safe to seed)']);
                  continue;
                }

                const existingByPath = {};
                for (const p of paths) {
                  if (!(await exists(o, n, p))) {
                    existingByPath[p] = null;
                    continue;
                  }
                  existingByPath[p] = true;
                }
                const { writes } = selectSeedWrites(payload, existingByPath);
                if (!writes.length) {
                  rows.push([n, profile.name, 'already seeded']);
                  continue;
                }

                const base = repo.default_branch;

                // ── Seed-branch safety gate ────────────────────────────────
                // The rebuild below constructs the branch as "current default
                // branch + one seed commit", so anything else already on that
                // branch would be discarded by construction rather than by
                // conflict. ops/seed-branch-safety.js decides, read-only,
                // before any git write; both seeders share that one decision.
                const gate = await assessSeedBranch({
                  github, owner: o, repo: n, base, branch: BRANCH,
                });
                if (gate.action === 'skip') {
                  rows.push([n, profile.name, gate.reason]);
                  continue;
                }
                const branchSha = gate.sha;

                // A different open PR already changing a path this seed would
                // add makes the seed PR a merge conflict. Refuse before any write.
                const overlap = await assessOpenPrOverlap({
                  github, owner: o, repo: n, branch: BRANCH, paths: writes,
                });
                if (overlap.action === 'block') {
                  rows.push([n, profile.name, `${overlap.status}: ${overlap.reason}`]);
                  if (overlap.status === 'BLOCKED_CONFLICT') conflicts.push(n);
                  else failed.push(n);
                  continue;
                }

                if (DRY) {
                  const preview = writes.length <= 6
                    ? writes.join(', ')
                    : `${writes.slice(0, 6).join(', ')} (+${writes.length - 6} more)`;
                  const onto = branchSha ? `; rebuild ${BRANCH}` : '';
                  rows.push([n, profile.name, `would seed ${writes.length}: ${preview}${onto}`]);
                  continue;
                }
                const baseRef = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });
                const baseSha = baseRef.data.object.sha;
                const baseCommit = await github.rest.git.getCommit({ owner: o, repo: n, commit_sha: baseSha });

                const treeItems = [];
                for (const path of writes) {
                  if (await exists(o, n, path, baseSha)) continue;
                  const blob = await github.rest.git.createBlob({
                    owner: o, repo: n,
                    content: Buffer.from(payload[path]).toString('base64'),
                    encoding: 'base64',
                  });
                  treeItems.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }

                if (!treeItems.length) {
                  rows.push([n, profile.name, 'already seeded']);
                  continue;
                }

                const tree = await github.rest.git.createTree({
                  owner: o, repo: n,
                  base_tree: baseCommit.data.tree.sha,
                  tree: treeItems,
                });
                const commit = await github.rest.git.createCommit({
                  owner: o, repo: n,
                  message: `chore(governance): auto-seed ${treeItems.length} org template file(s)`,
                  tree: tree.data.sha,
                  parents: [baseSha],
                });

                // The commit is built on baseSha. If the default branch moved
                // since, do not publish it: the next run replans from the new tip.
                const baseNow = (await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` })).data.object.sha;
                if (baseNow !== baseSha) {
                  rows.push([n, profile.name, `BASE_MOVED: ${base} moved ${baseSha.slice(0, 7)} → ${baseNow.slice(0, 7)} during the run — branch not moved; next run replans`]);
                  continue;
                }

                const moved = await moveSeedBranch({
                  github, owner: o, repo: n, branch: BRANCH,
                  expectedSha: branchSha, commitSha: commit.data.sha,
                });
                if (!moved.moved) {
                  rows.push([n, profile.name, moved.reason]);
                  continue;
                }

                // Seed-specific body in the sections governance-pr.yml checks.
                // Facts only: what was added, on which exact base, from which
                // source. Nothing here claims a check this run did not make.
                const added = treeItems.map(t => t.path);
                const behavioral = added.some(p => p === '.github/CODEOWNERS'
                  || p === '.github/dependabot.yml' || p.startsWith('.github/workflows/'));
                const pr = await github.rest.pulls.create({
                  owner: o, repo: n, head: BRANCH, base,
                  title: 'chore(governance): auto-seed org templates from Quantum-L9/.github',
                  body: [
                    '## Problem',
                    '',
                    `This repository is missing ${added.length} file(s) that its repo class \`${profile.name}\` (${profile.resolved_from}) materializes from \`Quantum-L9/.github\` — see \`policies/repo-classes.yml\`.`,
                    profile.inherit.length
                      ? `Inherited from the org \`.github\` repo and deliberately **not** copied here: ${profile.inherit.map(p => `\`${p}\``).join(', ')}.`
                      : '',
                    '',
                    '## Fix',
                    '',
                    `Adds only the missing files listed under Evidence, in one commit on \`${BRANCH}\`. Existing files were left untouched (missing-only seed).`,
                    hasRootCodeowners
                      ? 'Root `CODEOWNERS` is present and is **not** overridden by `.github/CODEOWNERS`.'
                      : '',
                    'Governance caller, where added, is **advisory** (`strict` defaults false). CI callers are not distributed from this repository. See `docs/BOUNDARIES.md`.',
                    'While this PR is open the seeder leaves the branch alone — commit review fixes onto it freely.',
                    '',
                    '## Risk',
                    '',
                    `- [${behavioral ? ' ' : 'x'}] Low — additive, reversible, no data or contract change`,
                    `- [${behavioral ? 'x' : ' '}] Medium — touches shared code, config, or a public interface`,
                    '- [ ] High — breaking change, migration, IAM/network, or irreversible',
                    '',
                    '## Evidence',
                    '',
                    '```text',
                    `source: Quantum-L9/.github@${SOURCE_SHA}`,
                    `base:   ${base}@${baseSha}`,
                    `class:  ${profile.name} (${profile.resolved_from})`,
                    `added (${added.length}):`,
                    ...added.map(p => `  ${p}`),
                    '```',
                    '',
                    '## Gates',
                    '',
                    '- [x] No other open PR changed these paths when the seed was planned (a PR opened later is not covered)',
                    "- [ ] Consumer CI passes on this PR — unverified: the seeder neither runs nor observes this repository's checks",
                    '',
                    '_Opened automatically by Quantum-L9/.github auto-seed._',
                  ].filter((line, idx, arr) => !(line === '' && arr[idx - 1] === '')).join('\n'),
                });
                rows.push([n, profile.name, `PR #${pr.data.number} (${treeItems.length} file(s))`]);
              } catch (e) {
                // An empty repository has no default branch to seed onto. It is
                // neither seeded nor failed; the next hourly sweep retries it.
                if (isEmptyRepo(e)) {
                  uninitialized.push(n);
                  rows.push([n, '-', 'UNINITIALIZED_NOT_SEEDED: Git Repository is empty — nothing written; retried next sweep']);
                  continue;
                }
                failed.push(n);
                const msg = `${e.status || ''} ${e.message || e}`.replace(/\s+/g, ' ').slice(0, 120);
                core.error(`${n}: failed: ${msg}`);
                rows.push([n, '?', `failed: ${msg}`]);
              }
            }

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Auto-seed (${mode}) — ${rows.length} repos`, 2)
              .addTable([
                [
                  {data: 'Repo', header: true},
                  {data: 'Class', header: true},
                  {data: 'Result', header: true},
                ],
                ...rows.map(r => r.map(String))
              ])
              .write();

            if (unresolved.length) {
              core.warning(
                `${unresolved.length} repo(s) declare an unresolvable class and were skipped: ` +
                  `${unresolved.join(', ')} — fix the marker; they are NOT seeded under default`,
              );
            }

            if (uninitialized.length) {
              core.warning(
                `${uninitialized.length} repo(s) have no commits and were NOT seeded: ${uninitialized.join(', ')} — retried on the next sweep`,
              );
            }
            if (conflicts.length) {
              core.warning(
                `${conflicts.length} repo(s) not seeded because another open PR changes a path the seed would add: ` +
                  `${conflicts.join(', ')} — nothing was written; the next run replans`,
              );
            }

            if (failed.length) {
              core.setFailed(
                `${failed.length} repo(s) failed auto-seed: ${failed.join(', ')} — see job summary`,
              );
            }
