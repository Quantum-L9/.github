# Auto-seeds full org templates into newly created repositories.
# Same payload as seed-governance.yml (ops/build-seed-payload.js).
# Advisory only — opens a PR, never pushes directly to main.
name: Auto-seed new repository

on:
  repository_dispatch:
    types: [repo_created]
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Specific repo name to seed (blank = all unseeded repos)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only, no PRs)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: governance-distribution
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_REPO: ${{ inputs.target_repo || github.event.client_payload.repository || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            const { buildSeedPayload } = require('./ops/build-seed-payload.js');

            const DRY = process.env.DRY_RUN === 'true';
            const TARGET = process.env.TARGET_REPO;
            const BRANCH = 'chore/auto-seed-governance';

            const exists = async (owner, repo, path, ref) => {
              try {
                await github.rest.repos.getContent({ owner, repo, path, ...(ref ? { ref } : {}) });
                return true;
              } catch {
                return false;
              }
            };

            let targets;
            if (TARGET) {
              const repo = await github.rest.repos.get({ owner: 'Quantum-L9', repo: TARGET });
              targets = [repo.data];
            } else {
              const all = await github.paginate(github.rest.repos.listForOrg, {
                org: 'Quantum-L9', type: 'all', per_page: 100
              });
              targets = all.filter(r => !r.archived && !r.fork && r.name !== '.github');
            }

            const rows = [];
            let failures = 0;

            for (const repo of targets) {
              const o = repo.owner.login, n = repo.name;
              try {
                const hasRootCodeowners = await exists(o, n, 'CODEOWNERS');
                const payload = buildSeedPayload({ fs, hasRootCodeowners });
                const paths = Object.keys(payload);
                if (!paths.length) {
                  rows.push([n, 'skipped (nothing safe to seed)']);
                  continue;
                }

                const present = await Promise.all(paths.map(p => exists(o, n, p)));
                if (present.every(Boolean)) {
                  rows.push([n, 'already seeded']);
                  continue;
                }

                const missing = paths.filter((_, i) => !present[i]);
                if (DRY) {
                  const preview = missing.length <= 6
                    ? missing.join(', ')
                    : `${missing.slice(0, 6).join(', ')} (+${missing.length - 6} more)`;
                  rows.push([n, `would seed ${missing.length}: ${preview}`]);
                  continue;
                }

                const base = repo.default_branch;
                const baseRef = await github.rest.git.getRef({ owner: o, repo: n, ref: `heads/${base}` });
                const baseSha = baseRef.data.object.sha;
                const baseCommit = await github.rest.git.getCommit({ owner: o, repo: n, commit_sha: baseSha });

                const treeItems = [];
                for (const path of missing) {
                  if (await exists(o, n, path, base)) continue;
                  const blob = await github.rest.git.createBlob({
                    owner: o, repo: n,
                    content: Buffer.from(payload[path]).toString('base64'),
                    encoding: 'base64',
                  });
                  treeItems.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
                }

                if (!treeItems.length) {
                  rows.push([n, 'already seeded']);
                  continue;
                }

                const tree = await github.rest.git.createTree({
                  owner: o, repo: n,
                  base_tree: baseCommit.data.tree.sha,
                  tree: treeItems,
                });
                const commit = await github.rest.git.createCommit({
                  owner: o, repo: n,
                  message: `chore(governance): auto-seed ${treeItems.length} org template file(s)`,
                  tree: tree.data.sha,
                  parents: [baseSha],
                });

                try {
                  await github.rest.git.createRef({
                    owner: o, repo: n, ref: `refs/heads/${BRANCH}`, sha: commit.data.sha,
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;
                  await github.rest.git.updateRef({
                    owner: o, repo: n, ref: `heads/${BRANCH}`, sha: commit.data.sha, force: true,
                  });
                }

                const existingPR = await github.rest.pulls.list({
                  owner: o, repo: n, head: `Quantum-L9:${BRANCH}`, state: 'open'
                });

                if (existingPR.data.length === 0) {
                  const pr = await github.rest.pulls.create({
                    owner: o, repo: n, head: BRANCH, base,
                    title: 'chore(governance): auto-seed org templates from Quantum-L9/.github',
                    body: [
                      'Automatically seeds org template files from `Quantum-L9/.github/templates/`.',
                      '',
                      '### Files in this PR',
                      ...treeItems.map(t => `- \`${t.path}\``),
                      '',
                      'Existing files were left untouched (missing-only seed).',
                      'Governance caller is **advisory** (`strict` defaults false).',
                      'No CI execution workflows — owned by `l9-ci-sdk` / `l9-ci-core`.',
                      '',
                      '_Opened automatically by Quantum-L9/.github auto-seed._',
                    ].join('\n'),
                  });
                  rows.push([n, `PR #${pr.data.number} (${treeItems.length} file(s))`]);
                } else {
                  rows.push([n, `PR already open: #${existingPR.data[0].number}`]);
                }
              } catch (e) {
                failures += 1;
                const msg = `${e.status || ''} ${e.message || e}`.replace(/\s+/g, ' ').slice(0, 120);
                rows.push([n, `failed: ${msg}`]);
              }
            }

            const mode = DRY ? 'DRY RUN' : 'APPLIED';
            await core.summary
              .addHeading(`Auto-seed (${mode}) — ${rows.length} repos`, 2)
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Result', header: true}],
                ...rows.map(r => r.map(String))
              ])
              .write();

            if (failures > 0) {
              core.setFailed(`${failures} repo(s) failed auto-seed — see job summary`);
            }
