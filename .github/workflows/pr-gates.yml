name: PR gates

# This repository's own PRs are held to the org PR-body contract strictly.
# The rules live in exactly one place — governance-pr.yml, the same check every
# seeded repository runs — so this file only calls it. Proof:
# ops/test-pr-body-contract.js.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    uses: ./.github/workflows/governance-pr.yml
    with:
      strict: true
