# Enforces declarative policies across all org repos. Runs weekly.
# Auto-corrects repo settings drift and reports missing mandatory files, both
# from each repository's compiled governance plan
# (ops/compile-repo-governance.js).
name: Enforce policies

on:
  schedule:
    - cron: "0 13 * * 3"  # Wednesday 13:00 UTC
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only enforce on repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547  # v1.12.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs = require('fs');
            // Policy is interpreted only by the governance-plan compiler
            // (docs/adr/0001-one-governance-brain.md). Each repository gets
            // one verified plan; settings are compared to its desired state
            // and mandatory files to its effective requirements, the same
            // answer birth and continuous-sync use (GOV-015).
            const {
              loadAuthority,
              GovernanceCompileError,
              gatherTargetFacts,
              compileVerifiedPlan,
              settingsDrift,
              remoteReader,
            } = require('./ops/plan-adapter.js');
            const ORG = 'Quantum-L9';
            const DRY = process.env.DRY_RUN === 'true';
            const FILTER = process.env.FILTER;
            // The exact revision actions/checkout put on disk (GOV-019).
            const AUTHORITY_SHA = process.env.GITHUB_SHA;
            const authority = loadAuthority(fs);

            // Fail closed (ops/plan-adapter.js remoteReader): only a 404 is
            // "absent". An unreadable opt-out is not "not opted out", and an
            // unreadable mandatory file is not "missing" — either fails the
            // repository, and the run.
            const exists = (repo, path) => remoteReader(github, ORG, repo).exists(path);
            const readText = (repo, path) => remoteReader(github, ORG, repo).readText(path);

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            const rows = [];
            // Repositories this run could not evaluate. Any entry fails the run:
            // a green enforcement run must mean every repository was checked.
            const failed = [];
            const unresolved = [];

            for (const repo of targets) {
              const n = repo.name;
              const findings = [];
              try {
                // Check opt-out
                if (await exists(n, '.l9/no-policy-enforcement')) {
                  rows.push([n, 'opted out']);
                  continue;
                }

                // Existence first, so a failed marker fetch is a malformed
                // declaration the compiler refuses — never "absent". A class
                // that cannot be resolved stops enforcement for this repository
                // instead of enforcing the widest class against it.
                let plan;
                try {
                  const facts = await gatherTargetFacts({
                    exists: (p) => exists(n, p),
                    readText: (p) => readText(n, p),
                  }, authority.classes.marker_path);
                  plan = compileVerifiedPlan({
                    fs, authority, authoritySha: AUTHORITY_SHA, repository: `${ORG}/${n}`, facts,
                  });
                } catch (e) {
                  if (e instanceof GovernanceCompileError && e.code === 'class_resolution') {
                    // The repository's own declaration is broken: reported and
                    // warned, never enforced as the widest class.
                    unresolved.push(n);
                    rows.push([n, `unresolvable repo class: ${e.message} — not enforced`]);
                    continue;
                  }
                  // Anything else (missing authority SHA, template defect, a
                  // failed read) is this run's failure, not a quiet row.
                  throw e;
                }

                // ── Mandatory files (plan.mandatory_files.effective) ──
                // Observed before any settings write, so a read that fails
                // leaves the repository untouched.
                // Class waivers and repository exceptions are already applied by
                // the compiler: a path the class waives is not in the list, so a
                // repo is never reported for a file its own class forbids.
                for (const req of plan.mandatory_files.effective) {
                  if (!(await exists(n, req.path))) {
                    findings.push(`missing: ${req.path}`);
                  }
                }

                // ── Settings enforcement (plan.remote_apply.repo_settings) ──
                if (plan.remote_apply.repo_settings.enabled) {
                  const current = await github.rest.repos.get({ owner: ORG, repo: n });
                  const settingsDriftList = settingsDrift(plan, current.data);
                  if (settingsDriftList.length > 0) {
                    if (!DRY) {
                      const patch = {};
                      for (const d of settingsDriftList) patch[d.key] = d.expected;
                      try {
                        await github.rest.repos.update({ owner: ORG, repo: n, ...patch });
                        findings.push(`settings fixed: ${settingsDriftList.map(d => d.key).join(', ')}`);
                      } catch (e) {
                        findings.push(`settings fix failed: ${e.message?.slice(0, 50)}`);
                        failed.push(n);
                      }
                    } else {
                      findings.push(`settings drift: ${settingsDriftList.map(d => `${d.key}=${d.actual}→${d.expected}`).join(', ')}`);
                    }
                  }
                }

                if (findings.length === 0) {
                  rows.push([n, 'compliant']);
                } else {
                  rows.push([n, findings.join('; ')]);
                }
              } catch (e) {
                failed.push(n);
                const msg = `${e.message || e}`.replace(/\s+/g, ' ').slice(0, 200);
                core.error(`${n}: not evaluated: ${msg}`);
                rows.push([n, `FAILED — not evaluated: ${msg}`]);
              }
            }

            const mode = DRY ? 'DRY RUN' : 'ENFORCED';
            const compliant = rows.filter(r => r[1] === 'compliant').length;
            await core.summary
              .addHeading(`Policy enforcement (${mode}) — ${compliant}/${targets.length} compliant`, 2)
              .addRaw(`**Governance authority:** \`${AUTHORITY_SHA}\`\n\n`)
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Status', header: true}],
                ...rows.filter(r => r[1] !== 'compliant').map(r => r.map(String))
              ])
              .write();

            if (unresolved.length) {
              core.warning(
                `${unresolved.length} repo(s) declare an unresolvable class and were not enforced: ` +
                  `${unresolved.join(', ')} — fix the marker`,
              );
            }
            if (failed.length) {
              core.setFailed(`${failed.length} repo(s) could not be evaluated or corrected: ${failed.join(', ')} — see job summary`);
            }
