# Enforces declarative policies from policies/*.yml across all org repos.
# Runs weekly. Auto-corrects repo settings drift and reports missing files.
name: Enforce policies

on:
  schedule:
    - cron: "0 13 * * 3"  # Wednesday 13:00 UTC
  workflow_dispatch:
    inputs:
      repo_filter:
        description: "Only enforce on repos containing this string (blank = all)"
        type: string
        default: ""
      dry_run:
        description: "Dry run (report only)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ vars.GOVERNANCE_APP_ID }}
          private-key: ${{ secrets.GOVERNANCE_APP_PRIVATE_KEY }}
          owner: Quantum-L9

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        # Literal block scalar: with the plain-flow form, the ": " inside
        # --only-binary=:all: is invalid YAML, so Actions rejected this whole
        # file and logged a zero-second failed run on every push.
        run: |
          pip install --only-binary=:all: "pyyaml==6.0.2"

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FILTER: ${{ inputs.repo_filter || '' }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');
            const {
              loadRepoClasses,
              parseClassMarker,
              classForRepo,
              resolveProfile,
              waivesMandatoryFile,
            } = require('./ops/repo-class-profile.js');
            const ORG = 'Quantum-L9';
            const DRY = process.env.DRY_RUN === 'true';
            const FILTER = process.env.FILTER;

            // Parse YAML via Python (no native YAML in actions/github-script)
            const parseYaml = (file) => {
              const out = execSync(
                `python3 -c "import yaml,json,sys; print(json.dumps(yaml.safe_load(open(sys.argv[1]))))" "${file}"`,
                { encoding: 'utf8' }
              );
              return JSON.parse(out);
            };

            const settingsPolicy = parseYaml('policies/repo-settings.yml');
            const filesPolicy = parseYaml('policies/mandatory-files.yml');
            const classes = loadRepoClasses(fs);

            // Only a 404 means "absent". Anything else (403, 5xx, a directory
            // where a file belongs) throws: an unreadable path is not missing.
            const readText = async (repo, path) => {
              let res;
              try {
                res = await github.rest.repos.getContent({ owner: ORG, repo, path });
              } catch (e) {
                if (e.status === 404) return null;
                throw e;
              }
              if (!res.data || Array.isArray(res.data) || typeof res.data.content !== 'string') {
                throw Object.assign(new Error(`${path} is not a readable file`), { status: 'NOT_A_FILE' });
              }
              return Buffer.from(res.data.content, 'base64').toString('utf8');
            };

            const all = await github.paginate(github.rest.repos.listForOrg, {
              org: ORG, type: 'all', per_page: 100
            });
            const targets = all.filter(r =>
              !r.archived && !r.fork && r.name !== '.github' &&
              (!FILTER || r.name.includes(FILTER))
            );

            // Check exceptions
            const fileExceptions = (filesPolicy.exceptions || []).map(e => e.repo);

            const rows = [];
            const blocked = [];

            for (const repo of targets) {
              const n = repo.name;
              const findings = [];

              // Check opt-out. It gates a settings WRITE, so it fails closed:
              // only a 404 means the marker is absent. A 403/5xx is an opt-out
              // nobody could read — the repo is neither enforced nor reported
              // compliant, and the run fails below.
              let optOut;
              try {
                await github.rest.repos.getContent({
                  owner: ORG, repo: n, path: '.l9/no-policy-enforcement'
                });
                optOut = true;
              } catch (e) {
                if (e.status !== 404) {
                  rows.push([n, `BLOCKED: .l9/no-policy-enforcement unreadable (${e.status || 'error'}) — settings and files not assessed`]);
                  blocked.push(n);
                  continue;
                }
                optOut = false;
              }

              if (optOut) {
                rows.push([n, 'opted out']);
                continue;
              }

              // ── Settings enforcement ──
              const defaults = settingsPolicy.defaults || {};
              const overrides = (settingsPolicy.overrides || [])
                .filter(o => o.repos && o.repos.includes(n))
                .reduce((acc, o) => ({ ...acc, ...o, repos: undefined }), {});
              const expected = { ...defaults, ...overrides };
              delete expected.repos;

              // Check current settings
              const current = await github.rest.repos.get({ owner: ORG, repo: n });
              const settingsDrift = [];
              for (const [key, val] of Object.entries(expected)) {
                if (key === 'default_branch') continue; // Don't auto-change default branch
                if (current.data[key] !== val) {
                  settingsDrift.push({ key, expected: val, actual: current.data[key] });
                }
              }

              if (settingsDrift.length > 0) {
                if (!DRY) {
                  const patch = {};
                  for (const d of settingsDrift) patch[d.key] = d.expected;
                  try {
                    await github.rest.repos.update({ owner: ORG, repo: n, ...patch });
                    findings.push(`settings fixed: ${settingsDrift.map(d => d.key).join(', ')}`);
                  } catch (e) {
                    findings.push(`settings fix failed: ${e.message?.slice(0, 50)}`);
                  }
                } else {
                  findings.push(`settings drift: ${settingsDrift.map(d => `${d.key}=${d.actual}→${d.expected}`).join(', ')}`);
                }
              }

              // ── Mandatory files check (class-aware) ──
              // A repository declares its class; a class may waive a mandatory
              // path it structurally must not carry. Reporting a repo for a
              // file its own class forbids is noise that trains people to
              // ignore this report.
              if (!fileExceptions.includes(n)) {
                // A failed marker fetch is not an absent marker, and an
                // unresolvable class is not `default`: either way this repo's
                // mandatory files are not assessed against a class it is not.
                let markerText = null;
                let markerError = null;
                try {
                  markerText = await readText(n, classes.marker_path);
                } catch (e) {
                  markerError = `${classes.marker_path} unreadable (${e.status || 'error'})`;
                }
                const decidedClass = markerError
                  ? { error: markerError }
                  : classForRepo(classes, n, markerText);
                if (decidedClass.error) {
                  findings.push(`unresolved repo class: ${decidedClass.error} — mandatory files not assessed`);
                } else {
                  const profile = resolveProfile(classes, decidedClass.name);
                  for (const file of (filesPolicy.files || [])) {
                    if (waivesMandatoryFile(profile, file.path)) continue;
                    try {
                      if ((await readText(n, file.path)) === null) {
                        findings.push(`missing: ${file.path}`);
                      }
                    } catch (e) {
                      findings.push(`unverified: ${file.path} unreadable (${e.status || 'error'})`);
                    }
                  }
                }
              }

              if (findings.length === 0) {
                rows.push([n, 'compliant']);
              } else {
                rows.push([n, findings.join('; ')]);
              }
            }

            const mode = DRY ? 'DRY RUN' : 'ENFORCED';
            const compliant = rows.filter(r => r[1] === 'compliant').length;
            core.summary
              .addHeading(`Policy enforcement (${mode}) — ${compliant}/${targets.length} compliant`, 2)
              .addTable([
                [{data: 'Repo', header: true}, {data: 'Status', header: true}],
                ...rows.filter(r => r[1] !== 'compliant').map(r => r.map(String))
              ])
              .write();
            if (blocked.length) {
              core.setFailed(`${blocked.length} repo(s) not assessed — opt-out marker unreadable: ${blocked.join(', ')}`);
            }
