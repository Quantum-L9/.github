# SonarCloud Automatic Analysis configuration (Quantum-L9/.github)
#
# Scoped issue-ignores for the reusable CI *hygiene* composite actions under
# .github/actions/. These actions intentionally install tooling dynamically —
# an editable local package (`pip install -e .`) and a pinned-but-unhashed
# requirements file fetched from l9-ci-core — for which pip offers no
# `--only-binary`/`--require-hashes` equivalent. The GitHub-Actions
# dependency-hardening rules below therefore cannot be satisfied in-code
# without removing that intended behavior, so they are accepted for these
# internal CI files only. Application/consumer code is NOT exempted.
#
# Rules:
#   S8541 — omitting `--only-binary :all:`
#   S8544 — installing dependencies without locking resolved versions
#   S6505 — omitting npm/yarn `--ignore-scripts`
#   S6506 — HTTPS not strictly enforced on a fetch

sonar.issue.ignore.multicriteria=gha1,gha2,gha3,gha4

sonar.issue.ignore.multicriteria.gha1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.gha1.resourceKey=.github/actions/**/*

sonar.issue.ignore.multicriteria.gha2.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.gha2.resourceKey=.github/actions/**/*

sonar.issue.ignore.multicriteria.gha3.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.gha3.resourceKey=.github/actions/**/*

sonar.issue.ignore.multicriteria.gha4.ruleKey=githubactions:S6506
sonar.issue.ignore.multicriteria.gha4.resourceKey=.github/actions/**/*
