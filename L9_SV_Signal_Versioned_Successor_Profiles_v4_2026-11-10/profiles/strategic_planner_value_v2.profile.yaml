id: l9.projection/strategic-planner-value@2
class: consumer
consumer: strategic-planner
purpose: Successor of the existing quantitative Strategic Value projection, preserving every v1 numerical model selector
  and adding a qualitative, no-solver pathway for evidence-bound discretionary comparison and realized-compounding scrutiny.
  Optional qualitative advice is not a five-bucket numeric assessment or a mandatory preflight for a valid numerical
  claim. Plan Keeper and Numerical/GT owners retain their boundaries.
sources:
  strategic_value_model:
    selectors:
    - $.artifact_id
    - $.authority
    - $.canonical_source
    - $.governed_by
    - $.purpose
    - $.identity
    - $.valuation
    - $.counterfactual_mathematics
    - $.strategic_interaction_lookahead
    - $.assessment_claim_levels
    - $.evaluation_integrity
    - $.causal_accounting
    - $.forecast_and_realization
    - $.comparisons
    - $.explicit_non_ownership
    - $.assessment_applicability
    - $.retained_former_candidate_semantics
    - $.relocated_additional_candidate_semantics
  vocabulary:
    selectors:
    - $.terms.strategic_value
    - $.terms.systemic_future_value
    - $.terms.strategic_value_assessment
    - $.terms.counterfactual_baseline
    - $.terms.future_effect_identity
    - $.terms.bidirectional_value_propagation
    - $.terms.value_propagation_mesh
    - $.terms.future_work_elimination
    - $.terms.capability_unlock
    - $.terms.decision_relevant_information_value
    - $.terms.decision_boundary
    - $.terms.qualitative_strategic_value_screen
    - $.terms.realized_strategic_compounding
    - $.terms.signal
    - $.terms.signal_propagation
    - $.terms.signal_feedback_episode
    - $.terms.signal_consumption
  invariants:
    selectors:
    - $.invariants[?(@.id=="L9-SV-001")]
    - $.invariants[?(@.id=="L9-SV-002")]
    - $.invariants[?(@.id=="L9-AUTH-001")]
    - $.invariants[?(@.id=="L9-AUTH-002")]
    - $.invariants[?(@.id=="L9-HARD-001")]
    - $.invariants[?(@.id=="L9-UNKNOWN-001")]
    - $.invariants[?(@.id=="L9-STRATEGY-001")]
    - $.invariants[?(@.id=="L9-PROJECTION-001")]
    - $.invariants[?(@.id=="L9-PROV-001")]
    - $.invariants[?(@.id=="L9-EVIDENCE-001")]
    - $.invariants[?(@.id=="L9-ASSURANCE-001")]
    - $.invariants[?(@.id=="L9-COORD-001")]
    - $.invariants[?(@.id=="L9-SVQ-001")]
    - $.invariants[?(@.id=="L9-SVQ-002")]
    - $.invariants[?(@.id=="L9-SIGNAL-001")]
    - $.invariants[?(@.id=="L9-SIGNAL-002")]
    - $.invariants[?(@.id=="L9-SIGNAL-003")]
    - $.invariants[?(@.id=="L9-SIGNAL-004")]
    - $.invariants[?(@.id=="L9-OWNER-001")]
    - $.invariants[?(@.id=="L9-PROMOTION-001")]
  contracts:
    selectors:
    - $.contracts[?(@.id=="l9.contract/strategic-value-assessment@1")]
    - $.contracts[?(@.id=="l9.contract/authority-boundary@1")]
    - $.contracts[?(@.id=="l9.contract/projection@1")]
    - $.contracts[?(@.id=="l9.contract/hard-constraint@1")]
    - $.contracts[?(@.id=="l9.contract/admission-and-promotion@1")]
  authority_model:
    selectors:
    - $.authority_classes
    - $.admission_rules
    - $.promotion_rules
    - $.strategic_authority
    - $.strategic_cognition_authority
output:
  schema: l9.projection.strategic-planner-value/v2
forbidden:
- provider_implementation_details
- execution_publication_or_merge_authority_grant
- repository_local_policy_as_global_law
- obligation_not_admitted_in_a_selected_source
- adapter_host_or_surface_specific_semantics
successor_of: l9.projection/strategic-planner-value@1
breaking_changes:
  consumer_migration: explicit
  rationale: Retain predecessor source coverage and authority boundaries; add six admitted-only qualitative Strategic
    Value / Signal terms and complete-record invariant selectors; opt into producer source-class-dispatch validation.
    Never reassign Numerical Reasoning, Strategy or runtime permissions.
  removed_selections: []
payload_validation:
  protocol: l9.payload-validation/source-class-dispatch@1
