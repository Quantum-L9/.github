schema: l9.candidate-consumer-use-contract/v1
status: proposed_non_authoritative
subject_profile: l9.projection/gar-architecture-observer@2
subject_consumer: l9-global-architect
consumer_ownership: existing_GAR_architecture_reasoning_boundary
activation:
  when: a_material_architecture_question_depends_on_qualitative_SV_or_signal_effects
  prerequisite:
  - independently_resolved_current_canonical_authority_revision
  - producer_verified_profile_and_per_source_projections
  - independently_observed_current_target_implementation_and_relevant_evidence
  - separately_bound_permission_for_consequential_actions
  otherwise: use_existing_admitted_GAR_observer_and_block_only_overlay_dependent_claims
requires:
- state_exact_decision_goal_and_current_authorized_scope
- identify_feasible_baseline_and_relevant_material_alternatives
- retain_true_semantic_owner_and_provenance_for_each_material_claim
- distinguish_objective_relative_potential_from_observed_outcomes
- distinguish_one_origin_from_copied_reports_or_multiple_routes
- check_material_harms_displaced_burdens_and_future_maintenance_drag
- test_existing_owner_reuse_before_new_architecture_or_signal_pipeline
- challenge_material_dependencies_and_credible_decision_flip_conditions
- identify_lowest_cost_evidence_witness_that_could_change_recommendation
- preserve_authority_boundary_of_architecture_reasoning_vs_plan_and_execution
claims:
  qualitative_value:
    acceptable: evidence_bound_directional_or_conditional_appraisal
    necessary_basis: [objective, beneficiary, feasible_comparator, causal_assumption, observation_and_Unknowns, costs_and_offsets]
    may_not_claim: [numeric_utility, confirmed_future_outcome, unique_optimality, action_authority]
  realized_compounding:
    acceptable: supported_only_when_separate_later_net_improvement_observed
    necessary_basis: [earlier_attributable_durable_change, eligible_later_consumer, actual_consumption, distinct_later_effect, comparator, offsetting_harm]
    missing_basis: explicit_unverified
  signal:
    eligible_stages: [originated, routed, delivered, accepted, consumed, resulted_in_downstream_effect]
    rule: each_stage_requires_its_own_evidence_and_no_stage_implies_the_next
  quantification:
    routing: independently_admitted_strategic_value_assessment_and_numerical_reasoning_owner
    prohibition: no_numeric_solver_claim_from_qualitative_prose_or_projection_receipt
forbidden:
- promoter_or_projection_makes_itself_a_canonical_semantic_owner
- duplicate_artifact_or_echo_counted_as_independent_evidence
- new_engine_or_new_primitive_without_necessity_evidence
- passive_partner_response_assumed_in_material_adaptive_interaction
- commitment_or_strategic_plan_mutation_without_appropriate_authority
- architecture_or_execution_decision_claimed_from_profile_attestation_alone
outcomes:
  supported: advisory_directional_architectural_comparison_with_source_and_limits
  conditional: recommendation_subject_to_explicit_evidence_or_preference_flip
  blocked: missing_current_authority_hard_constraint_or_source_proof_for_material_claim
  not_applicable: no_material_strategic_value_or_signal_question
negative_witnesses:
- five_forwarded_copies_of_one_error_claim_must_not_become_five_independent_sources
- accepted_signal_must_not_be_reported_as_proven_later_net_gain
- reusable_service_without_any_confirmed_future_consumer_is_potential_not_realized_compounding
- new_signal_bus_without_semantic_gap_or_realized_value_must_be_rejected
verification_status: consumer_replay_not_executed
