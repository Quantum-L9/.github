# Birth capability matrix (JSON-in-YAML).
#
# Product kind, constellation participation, and semantic ownership are
# semantics/product_kinds.yaml and semantics/authority_model.yaml.
# Distribution of published coordinates is semantics/lifecycle.yaml
# (distribution). This file does not restate that law.
#
# It records, per birth class, which seed categories materialize, which paths
# are inherited from this repository, which paths are forbidden, and which
# GitHub API settings are applied. Mode definitions and marker precedence are
# docs/REPO_BIRTH_PROFILES.md.
#
# A repository names its class in `.l9/org-birth-profile.yaml`.
# Precedence: marker > overrides > default_class.
#
# JSON-in-YAML so ops/repo-class-profile.js (JSON.parse after stripping
# full-line comments) and the Python birth orchestrator (yaml.safe_load)
# read one file.
{
  "schema": "l9.org-birth-profile/v1",
  "default_class": "default",
  "marker_path": ".l9/org-birth-profile.yaml",
  "overrides": {
    "l9-repo-template": "non_constellation_python",
    "l9-ci-core": "self_governed",
    "l9-meta-injector": "self_governed"
  },
  "classes": {
    "default": {
      "description": "No class marker. Materialize codeowners, dependabot, governance, community-health, issue templates, and pull-request templates. Apply labels and repository settings.",
      "seed_categories": [
        "codeowners",
        "dependabot",
        "governance",
        "community-health",
        "issue-templates",
        "pr-templates"
      ],
      "inherit": [],
      "forbid": [],
      "remote_apply": {
        "labels": true,
        "repo_settings": true
      },
      "mandatory_files_waive": []
    },
    "self_governed": {
      "description": "Materialize nothing. Apply labels and repository settings. Forbid the org CI distribution paths and the governance caller.",
      "seed_categories": [],
      "inherit": [
        "CODE_OF_CONDUCT.md",
        "CONTRIBUTING.md",
        "SECURITY.md",
        ".github/FUNDING.yml",
        ".github/ISSUE_TEMPLATE/**",
        ".github/pull_request_template.md",
        ".github/PULL_REQUEST_TEMPLATE/**"
      ],
      "forbid": [
        ".github/workflows/l9-analysis.yml",
        ".github/workflows/l9-lint-test.yml",
        ".github/workflows/l9-lint-test-node.yml",
        ".github/workflows/governance.yml",
        ".github/workflows/on-org-update.yml",
        ".github/governance/**"
      ],
      "remote_apply": {
        "labels": true,
        "repo_settings": true
      },
      "mandatory_files_waive": [
        ".github/workflows/governance.yml",
        ".github/CODEOWNERS",
        ".github/dependabot.yml"
      ]
    },
    "non_constellation_python": {
      "description": "Materialize codeowners, dependabot, and labels. Inherit community-health files. Forbid org CI distribution paths and the retired consumer CI pin files.",
      "seed_categories": [
        "codeowners",
        "dependabot",
        "labels"
      ],
      "inherit": [
        "CODE_OF_CONDUCT.md",
        ".github/FUNDING.yml",
        ".github/ISSUE_TEMPLATE/**",
        ".github/pull_request_template.md",
        ".github/PULL_REQUEST_TEMPLATE/**"
      ],
      "forbid": [
        ".github/workflows/l9-analysis.yml",
        ".github/workflows/l9-lint-test.yml",
        ".github/workflows/l9-lint-test-node.yml",
        ".github/workflows/governance.yml",
        ".github/workflows/on-org-update.yml",
        ".github/governance/**",
        "biome.json",
        ".biomeignore",
        ".l9/ci-pin",
        "requirements-consumer-ci.txt",
        "scripts/sync_ci_from_pack.py"
      ],
      "remote_apply": {
        "labels": true,
        "repo_settings": true
      },
      "mandatory_files_waive": [
        ".github/workflows/governance.yml"
      ]
    }
  }
}
