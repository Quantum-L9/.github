# Mandatory files policy.
# Defines files that must exist in every repo. Enforced by enforce-policies.yml.
# If a file is missing, a remediation PR is opened.
#
# Class-aware: a repository's class (policies/repo-classes.yml, declared in the
# repo's `.l9/org-birth-profile.yaml`) may waive an entry via
# `mandatory_files_waive`. That is how `.github/workflows/governance.yml` stays
# mandatory org-wide while `non_constellation_python` repos — where
# scripts/inventory_check.py fails closed on exactly that path — are not
# reported for its absence. A missing waiver, not a missing file, is the bug
# when those two disagree.
#
# mode:
#   managed  — content must match template exactly; drift is auto-restored
#   seeded   — file must exist; content is consumer-owned after first seed
#   present  — file must exist; no content check (any content is acceptable)
files:
  - path: .github/CODEOWNERS
    source: templates/CODEOWNERS.repo
    mode: managed

  - path: .github/dependabot.yml
    source: templates/dependabot.yml
    mode: managed

  - path: LICENSE
    source: templates/community-health/LICENSE
    mode: seeded

  - path: .github/workflows/governance.yml
    source: templates/governance-caller.yml
    mode: seeded
    # Waived for classes that own their CI invocation upstream; see
    # `mandatory_files_waive` in policies/repo-classes.yml.

  - path: README.md
    mode: present

exceptions:
  # Repos exempt from mandatory file checks
  - repo: ".github"
    reason: "This IS the template source"
  - repo: "Cursor-Governance"
    reason: "Policy SSOT — has its own governance model"
