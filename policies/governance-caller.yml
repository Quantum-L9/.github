# Managed by Quantum-L9/.github. Both reusable-workflow calls below pin one
# full commit SHA on main, so main can move without retargeting any consumer.
#
# Governance logic lives in Quantum-L9/.github/.github/workflows/governance-*.yml.
# Shipping a change there: merge it, then (an operator decision) set both
# `uses:` SHAs below to that merge commit, record the same SHA in
# ops/governance-v1-pin.txt, and set GOVERNANCE_CALLER_PIN in
# ops/test-distribution-triggers.js (it fails unless all three agree). Consumers that
# already carry a caller are re-pinned by a manual continuous-sync dispatch
# (docs/DISTRIBUTION.md). No tag is involved: moving one retargets nothing.
#
# Current pin: d632486. That commit checks Cursor-Governance's
# compose_pr_body.py out with the org secret L9_GITHUB_READ_TOKEN. The pr job
# passes that secret by name. governance-issue.yml at the same commit is unchanged.
#
# SECRETS: a called workflow does NOT inherit caller secrets automatically.
# Do not add blank `secrets: inherit`. The pr job passes L9_GITHUB_READ_TOKEN
# by name so the composer checkout can read the private renderer. The issue
# job uses only GITHUB_TOKEN.
#
# Permission validation runs BEFORE `if:` skip. Both jobs must declare
# job-level permissions or a partial grant startup_fails on the unused job.
#
# ACCESS: if this caller fails before any step runs, check the Actions policy on
# THIS repo. `gh api repos/OWNER/REPO/actions/permissions`

name: Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issues:
    types: [opened, edited, reopened]

# No token permission by default (OpenSSF Scorecard Token-Permissions); each job
# below grants exactly what its callee needs, which overrides this for that job.
permissions: {}

jobs:
  pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: Quantum-L9/.github/.github/workflows/governance-pr.yml@d632486ed5f2d4f7515eb89242b3a7a9123a41cb  # composer read token
    secrets:
      L9_GITHUB_READ_TOKEN: ${{ secrets.L9_GITHUB_READ_TOKEN }}

  issue:
    if: github.event_name == 'issues'
    permissions:
      contents: read
      issues: write
    uses: Quantum-L9/.github/.github/workflows/governance-issue.yml@d632486ed5f2d4f7515eb89242b3a7a9123a41cb  # composer read token
