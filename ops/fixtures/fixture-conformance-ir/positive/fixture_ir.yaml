fixture_cases:
- id: create_starts_at_zero
  disposition: executable
  source_law_refs: [urn:example:law:create-starts-at-zero]
  given:
    steps: []
  when:
    mode: single
    operation: counter.create
    request: {counter_id: c1, operation_id: op.1}
  expect:
    observations:
    - id: read_after
      kind: interface_action
      operation: counter.get
      request: {counter_id: c1}
      context: {tenant_ref: tenant.a, principal_ref: agent.a, budget_ms: 5000}
    assertions:
    - {id: committed, law_ref: urn:example:law:create-starts-at-zero, target: {kind: step, ref: when, path: status}, predicate: equals, operand: committed}
    - {id: receipt_contract, law_ref: urn:example:law:create-starts-at-zero, target: {kind: step, ref: when}, predicate: result_contract_is, operand: urn:example:CounterReceipt:1}
    - {id: value_zero, law_ref: urn:example:law:create-starts-at-zero, target: {kind: observation, ref: read_after, path: value}, predicate: equals, operand: 0}
    - {id: same_revision, law_ref: urn:example:law:create-starts-at-zero, target: {kind: observation, ref: read_after, path: revision}, predicate: equals, operand: {$observed: {step: when, path: revision}}}
  provenance: {derived_from: law_index, derivation_ref: urn:example:law-ir:counter@1}
- id: exact_retry_returns_original
  disposition: executable
  source_law_refs: [urn:example:law:exact-retry-is-idempotent]
  given:
    steps:
    - {id: original, kind: interface_action, operation: counter.create, request: {counter_id: c1, operation_id: op.1}, precondition: {status: committed}}
  when:
    mode: single
    operation: counter.create
    request: {counter_id: c1, operation_id: op.1}
  expect:
    observations: []
    assertions:
    - {id: same_receipt, law_ref: urn:example:law:exact-retry-is-idempotent, target: {kind: step, ref: when}, predicate: equals, operand: {$observed: {step: original, path: ''}}}
  provenance: {derived_from: law_index, derivation_ref: urn:example:law-ir:counter@1}
- id: concurrent_increments_one_commit
  disposition: executable
  source_law_refs: [urn:example:law:revision-compare-and-set]
  given:
    steps:
    - {id: limit, kind: port_fixture, operation: urn:example:LimitAdmission:1, request: {max_value: 10}}
    - {id: created, kind: interface_action, operation: counter.create, request: {counter_id: c1, operation_id: op.1}, precondition: {status: committed}}
  when:
    mode: parallel
    steps:
    - {id: writer_a, operation: counter.increment, request: {counter_id: c1, expected_revision: {$from: {step: created, path: revision}}, operation_id: op.a}}
    - {id: writer_b, operation: counter.increment, request: {counter_id: c1, expected_revision: {$from: {step: created, path: revision}}, operation_id: op.b}}
  expect:
    observations:
    - {id: final, kind: interface_action, operation: counter.get, request: {counter_id: c1}}
    assertions:
    - {id: one_commit, law_ref: urn:example:law:revision-compare-and-set, target: {kind: group}, predicate: count_where, operand: {where: [{path: status, predicate: equals, operand: committed}], count: 1}}
    - {id: one_conflict, law_ref: urn:example:law:revision-compare-and-set, target: {kind: group}, predicate: count_where, operand: {where: [{path: status, predicate: equals, operand: conflict}, {path: receipt_id, predicate: is_absent}], count: 1}}
    - {id: value_one, law_ref: urn:example:law:revision-compare-and-set, target: {kind: observation, ref: final, path: value}, predicate: equals, operand: 1}
    - {id: revision_advanced, law_ref: urn:example:law:revision-compare-and-set, target: {kind: observation, ref: final, path: revision}, predicate: greater_than, operand: {$observed: {step: created, path: revision}}}
  provenance: {derived_from: law_index, derivation_ref: urn:example:law-ir:counter@1}
- id: ambiguous_commit_reconciles
  disposition: executable
  source_law_refs: [urn:example:law:ambiguous-commit-reconciles]
  given:
    steps:
    - {id: policy, kind: harness_control, operation: urn:example:harness:authz-policy, request: {allow: [counter.create, counter.get]}}
    - {id: fault, kind: harness_control, operation: urn:example:harness:store-fault, request: {port_method: commit, code: TIMEOUT, after_effect: after}}
  when:
    mode: single
    operation: counter.create
    request: {counter_id: c2, operation_id: op.2}
    context: {tenant_ref: tenant.a, principal_ref: agent.a, authorization_ref: policy.allow, budget_ms: 30000}
  expect:
    observations:
    - {id: receipts, kind: harness_observation, operation: urn:example:harness:receipt-count, request: {operation_id: op.2}}
    assertions:
    - {id: outcome_unknown, law_ref: urn:example:law:ambiguous-commit-reconciles, target: {kind: step, ref: when, path: code}, predicate: equals, operand: OUTCOME_UNKNOWN}
    - {id: problem_contract, law_ref: urn:example:law:ambiguous-commit-reconciles, target: {kind: step, ref: when}, predicate: result_contract_is, operand: urn:example:CounterProblem:1}
    - {id: one_receipt, law_ref: urn:example:law:ambiguous-commit-reconciles, target: {kind: observation, ref: receipts, path: count}, predicate: equals, operand: 1}
    - {id: count_contract, law_ref: urn:example:law:ambiguous-commit-reconciles, target: {kind: observation, ref: receipts}, predicate: result_contract_is, operand: 'urn:example:harness:ReceiptCount:1'}
  provenance: {derived_from: law_index, derivation_ref: urn:example:law-ir:counter@1}
- id: erased_identity_not_reused
  disposition: executable
  source_law_refs: [urn:example:law:create-starts-at-zero]
  given:
    steps:
    - {id: created, kind: interface_action, operation: counter.create, request: {counter_id: c3, operation_id: op.3}, precondition: {status: committed}, context: {tenant_ref: tenant.a, principal_ref: agent.a}}
    - {id: erase, kind: harness_control, operation: urn:example:harness:retention-erase, request: {counter_id: c3, decision_ref: retention.decision.1}}
  when:
    mode: single
    operation: counter.create
    request: {counter_id: c3, operation_id: op.4, prior_digest: {$from: {step: erase, path: state_digest}}}
  expect:
    observations: []
    assertions:
    - {id: refused, law_ref: urn:example:law:create-starts-at-zero, target: {kind: step, ref: when, path: status}, predicate: equals, operand: refused}
  provenance: {derived_from: law_index, derivation_ref: urn:example:law-ir:counter@1}
