    - "!**/__pycache__/**"
    - "!**/*.pyc"
    - "!**/*.egg-info/**"
    - "!**/.mypy_cache/**"
    - "!**/.pytest_cache/**"
    - "!**/.ruff_cache/**"
    - "!**/htmlcov/**"
    - "!**/.coverage"
    # Minified bundles, source maps, dependency lockfiles and archives:
    # machine-written.
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/*.map"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
