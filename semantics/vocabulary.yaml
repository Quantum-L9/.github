  - identity_topology_ir
  - product_kind_resolution
  - product_archetype_resolution
  - requirement_ir
  - capability_closure_ir
  - architecture_ir
  - port_ir
  - adapter_requirement_ir
  - product_relationship_ir
  - provider_binding_ir
  - conformance_requirement_ir
  - compiler_coordinates
  operations:
  - synthesis
  - validation
  validation:
    required: true
    solver_source: canonical_compilation_profile
  produces:
  - product_manifest_ir
  - product_manifest
- ordinal: 14
  id: implementation
  label: Implementation IR
  consumes:
  - product_manifest_ir
  - applicable_conformance_projection
  - implementation_constraints
  operations:
  - projection
  - synthesis
  - lowering
  validation:
    required: true
    solver_source: canonical_compilation_profile
  produces:
  - implementation_ir
- ordinal: 15
  id: target_artifacts
  label: Target Artifacts
  consumes:
  - implementation_ir
  - target_binding
  - rendering_profile
  - final_conformance_projection
  operations:
  - binding_selection
  - lowering
  - rendering
  validation:
    required: true
    solver_source: canonical_compilation_profile
    final_conformance_required: true
  produces:
  - final_artifacts
  - final_conformance_receipt
stage_rules:
  stage_input_formula:
    expression: Input(Stage_n) = Project(ValidatedOutputs(Stage_0...Stage_(n-1)), Stage_n) ∪ StageSpecificInputs_n
  stage_advance_rule:
    expression: Advance(n -> n+1) iff AuthorityValid ∧ UpstreamValid(n) ∧ OutputValid(n+1) ∧ PreconditionsSatisfied
  current_stage_failure_rule:
    default: repair_current_stage
    exception: 'If mechanical validation proves that an admitted upstream assumption is unsatisfiable under newly
      available evidence, create a surgical upstream revision and invalidate only transitive dependents.

      '
  downstream_authority_rule:
    rule: 'A downstream stage MUST NOT become authoritative until all required upstream stages are admitted and
      validated.

      '
  historical_state_rule:
    rule: 'Historical admitted artifacts MUST NOT be mutated. Corrections produce new revisions.

      '
  context_rule:
    rule: 'Each stage receives only the minimum sufficient validated semantic projection plus stage-specific inputs,
      instructions, constraints, bindings, and solver projection.

      '
  solver_rule:
    rule: 'Each stage MUST use only the solver declared for that stage by the canonical compilation profile.

      '
  reasoning_plane_rule:
    current_dependency_allowed: false
    future_integration:
      transport: Gate
      packet: TransportPacket
      compiler_dependency: validation_binding_only
    rule: 'Semantic Compiler MUST remain independent of the Reasoning Plane. Future Reasoning Plane capabilities
      may be reached through Gate via an applicable validation or synthesis binding without changing compiler semantic
      ownership.

      '
fixture_admission_results:
- admitted_domain
- admitted_global
- admitted_mixed
- propose_global_law
- unresolved
- rejected
fixture_scope_classes:
- global
- domain
- mixed
- globalization_candidate
- unresolved
fixture_publication_rules:
  canonical_identity_required: true
  immutable_digest_required: true
  catalog_entry_required: true
  profile_membership_required: true
  distribution_availability_required: true
  existing_profile_versions_are_immutable: true
organizational_target:
  Quantum-L9/.github:
    role:
    - organization_governance_plane
    - organization_control_plane
    - organization_distribution_plane
    - canonical_l9_vocabulary_owner
    does_not_own:
    - executable_conformance_semantics
  l9-conformance:
    role:
    - executable_conformance_system
    - fixture_admission_semantics
    - canonical_global_fixture_catalog
    - fixture_profile_composition
    - fixture_profile_resolution
    - conformance_execution_semantics
    - conformance_receipts
    does_not_own:
    - global_constitutional_law
    - organization_distribution_policy
  Cursor-Governance:
    role:
    - user_operating_plane
    - agent_operating_plane
    - consumer_of_global_governance
    - consumer_of_l9_conformance
    target_direction:
    - consume_conformance_instead_of_owning_canonical_conformance
  l9-semantic-compiler:
    role:
    - semantic_compilation
    - projection
    - derivation
    - synthesis
    - lowering
    - rendering
    - fixture_compilation
    - law_normalization
    - semantic_harvesting
    does_not_own:
    - global_law
    - conformance_authority
canonical_artifact_flow:
  sequence:
  - authoritative_semantics
  - projection
  - synthesis_or_derivation
  - specialized_ir
  - mechanical_validation
  - authorized_state_change
  - next_stage_projection
  - lowering
  - rendering
  - final_conformance
  - receipt
canonical_semantic_chain:
  global_baseline:
    expression: GlobalAuthority + GlobalInvariants + GlobalContracts
  project_contracts:
    expression: Synthesize(ProductTopology, ProductRequirements, GlobalBaseline)
  laws:
    expression: Derive(ApplicableInvariants, AdmittedContracts)
  fixtures:
    expression: Derive(Laws)
  conformance_cases:
    expression: Compile(FixtureIR, ConformanceBinding)
  architecture:
    expression: Synthesize(ProductTopology, ProductKind, Archetype, ValidatedSemantics, Constraints, ConformanceObligations)
  ports:
    expression: Compile(ArchitectureIR, InterfaceObligations)
  provider_bindings:
    expression: Bind(PortIR, ProviderCapabilities)
  implementation:
    expression: SynthesizeAndLower(PortIR, ProviderBindingIR, ConformanceProjection)
  target_artifacts:
    expression: Render(Lower(ImplementationIR, TargetBinding))
