  - architecture_ir
  - selected_pattern_refs
  - port_ir
  - adapter_requirement_ir
  - product_relationship_ir
  - provider_binding_ir
  - applicable_conformance_bindings
  - fixture_profiles
  operations:
  - projection
  - derivation
  - binding_selection
  - lowering
  - synthesis
  validation:
    required: true
    solver_source: canonical_compilation_profile
  produces:
  - conformance_requirement_ir
  - conformance_ir
  - executable_conformance_cases
- ordinal: 13
  id: product_manifest
  label: Product Manifest
  consumes:
