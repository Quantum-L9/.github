  label: Ports and Boundaries
  consumes:
  - architecture_ir
  - port_requirements
  - adapter_requirements
  - relationship_requirements
  - port_catalog
  - applicable_contract_projection
  - applicable_conformance_projection
  operations:
  - projection
  - synthesis
  validation:
    required: true
    solver_source: canonical_compilation_profile
  produces:
  - port_ir
  - adapter_requirement_ir
  - product_relationship_ir
- ordinal: 11
