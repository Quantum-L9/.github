schema: l9.schema-definition/v1
artifact_id: l9.schema/strategic-plan-graph@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_strategic_plan_graph_schema
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: strategic_plan_graph.schema.yaml
governed_by:
  semantic_model_ref: strategic_plan_model.yaml
  strategic_cognition_ref: strategic_cognition_model.yaml
  authority_ref: authority_model.yaml#strategic_authority
  lifecycle_ref: lifecycle.yaml
purpose: >
  Define the minimum machine-readable node-and-relation representation of one
  immutable revision of the Strategy recorded by a Strategic Plan while
  preserving Plan ownership boundaries, external semantic ownership, and
  revision history. This schema defines representation only and does not add a
  fifth Plan primitive, a sixth strategic relation, runtime cognition, storage,
  graph-database semantics, execution semantics, or universal world-state ownership.
type: object
required:
- schema
- plan_ref
- revision_ref
- strategic_authority_ref
- scope
- strategic_intent_refs
- objective_refs
- nodes
- relations
- provenance
- graph_digest
properties:
  schema:
    const: l9.strategic-plan-graph/v1
  plan_ref:
    type: semantic_ref
  revision_ref:
    type: semantic_ref
  predecessor_revision_ref:
    type: semantic_ref
  strategic_authority_ref:
    type: semantic_ref
  scope:
    type: semantic_ref_or_string
  strategic_intent_refs:
    type: semantic_ref_list
    min_items: 1
  objective_refs:
    type: semantic_ref_list
  nodes:
    type: array
    min_items: 1
    items:
      type: object
      required:
      - ref
      - kind
      - statement
      fields:
        ref:
          type: semantic_ref
        kind:
          enum:
          - strategic_goal
          - strategic_target
          - strategic_hypothesis
          - strategic_commitment
        statement:
          type: string
        evidence_refs:
          type: semantic_ref_list
  relations:
    type: array
    items:
      type: object
      required:
      - ref
      - relation
      - source_ref
      - target_ref
      fields:
        ref:
          type: semantic_ref
        relation:
          enum:
          - advances
          - enables
          - depends_on
          - conflicts_with
          - supersedes
        source_ref:
          type: semantic_ref
        target_ref:
          type: semantic_ref
        hypothesis_ref:
          type: semantic_ref
  provenance:
    type: object
  graph_digest:
    type: semantic_digest
reference_rules:
  local_node_identity_source: nodes.ref
  non_local_relation_endpoint_semantics: external_semantic_ref
  external_references_remain_externally_owned: true
  unresolved_external_reference_result: unknown
  downstream_references_governing_upstream_subjects: true
  upstream_objects_do_not_embed_downstream_consumer_inventories: true
  reverse_adjacency_is_derived: true
relation_constraints:
  all:
    at_least_one_endpoint_must_resolve_to_local_plan_node: true
    relation_never_transfers_ownership_or_authority: true
  enables:
    hypothesis_ref_required: true
    hypothesis_ref_must_resolve_to_local_kind: strategic_hypothesis
  supersedes:
    source_must_resolve_to_local_plan_node: true
    target_must_resolve_to_same_primitive_kind: true
    target_may_resolve_to_prior_revision_same_plan_lineage: true
revision_rules:
  graph_represents_exactly_one_plan_revision: true
  content_change_requires_new_revision_ref: true
  predecessor_when_present_must_reference_prior_revision_same_plan_lineage: true
  prior_revisions_remain_addressable: true
  historical_revision_content_is_immutable: true
  graph_digest_binds_exact_revision_content: true
semantic_rules:
- strategy_is_the_integrated_meaning_of_the_graph_not_a_local_node_kind
- exactly_four_plan_owned_node_kinds_are_admitted
- exactly_five_strategic_relation_kinds_are_admitted
- strategic_intent_is_referenced_not_plan_owned
- objective_is_referenced_not_plan_owned
- capability_constraint_evidence_execution_and_reality_objects_remain_externally_owned
- external_semantics_are_referenced_not_copied_into_plan_ownership
- affected_strategic_closure_is_computed_reasoning_not_serialized_plan_content
- planning_horizon_does_not_create_node_kinds_or_required_plan_fields
- confidence_probability_budget_priority_schedule_and_execution_state_are_not_admitted_plan_graph_fields
- graph_storage_index_or_query_provider_never_becomes_semantic_owner
- strategic_authority_ref_must_resolve_before_authoritative_plan_revision_mutation
