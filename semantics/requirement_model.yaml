schema: l9.requirement-model/v1
artifact_id: l9.requirement-model/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_requirement_semantics
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: requirement_model.yaml
governed_by:
  contracts:
    - l9.contract/requirement-resolution@1
    - l9.contract/hard-constraint@1
    - l9.contract/unknown-and-degradation@1
global_rules:
  requirements_are_typed: true
  requirements_preserve_source_provenance: true
  hard_requirements_are_non_compensable: true
  preferences_do_not_satisfy_hard_requirements: true
  unresolved_requirements_remain_explicit: true
  resolution_does_not_create_authority: true
  provider_capability_is_not_semantic_requirement_ownership: true
requirement_classes:
  semantic:
    meaning: Required domain or L9 meaning that must be preserved.
    default_hardness: hard
  authority:
    meaning: Required authority or admission condition.
    default_hardness: hard
  capability:
    meaning: Required semantic capability or capability closure.
    default_hardness: hard
  interface:
    meaning: Required semantic port or interface obligation.
    default_hardness: hard
  architecture:
    meaning: Required structural guarantee or prohibited structure.
    default_hardness: hard
  technology:
    meaning: Required realization property or declared technology constraint.
    default_hardness: hard
    note: Technology preferences are modeled separately as soft objectives.
  conformance:
    meaning: Required independently verifiable behavioral obligation.
    default_hardness: hard
  operational:
    meaning: Required runtime, deployment, observability, or packaging property.
    default_hardness: hard
    note: Operational preferences are modeled separately as soft objectives.
  objective:
    meaning: Optimization objective evaluated only among feasible candidates.
    default_hardness: soft
requirement_entry_contract:
  required:
    - id
    - class
    - source_ref
    - hardness
    - satisfaction_semantics
  optional:
    - owner
    - scope
    - depends_on
    - conflicts_with
    - evidence_requirement
    - priority
  hardness_domain:
    - hard
    - soft
closure_rules:
  - transitive_requirements_are_preserved
  - duplicate_semantic_requirements_may_be_canonicalized_without_losing_provenance
  - conflicting_hard_requirements_produce_explicit_conflict_or_unsat
  - soft_objectives_are_evaluated_only_after_hard_feasibility
