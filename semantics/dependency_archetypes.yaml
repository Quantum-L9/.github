schema: l9.dependency-archetypes/v1
artifact_id: l9.dependency-archetypes/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_dependency_archetypes
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: dependency_archetypes.yaml
governed_by:
  contracts:
    - l9.contract/product-kind@1
    - l9.contract/product-topology@1
global_rules:
  catalog_applies_only_to_product_kind_dependency: true
  archetype_does_not_define_consumer_semantics: true
  archetype_does_not_create_semantic_ownership: true
  archetype_specializes_dependency_kind: true
  dependencies_are_locally_composed: true
  dependency_runtime_identity_is_consumer_bound: true
  package_complexity_does_not_imply_node_kind: true
archetypes:
  - id: l9.dependency-archetype/semantic-subsystem@1
    purpose: >
      Reusable installable subsystem that owns a bounded semantic domain while
      executing inside a consuming product's runtime boundary.
    properties:
      - owned_reusable_semantics
      - public_programmatic_contract
      - consumer_bound_runtime
      - independent_release_identity
    requires:
      architecture_patterns:
        - l9.pattern/dependency-package@1
      conformance_classes:
        - core
    optional_patterns:
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/reference-model-conformance@1
      - l9.pattern/fixture-backed-conformance@1
    forbidden:
      - implicit_gate_registration
      - consumer_semantic_ownership_capture
      - provider_becomes_semantic_owner
  - id: l9.dependency-archetype/infrastructure@1
    purpose: >
      Reusable installable infrastructure mechanism with an L9-owned public
      contract and no independent Constellation identity.
    properties:
      - reusable_mechanism
      - public_programmatic_contract
      - consumer_bound_runtime
    requires:
      architecture_patterns:
        - l9.pattern/dependency-package@1
      conformance_classes:
        - core
    forbidden:
      - implicit_domain_ownership
      - implicit_gate_registration
  - id: l9.dependency-archetype/adapter-package@1
    purpose: >
      Reusable installable package whose primary responsibility is a concrete
      realization of one or more owner-defined ports.
    properties:
      - adapter_implementation
      - explicit_port_conformance
      - provider_binding
    requires:
      architecture_patterns:
        - l9.pattern/dependency-package@1
        - l9.pattern/semantic-core-provider-adapter@1
      conformance_classes:
        - core
        - adapter
    forbidden:
      - provider_api_promoted_to_owner_contract
      - consumer_semantics_redefined_by_adapter
  - id: l9.dependency-archetype/contract-package@1
    purpose: >
      Reusable installable package whose primary public surface is canonical or
      owner-admitted types, schemas, contracts, validators, and compatibility
      machinery with minimal runtime behavior.
    properties:
      - stable_contract_surface
      - minimal_runtime
      - independent_release_identity
    requires:
      architecture_patterns:
        - l9.pattern/dependency-package@1
      conformance_classes:
        - core
    forbidden:
      - hidden_runtime_side_effects
      - implicit_process_ownership
  - id: l9.dependency-archetype/chassis@1
    purpose: >
      Reusable installable runtime substrate providing common bootstrap,
      configuration, health, observability, security, or lifecycle mechanics
      without acquiring the consumer's domain semantics.
    properties:
      - reusable_runtime_substrate
      - consumer_bound_runtime
      - domain_semantic_non_ownership
    requires:
      architecture_patterns:
        - l9.pattern/dependency-package@1
      conformance_classes:
        - core
    forbidden:
      - consumer_domain_semantic_ownership
      - implicit_constellation_identity
