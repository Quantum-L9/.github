schema: l9.binding-catalog/v1
artifact_id: l9.binding-catalog/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_binding_catalog
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: binding_catalog.yaml
binding_families:
  provider:
    purpose: Map an abstract semantic port or capability requirement onto a concrete implementation provider.
  target:
    purpose: Map semantic or intermediate-representation concepts onto a concrete target artifact, runtime,
      language, framework, protocol, or execution environment.
  validation:
    purpose: Map a validation contract onto a mechanically checkable validator implementation without
      changing validation semantics.
bindings:
- id: l9.binding/json-schema-2020-12@1
  class: target
  source_ir: structural_requirements_ir
  target_ir: json_schema_ir
  target:
    technology: json-schema
    version: 2020-12
  schema_uri: https://json-schema.org/draft/2020-12/schema
  semantic_type_map:
    string:
      type: string
    integer:
      type: integer
    number:
      type: number
    boolean:
      type: boolean
    object:
      type: object
    array:
      type: array
    semantic_digest:
      type: string
      pattern: ^sha256:[0-9a-f]{64}$
    reference:
      type: string
      minLength: 1
    any: {}
  rules:
  - required_contract_field_maps_to_required_json_schema_field
  - enum_maps_to_enum
  - descriptions_may_be_preserved
  - unknown_semantic_type_fails_closed
  - binding_does_not_invent_field_type
- id: pytest/v1
  class: target
  source_ir: fixture_ir
  target_ir: pytest_ir
  target:
    technology: pytest
  maps:
    fixture_case: pytest_test_function
    given: setup_phase
    when.operation: system_under_test_call
    expect: pytest_assertions
  rules:
  - binding_declares_mapping
  - binding_does_not_perform_lowering
- id: pytest/v2
  class: target
  source_ir: fixture_ir
  target_ir: pytest_ir
  target:
    technology: pytest
  successor_of: pytest/v1
  maps:
    fixture_case: pytest_test_function
    given: setup_phase
    given.steps.interface_action: setup_system_under_test_call
    given.steps.port_fixture: setup_port_fixture
    given.steps.harness_control: setup_harness_control
    given.steps.precondition: setup_precondition_error_not_failure
    when.operation: system_under_test_call
    when.steps.sequence: ordered_system_under_test_calls
    when.steps.parallel: concurrently_issued_system_under_test_calls
    context: gate_invocation_context
    expect: pytest_assertions
    expect.observations.interface_action: post_call_observation_call
    expect.observations.harness_observation: post_call_harness_observation
    disposition.unresolved: unresolved_case_reported_never_passed
    expect.observations.context: gate_invocation_context_of_the_observation_call
    expect.group.count_where: exact_count_of_group_member_results_satisfying_every_where_clause
    expect.presence: path_resolution_check_where_absence_is_a_value_not_an_error
  rules:
  - binding_declares_mapping
  - binding_does_not_perform_lowering
  - unresolved_case_never_renders_as_a_passing_or_skipped_success
  - parallel_group_renders_as_concurrently_issued_calls_without_ordering_guarantee
  - setup_precondition_failure_renders_as_error_never_as_assertion_failure
  - value_references_resolve_from_recorded_step_results_only
  - harness_controls_and_observations_render_only_through_the_product_declared_harness_surface
  - context_renders_as_the_gate_invocation_context_of_its_step_and_never_as_request_payload
- id: l9.binding/repository-operations-pyproject@1
  class: target
  source_ir: repository_operations_ir
  target_ir: target_ir
  target:
    technology: toml
    artifact: pyproject.toml
    semantic_profile: python_project_metadata
  maps:
    package_identity: project_identity
    version_declaration: project_version_or_dynamic_version
    description: project_description
    python_runtime_constraint: project_requires_python
    dependency_intent: project_dependencies
    optional_dependency_groups: project_optional_dependencies
    cli_entrypoints: project_scripts
    build_system: build_system
    package_layout: package_discovery_configuration
  rules:
  - applies_only_when_python_ecosystem_is_resolved
  - package_identity_must_resolve_from_authoritative_repository_or_product_input
  - version_declaration_must_resolve_from_authoritative_versioning_intent
  - build_backend_and_build_requirements_must_be_authoritatively_resolved
  - dependency_ranges_and_groups_must_be_authoritatively_resolved
  - observed_imports_must_not_invent_dependency_constraints
  - projected_cli_entrypoint_must_be_authorized_and_observed_or_declared_build_output
  - unresolved_required_project_metadata_fails_closed
  - existing_pyproject_bytes_have_no_authority_or_preservation_privilege
  - rendering_is_deterministic_and_semantically_noncreative
- id: l9.binding/repository-operations-makefile@1
  class: target
  source_ir: repository_operations_ir
  target_ir: target_ir
  target:
    technology: makefile
    artifact: Makefile
    semantic_profile: repository_operator_facade
  maps:
    build: build
    test: test
    validate: validate
  rules:
  - first_binding_version_renders_only_build_test_validate
  - operation_must_be_resolved_and_applicable_before_target_is_emitted
  - recipe_must_come_from_resolved_repository_operation_realization
  - makefile_must_not_contain_unique_business_or_product_logic
  - make_target_name_does_not_create_operation_semantics
  - missing_unknown_blocked_or_not_applicable_operation_omits_target
  - dummy_success_targets_are_forbidden
  - existing_makefile_bytes_have_no_authority_or_preservation_privilege
  - additional_operator_targets_require_a_successor_binding_version
- id: l9.binding/python-gate-node@1
  class: target
  source_ir: implementation_ir
  target_ir: target_ir
  target:
    technology: python
    transport_technology: gate-sdk
    semantic_profile: gate_node_shell
  applies_to:
    product_kind: node
  maps:
    inbound_interface_action: gate_sdk_registered_action_handler
    action_request_contract: handler_request_validation_against_the_declared_contract
    consequential_operation: gate_runtime_idempotency_requirement
    forbidden_action: absent_registration
    inbound_port_implementation: bound_implementation_reference
    outbound_port: bound_port_interface_reference
    adapter_requirement: bound_adapter_implementation_reference
    composition_root: gate_sdk_node_app_factory
  rules:
  - consumes_only_implementation_ir_lowered_from_a_manifest_satisfying_the_resolved_manifest_gate
  - every_registered_action_is_exactly_one_manifest_interfaces_action_and_every_manifest_action_is_registered
  - registered_actions_are_reached_only_through_gate_sdk_transport
  - every_manifest_effects_consequential_operation_requires_gate_runtime_idempotency
  - forbidden_actions_are_never_registered
  - port_and_adapter_implementations_are_bound_by_manifest_implementation_ref_and_verified_not_regenerated
  - behavior_code_is_emitted_only_where_an_admitted_behavior_contract_determines_it
  - unresolved_action_contract_effect_port_adapter_or_implementation_ref_fails_closed
  - optional_port_without_a_declared_adapter_is_not_given_an_invented_adapter
  - binding_emits_no_http_route_authentication_peer_url_or_routing_logic
  - generated_artifacts_are_derived_and_never_semantic_authority
  - final_conformance_is_required_before_generated_artifacts_count_as_realized
  - existing_target_bytes_have_no_authority_or_preservation_privilege
  - rendering_is_deterministic_and_semantically_noncreative
- id: l9.binding/provider/mongodb@1
  class: provider
  provider:
    technology: mongodb
    semantic_ownership:
      implied: false
  fact_source:
    kind: vendor_documentation
    documentation: MongoDB Database Manual, https://www.mongodb.com/docs/manual/ (version selector "Version 9.0 (current)")
    retrieved: '2026-11-11'
    quotes_rematched_against_raw_page_html: '2026-11-12'
  server_version_range:
    min_inclusive: '9.0'
    max_exclusive: '9.1'
    basis: >
      Every fact below was read from the manual's current line, labelled Version
      9.0 on the retrieval date. Other server lines are Unknown until their own
      documentation is cited; deployments outside the range are
      incompatible_until_resolved for every token.
  deployment_profiles:
    - standalone
    - replica_set
    - sharded_cluster
  rules:
    - provider_does_not_become_semantic_owner
    - every_fact_names_a_defined_token_or_alias
    - a_provided_fact_cites_vendor_documentation_with_a_verbatim_quote
    - an_inferred_fact_is_labelled_inference_from_vendor_statements
    - a_fact_without_vendor_citation_is_unknown
    - runtime_qualification_is_a_separate_obligation_and_never_part_of_the_fact
  facts:
    transactions:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: [replica_set, sharded_cluster]
      preconditions:
        - featureCompatibilityVersion at least 4.0 on a replica set and 4.2 on a sharded cluster
        - a transaction runs for less than transactionLifetimeLimitSeconds (60 s by default) or is aborted
      citations:
        - url: https://www.mongodb.com/docs/manual/core/transactions/
          quote: MongoDB supports distributed transactions, including transactions on replica sets and sharded clusters.
        - url: https://www.mongodb.com/docs/manual/core/transactions-production-consideration/
          quote: MongoDB standalone deployments do not support transactions.
        - url: https://www.mongodb.com/docs/manual/core/transactions-production-consideration/
          quote: the featureCompatibilityVersion for all members of the deployment must be at least
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/transactions@1
        deployment_profiles: [replica_set]
        status: not_executed
    conditional_updates:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: []
      caveats:
        - the predicate must include the expected current value; a filter on the identifier alone loses concurrent updates
      citations:
        - url: https://www.mongodb.com/docs/manual/core/write-operations-atomicity/
          quote: In MongoDB, write operations are atomic on the single-document level, even if modifying multiple values.
        - url: https://www.mongodb.com/docs/manual/core/write-operations-atomicity/
          quote: include the expected current value in the update filter
        - url: https://www.mongodb.com/docs/manual/reference/command/findAndModify/
          quote: When modifying a single document, both findAndModify and the updateOne() method atomically update the document.
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/conditional-updates@1
        deployment_profiles: [replica_set]
        status: not_executed
    snapshot_isolation:
      status: provided
      fact_basis: inference_from_vendor_statements
      inference: >
        The vendor does not use the term snapshot isolation. Snapshot reads of
        majority-committed data at one point in time, together with a write
        conflict abort when a document modified outside the transaction is
        later modified inside it, match the token's guarantee.
      requires_deployment: [replica_set, sharded_cluster]
      preconditions:
        - transaction read concern "snapshot"
        - the transaction commits with write concern "majority"
      citations:
        - url: https://www.mongodb.com/docs/manual/reference/read-concern-snapshot/
          quote: provides its guarantees only if the transaction commits with write concern "majority"
        - url: https://www.mongodb.com/docs/manual/reference/read-concern-snapshot/
          quote: returns majority-committed data as it appears across shards from a specific single point in time in the recent past.
        - url: https://www.mongodb.com/docs/manual/core/transactions-production-consideration/
          quote: the transaction aborts because of a write conflict
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/snapshot-isolation@1
        deployment_profiles: [replica_set]
        status: not_executed
    serializable_isolation:
      status: unknown
      fact_basis: none
      note: >
        The vendor claims serializability only for single-document operations on
        a replica set in the absence of rollback, and states nothing about
        multi-document transactions or write skew.
      citations:
        - url: https://www.mongodb.com/docs/manual/core/read-isolation-consistency-recency/
          quote: is serializable only in the absence of a rollback
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/serializable-isolation@1
        deployment_profiles: [replica_set]
        status: not_executed
    replicated_durable_commit:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: [replica_set, sharded_cluster]
      preconditions:
        - write concern "majority" set at the transaction level, not per operation
      caveats:
        - 'j: true alone does not prevent rollback after a primary failover'
        - 'w: 1 writes can be rolled back if the primary steps down before replication'
      citations:
        - url: https://www.mongodb.com/docs/manual/reference/write-concern/
          quote: have durably written the change to their local oplog
        - url: https://www.mongodb.com/docs/manual/reference/write-concern/
          quote: you set the write concern at the transaction level, not at the individual operation level
        - url: https://www.mongodb.com/docs/manual/core/transactions/
          quote: 'applies w: "majority" as the write concern when retrying'
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/replicated-durable-commit@1
        deployment_profiles: [replica_set]
        status: not_executed
    commit_outcome_unknown_signal:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: [replica_set, sharded_cluster]
      provider_signal:
        ambiguous_commit: error label UnknownTransactionCommitResult
        retryable_abort: error label TransientTransactionError
      caveats:
        - the core transaction API retries neither label; the callback API may retry and run the callback more than once
      citations:
        - url: https://www.mongodb.com/docs/manual/core/transactions-in-applications/
          quote: To retry the commit operation if the commit encounters an UnknownTransactionCommitResult error.
        - url: https://www.mongodb.com/docs/manual/core/transactions-in-applications/
          quote: associated with the label "TransientTransactionError"
        - url: https://www.mongodb.com/docs/languages/python/pymongo-driver/current/crud/transactions/
          quote: this method may retry the commit or the entire transaction, which may invoke the callback multiple times by a single call to with_transaction().
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/commit-outcome-unknown-signal@1
        deployment_profiles: [replica_set]
        status: not_executed
    server_authoritative_time_in_update_expressions:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: []
      citations:
        - url: https://www.mongodb.com/docs/manual/reference/aggregation-variables/
          quote: returns the same value for all members of the deployment
        - url: https://www.mongodb.com/docs/manual/tutorial/update-documents-with-aggregation-pipeline/
          quote: The operation uses the aggregation variable NOW for the current datetime.
        - url: https://www.mongodb.com/docs/manual/reference/method/db.collection.updateOne/
          quote: The aggregation variable NOW resolves to the current datetime value and remains the same throughout the pipeline.
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/server-time-update-expressions@1
        deployment_profiles: [replica_set]
        status: not_executed
    server_authoritative_time_in_query_filters:
      status: unknown
      fact_basis: none
      note: >
        No vendor page read shows the server time variable inside a query filter
        through $expr. It stays Unknown until a vendor citation or a passing
        live receipt is recorded.
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/server-time-query-filters@1
        deployment_profiles: [replica_set]
        status: not_executed
    unique_key:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: []
      provider_signal:
        duplicate_key: error code 11000 DuplicateKey
      citations:
        - url: https://www.mongodb.com/docs/manual/core/index-unique/
          quote: A unique index ensures that the indexed fields do not store duplicate values
        - url: https://www.mongodb.com/docs/manual/reference/error-codes/
          quote: 11000 DuplicateKey
        - url: https://www.mongodb.com/docs/manual/reference/command/findAndModify/
          quote: Upserts can create duplicate documents, unless there is a unique index to prevent duplicates.
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/unique-key@1
        deployment_profiles: [replica_set]
        status: not_executed
    change_notifications:
      status: provided
      fact_basis: vendor_statement
      requires_deployment: [replica_set, sharded_cluster]
      citations:
        - url: https://www.mongodb.com/docs/manual/changestreams/
          quote: 'Change streams are available for replica sets and sharded clusters:'
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/change-notifications@1
        deployment_profiles: [replica_set]
        status: not_executed
    document_storage:
      status: unknown
      fact_basis: none
      note: No vendor citation was recorded for this token.
      runtime_qualification_obligation:
        probe_id: l9.probe/datastore/document-storage@1
        deployment_profiles: [replica_set]
        status: not_executed

validation_binding_families:
- LocalSATBinding
- GraphConstraintBinding
- SchemaBinding
- FixtureBinding
- ConformanceBinding
compatibility:
  provider: RequiredCapabilities ⊆ ProviderCapabilities
  target: RequiredTargetCapabilities ⊆ TargetCapabilities
  unknown_capability: incompatible_until_resolved
  optimization_permitted_only_after_compatibility: true
  provider_does_not_become_semantic_owner: true
  binding_selection_does_not_transform_source_ir: true
