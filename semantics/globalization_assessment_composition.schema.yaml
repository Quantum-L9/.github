type: object
required:
- invariants
- contracts
- authority_model
- lifecycle
- packet_catalog
properties:
  schema:
    const: l9.composed-projection.globalization-assessment/v1
  invariants:
    type: object
    required:
    - invariants
    properties:
      invariants:
        type: array
        min_items: 9
        items:
          type: object
          required:
          - id
          - statement
          - scope
          - owner
          properties:
            id:
              type: string
              enum:
              - L9-AUTH-001
              - L9-AUTH-002
              - L9-OWNER-001
              - L9-SEM-001
              - L9-SCOPE-001
              - L9-PROMOTION-001
              - L9-DERIVED-001
              - L9-ADMISSION-001
              - L9-GLOBALIZATION-001
            statement:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
  contracts:
    type: object
    required:
    - contracts
    properties:
      contracts:
        type: array
        min_items: 3
        items:
          type: object
          required:
          - id
          - purpose
          - scope
          - owner
          - source_invariants
          - applies_to
          - requires
          - guarantees
          - forbidden
          - outcomes
          properties:
            id:
              type: string
              enum:
              - l9.contract/authority-boundary@1
              - l9.contract/semantic-ownership@1
              - l9.contract/admission-and-promotion@1
            purpose:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
            source_invariants:
              type: string_list
              min_items: 2
            applies_to:
              type: string_list
              min_items: 5
            requires:
              type: string_list
              min_items: 2
            guarantees:
              type: string_list
              min_items: 3
            forbidden:
              type: string_list
              min_items: 4
            outcomes:
              type: object
              required:
              - unresolved
              properties:
                satisfied:
                  type: string
                violated:
                  type: string
                unresolved:
                  type: string
                admitted:
                  type: string
                  const: exact_subject_is_admitted_by_target_class_authority
                refused:
                  type: string
                  const: exact_subject_is_not_admitted
                new_decision_required:
                  type: string
                  const: subject_changed_materially_without_compatibility_preservation
  authority_model:
    type: object
    required:
    - promotion_rules
    - global_promotion
    - global_admission_rules
    properties:
      promotion_rules:
        type: object
        required:
        - sequence
        - globalization_candidate_is_not_global_authority
        - authorized_global_state_change_required
        properties:
          sequence:
            type: string_list
            min_items: 8
          globalization_candidate_is_not_global_authority:
            type: boolean
            const: true
          authorized_global_state_change_required:
            type: boolean
            const: true
      global_promotion:
        type: object
        required:
        - candidate
        - requires
        - automatic_promotion_forbidden
        properties:
          candidate:
            type: string
            const: globalization_candidate
          requires:
            type: string_list
            min_items: 2
          automatic_promotion_forbidden:
            type: boolean
            const: true
      global_admission_rules:
        type: object
        required:
        - requirements
        - requires_global_authority
        - candidate_generation_is_not_admission
        properties:
          requirements:
            type: string_list
            min_items: 6
          requires_global_authority:
            type: boolean
            const: true
          candidate_generation_is_not_admission:
            type: boolean
            const: true
  lifecycle:
    type: object
    required:
    - lifecycles
    properties:
      lifecycles:
        type: object
        required:
        - globalization_candidate
        - harvest_packet
        - architecture_pattern
        properties:
          globalization_candidate:
            type: object
            required:
            - semantic_owner
            - purpose
            - stages
            - terminal_resolutions
            - rules
            properties:
              semantic_owner:
                type: string
                const: Quantum-L9/.github
              purpose:
                type: string
              stages:
                type: string_list
                min_items: 4
              terminal_resolutions:
                type: string_list
                min_items: 4
              rules:
                type: string_list
                min_items: 3
          harvest_packet:
            type: object
            required:
            - semantic_owner
            - purpose
            - artifact_state
            - stages
            - rules
            properties:
              semantic_owner:
                type: string
                const: packet_semantic_owner
              purpose:
                type: string
              artifact_state:
                type: string
                const: immutable_after_emission
              stages:
                type: string_list
                min_items: 3
              rules:
                type: string_list
                min_items: 3
          architecture_pattern:
            type: object
            required:
            - semantic_owner
            - purpose
            - stages
            - branches
            - rules
            properties:
              semantic_owner:
                type: string
                const: Quantum-L9/.github
              purpose:
                type: string
              stages:
                type: string_list
                min_items: 7
              branches:
                type: object
                required:
                - admitted_global_pattern
                - domain_pattern
                - rejected
                - unresolved
                properties:
                  admitted_global_pattern:
                    type: string
                    const: applicable_global_authority_admits_exact_candidate
                  domain_pattern:
                    type: string
                    const: domain_specific_authority_is_required_or_globalization_is_not_supported
                  rejected:
                    type: string
                    const: applicable_authority_refuses_candidate
                  unresolved:
                    type: string
                    const: evidence_or_authority_is_insufficient
              rules:
                type: string_list
                min_items: 3
  packet_catalog:
    type: object
    required:
    - packets
    properties:
      packets:
        type: object
        required:
        - fixture_harvest
        properties:
          fixture_harvest:
            type: object
            required:
            - canonical_name
            - purpose
            - required_semantics
            properties:
              canonical_name:
                type: string
                const: FixtureHarvestPacket
              purpose:
                type: string
              required_semantics:
                type: string_list
                min_items: 4
