entry_shapes:
  purpose: Item shapes of the port and adapter entry lists named under properties.ports and properties.adapters. Fields
    not listed here are descriptive; they are permitted and can never make a port or adapter resolve.
  port_binding_list:
    item_type: object
    required:
    - port_ref
    - contract_refs
    fields:
      port_ref: semantic_ref
      contract_refs: semantic_ref_list
      capability_ref: semantic_ref
      implementation_ref: implementation_source_coordinate
    resolution:
    - port_ref_is_explicit_unique_across_inbound_outbound_and_extension_and_not_forbidden
    - contract_refs_are_non_empty_and_resolve_through_the_product_declared_contract_authority
    - capability_ref_when_present_names_a_declared_capability
  adapter_requirement_list:
    item_type: object
    required:
    - adapter_ref
    required_one_of:
    - port_ref
    - realizes_port
    fields:
      adapter_ref: semantic_ref
      port_ref: semantic_ref
      realizes_port: semantic_ref
      capability_ref: semantic_ref
      contract_refs: semantic_ref_list
      provider: semantic_ref
      provider_ref: semantic_ref
      transport: semantic_ref
      implementation_ref: implementation_source_coordinate
    resolution:
    - adapter_ref_is_explicit_unique_across_all_adapter_groups_and_not_forbidden
    - every_declared_port_link_names_a_resolved_port_and_at_least_one_is_declared
    - capability_ref_contract_refs_and_provider_coordinates_when_present_resolve_through_their_owners
    - declared_transport_stays_unresolved_until_a_transport_binding_authority_is_admitted
  implementation_source_coordinate:
    type: string
    form: <repository-relative POSIX path>[::<top-level symbol>]
    rules:
    - path_is_relative_to_the_directory_holding_the_product_repository_spec
    - path_is_neither_absolute_nor_escapes_that_directory
    - symbol_when_present_names_exactly_one_top_level_definition_in_that_file
    - coordinate_names_existing_code_and_creates_none
    - absent_coordinate_binds_no_existing_implementation
    - coordinate_is_declared_source_location_not_semantic_authority
semantic_rules:
- product_topology_is_authoritative_product_contract
- every_l9_product_uses_one_product_topology_vocabulary
- product_kind_constrains_topology_without_creating_parallel_vocabulary
- archetype_must_belong_to_declared_product_kind
- declared_semantics_override_no_derived_guess
- compiler_must_not_invent_product_purpose_boundary_or_authority
- provider_identity_does_not_define_product_kind_or_capability_meaning
- omitted_derivable_structure_is_not_a_schema_error
- material_unknown_blocks_resolved_product_manifest
- unadmitted_or_unresolved_kind_must_remain_explicit_unknown
- unresolved_kind_or_archetype_blocks_resolved_product_manifest
- topology_representation_does_not_require_kind_invention
- identity_is_first_class_product_topology_primitive
- identity_dimensions_must_not_be_collapsed
- governance_profile_is_not_identity
- dynamic_identity_is_resolved_into_identity_assertion_not_authored_as_static_session_fact
- valid_identity_assertion_is_consumed_not_rederived
- product_kind_exception_is_claimed_only_by_explicit_reference_and_exact_subject_binding
- port_and_adapter_entries_follow_entry_shapes
- implementation_ref_is_an_optional_declared_source_coordinate_not_semantic_authority
- implementation_ref_never_makes_a_port_or_adapter_resolve
- conformance_fixture_case_refs_name_product_owned_fixture_ir_documents_bound_by_digest_and_are_not_fixture_profiles
- conformance_harness_surface_ref_names_the_product_l9_harness_surface_document_and_grants_no_gate_action
- absent_fixture_case_refs_or_harness_surface_ref_changes_no_existing_topology_obligation
- a_conformance_product_file_digest_is_the_sha256_of_the_raw_bytes_of_the_named_file
- a_conformance_product_file_ref_resolves_to_exactly_one_repository_spec_authoritative_source_entry_whose_coordinate_equals_it_and_whose_path_stays_inside_the_repository
- an_unresolved_ambiguous_escaping_or_digest_mismatched_product_file_ref_is_a_typed_refusal_never_a_resolution
product_file_resolution:
  applies_to:
  - properties.conformance.fields.fixture_case_refs
  - properties.conformance.fields.harness_surface_ref
  rule: 'A product file ref {ref, digest} resolves through the product''s RepositorySpec. ref must equal the coordinate
    of exactly one entry under the RepositorySpec''s source_surfaces.authoritative groups. That entry''s path is
    relative to the directory holding the RepositorySpec, is not absolute, and never escapes that directory. The
    file at that path is read as raw bytes, and digest must equal "sha256:" + the lowercase hex sha256 of those bytes.
    Nothing outside the matched entry''s path is read.'
  refusals:
    product_file_ref_unresolved: No authoritative source entry's coordinate equals ref, or the matched path names no
      file.
    product_file_ref_ambiguous: More than one authoritative source entry's coordinate equals ref.
    product_file_path_escapes_repository: The matched entry's path is absolute or resolves outside the directory
      holding the RepositorySpec.
    product_file_digest_mismatch: The raw-bytes sha256 of the matched file differs from digest.
  consumer_requirement: A RepositorySpec authoritative source entry that a topology product file ref names carries a
    coordinate equal to that ref. The RepositorySpec schema is not owned here; this states only what resolution
    reads.
kind_resolution:
  canonical_source: product_kinds.yaml
  admitted_kind_rule: Declared kind must resolve to an admitted ProductKind before ProductManifest may pass the
    resolved-manifest gate.
  unknown_rule: A product whose ProductKind or archetype is not yet admitted remains representable through explicit
    material Unknowns; the compiler must not guess or coerce a nearest kind.
  archetype_rule: Resolved archetype must come from the catalog bound by the resolved ProductKind.
  exception_rule: Absent product.kind_exception_ref, declared consumption and deployment models must equal the resolved
    kind's models. A declared product.kind_exception_ref must resolve to an admitted entry of product_kinds.yaml#kind_exceptions
    whose kind, subject product, canonical repository, and archetype equal the declaration; the entry's effective models
    and enumerated departures then apply and every undisplaced obligation remains. Any unresolved, unadmitted, malformed,
    or unbound claim is invalid, never ignored and never coerced to the nearest kind. ProductTopology and ProductManifest are
    release-independent, so an exception's release floor (subject.applies_from_release) is a product-kind release obligation
    enforced at product release admission through l9.contract/product-release@1 (applicable_product_kind_requirements_are_resolved).
  exception_catalog: product_kinds.yaml#kind_exceptions
