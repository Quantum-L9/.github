    fields:
      restart_semantics: semantic_ref_or_string_list
      replay_semantics: semantic_ref_or_string_list
      compensation_semantics: semantic_ref_or_string_list
      restore_contract_refs: semantic_ref_list
      disaster_recovery_requirement_refs: semantic_ref_list
  observability:
    type: object
    fields:
      logging_contract_refs: semantic_ref_list
      capability_metrics: semantic_ref_or_string_list
      provider_metrics: semantic_ref_or_string_list
      tracing_requirement_refs: semantic_ref_list
      correlation_identity_refs: semantic_ref_list
      audit_requirement_refs: semantic_ref_list
      slo_refs: semantic_ref_list
  admission:
    type: object
    required:
    - subject
    - authority_ref
    - requirements
    fields:
      subject: semantic_ref_or_string
      authority_ref: semantic_ref
      admission_profile_ref: semantic_ref
      requirements: semantic_ref_or_string_list
      kind_specific_requirements: semantic_ref_or_string_list
      evidence_requirement_refs: semantic_ref_list
