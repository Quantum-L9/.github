schema: l9.schema-definition/v1
canonical: true
authority:
  owner: Quantum-L9/.github
  authority_class: canonical
  scope: l9_global_identity_assurance_projection_payload_schema
artifact_id: l9.schema/identity-assurance-projection@1
canonical_source:
  format: yaml
  artifact: identity_assurance_projection.schema.yaml
governed_by:
  projection_profile_ref: l9.projection/identity-assurance@1
purpose: Typed per-source payload of l9.projection/identity-assurance@1, derived from the payloads its
  selectors produce at the recorded authority revision. Exact selected membership is independently governed
  by selector equivalence; the schema adds no authority.
derivation:
  method: l9.schema-derivation/selected-payload@1
  basis: selected_payload_observation_at_authority_revision
  authority_repository: Quantum-L9/.github
  authority_revision: 2349a90b86b2d90ad5b1aa5a026fee58dbec75f3
  projection_profile:
    ref: l9.projection/identity-assurance@1
    digest: sha256:e5b099a569fbdd49e75d715ed982460b6f30d9bd805cc17264d91aa2b865a32d
  composition_profile:
    ref: l9.compose/identity-assurance@1
    digest: sha256:9e8e52f72d1efcddfada3517be61a035f2ef8d84e698e45e52c603cd80d55b1b
  selector_model:
    ref: l9.selector-model/global@1
    digest: sha256:2c2e221c3e5455f3359723d0e1b4da2cdbd02542782b7cd4bb22bfb7cd5aad56
    path: semantics/selector_model.yaml
  sources:
  - source_class: invariants
    source_ref: l9.source/invariants@1
    source_path: semantics/invariants.yaml
    source_digest: sha256:771e3509703ea7d177a4bbac965e126f77f390ec359d1544854d95ec4374082a
  - source_class: contracts
    source_ref: l9.source/contracts@1
    source_path: semantics/contracts.yaml
    source_digest: sha256:f1fcc979534d0aa34783710657ae36d765f7078e6ab20dc3b11a31d576539d79
  - source_class: identity_model
    source_ref: l9.source/identity-model@1
    source_path: semantics/identity_model.yaml
    source_digest: sha256:b9245eca99501a38976e909e1d151942c1253b2eee2bd6bab9c6382687db4288
  - source_class: authority_model
    source_ref: l9.source/authority-model@1
    source_path: semantics/authority_model.yaml
    source_digest: sha256:9303ee5910f3db2b10abe71bdcb5e360128ee77e7e4bd3ebe9e05dba77018620
  - source_class: actor_registry
    source_ref: l9.source/actor-registry@1
    source_path: semantics/actor_registry.yaml
    source_digest: sha256:34fbe4abc246e21c28401941025317be52c109c88335577616a2648cc93c6f6f
  - source_class: surface_registry
    source_ref: l9.source/surface-registry@1
    source_path: semantics/surface_registry.yaml
    source_digest: sha256:d7200409ff02141a274ff8c9221d31429f6a6fae27539e6d9c8d20f1a6eba988
type: object
properties:
  schema:
    const: l9.projection.identity-assurance/v1
  invariants:
    type: array
    min_items: 12
    items:
      type: object
      required:
      - id
      - statement
      - scope
      - owner
      properties:
        id:
          type: string
          enum:
          - L9-AUTH-001
          - L9-OWNER-001
          - L9-UNKNOWN-001
          - L9-PROV-001
          - L9-COORD-001
          - L9-IDENTITY-001
          - L9-REVISION-001
          - L9-IDENTITY-002
          - L9-IDENTITY-003
          - L9-IDENTITY-004
          - L9-IDENTITY-005
          - L9-IDENTITY-006
        statement:
          type: string
        scope:
          type: string
          const: global
        owner:
          type: string
          const: Quantum-L9/.github
  contracts:
    type: array
    min_items: 4
    items:
      type: object
      required:
      - id
      - purpose
      - scope
      - owner
      - source_invariants
      - applies_to
      - requires
      - guarantees
      - forbidden
      - outcomes
      properties:
        id:
          type: string
          enum:
          - l9.contract/provenance-and-coordinate@1
          - l9.contract/identity-topology@1
          - l9.contract/identity-resolution@1
          - l9.contract/identity-assertion@1
        purpose:
          type: string
        scope:
          type: string
          const: global
        owner:
          type: string
          const: Quantum-L9/.github
        source_invariants:
          type: string_list
          min_items: 3
        applies_to:
          type: string_list
          min_items: 3
        requires:
          type: string_list
          min_items: 4
        guarantees:
          type: string_list
          min_items: 3
        forbidden:
          type: string_list
          min_items: 3
        outcomes:
          type: object
          properties:
            current:
              type: string
              const: declared_coordinates_match_or_compatibility_is_proven
            non_current:
              type: string
            unresolved:
              type: string
            satisfied:
              type: string
              const: identity_topology_is_explicit_and_non_colliding
            invalid:
              type: string
            resolved:
              type: string
              const: required_identity_dimensions_are_resolved
            unknown:
              type: string
            ambiguous:
              type: string
              const: multiple_materially_distinct_identities_remain
            valid:
              type: string
              const: assertion_is_current_and_verifiable
  global_rules:
    type: object
    properties:
      identity_dimensions_are_semantically_distinct:
        type: boolean
        const: true
      equal_strings_do_not_imply_equal_identity_kinds:
        type: boolean
        const: true
      identity_resolution_is_evidence_bound:
        type: boolean
        const: true
      identity_assertion_is_consumed_not_rederived:
        type: boolean
        const: true
      unknown_or_ambiguous_consequential_actor_identity_fails_closed:
        type: boolean
        const: true
      governance_profile_is_not_identity:
        type: boolean
        const: true
      adapter_identity_is_not_actor_identity:
        type: boolean
        const: true
      provider_identity_is_not_actor_identity:
        type: boolean
        const: true
      surface_identity_is_not_actor_identity:
        type: boolean
        const: true
      runtime_identity_is_not_actor_identity:
        type: boolean
        const: true
      memory_authorship_uses_actor_identity:
        type: boolean
        const: true
      receipts_bind_applicable_actor_and_runtime_provenance:
        type: boolean
        const: true
      registry_names_identity_only:
        type: boolean
        const: true
      registry_does_not_interpret_runtime_evidence:
        type: boolean
        const: true
      registry_grants_no_credential_role_or_execution_authority:
        type: boolean
        const: true
      registry_does_not_assign_surfaces:
        type: boolean
        const: true
      registry_does_not_select_governance_profile:
        type: boolean
        const: true
      aliases_are_scoped_to_actor_identity:
        type: boolean
        const: true
      equal_strings_in_other_identity_dimensions_are_unrelated:
        type: boolean
        const: true
      actor_admission_is_a_separate_digest_bound_decision:
        type: boolean
        const: true
      surface_does_not_intrinsically_own_an_actor:
        type: boolean
        const: true
      surface_does_not_intrinsically_select_governance_profile:
        type: boolean
        const: true
      surface_does_not_bind_provider_or_adapter:
        type: boolean
        const: true
      aliases_are_scoped_to_surface_identity:
        type: boolean
        const: true
      one_actor_may_operate_through_many_surfaces:
        type: boolean
        const: true
  identity_dimensions:
    type: object
    required:
    - product_identity
    - release_identity
    - runtime_identity
    - constellation_identity
    - actor_identity
    - surface_identity
    properties:
      product_identity:
        type: object
        required:
        - question
        - definition
        - authority_source
        - dynamic
        properties:
          question:
            type: string
          definition:
            type: string
          authority_source:
            type: string
            const: product_semantic_owner
          dynamic:
            type: boolean
            const: false
      release_identity:
        type: object
        required:
        - question
        - definition
        - authority_source
        - dynamic
        properties:
          question:
            type: string
          definition:
            type: string
          authority_source:
            type: string
            const: release_provenance_and_admission
          dynamic:
            type: boolean
            const: false
      runtime_identity:
        type: object
        required:
        - question
        - definition
        - authority_source
        - dynamic
        properties:
          question:
            type: string
          definition:
            type: string
          authority_source:
            type: string
            const: runtime_identity_contract
          dynamic:
            type: boolean
            const: true
      constellation_identity:
        type: object
        required:
        - question
        - definition
        - authority_source
        - dynamic
        properties:
          question:
            type: string
          definition:
            type: string
          authority_source:
            type: string
            const: constellation_admission_authority
          dynamic:
            type: boolean
            const: true
      actor_identity:
        type: object
        required:
        - question
        - definition
        - authority_source
        - dynamic
        properties:
          question:
            type: string
          definition:
            type: string
          authority_source:
            type: string
            const: actor_registry_and_identity_resolution_contract
          dynamic:
            type: boolean
            const: true
      surface_identity:
        type: object
        required:
        - question
        - definition
        - authority_source
        - dynamic
        properties:
          question:
            type: string
          definition:
            type: string
          authority_source:
            type: string
            const: surface_registry_and_runtime_evidence
          dynamic:
            type: boolean
            const: true
  non_identity_dimensions:
    type: object
    required:
    - adapter_identity
    - provider_identity
    - governance_profile
    properties:
      adapter_identity:
        type: object
        required:
        - definition
        properties:
          definition:
            type: string
      provider_identity:
        type: object
        required:
        - definition
        properties:
          definition:
            type: string
      governance_profile:
        type: object
        required:
        - definition
        properties:
          definition:
            type: string
  identity_binding:
    type: object
    required:
    - definition
    - allowed_fields
    - rules
    properties:
      definition:
        type: string
      allowed_fields:
        type: string_list
        min_items: 12
      rules:
        type: string_list
        min_items: 3
  identity_resolution:
    type: object
    required:
    - definition
    - inputs
    - result_domain
    - rules
    properties:
      definition:
        type: string
      inputs:
        type: string_list
        min_items: 4
      result_domain:
        type: string_list
        min_items: 4
      rules:
        type: string_list
        min_items: 5
  identity_assertion:
    type: object
    required:
    - definition
    - schema_ref
    - required
    - rules
    properties:
      definition:
        type: string
      schema_ref:
        type: string
        const: l9.schema/identity-assertion@1
      required:
        type: string_list
        min_items: 8
      rules:
        type: string_list
        min_items: 4
  consumer_rules:
    type: object
    required:
    - memory
    - bootstrap
    - governance
    - receipts
    properties:
      memory:
        type: string_list
        min_items: 3
      bootstrap:
        type: string_list
        min_items: 2
      governance:
        type: string_list
        min_items: 2
      receipts:
        type: string_list
        min_items: 2
  identity_authority:
    type: object
    required:
    - global_semantics_owner
    - product_identity_owner
    - actor_identity_source
    - runtime_and_surface_resolution_owner
    - governance_profile_owner
    - rules
    properties:
      global_semantics_owner:
        type: string
        const: Quantum-L9/.github
      product_identity_owner:
        type: string
        const: product_semantic_owner
      actor_identity_source:
        type: string
        const: admitted_actor_registry_or_authorized_identity_owner
      runtime_and_surface_resolution_owner:
        type: string
        const: applicable_identity_resolution_contract
      governance_profile_owner:
        type: string
        const: applicable_governance_owner
      rules:
        type: string_list
        min_items: 4
  artifact_id:
    type: string
  canonical:
    type: boolean
    const: true
  authority:
    type: object
    required:
    - owner
    - scope
    - authority_class
    properties:
      owner:
        type: string
        const: Quantum-L9/.github
      scope:
        type: string
      authority_class:
        type: string
        const: canonical
  canonical_source:
    type: object
    required:
    - format
    - artifact
    properties:
      format:
        type: string
        const: yaml
      artifact:
        type: string
  governed_by:
    type: object
    required:
    - contracts
    properties:
      contracts:
        type: string_list
        min_items: 3
  purpose:
    type: string
  identity_dimension:
    type: string
  detailed_model:
    type: string
    const: identity_model.yaml
  does_not_own:
    type: string_list
    min_items: 9
  actor_kinds:
    type: object
    required:
    - agent
    - human
    properties:
      agent:
        type: string
      human:
        type: string
  actor_statuses:
    type: object
    required:
    - current
    - superseded
    - retired
    properties:
      current:
        type: string
      superseded:
        type: string
      retired:
        type: string
  actors:
    type: array
    min_items: 6
    items:
      type: object
      required:
      - id
      - kind
      - status
      - description
      properties:
        id:
          type: string
          enum:
          - cursor
          - claude-code
          - codex
          - gemini
          - manus
          - human
        kind:
          type: string
        status:
          type: string
          const: current
        description:
          type: string
  aliases:
    type: array
    min_items: 2
    items:
      type: object
      required:
      - alias
      - canonical
      - alias_kind
      properties:
        alias:
          type: string
        canonical:
          type: string
        alias_kind:
          type: string
        note:
          type: string
  alias_rules:
    type: object
    required:
    - alias_kinds
    - alias_never_targets_another_alias
    properties:
      alias_kinds:
        type: object
        properties:
          historical_actor_alias:
            type: string
          historical_surface_alias:
            type: string
      alias_resolves_to_exactly_one_canonical_actor:
        type: boolean
        const: true
      alias_never_targets_another_alias:
        type: boolean
        const: true
      alias_never_shadows_a_canonical_actor:
        type: boolean
        const: true
      alias_meaning_is_bounded_to_actor_identity:
        type: boolean
        const: true
      alias_does_not_authorize_new_consequential_authorship_after_downstream_migration:
        type: boolean
        const: true
      alias_resolves_to_exactly_one_canonical_surface:
        type: boolean
        const: true
      alias_never_shadows_a_canonical_surface:
        type: boolean
        const: true
      alias_meaning_is_bounded_to_surface_identity:
        type: boolean
        const: true
      surface_alias_never_implies_actor_alias:
        type: boolean
        const: true
  downstream_obligations:
    type: object
    required:
    - emit_assertion_matching
    - concrete_runtime_evidence_interpretation_remains_downstream
    properties:
      resolve_actor_from_runtime_evidence_under:
        type: string
        const: l9.contract/identity-resolution@1
      emit_assertion_matching:
        type: string
        const: l9.identity-assertion/v1
      validate_asserted_actor_against_this_registry:
        type: boolean
        const: true
      concrete_runtime_evidence_interpretation_remains_downstream:
        type: boolean
        const: true
      resolve_surface_from_runtime_evidence_under:
        type: string
        const: l9.contract/identity-resolution@1
      validate_asserted_surface_against_this_registry:
        type: boolean
        const: true
  surface_statuses:
    type: object
    required:
    - current
    - superseded
    - retired
    properties:
      current:
        type: string
      superseded:
        type: string
      retired:
        type: string
  surfaces:
    type: array
    min_items: 11
    items:
      type: object
      required:
      - id
      - status
      - description
      properties:
        id:
          type: string
          enum:
          - cursor-ide
          - claude-code-desktop
          - claude-code-cli
          - claude-code-ide
          - claude-code-web
          - claude-code-mobile
          - codex-cloud
          - codex-cli
          - gemini-cli
          - manus-cloud
          - operator-shell
        status:
          type: string
          const: current
        description:
          type: string
