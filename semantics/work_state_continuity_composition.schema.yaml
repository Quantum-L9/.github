type: object
required:
- invariants
- contracts
- packet_catalog
- receipt_catalog
- lifecycle
- semantic_dependency_model
properties:
  schema:
    const: l9.composed-projection.work-state-continuity/v1
  invariants:
    type: object
    required:
    - invariants
    properties:
      invariants:
        type: array
        min_items: 10
        items:
          type: object
          required:
          - id
          - statement
          - scope
          - owner
          properties:
            id:
              type: string
              enum:
              - L9-AUTH-001
              - L9-EVIDENCE-001
              - L9-ASSURANCE-001
              - L9-UNKNOWN-001
              - L9-DEGRADE-001
              - L9-PROV-001
              - L9-COORD-001
              - L9-COMPAT-001
              - L9-REVISION-001
              - L9-ADMISSION-001
            statement:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
  contracts:
    type: object
    required:
    - contracts
    properties:
      contracts:
        type: array
        min_items: 4
        items:
          type: object
          required:
          - id
          - purpose
          - scope
          - owner
          - source_invariants
          - applies_to
          - requires
          - guarantees
          - forbidden
          - outcomes
          properties:
            id:
              type: string
              enum:
              - l9.contract/evidence-and-receipt@1
              - l9.contract/unknown-and-degradation@1
              - l9.contract/provenance-and-coordinate@1
              - l9.contract/revision-and-supersession@1
            purpose:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
            source_invariants:
              type: string_list
            applies_to:
              type: string_list
            requires:
              type: string_list
            guarantees:
              type: string_list
            forbidden:
              type: string_list
            outcomes:
              type: object
              properties:
                attested:
                  type: string
                  const: claim_is_bound_and_independently_verifiable
                unverified:
                  type: string
                  const: required_evidence_or_binding_is_missing_stale_or_unverifiable
                invalid_binding:
                  type: string
                  const: claim_does_not_bind_the_subject_or_coordinates_it_asserts
                resolved:
                  type: string
                  const: required_semantics_are_known_or_validly_substituted_or_conflict_is_authoritatively_resolved
                unresolved:
                  type: string
                refused:
                  type: string
                  const: requested_substitution_lacks_compatibility_or_authority
                current:
                  type: string
                  const: declared_coordinates_match_or_compatibility_is_proven
                non_current:
                  type: string
                  const: a_material_governing_coordinate_changed_without_compatibility_proof
                preserved:
                  type: string
                  const: revision_semantics_are_unchanged
                successor_required:
                  type: string
                  const: material_semantic_change_requires_new_revision_identity
                violated:
                  type: string
                  const: admitted_history_was_rewritten_or_reused_for_changed_meaning
  packet_catalog:
    type: object
    required:
    - global_rules
    - packets
    properties:
      global_rules:
        type: object
        required:
        - packet_is_bounded_transferable_unit
        - packet_does_not_create_authority
        - transport_envelope_is_not_preferred_l9_vocabulary
        properties:
          packet_is_bounded_transferable_unit:
            type: boolean
            const: true
          packet_does_not_create_authority:
            type: boolean
            const: true
          transport_envelope_is_not_preferred_l9_vocabulary:
            type: boolean
            const: true
      packets:
        type: object
        required:
        - state_change
        properties:
          state_change:
            type: object
            required:
            - canonical_name
            - purpose
            - required_semantics
            properties:
              canonical_name:
                type: string
                const: StateChangePacket
              purpose:
                type: string
              required_semantics:
                type: string_list
  receipt_catalog:
    type: object
    required:
    - global_rules
    - receipt_kernel
    properties:
      global_rules:
        type: object
        required:
        - receipt_is_evidence
        - receipt_does_not_grant_semantic_authority
        - receipt_does_not_grant_execution_authority
        - receipt_claim_scope_must_be_explicit
        - exact_subject_binding_is_required
        - materially_governing_coordinates_must_be_bound
        - declared_observation_or_outcome_is_required
        - verification_must_not_depend_only_on_the_recorded_verdict
        - receipt_digest_is_required
        - receipt_content_is_immutable_by_digest
        - material_subject_change_makes_prior_receipt_non_current_unless_compatibility_preserves_it
        - result_semantics_remain_owned_by_the_applicable_contract_or_taxonomy
        - receipt_family_registration_does_not_transfer_domain_semantic_ownership
        - receipt_presence_does_not_imply_capability_admission_availability_authorization_or_invocability
        - receipt_lifecycle_is_defined_separately
        properties:
          receipt_is_evidence:
            type: boolean
            const: true
          receipt_does_not_grant_semantic_authority:
            type: boolean
            const: true
          receipt_does_not_grant_execution_authority:
            type: boolean
            const: true
          receipt_claim_scope_must_be_explicit:
            type: boolean
            const: true
          exact_subject_binding_is_required:
            type: boolean
            const: true
          materially_governing_coordinates_must_be_bound:
            type: boolean
            const: true
          declared_observation_or_outcome_is_required:
            type: boolean
            const: true
          verification_must_not_depend_only_on_the_recorded_verdict:
            type: boolean
            const: true
          receipt_digest_is_required:
            type: boolean
            const: true
          receipt_content_is_immutable_by_digest:
            type: boolean
            const: true
          material_subject_change_makes_prior_receipt_non_current_unless_compatibility_preserves_it:
            type: boolean
            const: true
          result_semantics_remain_owned_by_the_applicable_contract_or_taxonomy:
            type: boolean
            const: true
          receipt_family_registration_does_not_transfer_domain_semantic_ownership:
            type: boolean
            const: true
          receipt_presence_does_not_imply_capability_admission_availability_authorization_or_invocability:
            type: boolean
            const: true
          receipt_lifecycle_is_defined_separately:
            type: boolean
            const: true
      receipt_kernel:
        type: object
        required:
        - required_semantics
        - field_semantics
        - authority
        - currentness
        - forbidden
        properties:
          required_semantics:
            type: string_list
          field_semantics:
            type: object
            required:
            - receipt_type
            - receipt_identity
            - exact_subject_ref
            - claim
            - governing_coordinates
            - observation_or_outcome
            - verification_basis
            - producer_identity
            - receipt_digest
            properties:
              receipt_type:
                type: string
              receipt_identity:
                type: string
              exact_subject_ref:
                type: string
              claim:
                type: string
              governing_coordinates:
                type: string
              observation_or_outcome:
                type: string
              verification_basis:
                type: string
              producer_identity:
                type: string
              receipt_digest:
                type: string
          authority:
            type: object
            required:
            - class
            - grants_semantic_authority
            - grants_execution_authority
            - may_replace_admission_decision
            properties:
              class:
                type: string
                const: evidence
              grants_semantic_authority:
                type: boolean
                const: false
              grants_execution_authority:
                type: boolean
                const: false
              may_replace_admission_decision:
                type: boolean
                const: false
          currentness:
            type: object
            required:
            - rule
            - currentness_is_authority
            properties:
              rule:
                type: string
              currentness_is_authority:
                type: boolean
                const: false
          forbidden:
            type: string_list
  lifecycle:
    type: object
    required:
    - global_rules
    - state_semantics
    - lifecycle_relations
    properties:
      global_rules:
        type: object
        required:
        - lifecycles_are_typed_not_universal
        - lifecycle_state_does_not_create_authority
        - transition_authority_must_be_explicit_when_transition_requires_authority
        - admission_binds_exact_subject_revision_or_digest
        - admitted_revision_content_is_immutable
        - material_semantic_change_creates_successor_or_supersession
        - prior_revisions_remain_addressable
        - unknown_or_unresolved_state_remains_explicit
        - derived_currentness_is_not_authority
        - capability_state_dimensions_are_not_lifecycle_states
        - lifecycle_transition_does_not_imply_capability_authorization
        - receipt_emission_does_not_imply_subject_admission_or_authorization
        - published_is_stronger_than_file_presence
        properties:
          lifecycles_are_typed_not_universal:
            type: boolean
            const: true
          lifecycle_state_does_not_create_authority:
            type: boolean
            const: true
          transition_authority_must_be_explicit_when_transition_requires_authority:
            type: boolean
            const: true
          admission_binds_exact_subject_revision_or_digest:
            type: boolean
            const: true
          admitted_revision_content_is_immutable:
            type: boolean
            const: true
          material_semantic_change_creates_successor_or_supersession:
            type: boolean
            const: true
          prior_revisions_remain_addressable:
            type: boolean
            const: true
          unknown_or_unresolved_state_remains_explicit:
            type: boolean
            const: true
          derived_currentness_is_not_authority:
            type: boolean
            const: true
          capability_state_dimensions_are_not_lifecycle_states:
            type: boolean
            const: true
          lifecycle_transition_does_not_imply_capability_authorization:
            type: boolean
            const: true
          receipt_emission_does_not_imply_subject_admission_or_authorization:
            type: boolean
            const: true
          published_is_stronger_than_file_presence:
            type: boolean
            const: true
      state_semantics:
        type: object
        required:
        - candidate
        - admission_evaluated
        - awaiting_authority
        - admitted
        - published
        - resolvable
        - executed
        - receipted
        - current
        - non_current
        - superseded
        - retired
        - rejected
        - unresolved
        properties:
          candidate:
            type: string
            const: proposed_subject_not_yet_admitted
          admission_evaluated:
            type: string
            const: mechanical_or_contractual_admission_evaluation_completed
          awaiting_authority:
            type: string
            const: evaluation_complete_but_required_authority_decision_not_yet_bound
          admitted:
            type: string
            const: exact_subject_accepted_by_applicable_admission_authority
          published:
            type: string
            const: admitted_subject_satisfies_its_semantic_owner_defined_canonical_publication_contract
          resolvable:
            type: string
            const: consumers_can_resolve_exact_identity_and_digest
          executed:
            type: string
          receipted:
            type: string
            const: execution_or_evaluation_has_bound_evidence_receipt
          current:
            type: string
            const: declared_material_coordinates_still_match_or_compatibility_preserves_applicability
          non_current:
            type: string
            const: one_or_more_material_coordinates_changed_without_compatibility_preservation
          superseded:
            type: string
            const: newer_authoritative_revision_or_version_replaces_current_use_without_rewriting_history
          retired:
            type: string
            const: authoritative_owner_has_ended_future_use_while_preserving_history
          rejected:
            type: string
            const: applicable_authority_or_mechanical_gate_refused_admission_or_progression
          unresolved:
            type: string
      lifecycle_relations:
        type: object
        required:
        - successor_of
        - supersedes
        - current_for
        properties:
          successor_of:
            type: object
            required:
            - semantics
            properties:
              semantics:
                type: string
                const: new_authoritative_revision_or_version_preserves_history_while_replacing_future_current_use
          supersedes:
            type: object
            required:
            - semantics
            properties:
              semantics:
                type: string
                const: newer_authoritative_subject_displaces_prior_subject_for_current_use_without_rewriting_prior_meaning
          current_for:
            type: object
            required:
            - semantics
            properties:
              semantics:
                type: string
                const: subject_remains_applicable_to_exact_declared_material_coordinates
  semantic_dependency_model:
    type: object
    required:
    - invalidation_rules
    properties:
      invalidation_rules:
        type: object
        required:
        - source_digest_change
        - profile_digest_change
        - upstream_revision_change
        - historical_artifacts_are_immutable
        - repair_default
        - upstream_conflict
        - affected_expression
        - silent_consumption_of_stale_input_forbidden
        properties:
          source_digest_change:
            type: string
            const: mark_transitive_dependents_stale
          profile_digest_change:
            type: string
            const: mark_profile_dependents_stale
          upstream_revision_change:
            type: string
            const: evaluate_dependency_impact
          historical_artifacts_are_immutable:
            type: boolean
            const: true
          repair_default:
            type: string
            const: repair_current_stage_when_upstream_assumptions_remain_valid
          upstream_conflict:
            type: string
            const: create_new_upstream_revision_then_invalidate_transitive_dependents
          affected_expression:
            type: string
          silent_consumption_of_stale_input_forbidden:
            type: boolean
            const: true
