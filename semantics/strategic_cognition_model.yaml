schema: l9.strategic-cognition-model/v1
artifact_id: l9.strategic-cognition-model/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_strategic_cognition_semantics
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: strategic_cognition_model.yaml
governed_by:
  invariants:
  - L9-STRATEGY-001
  - L9-AUTH-001
  - L9-AUTH-002
  - L9-OWNER-001
  - L9-PROMOTION-001
  - L9-PROJECTION-001
  - L9-DERIVED-001
  - L9-PROV-001
  - L9-COORD-001
  contracts:
  - l9.contract/authority-boundary@1
  - l9.contract/semantic-ownership@1
  - l9.contract/projection@1
  - l9.contract/derived-artifact@1
purpose: Define the global meaning of Strategy, Strategic Cognition, Strategic Intent, the Current Meta View it reasons
  over, and the authority boundary between the Plan Keeper, which owns the Strategic Plan, and the Strategic Plan
  Metacognitive Reasoner, which owns analysis of the reasoning that produces the Strategic Plan. This ledger defines
  semantics only; it does not define Strategic Plan content or structure, runtime cognition, prompts, model or provider
  selection, actor bindings, or memory behavior.
plane:
  conceptual_plane: reasoning_plane
  semantic_compiler_owner: false
  runtime_owned_here: false
  compiler_boundary_ref: vocabulary.yaml#stage_rules.reasoning_plane_rule
global_rules:
  strategic_cognition_does_not_own_underlying_truth_sources: true
  strategic_cognition_does_not_own_runtime_execution: true
  reasoning_capability_does_not_confer_strategic_authority: true
  projection_consumption_does_not_transfer_truth_source_ownership: true
  strategic_roles_are_semantic_roles_not_actor_identities: true
  strategic_label_does_not_create_authority_or_ownership: true
  metacognition_is_advisory_to_strategic_authority: true
  semantic_compiler_remains_independent_of_reasoning_plane: true
  planning_episode_is_non_authoritative_reasoning_record: true
  plan_revision_candidate_is_not_strategy_until_admitted_under_strategic_authority: true
  metacognitive_analysis_is_advisory_and_cannot_mutate_strategy: true
concepts:
  strategy:
    definition: An integrated theory of intended change that identifies desired future conditions, causal beliefs about
      how relevant conditions and actions may influence those conditions, and chosen courses of action under uncertainty.
  strategic_cognition:
    definition: The reasoning concern through which the Plan Keeper compares current authoritative understanding and
      Strategic Intent with the current Strategy to determine whether the Strategic Plan should remain unchanged or be revised.
    consumes:
    - current_meta_view
    - strategic_intent
    - strategic_plan
    maintains:
    - strategic_plan
    does_not_own:
    - underlying_truth_sources
    - runtime_execution
    - architecture_semantics
    - evidence_semantics
    - memory_semantics
    - capability_semantics
    - authority_semantics
  strategic_plan:
    definition: The authoritative maintained record of the current Strategy within a scope for which the Plan Keeper has
      been granted Strategic Authority.
    owner_role: plan_keeper
    content_defined_here: false
    structure_defined_here: false
  current_meta_view:
    definition: The bounded current view used when reasoning about Strategy, composed from relevant authoritative projections.
    authority_class: derived
    authoritative: false
    canonical_source: false
    artifact_class_ref: composed_projection
    component_artifact_class_ref: projection_artifact
    schema_ref: l9.schema/composed-projection@1
    properties:
      derived: true
      disposable: true
      provenance_preserving: true
      invalidated_when_source_truth_changes: true
      may_reinterpret_source_truth: false
      may_create_authority: false
  strategic_intent:
    definition: The purpose supplied by an applicable authority that constrains what the current Strategy is intended to advance.
    owned_here: false
    owner: applicable_strategic_authority
    authority_ref: authority_model.yaml#strategic_authority
reasoning_artifacts:
  strategic_planning_episode:
    definition: An immutable, non-authoritative record of one bounded Plan Keeper reasoning episode over exact planning
      inputs, observations, assumptions, candidate paths, evaluations, material Unknowns, and its recommendation.
    producer_role: plan_keeper
    authority_class: derived
    schema_ref: l9.schema/strategic-planning-episode@1
    authority_effect: none
    may_not:
    - become_strategic_plan_content_by_recording
    - grant_strategic_authority
    - mutate_strategic_plan
  strategic_plan_revision_candidate:
    definition: A digest-bound candidate binding an exact predecessor Strategic Plan revision, one exact proposed
      Strategic Plan Graph, and the planning episode that produced it. Candidate status alone does not revise Strategy.
    producer_role: plan_keeper
    authority_class: candidate
    schema_ref: l9.schema/strategic-plan-revision-candidate@1
    authority_effect: none_until_admitted
    may_not:
    - self_admit
    - mutate_strategic_plan_without_applicable_strategic_authority
    - float_across_changed_candidate_or_proposed_graph_digests
  strategic_plan_metacognitive_analysis:
    definition: An immutable advisory analysis of exact Plan Keeper reasoning episodes, Plan revisions, and outcome
      evidence that identifies findings, recurring reasoning patterns, and planning cognition lessons without deciding
      or modifying Strategy.
    producer_role: strategic_plan_metacognitive_reasoner
    owner_role: strategic_plan_metacognitive_reasoner
    authority_class: derived
    schema_ref: l9.schema/strategic-plan-metacognitive-analysis@1
    output_authority: advisory
    authority_effect: none
    may_not:
    - modify_strategic_plan
    - become_strategic_authority
    - convert_lesson_into_strategic_decision
roles:
  plan_keeper:
    role_kind: semantic_role
    actor_identity_binding: none
    definition: The reasoning role responsible for maintaining the Strategic Plan within granted Strategic Authority.
    owns:
    - strategic_plan
    reasons_over:
    - current_meta_view
    - strategic_intent
    - strategic_plan
    may:
    - revise_strategic_plan_within_granted_strategic_authority
    - emit_strategic_planning_episode
    - emit_strategic_plan_revision_candidate
    - consume_planning_cognition_lessons
    authority_source: strategic_authority
    does_not_own:
    - underlying_truth_sources
    - capability_semantics
    - evidence
    - memory
    - architecture
    - execution
    - environment_truth
    may_not:
    - acquire_truth_source_ownership_by_consuming_projections
    - derive_authority_from_reasoning_capability
    - become_execution_or_implementation_authority_by_implication
    - treat_planning_episode_as_strategic_plan_content
    - treat_revision_candidate_as_authorized_plan_revision_without_admission
    - revise_strategic_plan_beyond_granted_strategic_authority
  strategic_plan_metacognitive_reasoner:
    role_kind: semantic_role
    actor_identity_binding: none
    definition: The reasoning role responsible for analyzing the reasoning processes that produce and revise the
      Strategic Plan.
    subject: reasoning_processes_that_produce_and_revise_the_strategic_plan
    universal_metacognitive_authority: false
    owns:
    - strategic_plan_reasoning_analysis
    may:
    - analyze_plan_keeper_reasoning_episodes
    - compare_planning_reasoning_expectations_outcomes_and_revisions
    - identify_recurring_planning_reasoning_strengths_and_failure_patterns
    - emit_strategic_plan_metacognitive_analysis
    - emit_planning_cognition_lessons_for_plan_keeper
    may_not:
    - modify_strategic_plan
    - supersede_plan_keeper
    - become_strategic_authority
    - grant_itself_strategic_authority
    - treat_metacognitive_analysis_as_strategic_decision
    - convert_metacognitive_conclusions_into_strategic_decisions
    strategic_authority: false
    output_authority: advisory
    output_consumer: plan_keeper
authority_separation:
  invariant_ref: L9-STRATEGY-001
  resolution_ref: authority_model.yaml#strategic_cognition_authority
  strategic_plan_owner: plan_keeper
  strategic_plan_reasoning_analysis_owner: strategic_plan_metacognitive_reasoner
  teaching_relation:
    from: strategic_plan_metacognitive_reasoner
    to: plan_keeper
    carries: planning_cognition_lessons
    authority_effect: none
