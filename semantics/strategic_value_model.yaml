assessment_applicability:
  claim_gate: applies_only_to_assessments_asserting_objective_relative_quantitative_strategic_value
  does_not_govern:
  - unrelated_numerical_reasoning_methods
  - unrelated_governed_decision_evaluations
  - any_evaluation_not_asserting_applicable_strategic_value
  method_applicability: requirements_apply_only_when_the_selected_method_and_material_claim_trigger_them
  non_claim: a generic utility optimization or ranking is not automatically a Strategic Value claim
  unsupported_claim: conditional_or_unknown_not_imposed_method
retained_former_candidate_semantics:
  L9-SV-003:
    source_candidate_id: L9-SV-003
    meaning: Predicted Strategic Value and observed realized outcomes are separate evidence classes. Observed results can calibrate later
      predictions but never retroactively establish an earlier forecast as fact or authorization.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: forecast_and_realization
    contract_obligation: separate_predicted_and_realized_outcomes
    when: applies_to_forecast_and_realized_comparison
  L9-SV-004:
    source_candidate_id: L9-SV-004
    meaning: Repeated propagation, feedback and reuse create incremental value only when they produce a new attributable future-state delta;
      unchanged echoes, circular recounting and duplicate observations create no new utility. A legitimate recurring effect must be represented
      as a distinct attributable period state change.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: causal_accounting
    contract_obligation: no_novelty_echo_or_circular_value_inflation
    when: when_recurring_or_feedback_effects_are_claimed
  L9-SV-005:
    source_candidate_id: L9-SV-005
    meaning: Bidirectional value propagation must distinguish forward and return effects as time-indexed state transitions and retain positive,
      zero or negative returns. A return path is not inherently beneficial.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: causal_accounting
    contract_obligation: negative_propagation_and_coordinating_drag_where_material
    when: when_bidirectional_causal_paths_are_material
  L9-SV-006:
    source_candidate_id: L9-SV-006
    meaning: A branching, reconvergent or mesh causal network must preserve contributor identity, shared effects, overlap, uncertainty, bounded
      stopping conditions, and material negative drag; reconvergence and loop traversal cannot duplicate value. Unknown probability mass
      or a material unbounded tail cannot be treated as zero.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: causal_accounting
    contract_obligation: bounded_tail_and_early_stop_coverage_or_explicit_unresolved_consequences
    when: when_mesh_or_feedback_paths_are_material
  L9-SV-007:
    source_candidate_id: L9-SV-007
    meaning: Material future work eliminated by a proposed intervention is considered as an attributable counterfactual improvement, never
      an unsupported multiplier or a second booking of the same cost saving.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: valuation.explanatory_dimensions
    contract_obligation: effect_identity_provenance_attribution_and_overlap_handling
    when: when_future_work_elimination_is_material
  L9-SV-008:
    source_candidate_id: L9-SV-008
    meaning: When material, evaluation considers capability unlock, dependency removal, reusable assets and future option expansion as descriptions
      of state changes, not independent additive credits for shared consequences.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: valuation.explanatory_dimensions
    contract_obligation: effect_identity_provenance_attribution_and_overlap_handling
    when: when_capabilities_dependency_or_option_unlocks_are_material
  L9-SV-009:
    source_candidate_id: L9-SV-009
    meaning: When material, evaluation considers future decision quality, learning, information and preserved or foreclosed options; entropy
      reduction alone does not prove decision value, and overlapping information and option effects cannot be booked twice.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: valuation.explanatory_dimensions
    contract_obligation: uncertainty_sensitivity_or_conditional_frontier_when_preference_can_flip
    when: when_learning_information_or_option_value_is_claimed
  L9-SV-010:
    source_candidate_id: L9-SV-010
    meaning: A value comparison considers feasible ACT, LEARN, COMPUTE, WAIT and STOP alternatives when relevant; all remain governed by
      authorization, mandatory constraints, and resource ceilings independent of utility.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: comparisons
    contract_obligation: relevant_alternative_and_counterfactual_comparison
    when: when_meta_action_alternatives_are_material
  L9-SV-011:
    source_candidate_id: L9-SV-011
    meaning: Forecast downstream actors, responses and relationship effects remain explicitly uncertain and causally conditional under a
      bounded, revision-bound method appropriate to the material claim. Bounded scenario analysis, robust optimization or an owner-admitted
      alternative can be sufficient; a Q/V belief-state optimizer is not universally required. A single observed action or actor assertion
      cannot silently become a guaranteed response or durable actor trait. Unsupported claims remain conditional or Unknown.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: strategic_interaction_lookahead
    contract_obligation: method_appropriate_handling_of_material_strategic_actor_responses_or_conditional_unknown
    when: when_actor_responses_are_material
  L9-SV-012:
    source_candidate_id: L9-SV-012
    meaning: The assessment result preserves the shape of the decision question, including conditional ranking, frontier, allocation vector,
      and unresolved result; changing a material premise invalidates affected evaluation claims without silently changing unrelated claims.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: comparisons
    contract_obligation: assessment_preserves_question_appropriate_result_shape
    when: when_the_question_requires_non_scalar_result
  L9-SV-013:
    source_candidate_id: L9-SV-013
    meaning: Optional further learning or computing is evaluated against its expected marginal decision improvement, non-overlapping systemic
      effects, and costs; available compute or information gain alone does not establish positive marginal value; a budget or approximation
      stop does not prove unknown future branches have zero value.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: strategic_interaction_lookahead
    contract_obligation: when_learning_or_computing_is_an_alternative_compare_expected_marginal_decision_improvement_net_of_costs
    when: when_further_learning_or_computation_is_an_alternative
  L9-SV-014:
    source_candidate_id: L9-SV-014
    meaning: When responsive other actors are material, valuation considers conditional counteractions, incentives, commitments and relationship
      effects without converting uncertain strategy predictions into facts or execution authority.
    governing_layer: strategic_value_model_and_assessment_contract_not_independent_global_invariant
    model_section: strategic_interaction_lookahead
    contract_obligation: method_appropriate_handling_of_material_strategic_actor_responses_or_conditional_unknown
    when: when_responsive_strategic_actors_are_material
relocated_additional_candidate_semantics:
  L9-SV-015:
    source_candidate_id: L9-SV-015
    meaning: For a Strategic Value claim, a counterfactual comparison must identify the same decision-relevant initial conditions, utility
      measure, exogenous context and time basis across intervention and baseline worlds, or explicitly quantify their divergence. A convenient
      scenario pairing or historical correlation is not evidence of an identifiable causal intervention effect.
    disposition: MERGE
    governing_invariants:
    - L9-SV-001
    model_section: evaluation_integrity.counterfactual_identification
    contract_obligation: counterfactual_worlds_share_defensible_initial_conditions_time_basis_and_identification_assumptions
    when: causal_intervention_effect_is_claimed
    authority_status: not_admitted_as_independent_invariant
  L9-SV-016:
    source_candidate_id: L9-SV-016
    meaning: For a Strategic Value claim, the assessment must declare the focal beneficiary or authorized social-welfare aggregation before
      combining outcomes across actors. Benefits to counterparties, externalities, transfers and costs cannot be credited to the focal objective
      twice or silently converted between actors with incompatible utilities.
    disposition: CONTRACT
    governing_invariants:
    - L9-SV-001
    - L9-SV-002
    - L9-AUTH-001
    model_section: evaluation_integrity.beneficiary_scope
    contract_obligation: beneficiary_scope_and_welfare_aggregation_when_cross_actor_effects_material
    when: material_cross_actor_valuation
    authority_status: not_admitted_as_independent_invariant
  L9-SV-017:
    source_candidate_id: L9-SV-017
    meaning: When a Strategic Value claim evaluates a sequential decision policy, the policy may condition each action only on observations
      and information available at the time of that action. A lookahead ranking must not exploit hindsight, future responses or post-action
      evidence as if they were known at decision time; posterior updates must preserve observation provenance.
    disposition: CONTRACT
    governing_invariants:
    - L9-SV-001
    - L9-PROV-001
    model_section: evaluation_integrity.nonanticipativity
    contract_obligation: nonanticipative_conditional_policies_when_sequential_actions_are_evaluated
    when: sequential_policy_value_claimed
    authority_status: not_admitted_as_independent_invariant
  L9-SV-018:
    source_candidate_id: L9-SV-018
    meaning: For a Strategic Value claim about a portfolio or joint intervention, its value is evaluated against the joint feasible counterfactual
      and shared resource constraints. Standalone action values may be summed only with evidence of additive independence; shared dependencies,
      synergies, substitution, resource collision and cannibalization must be represented or remain unresolved.
    disposition: CONTRACT
    governing_invariants:
    - L9-SV-002
    - L9-HARD-001
    model_section: evaluation_integrity.joint_portfolio_valuation
    contract_obligation: joint_portfolio_counterfactual_and_resource_interactions_for_nonadditive_actions
    when: joint_or_portfolio_value_claimed
    authority_status: not_admitted_as_independent_invariant
  L9-SV-019:
    source_candidate_id: L9-SV-019
    meaning: When uncertainty can change preference in a Strategic Value comparison, the evaluation must expose a bounded sensitivity or
      uncertainty result and conditional decision boundary, not an unjustified precise winner. A robustness claim requires declared uncertainty
      sets, bounds or probability models and an applicable comparison method.
    disposition: REUSE
    governing_invariants:
    - L9-UNKNOWN-001
