schema: l9.strategic-value-model/v1
artifact_id: l9.strategic.value@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_strategic_value_semantics
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: strategic_value_model.yaml
governed_by:
  invariants:
  - L9-SV-001
  - L9-SV-002
  - L9-AUTH-001
  - L9-AUTH-002
  - L9-HARD-001
  - L9-UNKNOWN-001
  - L9-STRATEGY-001
  - L9-PROJECTION-001
  - L9-PROV-001
  - L9-EVIDENCE-001
  - L9-ASSURANCE-001
  - L9-COORD-001
  contracts:
  - l9.contract/authority-boundary@1
  - l9.contract/projection@1
  - l9.contract/strategic-value-assessment@1
purpose: Govern the meaning and boundaries of objective-relative quantitative Strategic Value comparisons without creating a reasoning sibling,
  a Plan-owned semantic primitive, a universal utility weight or an autonomous strategy authority. Numerical Reasoning owns numerical evaluation
  methods and the declared DecisionModel. A consumer owns its business objective, baseline, candidates, policy and the authorization of any
  consequential action.
identity:
  semantic_ref: l9.strategic.value@1
  canonical_term_ref: vocabulary.yaml#terms.strategic_value
  related_term_ref: vocabulary.yaml#terms.systemic_future_value
  assessment_contract_ref: l9.contract/strategic-value-assessment@1
  numerical_owner: Numerical Reasoning
  strategic_plan_owner_ref: strategic_cognition_model.yaml#concepts.strategic_plan
valuation:
  conceptual_decomposition: StrategicValue(a) = ImmediateExpectedValue(a) + SystemicFutureValue(a) - DirectCost(a) - ExpectedRiskLoss(a)
    - OpportunityCost(a)
  semantic_class: numerical_valuation_composition
  requires_declared:
  - objective_and_comparable_utility_unit
  - feasible_counterfactual_baseline
  - action_or_intervention_identity
  - evaluation_horizon
  - evidence_model_revision_and_uncertainty
  - applicable_hard_constraints_and_admissibility
  - material_alternatives_and_context
  - accounting_partition_complete_and_reconciled_for_full_claim
  systemic_future_value_definition: Expected counterfactual improvement in future reachable utility caused by an intervention relative to
    a feasible baseline, excluding immediate and already-booked changes. Positive and negative effects are both permitted.
  explanatory_dimensions:
  - future_work_elimination
  - capability_unlock
  - recurring_cost_reduction
  - dependency_unlock
  - reusable_asset_value
  - future_decision_improvement
  - future_information_improvement
  - future_action_space_expansion
  - relationship_and_reputation_effect
  rule: Explanatory dimensions are not independent additive bonuses.
  accounting_partition_contract:
    status: mandatory_precondition_for_complete_five_term_value_claim
    scope: every_material_modeled_consequence_within_the_declared_objective_and_horizon
    representation_modes:
    - gross_components_with_separate_cost_and_risk_bookings
    - net_utility_flows_with_auditable_embedded_component_reconciliation
    required_component_buckets:
    - ImmediateExpectedValue
    - SystemicFutureValue
    - DirectCost
    - ExpectedRiskLoss
    - OpportunityCost
    normative_partition:
      mutually_exclusive_booking: true
      exhaustive_material_consequence_coverage: true
      each_effect_requires_stable_causal_and_period_identity: true
      each_effect_requires_one_accounting_home_after_reconciliation: true
      shared_or_overlapping_effects_require_explicit_attribution_and_exclusion: true
      common_utility_units_time_basis_and_discount_treatment_required: true
      losses_and_costs_already_reflected_in_utility_flows_cannot_be_subtracted_again: true
      unknown_effect_booking_never_defaults_to_zero: true
    component_coverage_ledger:
      required_per_material_effect:
      - effect_identity_and_causal_attribution
      - scenario_and_period_scope_where_applicable
      - utility_unit_and_discount_basis
      - accounting_bucket_or_embedded_component_reference
      - included_or_excluded_status_with_evidence_ref
      - overlap_resolution_and_source_model_revision
      embedded_cost_handling: When a modeled future utility flow is already net of a DirectCost, ExpectedRiskLoss, OpportunityCost or other
        material consequence, that embedded contribution must be identified in the coverage ledger and excluded from separate subtraction.
        A separately reported bucket can contain only residual effects not already booked in a net flow.
      zero_bucket_semantics: A zero separately subtracted bucket is permissible only when the ledger supports no applicable residual effect
        or shows all applicable effects were booked elsewhere; zero may not substitute for missing evidence.
      incomplete_coverage_result: unknown_or_conditional_not_complete_value
    sign_and_expectation_discipline:
    - signed_incremental_benefits_and_harms_may_be_in_IEV_or_SFV
    - positive_magnitude_cost_buckets_are_subtracted_only_when_separately_booked
    - expected_losses_already_weighted_in_scenarios_cannot_be_reweighted_or_resubtracted
    - recurring_increment_is_distinct_from_recounted_stock_or_unchanged_echo
    example_equivalence:
      gross: IEV=0, SFV=100, DC=20, ERL=0, OC=0 => SV=80
      reconciled_net: IEV=0, SFV=80, DC=0 (20 embedded in SFV), ERL=0, OC=0 => SV=80
      invalid: SFV=80 net of a 20 DC, then subtracting that same DC again => 60 (double count; forbidden)
    negative_witnesses:
      embedded_DC_subtracted_again: forbidden_double_booking
      embedded_expected_risk_loss_subtracted_again: forbidden_double_booking
      embedded_opportunity_cost_subtracted_again: forbidden_double_booking
      unclassified_material_consequence: unknown_or_conditional
      zero_subtraction_without_ledger_basis: unknown_or_conditional
      same_effect_in_mutually_exclusive_scenarios: compare_conditionally_not_add_together
      genuinely_distinct_recurring_period_effects: book_each_increment_once
counterfactual_mathematics:
  normative_meaning: Systemic Future Value compares objective-relative future utility against a feasible counterfactual baseline under a
    bounded, question-appropriate numerical method, excluding immediate and already-booked effects. One supported probabilistic formulation
    is the expected discounted difference of intervention and baseline future utility flows. This formulation is not a universal algorithm
    mandate; modeled futures are claims, not observations.
  bounded_expression: SFV(a) = E[sum_{tau=t+1}^{H} d(tau-t) * (U_flow(S_tau | do(a)) - U_flow(S_tau | do(baseline)))] after effect-identity
    and booking reconciliation.
  geometric_discount_special_case: d(k) = gamma**k, with declared gamma in [0,1]
  expectation_semantics:
  - declared_probability_uncertainty_or_robustness_model_appropriate_to_selected_method
  - scenario_probabilities_are_model_inputs_not_defaults
  - paired_scenario_differences_require_declared_counterfactual_coupling
  - differing_intervention_and_baseline_distributions_may_require_separate_expectations
  - incomplete_probability_mass_is_unknown_when_probabilistic_method_applies
  - approximation_pruning_or_tail_omission_requires_justified_bound_or_unresolved_result
  utility_accounting:
  - declared_utility_flow_or_stock_semantics_required
  - summing_cumulative_stock_levels_as_if_period_flows_forbidden
  - same_underlying_utility_delta_never_rebooked_as_immediate_future_risk_option_or_cost
  - net_future_flows_require_explicit_partition_reconciliation_to_all_separate_buckets
  - expected_risk_losses_embedded_in_scenario_utility_must_not_be_subtracted_again
  - opportunity_and_direct_costs_embedded_in_net_utility_must_not_be_subtracted_again
  - incomplete_or_conflicting_bookings_yield_unknown_or_conditional_assessment
  - future_episode_identity_distinguishes_real_recurring_increment_from_unchanged_echo
  - path_conditioning_and_counterfactual_feasibility_require_applicable_evidence_or_remain_unknown
  - negative_downstream_utility_drag_remains_negative
  numerical_owner: Numerical Reasoning
  consumer_behavior: A planner may verify arithmetic for declared scenarios but must not claim independent future-state prediction, scenario
    calibration, causal identification, attribution identification, or numerical method authority.
strategic_interaction_lookahead:
  applies_when: material_responsive_actors_or_actions_that_change_future_choices
  method_policy: supported_mathematical_formulation_not_universal_algorithm_requirement
  supported_method_families:
  - bounded_scenario_analysis
  - robust_optimization
  - bounded_QV_belief_state_lookahead
  - other_owner_admitted_question_appropriate_methods
  selection_requirements:
  - select_a_method_appropriate_to_the_decision_question_and_material_claim
  - preserve_formal_constraints_uncertainty_provenance_and_finite_resource_bounds
  - represent_material_actor_reactions_or_explain_conditional_unknowns
  - no_method_is_mandatory_when_another_owner_admitted_method_supports_the_claim
  - unsupported_material_claims_remain_conditional_or_unknown
  bounded_recurrence: 'Supported Q/V belief-state lookahead example, not a universal solver: Q(s_t,b_t,a_i) = E_{response,next_state}[ R(s_t,a_i,response)
    + gamma*V(s_{t+1},b_{t+1})]; V(s_t,b_t) = max over formally feasible actions Q(s_t,b_t,a); b_{t+1} is updated by an admitted probabilistic
    model.'
  qv_only_required_model_coordinates:
  - formal_feasibility_ref
  - versioned_actor_and_response_model_refs
  - belief_state_and_observation_model_refs
  - probability_or_strategy_model_and_utility_ref
  - bounded_time_horizon_and_maximum_belief_depth
  - branch_budget_and_resource_budget
  - convergence_terminal_and_approximation_policy
  qv_only_stopping_conditions:
  - formal_unsat_or_no_feasible_action
  - planning_horizon_exhausted
  - new_effect_novelty_exhausted_or_proven_convergence
  - explicit_approximation_with_bound
  - computation_budget_exhausted_with_unresolved_tail_when_material
  - optional_computation_expected_marginal_value_nonpositive
  ownership:
    formal_admissibility: Formal Reasoning
    belief_and_response_uncertainty: Probabilistic Reasoning
    objective_utility_and_lookahead_valuation: Numerical Reasoning
    available_actions_and_execution_authority: consumer_and_strategic_authority
  rule: Q/V recurrence and its belief-state, branching, and stopping coordinates apply only when that method is selected. They are neither
    required for bounded scenario analysis nor for an owner-admitted robust method. All methods remain evidence-bound, formally constrained
    and conservatively bounded; inability to establish a material claim means conditional or Unknown, not a fabricated optimal action. The
    model introduces neither a solver, algorithm provider, actor policy nor extra reasoning node. A static declared path distribution does
    not prove responsive-actor lookahead ran.
assessment_claim_levels:
  declared_aggregate: Arithmetic over already supplied component values; not evidence that SFV was derived from counterfactual paths.
  supplied_trajectory_calculation: Verified arithmetic over declared, complete, bounded probability-weighted future deltas, not independently
    established probability or causality.
  independently_verified_numerical_assessment: Requires applicable, independently reviewable model-validation evidence, owner-produced method/execution
    records and source verification appropriate to the claim in addition to arithmetic; consumer cannot self-attest.
  unknown_or_degraded: Required evidence, scenario mass, causal identity, model, terminal bound, hard feasibility or material interactive-response
    inputs unresolved.
evaluation_integrity:
  counterfactual_identification:
  - intervention_and_baseline_share_declared_initial_state_and_exogenous_context_or_adjustment
  - common_objective_utility_horizon_and_observation_timing_required
  - correlation_or_arbitrary_paired_paths_do_not_prove_causal_identification
  beneficiary_scope:
  - focal_beneficiary_and_welfare_aggregation_declared_before_cross_actor_valuation
  - externalities_and_transfers_exposed_without_double_crediting
  - incompatible_actor_utility_units_do_not_silently_sum
  nonanticipativity:
  - action_policy_conditioning_uses_only_information_available_at_decision_time
  - posterior_belief_update_preserves_observation_source_and_timestamp
  - hindsight_does_not_become_ex_ante_policy_value
  joint_portfolio_valuation:
  - feasible_joint_action_set_and_resource_constraints_declared
  - shared_causes_synergy_substitution_and_cannibalization_reconciled
  - individual_action_sv_is_not_additive_without_independence_evidence
  uncertainty_aware_selection:
  - material_preference_sensitive_uncertainty_preserved_as_range_or_conditional_frontier
  - sensitivity_and_decision_flip_conditions_evaluated_by_applicable_numerical_owner
  - precise_best_action_not_claimed_from_unbounded_or_unresolved_uncertainty
  independent_method_assurance:
  - versioned_numerical_method_and_model_identity
  - exact_input_and_assumption_lineage
  - executed_solver_or_evaluator_evidence_for_claims_of_executed_methods
  - applicable_independently_reviewable_model_validation_evidence_distinct_from_arithmetic_correctness
  - projection_receipt_not_a_numerical_reasoning_receipt
  - independent_assurance_required_for_independently_verified_claim
  - empirical_validation_may_use_calibration_backtesting_sensitivity_or_out_of_sample_evidence_when_applicable
  - mathematical_proof_of_general_real_world_forecast_adequacy_not_presumed
causal_accounting:
  stable_effect_identity_required: true
  shared_state_delta_booked_once: true
  explicit_attribution_and_overlap_required: true
  loops_unrolled_through_time: true
  unchanged_echo_incremental_value: zero
  topology_kinds:
  - ONE_WAY
  - BILATERAL
  - CLOSED_LOOP
  - MESH
  negative_drag_and_coordination_costs_preserved: true
  conditional_relevance: Material topology claims require evidence and bounded horizon.
forecast_and_realization:
  predicted_value_is: derived_model_forecast
  realized_value_is: separately_observed_evidence
  realization_never_retroactively_proves_ex_ante_forecast: true
comparisons:
  compatible_objective_and_units_required: true
  may_return:
  - conditional_rank
  - tied_frontier
  - portfolio_or_allocation_vector
  - decision_boundary
  - unresolved
  relevant_meta_action_kinds:
  - ACT
  - LEARN
  - COMPUTE
  - WAIT
  - STOP
  unknown_is_not_zero: true
  valuation_does_not_override_mandatory_constraints: true
  output_is_not_authorization: true
  output_is_not_strategic_plan_graph_content: true
  output_is_not_strategic_commitment: true
  stale_model_or_evidence_invalidates_affected_assessment: true
explicit_non_ownership:
- numerical_solver_implementation
- agent_orchestration
- strategic_authority
- strategic_plan_admission
- objective_or_domain_policy
- external_truth_or_evidence_sources
- value_projections_as_new_canonical_truth
- execution_authorization
