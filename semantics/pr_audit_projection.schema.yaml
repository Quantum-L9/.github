schema: l9.schema-definition/v1
canonical: true
authority:
  owner: Quantum-L9/.github
  authority_class: canonical
  scope: l9_global_pr_audit_projection_payload_schema
artifact_id: l9.schema/pr-audit-projection@1
canonical_source:
  format: yaml
  artifact: pr_audit_projection.schema.yaml
governed_by:
  projection_profile_ref: l9.projection/pr-audit@1
purpose: 'Define the payload of one source projection emitted under l9.projection/pr-audit@1. The profile selects
  admitted global records by exact id and whole canonical sections from thirteen registered ledgers, so a payload
  carries at most the sections its source declares. Each record collection requires the identity and citation fields
  its canonical source declares and pins the scope the profile may select. The payload is the exact declared selection
  of its source, which selection equivalence proves; this schema constrains shape and adds no meaning, obligation, or
  authority.

  '
type: object
properties:
  schema:
    const: l9.projection.pr-audit/v1
  terms:
    type: object
    fields:
      authority: {type: object, required: [semantic_class, definition]}
      law: {type: object, required: [semantic_class, definition]}
      canonical_source: {type: object, required: [semantic_class, definition]}
      semantic_owner: {type: object, required: [semantic_class, definition]}
      semantic_ownership: {type: object, required: [semantic_class, definition]}
      derived_artifact: {type: object, required: [semantic_class, definition]}
      projection: {type: object, required: [semantic_class, definition]}
      provenance: {type: object, required: [semantic_class, definition]}
      semantic_digest: {type: object, required: [semantic_class, definition]}
      receipt: {type: object, required: [semantic_class, definition]}
      validation: {type: object, required: [semantic_class, definition]}
      validation_receipt: {type: object, required: [semantic_class, definition]}
      mechanical_validation: {type: object, required: [semantic_class, definition]}
      conformance: {type: object, required: [semantic_class, definition]}
      constraint: {type: object, required: [semantic_class, definition]}
      hard_constraint: {type: object, required: [semantic_class, definition]}
      admission_decision: {type: object, required: [semantic_class, definition]}
      state_change: {type: object, required: [semantic_class, definition]}
      invalidation: {type: object, required: [semantic_class, definition]}
      impact_analysis: {type: object, required: [semantic_class, definition]}
      dependency_scoped_invalidation: {type: object, required: [semantic_class, definition]}
      surgical_revision: {type: object, required: [semantic_class, definition]}
      semantic_preservation: {type: object, required: [semantic_class, definition]}
      semantic_equivalence: {type: object, required: [semantic_class, definition]}
      unsat_core: {type: object, required: [semantic_class, definition]}
      bounded_autonomy: {type: object, required: [semantic_class, definition]}
      published: {type: object, required: [semantic_class, definition]}
  invariants:
    type: array
    min_items: 1
    items:
      type: object
      required:
      - id
      - statement
      - scope
      - owner
      properties:
        id: {type: string}
        statement: {type: string}
        scope: {const: global}
        owner: {const: Quantum-L9/.github}
  contracts:
    type: array
    min_items: 1
    items:
      type: object
      required:
      - id
      - purpose
      - scope
      - owner
      - source_invariants
      - requires
      - guarantees
      - forbidden
      - outcomes
      properties:
        id: {type: string}
        scope: {const: global}
        owner: {const: Quantum-L9/.github}
        source_invariants: {type: string_list, min_items: 1}
        requires: {type: string_list}
        guarantees: {type: string_list, min_items: 1}
        forbidden: {type: string_list, min_items: 1}
        outcomes: {type: object}
  authority_classes:
    type: object
    required:
    - canonical
    - derived
    - candidate
    - evidence
    properties:
      evidence:
        type: object
        required: [grants_authority]
        properties:
          grants_authority: {const: false}
  admission_rules:
    type: object
    required:
    - global_requirements
    - candidate_generation_is_not_admission
    - self_admission_without_target_class_authority_forbidden
    properties:
      global_requirements: {type: string_list, min_items: 1}
      candidate_generation_is_not_admission: {const: true}
      self_admission_without_target_class_authority_forbidden: {const: true}
  global_admission_rules:
    type: object
    required:
    - requirements
    - requires_global_authority
    properties:
      requires_global_authority: {const: true}
  promotion_rules:
    type: object
    required:
    - sequence
    - globalization_candidate_is_not_global_authority
    - authorized_global_state_change_required
    properties:
      sequence: {type: string_list, min_items: 1}
      globalization_candidate_is_not_global_authority: {const: true}
      authorized_global_state_change_required: {const: true}
  agent_authority:
    type: object
    required: [rules]
    properties:
      rules: {type: string_list, min_items: 1}
  human_authority:
    type: object
    required: [rules]
    properties:
      rules: {type: string_list, min_items: 1}
  escalation_rules:
    type: object
    required:
    - authority_missing
    - semantic_conflict
    - unknown
    - changed_candidate_after_decision
    properties:
      authority_missing: {enum: [block]}
      semantic_conflict: {enum: [block]}
      unknown: {enum: [remain_unknown]}
      changed_candidate_after_decision: {enum: [require_new_decision]}
  derivation_rules:
    type: string_list
    min_items: 1
  rules:
    type: array
    min_items: 1
    items:
      type: object
      required:
      - id
      - when
      - derive
      - source_refs
      properties:
        source_refs: {type: string_list, min_items: 1}
  patterns:
    type: array
    min_items: 1
    items:
      type: object
      required:
      - id
      - class
      - purpose
      - guarantees
      properties:
        guarantees: {type: string_list, min_items: 1}
  capability_state_dimensions:
    type: object
    required:
    - declared
    - admitted
    - available
    - authorized
    - invocable
  state_dimension_rules:
    type: string_list
    min_items: 1
  global_rules:
    type: object
  conformance_requirement_shape:
    type: object
    required: [required]
    properties:
      required: {type: string_list, min_items: 1}
  receipt_kernel:
    type: object
    required:
    - required_semantics
    - field_semantics
    - authority
    - currentness
    - forbidden
    properties:
      required_semantics: {type: string_list, min_items: 1}
      forbidden: {type: string_list, min_items: 1}
      authority:
        type: object
        required:
        - class
        - grants_semantic_authority
        - grants_execution_authority
        properties:
          class: {const: evidence}
          grants_semantic_authority: {const: false}
          grants_execution_authority: {const: false}
  receipts:
    type: object
    fields:
      validation:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - forbidden
        properties:
          family_id: {const: l9.receipt/validation@1}
          additional_required_semantics: {type: string_list, min_items: 1}
          forbidden: {type: string_list, min_items: 1}
      admission:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - forbidden
        properties:
          family_id: {const: l9.receipt/admission@1}
          additional_required_semantics: {type: string_list, min_items: 1}
          forbidden: {type: string_list, min_items: 1}
  state_semantics:
    type: object
    required:
    - candidate
    - admitted
    - published
    - current
    - non_current
    - superseded
    - rejected
    - unresolved
  lifecycles:
    type: object
    fields:
      published_artifact:
        type: object
        required:
        - semantic_owner
        - purpose
        - stages
        - publication_gate
        - rules
        properties:
          stages: {type: string_list, min_items: 1}
          rules: {type: string_list, min_items: 1}
  invalidation_rules:
    type: object
    required:
    - source_digest_change
    - profile_digest_change
    - historical_artifacts_are_immutable
    - silent_consumption_of_stale_input_forbidden
    properties:
      historical_artifacts_are_immutable: {const: true}
      silent_consumption_of_stale_input_forbidden: {const: true}
  result_domains:
    type: object
    required: [validation]
    properties:
      validation: {type: string_list, min_items: 5}
