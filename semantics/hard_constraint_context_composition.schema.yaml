type: object
required:
- invariants
- contracts
- requirement_model
- resolution_model
properties:
  schema:
    const: l9.composed-projection.hard-constraint-context/v1
  invariants:
    type: object
    required:
    - invariants
    properties:
      invariants:
        type: array
        min_items: 7
        items:
          type: object
          required:
          - id
          - statement
          - scope
          - owner
          properties:
            id:
              type: string
              enum:
              - L9-AUTH-001
              - L9-SEM-001
              - L9-UNKNOWN-001
              - L9-HARD-001
              - L9-DEGRADE-001
              - L9-IDENTITY-001
              - L9-COMPAT-001
            statement:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
  contracts:
    type: object
    required:
    - contracts
    properties:
      contracts:
        type: array
        min_items: 3
        items:
          type: object
          required:
          - id
          - purpose
          - scope
          - owner
          - source_invariants
          - applies_to
          - requires
          - guarantees
          - forbidden
          - outcomes
          properties:
            id:
              type: string
              enum:
              - l9.contract/unknown-and-degradation@1
              - l9.contract/hard-constraint@1
              - l9.contract/semantic-identity-and-compatibility@1
            purpose:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
            source_invariants:
              type: string_list
            applies_to:
              type: string_list
            requires:
              type: string_list
            guarantees:
              type: string_list
            forbidden:
              type: string_list
            outcomes:
              type: object
              required:
              - unresolved
              properties:
                resolved:
                  type: string
                  const: required_semantics_are_known_or_validly_substituted_or_conflict_is_authoritatively_resolved
                unresolved:
                  type: string
                refused:
                  type: string
                  const: requested_substitution_lacks_compatibility_or_authority
                admissible:
                  type: string
                  const: all_applicable_hard_constraints_are_satisfied
                inadmissible:
                  type: string
                  const: one_or_more_applicable_hard_constraints_fail
                compatible:
                  type: string
                  const: applicable_declared_compatibility_contract_is_satisfied
                incompatible:
                  type: string
                  const: applicable_declared_compatibility_contract_is_violated
  requirement_model:
    type: object
    required:
    - global_rules
    - requirement_classes
    - requirement_entry_contract
    - closure_rules
    properties:
      global_rules:
        type: object
        required:
        - requirements_are_typed
        - requirements_preserve_source_provenance
        - hard_requirements_are_non_compensable
        - preferences_do_not_satisfy_hard_requirements
        - unresolved_requirements_remain_explicit
        - resolution_does_not_create_authority
        - provider_capability_is_not_semantic_requirement_ownership
        properties:
          requirements_are_typed:
            type: boolean
            const: true
          requirements_preserve_source_provenance:
            type: boolean
            const: true
          hard_requirements_are_non_compensable:
            type: boolean
            const: true
          preferences_do_not_satisfy_hard_requirements:
            type: boolean
            const: true
          unresolved_requirements_remain_explicit:
            type: boolean
            const: true
          resolution_does_not_create_authority:
            type: boolean
            const: true
          provider_capability_is_not_semantic_requirement_ownership:
            type: boolean
            const: true
      requirement_classes:
        type: object
        required:
        - semantic
        - authority
        - capability
        - interface
        - architecture
        - technology
        - conformance
        - operational
        - objective
        properties:
          semantic:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
          authority:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
          capability:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
          interface:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
          architecture:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
          technology:
            type: object
            required:
            - meaning
            - default_hardness
            - note
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
              note:
                type: string
          conformance:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
          operational:
            type: object
            required:
            - meaning
            - default_hardness
            - note
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: hard
              note:
                type: string
          objective:
            type: object
            required:
            - meaning
            - default_hardness
            properties:
              meaning:
                type: string
              default_hardness:
                type: string
                const: soft
      requirement_entry_contract:
        type: object
        required:
        - required
        - optional
        - hardness_domain
        properties:
          required:
            type: string_list
          optional:
            type: string_list
          hardness_domain:
            type: string_list
      closure_rules:
        type: string_list
  resolution_model:
    type: object
    required:
    - global_rules
    - result_domain
    - selection_rules
    properties:
      global_rules:
        type: object
        required:
        - all_resolvers_share_one_result_algebra
        - resolution_is_evidence_bound
        - resolution_does_not_admit_subjects
        - unknown_is_not_resolved
        - ambiguity_is_not_silently_collapsed
        - incompatibility_is_not_optimization_failure
        properties:
          all_resolvers_share_one_result_algebra:
            type: boolean
            const: true
          resolution_is_evidence_bound:
            type: boolean
            const: true
          resolution_does_not_admit_subjects:
            type: boolean
            const: true
          unknown_is_not_resolved:
            type: boolean
            const: true
          ambiguity_is_not_silently_collapsed:
            type: boolean
            const: true
          incompatibility_is_not_optimization_failure:
            type: boolean
            const: true
      result_domain:
        type: object
        required:
        - resolved
        - unresolved
        - incompatible
        - unsat
        - ambiguous
        properties:
          resolved:
            type: string
          unresolved:
            type: string
          incompatible:
            type: string
          unsat:
            type: string
          ambiguous:
            type: string
      selection_rules:
        type: string_list
