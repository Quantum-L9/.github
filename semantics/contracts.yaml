    '
contracts:
- id: l9.contract/authority-boundary@1
  purpose: 'Preserve governing authority boundaries when a component computes, validates, recommends, transports,
    or executes a function.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-AUTH-001
  - L9-AUTH-002
  applies_to:
  - components
  - capabilities
  - validators
  - executors
  - providers
  - consumers
  requires:
  - governing_authority_is_resolvable_for_decisions_or_actions_that_require_authority
  - component_behavior_remains_within_declared_authority
  guarantees:
  - functional_capability_does_not_transfer_governing_authority
  - successful_execution_does_not_expand_authority
  - delegated_authority_remains_bounded_by_its_declared_scope
  forbidden:
  - self_authorization
  - authority_inference_from_capability
  - authority_inference_from_execution_success
  - authority_expansion_by_consumer_or_provider
  outcomes:
    satisfied: governing_action_remains_within_declared_authority
    violated: attempted_or_effective_authority_expansion
    unresolved: required_governing_authority_cannot_be_resolved
- id: l9.contract/semantic-ownership@1
  purpose: 'Keep canonical semantic ownership singular and explicit across mirrors, projections, providers, consumers,
    implementations, dependencies, co-location, execution, and scope changes.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-OWNER-001
  - L9-SEM-001
  - L9-SCOPE-001
  applies_to:
  - canonical_concepts
  - mirrors
  - projections
  - providers
  - consumers
  - implementations
  - dependencies
  - co_located_components
  - shared_execution_processes
  - generalized_global_laws
  requires:
  - semantic_scope_is_declared
  - semantic_revision_is_resolvable_when_revisioned
  - canonical_owner_is_resolvable
  guarantees:
  - one_canonical_owner_per_semantic_scope_and_revision
  - mirrors_and_projections_remain_non_owning
  - provider_and_implementation_identity_remain_non_owning
  - dependency_colocation_or_shared_execution_do_not_transfer_ownership
  - global_admission_does_not_transfer_originating_domain_ownership
  forbidden:
  - competing_canonical_sources_within_one_scope_and_revision
  - provider_identity_as_semantic_ownership
  - consumer_identity_as_semantic_ownership
  - ownership_transfer_by_projection_or_consumption
  - ownership_transfer_by_dependency_colocation_or_shared_execution
  outcomes:
    satisfied: canonical_owner_is_unambiguous
    violated: competing_or_implicit_semantic_ownership
    unresolved: canonical_owner_cannot_be_resolved
- id: l9.contract/monotonic-subordination@1
  purpose: 'Govern how subordinate policy or contracts may extend canonical law without weakening or replacing it.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-MONOTONIC-001
  - L9-AUTH-001
  - L9-OWNER-001
  applies_to:
  - subordinate_policy
  - domain_policy
  - project_contracts
  - local_governance
  requires:
  - canonical_extension_permission_when_extension_is_attempted
  - delegated_scope_is_explicit
  - inherited_canonical_obligations_are_resolvable
  guarantees:
  - permitted_extensions_remain_inside_delegated_scope
  - narrowing_or_strengthening_does_not_remove_canonical_obligations
  - canonical_owner_retains_authority_over_canonical_law
  forbidden:
  - weakening_canonical_law_without_delegated_authority
  - bypassing_canonical_law_without_delegated_authority
  - reinterpreting_or_shadowing_canonical_law_without_delegated_authority
  - replacing_canonical_law_without_delegated_authority
  - assuming_extension_permission_from_local_ownership
  outcomes:
    satisfied: subordinate_extension_is_monotonic_and_in_scope
    violated: subordinate_extension_weakens_or_replaces_canonical_law
    unresolved: extension_permission_or_delegated_scope_is_unknown
- id: l9.contract/admission-and-promotion@1
  purpose: 'Bind admission and semantic-class promotion to the exact subject evaluated and to the authority that
    owns the target class.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-PROMOTION-001
  - L9-ADMISSION-001
  - L9-GLOBALIZATION-001
  - L9-DERIVED-001
  applies_to:
  - admission_decisions
  - authority_decisions
  - semantic_class_promotion
  - globalization_candidates
  - derived_artifacts
  requires:
  - exact_subject_identity
  - exact_subject_revision_or_digest_when_revisioned
  - target_semantic_or_authority_class
  - target_class_authority
  - explicit_decision_record
  - explicit_compatibility_contract_when_reusing_a_prior_decision_after_material_change
  - independent_domain_witnesses_when_cross_domain_recurrence_is_asserted_as_admission_evidence
  guarantees:
  - decisions_bind_only_the_exact_subject_evaluated
  - promotion_is_performed_only_by_target_class_authority
  - recurrence_or_validation_creates_no_implicit_promotion
  - cross_domain_recurrence_claims_are_evidence_bound_when_used_to_support_higher_scope_admission
  - materially_changed_subjects_require_new_decisions_unless_compatibility_preserves_the_prior_decision
  forbidden:
  - self_admission
  - admission_by_producer_or_consumer_without_target_class_authority
  - replaying_a_decision_against_a_materially_changed_subject_without_compatibility
  - treating_recurrence_as_global_admission
  - treating_hypothetical_reuse_repeated_assertion_or_single_domain_repetition_as_cross_domain_recurrence
  - treating_derivation_or_validation_as_automatic_canonicalization
  outcomes:
    admitted: exact_subject_is_admitted_by_target_class_authority
    refused: exact_subject_is_not_admitted
    new_decision_required: subject_changed_materially_without_compatibility_preservation
    unresolved: subject_identity_or_target_class_authority_is_unresolved
- id: l9.contract/derived-artifact@1
  purpose: 'Preserve the non-authoritative status and source relationship of artifacts produced from upstream semantics.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-DERIVED-001
  - L9-AUTH-001
  - L9-PROV-001
  applies_to:
  - derived_artifacts
  - generated_artifacts
  - compiled_views
  - synthesized_candidates
  requires:
  - authoritative_source_identity
  - declared_transformation_identity
  - derivation_or_generation_provenance
  guarantees:
  - derived_status_is_preserved_until_explicit_admission
  - source_authority_is_not_transferred_to_the_derived_artifact
  - transformation_lineage_remains_resolvable
  forbidden:
  - implicit_canonicalization
  - authority_expansion_by_derivation
  - provenance_free_derived_artifacts
  - derived_artifact_as_competing_canonical_source
  outcomes:
    satisfied: artifact_remains_traceable_and_non_authoritative
    violated: artifact_claims_undelegated_or_implicit_authority
    unresolved: source_or_transformation_lineage_cannot_be_resolved
- id: l9.contract/evidence-and-receipt@1
  purpose: 'Bind an evidence or receipt claim to the exact subject, coordinates, criteria, and outcome it attests
    so the claim can be independently checked.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-EVIDENCE-001
  - L9-ASSURANCE-001
  - L9-PROV-001
  - L9-COORD-001
  - L9-ADMISSION-001
  applies_to:
  - evidence
  - receipts
  - attestations
  - validation_results
  - conformance_results
  requires:
  - declared_claim
  - exact_subject_identity
  - governing_subject_coordinates_when_material
  - declared_observation_or_outcome
  - evidence_or_criteria_sufficient_for_independent_verification
  guarantees:
  - claim_scope_is_limited_to_the_declared_subject_and_declared_observation_or_outcome
  - verifier_can_resolve_the_subject_criteria_and_evidence_without_relying_only_on_the_recorded_verdict
  - receipt_or_evidence_confers_no_semantic_or_execution_authority
  - material_subject_change_invalidates_reuse_unless_compatibility_explicitly_preserves_it
  forbidden:
  - ambient_head_phase_or_flag_as_the_only_subject_binding
  - producer_verdict_as_the_only_verification_basis
  - evidence_as_authorization
  - receipt_as_canonical_semantic_authority
  - claim_replay_against_an_unbound_or_materially_changed_subject
  outcomes:
    attested: claim_is_bound_and_independently_verifiable
    unverified: required_evidence_or_binding_is_missing_stale_or_unverifiable
    invalid_binding: claim_does_not_bind_the_subject_or_coordinates_it_asserts
- id: l9.contract/assurance-and-verification@1
  purpose: 'Separate normative requirements, implementation state, and assurance claims and define when stronger
    assurance language is permitted.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-ASSURANCE-001
  - L9-CORRECTNESS-001
  - L9-EVIDENCE-001
  - L9-UNKNOWN-001
  applies_to:
  - requirements
  - controls
  - implementations
  - verification_claims
  - conformance_claims
  - completion_claims
  requires:
  - claim_class_is_explicit
  - evidence_requirements_for_that_claim_class_are_known
  - current_independently_verifiable_evidence_for_every_required_condition
  guarantees:
  - requirement_truth_is_not_confused_with_implementation_state
  - implementation_presence_is_not_confused_with_verified_effectiveness
  - stronger_assurance_claims_require_correspondingly_sufficient_evidence
  - missing_stale_or_unverifiable_required_evidence_remains_unverified_or_unknown
  forbidden:
  - self_attestation_as_the_sole_basis_for_verification
  - artifact_presence_as_proof_of_effectiveness
  - workflow_presence_as_proof_of_blocking_enforcement
  - pass_claim_without_required_evidence
  - unknown_or_unverified_as_verified
  outcomes:
    supported: claim_has_current_sufficient_independently_verifiable_evidence
    unsupported: evidence_proves_the_claim_is_not_satisfied
    unverified: required_evidence_is_missing_stale_or_unverifiable
- id: l9.contract/unknown-and-degradation@1
  purpose: 'Preserve unknown, unresolved, and conflicting semantics and constrain degraded behavior so unavailable
    capabilities cannot silently impersonate other semantic owners.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-UNKNOWN-001
  - L9-DEGRADE-001
  - L9-COMPAT-001
  - L9-AUTH-001
  applies_to:
  - missing_inputs
  - unresolved_results
  - conflicting_authoritative_claims
  - unavailable_capabilities
  - degraded_execution
  - fallback_paths
  requires:
  - unknown_or_unavailable_state_is_explicit
  - conflicting_semantics_remain_explicit_until_resolved_by_applicable_authoritative_rule_or_decision
  - substitution_has_explicit_compatibility_contract_when_attempted
  - substitution_has_applicable_authority_when_attempted
  guarantees:
  - unknown_remains_distinguishable_from_known_values_and_success
  - conflicting_semantics_are_not_silently_reconciled
  - conflict_resolution_does_not_manufacture_missing_evidence_or_prove_unproven_claims
  - unavailable_semantics_are_not_replaced_by_undeclared_fallbacks
  - authorized_compatible_substitution_preserves_declared_semantic_guarantees
  forbidden:
  - coercing_unknown_to_default_value
  - coercing_unknown_to_success_failure_validity_or_authorization
  - silent_conflict_reconciliation
  - authority_declaration_as_substitute_for_missing_evidence
  - silent_semantic_fallback
  - cross_owner_impersonation_without_compatibility_and_authority
  outcomes:
    resolved: required_semantics_are_known_or_validly_substituted_or_conflict_is_authoritatively_resolved
    unresolved: unknown_unavailable_or_conflicting_semantics_remain_explicit
    refused: requested_substitution_lacks_compatibility_or_authority
- id: l9.contract/hard-constraint@1
  purpose: 'Keep applicable hard constraints outside compensating optimization or preference logic.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-HARD-001
  - L9-UNKNOWN-001
  applies_to:
  - hard_constraints
  - acceptance_decisions
  - optimization_and_ranking
  requires:
  - acceptance_requires_all_applicable_hard_constraints_to_be_satisfied
  - unresolved_hard_constraints_remain_unresolved
  guarantees:
  - soft_objectives_operate_only_within_the_admissible_region
  - failed_hard_constraints_block_acceptance
  - unresolved_hard_constraints_are_not_compensated_by_soft_scores
  forbidden:
  - trading_hard_constraint_failure_for_utility
  - trading_hard_constraint_failure_for_probability_or_confidence
  - ranking_or_optimization_overriding_a_hard_constraint
  outcomes:
    admissible: all_applicable_hard_constraints_are_satisfied
    inadmissible: one_or_more_applicable_hard_constraints_fail
    unresolved: one_or_more_applicable_hard_constraints_cannot_be_resolved
- id: l9.contract/provenance-and-coordinate@1
  purpose: 'Bind derived validity to resolvable authoritative inputs, transformations, and governing coordinates.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-PROV-001
  - L9-COORD-001
  - L9-REVISION-001
  applies_to:
  - derived_results
  - compiled_artifacts
  - projections
  requires:
  - authoritative_input_references
  - authoritative_input_revisions_or_digests_when_revisioned
  - declared_transformation_identity
  - all_governing_coordinates_material_to_validity
  guarantees:
  - authoritative_inputs_and_transformations_are_resolvable
  - validity_is_evaluated_against_declared_coordinates
  - material_coordinate_change_makes_affected_results_non_current_until_recomputed_or_compatibility_is_proven
  forbidden:
  - provenance_truncation_that_prevents_authority_resolution
  - silently_consuming_non_current_results_as_current
  - unbound_reuse_across_material_coordinate_change
  outcomes:
    current: declared_coordinates_match_or_compatibility_is_proven
    non_current: a_material_governing_coordinate_changed_without_compatibility_proof
    unresolved: required_provenance_or_coordinate_cannot_be_resolved
- id: l9.contract/semantic-identity-and-compatibility@1
  purpose: 'Separate semantic identity from representation and provider choice while requiring explicit compatibility
    across semantic boundaries.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-IDENTITY-001
  - L9-COMPAT-001
  - L9-SEM-001
  - L9-DEGRADE-001
  applies_to:
  - representations
  - providers
  - implementations
  - transports
  - storage
  - semantic_types
  - contract_versions
  requires:
  - semantic_identity_or_type_is_resolvable
  - compatibility_rule_is_explicit_when_compatibility_is_required
  guarantees:
  - provider_or_representation_change_alone_does_not_change_semantic_identity
  - compatibility_is_decided_by_the_applicable_declared_type_or_contract
  - compatible_substitution_preserves_the_semantics_promised_by_the_compatibility_contract
  forbidden:
  - inferring_equivalence_from_shape_or_similarity
  - inferring_compatibility_from_successful_execution
  - provider_identity_as_semantic_identity
  - undeclared_cross_version_or_cross_type_compatibility
  outcomes:
    compatible: applicable_declared_compatibility_contract_is_satisfied
    incompatible: applicable_declared_compatibility_contract_is_violated
    unresolved: no_applicable_compatibility_decision_can_be_resolved
- id: l9.contract/revision-and-supersession@1
  purpose: 'Preserve admitted historical meaning by representing correction and change as successor or supersession
    rather than in-place semantic rewrite.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-REVISION-001
  - L9-ADMISSION-001
  - L9-COORD-001
  applies_to:
  - admitted_semantic_revisions
  - corrected_semantics
  - superseding_semantics
  requires:
  - immutable_revision_identity_for_admitted_semantics
  - successor_or_supersession_relationship_for_material_semantic_change
  guarantees:
  - prior_admitted_meaning_remains_addressable
  - material_change_receives_a_distinct_revision_identity
  - decisions_bound_to_prior_revisions_are_not_silently_rebound
  forbidden:
  - in_place_rewrite_of_admitted_semantic_content
  - revision_identity_reuse_for_changed_meaning
  - hidden_rebinding_of_prior_admission_or_evidence
  outcomes:
    preserved: revision_semantics_are_unchanged
    successor_required: material_semantic_change_requires_new_revision_identity
    violated: admitted_history_was_rewritten_or_reused_for_changed_meaning
- id: l9.contract/projection@1
  purpose: 'Define projection as a bounded source-derived view that may select or reshape representation without
    creating new meaning or authority.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-PROJECTION-001
  - L9-DERIVED-001
  - L9-PROV-001
  - L9-AUTH-001
  applies_to:
  - projection_engines
  - projection_profiles
  - projection_artifacts
  requires:
  - source_identity
  - source_revision_or_digest_when_revisioned
  - declared_projection_profile_or_selector_contract
  - projection_provenance
  guarantees:
  - output_is_bounded_by_source_semantics_and_declared_selection
  - source_lineage_remains_resolvable
  - projection_remains_derived_and_non_authoritative
  - transformations_that_add_semantic_consequences_are_classified_under_another_governed_operation
  forbidden:
  - semantic_invention
  - semantic_reconciliation
  - semantic_reinterpretation
  - semantic_derivation_or_synthesis_misclassified_as_projection
  - authority_expansion
  - projection_as_admission_or_promotion
  outcomes:
    valid_projection: output_is_a_bounded_semantics_preserving_view
    invalid_projection: output_invents_reinterprets_reconciles_or_expands_source_semantics
    unresolved: source_or_projection_contract_cannot_be_resolved
- id: l9.contract/validation-and-correctness@1
  purpose: 'Keep validation and conformance observational, bind them to correctness criteria independent of the
    candidate and its production path, prevent validators from changing candidates or governing criteria, and
    make success depend on complete, evidence-bound evaluation of every applicable required criterion.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-VALIDATION-001
  - L9-CORRECTNESS-001
  - L9-EVIDENCE-001
  - L9-UNKNOWN-001
  - L9-ASSURANCE-001
  applies_to:
  - validators
  - conformance_systems
  - validation_profiles
  - candidate_artifacts
  - generated_artifacts
  requires:
  - exact_candidate_identity
  - correctness_criteria_independent_of_candidate_and_production_path
  - declared_validation_or_conformance_contract
  guarantees:
  - candidate_is_not_mutated_by_validation_or_conformance
  - validation_emits_only_evidence_about_the_candidate_against_declared_criteria
  - candidate_or_its_production_path_is_not_the_sole_correctness_authority
  - validation_does_not_alter_relax_substitute_or_reinterpret_governing_criteria
  - unresolved_validation_semantics_remain_unresolved
  - validation_success_requires_every_applicable_required_criterion_to_be_evaluated_and_satisfied
  - unavailable_unreadable_unexecuted_or_unresolved_required_criteria_preclude_success
  - validation_coverage_is_explicit_and_evidence_bound
  forbidden:
  - repair_during_validation
  - constraint_relaxation_during_validation
  - governing_criteria_mutation_or_substitution_during_validation
  - reinterpretation_to_obtain_success
  - candidate_or_production_path_defined_correctness_as_the_only_criterion
  - unknown_to_success_coercion
  - silent_skip_of_applicable_required_validation
  - default_success_on_missing_unreadable_unexecuted_or_unresolved_required_validation
  - partial_validation_coverage_reported_as_complete
  outcomes:
    satisfied: every_applicable_required_criterion_was_evaluated_and_evidence_supports_the_candidate_against_each
    rejected: evidence_refutes_the_candidate_against_declared_criteria
    unresolved: validation_cannot_resolve_the_candidate_against_every_applicable_required_criterion
- id: l9.contract/capability-state@1
  purpose: 'Preserve the distinction among capability declaration, admission, availability, authorization, and invocability.

    '
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-CAPABILITY-001
  - L9-AUTH-001
  - L9-PROMOTION-001
  applies_to:
  - capability_catalogs
  - capability_admission
  - capability_availability
  - authorization
  - invocation
  requires:
  - each_relevant_capability_state_is_explicit
  - state_implications_are_defined_only_by_applicable_canonical_contract
  - invocation_satisfies_all_required_states_and_authority
  guarantees:
  - declaration_admission_availability_authorization_and_invocability_remain_distinct
  - no_state_implies_another_without_declared_contract_semantics
  - invocation_does_not_create_missing_authorization_or_admission
  forbidden:
  - treating_declaration_as_admission
  - treating_admission_as_availability
  - treating_availability_as_authorization
  - treating_authorization_as_availability
  - treating_any_single_state_as_invocability_without_required_contract_conditions
  outcomes:
    invocable: all_contract_required_states_and_authority_are_satisfied
    not_invocable: one_or_more_required_states_or_authority_conditions_fail
    unresolved: one_or_more_required_capability_states_cannot_be_resolved
- id: l9.contract/product-kind@1
  purpose: Classify an L9 product by its canonical consumption and deployment boundary without inferring kind from
    implementation technology, repository shape, semantic complexity, or incidental process topology.
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-SEM-001
  - L9-IDENTITY-001
  - L9-OWNER-001
  - L9-COMPAT-001
  - L9-UNKNOWN-001
  applies_to:
  - product_topologies
  - product_kind_resolution
  - product_archetype_resolution
  requires:
  - declared_product_kind
  - declared_consumption_model
  - declared_deployment_model
  - admitted_kind_semantics
  - kind_compatible_archetype
  guarantees:
  - node_means_remote_invocation_plus_independent_runtime
  - dependency_means_local_composition_plus_consumer_bound_artifact
  - kind_does_not_transfer_semantic_ownership
  - kind_specific_archetype_catalog_is_selected_mechanically
  forbidden:
  - kind_inferred_from_provider
  - kind_inferred_from_repository_shape
  - kind_inferred_from_package_format
  - kind_inferred_from_semantic_complexity
  - sdk_kind_assumed_before_admission
  outcomes:
    resolved: declared_kind_consumption_deployment_and_archetype_are_coherent
    invalid: declared_kind_conflicts_with_consumption_or_deployment
    unresolved: kind_or_archetype_semantics_are_not_admitted
- id: l9.contract/product-topology@1
  purpose: Define the authoritative ProductTopology contract from which every L9 product is compiled using one shared
    topology vocabulary, while preserving product-owner semantics and kind-specific obligations.
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-AUTH-001
  - L9-OWNER-001
  - L9-UNKNOWN-001
  - L9-HARD-001
  - L9-CAPABILITY-001
  - L9-PROV-001
  - L9-SEM-001
  - L9-IDENTITY-001
