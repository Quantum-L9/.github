status: active
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_cross_boundary_contracts
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: contracts.yaml
derivation:
  source_artifact: invariants.yaml
  source_artifact_id: l9.invariants/global@1
  source_digest_sha256: 771e3509703ea7d177a4bbac965e126f77f390ec359d1544854d95ec4374082a
