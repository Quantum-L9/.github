  preserves its source-class identity and the constraints derived from its selected payload.
derivation:
  method: l9.schema-derivation/selected-payload@1
  basis: selected_payload_observation_at_authority_revision
  authority_repository: Quantum-L9/.github
  authority_revision: 290bcd90378577392640cea9c6053c178423f0da
