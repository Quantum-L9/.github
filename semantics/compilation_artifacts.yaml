schema: l9.compilation-artifacts/v1
artifact_id: l9.compilation-artifacts/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_compilation_artifact_model
  authority_class: canonical
artifact_types:
  canonical_artifact:
    authority_class: canonical
    immutable_by_digest: true
  projection_artifact:
    authority_class: derived
    required:
      - source_ref
      - source_digest
      - projection_profile_ref
      - projection_profile_digest
      - payload
      - artifact_digest
  derived_artifact:
    authority_class: derived
    required:
      - source_refs
      - source_digests
      - derivation_profile_ref
      - derivation_profile_digest
      - payload
      - artifact_digest
  candidate_artifact:
    authority_class: candidate
    required:
      - source_refs
      - source_digests
      - compilation_profile_ref
      - payload
      - artifact_digest
  composed_projection:
    authority_class: derived
    required:
      - component_projection_refs
      - component_projection_digests
      - composition_profile_ref
      - composition_profile_digest
      - payload
      - artifact_digest
  validation_receipt:
    authority_class: evidence
    semantics_source: receipt_catalog.yaml#receipts.validation
    required:
      - candidate_digest
      - solver_ref
      - solver_version
      - solver_profile_digest
      - result
      - evidence
  compiled_artifact:
    authority_class: derived
    required:
      - source_refs
      - source_digests
      - compiler_version
      - compilation_profile_ref
      - artifact_digest
  node_spec:
    authority_class: candidate
    required:
      - node_identity
      - purpose
      - invariant_refs
      - desired_capability_refs
      - technology_intent
      - source_coordinates
  node_manifest:
    authority_class: derived
    required:
      - source_node_spec_ref
      - resolved_requirement_closure
      - resolved_capability_closure
      - architecture_ir_ref
      - port_ir_refs
      - binding_refs
      - conformance_requirement_refs
      - compiler_profile_ref
      - provenance
      - manifest_digest
rules:
  artifact_digest_is_deterministic: true
  derived_artifact_never_implicitly_becomes_canonical: true
  provenance_must_be_complete: true
  implementation_lowering_requires_resolved_node_manifest: true
