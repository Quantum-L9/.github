schema: l9.strategic-plan-model/v1
artifact_id: l9.strategic-plan-model/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_strategic_plan_semantics
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: strategic_plan_model.yaml
governed_by:
  invariants:
  - L9-STRATEGY-001
  - L9-AUTH-001
  - L9-OWNER-001
  - L9-SEM-001
  - L9-PROMOTION-001
  - L9-PROJECTION-001
  - L9-UNKNOWN-001
  contracts:
  - l9.contract/authority-boundary@1
  - l9.contract/semantic-ownership@1
purpose: Define the global meaning of Strategic Plan content - the four Plan-owned primitives, the five strategic
  relations, and Affected Strategic Closure - together with the boundary that separates a change in authoritative
  reality from a revision of strategy. The Strategic Plan, its owner, and its authority are those of Strategic
  Cognition and are not redefined here. This ledger defines semantics only; it does not define a schema, fields,
  identifiers, versions, relation endpoint typing, graph or other representation, temporal or horizon structure,
  confidence or probability, a closure algorithm, runtime cognition, prompts, model or provider selection, or actor
  bindings.
subject:
  concept_ref: strategic_cognition_model.yaml#concepts.strategic_plan
  resolution_ref: authority_model.yaml#strategic_cognition_authority
global_rules:
  strategic_plan_represents_strategy_without_absorbing_external_truth_ownership: true
  strategic_hypothesis_is_plan_owned_belief_not_authoritative_truth: true
  reality_change_may_require_reconsideration_but_never_directly_modifies_or_invalidates_strategic_plan: true
  reasoning_workspace_content_is_not_strategic_plan_content_without_authorized_decision: true
  planning_horizon_does_not_create_primitive_types: true
  compound_causal_claims_are_expressible_by_one_strategic_hypothesis: true
  outcome_of_one_primitive_does_not_establish_correctness_of_another: true
primitives:
  strategic_goal:
    definition: A broad desired future condition represented in the current Strategy because its realization would
      advance Strategic Intent.
    question: What future condition do we seek?
  strategic_target:
    definition: A more concrete desired condition, threshold, milestone, or recognizable state represented in the
      current Strategy to give bounded resolution to progress toward one or more Strategic Goals.
    question: What more concrete condition would demonstrate progress toward the Goal?
  strategic_hypothesis:
    definition: A Plan-owned causal belief represented in the current Strategy about how relevant conditions,
      capabilities, constraints, actions, or combinations thereof may influence realization of Strategic Goals or Targets.
    question: Why do we believe this path or condition should produce the expected consequence?
  strategic_commitment:
    definition: A course of action recorded in the current Strategy as chosen for pursuit under Strategic Authority,
      distinct from a candidate path considered during reasoning.
    question: Which path have we chosen?
reused_concepts:
  strategy:
    concept_ref: strategic_cognition_model.yaml#concepts.strategy
    owned_here: false
  objective:
    concept_ref: vocabulary.yaml#terms.objective
    owned_here: false
  strategic_intent:
    concept_ref: strategic_cognition_model.yaml#concepts.strategic_intent
    owned_here: false
relations:
  advances:
    meaning: Within the current Strategy, realization of the source contributes toward realization of the target;
      following it upward answers why a Plan-owned object exists.
  enables:
    meaning: Under a Strategic Hypothesis in the current Strategy, the source is believed to make the target possible
      or materially more achievable.
  depends_on:
    meaning: Within the current Strategy, the source's viability is contingent on the target.
  conflicts_with:
    meaning: Within the current Strategy, pursuing or maintaining the source is materially incompatible with the target
      under the current assumptions.
  supersedes:
    semantics_ref: lifecycle.yaml#lifecycle_relations.supersedes
relation_rules:
  relations_do_not_transfer_ownership_or_authority: true
  material_causal_enables_claims_remain_attributable_to_a_strategic_hypothesis: true
reasoning_concepts:
  affected_strategic_closure:
    definition: The smallest reachable set of Plan-owned claims whose current justification may materially depend on a
      changed belief, reference, condition, or authoritative input.
    purpose: selective_plan_reconsideration
    representation_schema_ref: l9.schema/affected-strategic-closure@1
    authority_class: derived
    authoritative: false
    representation_does_not_define_closure_algorithm: true
    may_not:
    - decide_strategy
    - modify_strategic_plan
    - invalidate_strategic_plan
    - mark_dependent_strategy_stale_automatically
