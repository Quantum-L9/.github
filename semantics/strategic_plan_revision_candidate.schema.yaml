schema: l9.schema-definition/v1
artifact_id: l9.schema/strategic-plan-revision-candidate@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_strategic_plan_revision_candidate_schema
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: strategic_plan_revision_candidate.schema.yaml
governed_by:
  semantic_model_ref: strategic_cognition_model.yaml#reasoning_artifacts.strategic_plan_revision_candidate
  plan_graph_schema_ref: l9.schema/strategic-plan-graph@1
  admission_pattern_ref: l9.pattern/authority-candidate-admission@1
  authority_ref: authority_model.yaml#strategic_authority
purpose: >
  Define the digest-bound candidate that bridges Plan Keeper reasoning and an
  authorized Strategic Plan revision. The candidate binds an exact predecessor,
  one exact proposed Strategic Plan Graph, and the exact reasoning episode that
  produced it. It is never Strategy merely because it exists and cannot admit,
  approve, or apply itself.
instance_semantics:
  authority_class: candidate
  authoritative: false
  authority_effect: none_until_admitted
  producer_role: plan_keeper
type: object
required:
- schema
- candidate_ref
- plan_ref
- predecessor
- proposed_graph
- reasoning_episode
- strategic_authority_ref
- rationale_refs
- provenance
- candidate_digest
properties:
  schema:
    const: l9.strategic-plan-revision-candidate/v1
  candidate_ref:
    type: semantic_ref
  plan_ref:
    type: semantic_ref
  predecessor:
    type: object
    required:
    - revision_ref
    - graph_digest
    fields:
      revision_ref:
        type: semantic_ref
      graph_digest:
        type: semantic_digest
  proposed_graph:
    type: object
    required:
    - ref
    - schema_ref
    - digest
    fields:
      ref:
        type: semantic_ref
      schema_ref:
        const: l9.schema/strategic-plan-graph@1
      digest:
        type: semantic_digest
  reasoning_episode:
    type: object
    required:
    - ref
    - digest
    fields:
      ref:
        type: semantic_ref
      digest:
        type: semantic_digest
  affected_closure:
    type: object
    required:
    - ref
    - digest
    fields:
      ref:
        type: semantic_ref
      digest:
        type: semantic_digest
  strategic_authority_ref:
    type: semantic_ref
  rationale_refs:
    type: semantic_ref_list
  provenance:
    type: object
  candidate_digest:
    type: semantic_digest
candidate_rules:
  proposed_graph_must_conform_to_strategic_plan_graph_schema: true
  proposed_graph_plan_ref_must_equal_candidate_plan_ref: true
  proposed_graph_predecessor_must_bind_exact_predecessor: true
  predecessor_must_be_current_at_admission_or_admission_fails_closed: true
  admission_must_bind_candidate_digest_and_proposed_graph_digest: true
  candidate_change_requires_new_authority_decision: true
  proposed_graph_change_requires_new_authority_decision: true
  candidate_may_be_rejected_without_mutating_current_plan: true
semantic_rules:
- revision_candidate_is_candidate_not_strategy
- revision_candidate_does_not_self_admit
- revision_candidate_does_not_modify_strategic_plan
- strategic_authority_ref_does_not_itself_prove_authorization
- admission_is_external_to_candidate_artifact
- authorization_must_bind_exact_candidate_and_proposed_graph_digests
- candidate_preserves_reasoning_and_predecessor_provenance
