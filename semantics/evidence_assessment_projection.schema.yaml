schema: l9.schema-definition/v1
canonical: true
authority:
  owner: Quantum-L9/.github
  authority_class: canonical
  scope: l9_global_evidence_assessment_projection_payload_schema
artifact_id: l9.schema/evidence-assessment-projection@1
canonical_source:
  format: yaml
  artifact: evidence_assessment_projection.schema.yaml
governed_by:
  projection_profile_ref: l9.projection/evidence-assessment@1
purpose: Typed per-source payload of l9.projection/evidence-assessment@1, derived from the payloads its
  selectors produce at the recorded authority revision. Exact selected membership is independently governed
  by selector equivalence; the schema adds no authority.
derivation:
  method: l9.schema-derivation/selected-payload@1
  basis: selected_payload_observation_at_authority_revision
  authority_repository: Quantum-L9/.github
  authority_revision: 290bcd90378577392640cea9c6053c178423f0da
  projection_profile:
    ref: l9.projection/evidence-assessment@1
    digest: sha256:dc8b69b2d0a4a1e461c9eebe41250d733a7d80e502946543719380ab5737682c
  composition_profile:
    ref: l9.compose/evidence-assessment@1
    digest: sha256:1b8110e2c8048beccb0561c7f110720d290416d1f42b0be4e2f9dd8e895baa78
  selector_model:
    ref: l9.selector-model/global@1
    digest: sha256:2c2e221c3e5455f3359723d0e1b4da2cdbd02542782b7cd4bb22bfb7cd5aad56
    path: semantics/selector_model.yaml
  sources:
  - source_class: invariants
    source_ref: l9.source/invariants@1
    source_path: semantics/invariants.yaml
    source_digest: sha256:771e3509703ea7d177a4bbac965e126f77f390ec359d1544854d95ec4374082a
  - source_class: contracts
    source_ref: l9.source/contracts@1
    source_path: semantics/contracts.yaml
    source_digest: sha256:f1fcc979534d0aa34783710657ae36d765f7078e6ab20dc3b11a31d576539d79
  - source_class: receipt_catalog
    source_ref: l9.source/receipt-catalog@1
    source_path: semantics/receipt_catalog.yaml
    source_digest: sha256:0dc3a305a53cbd6f2f1e0cba440d21cf7b3c6b241285a15be8bdb185babc1c84
  - source_class: conformance_model
    source_ref: l9.source/conformance-model@1
    source_path: semantics/conformance_model.yaml
    source_digest: sha256:e777a3cb7b8d94e044934d4778045d697bcdd85ecb2ebe241e95fe60bd7141c5
type: object
properties:
  schema:
    const: l9.projection.evidence-assessment/v1
  invariants:
    type: array
    min_items: 9
    items:
      type: object
      required:
      - id
      - statement
      - scope
      - owner
      properties:
        id:
          type: string
          enum:
          - L9-EVIDENCE-001
          - L9-ASSURANCE-001
          - L9-UNKNOWN-001
          - L9-PROV-001
          - L9-COORD-001
          - L9-REVISION-001
          - L9-ADMISSION-001
          - L9-VALIDATION-001
          - L9-CORRECTNESS-001
        statement:
          type: string
        scope:
          type: string
          const: global
        owner:
          type: string
          const: Quantum-L9/.github
  contracts:
    type: array
    min_items: 4
    items:
      type: object
      required:
      - id
      - purpose
      - scope
      - owner
      - source_invariants
      - applies_to
      - requires
      - guarantees
      - forbidden
      - outcomes
      properties:
        id:
          type: string
          enum:
          - l9.contract/evidence-and-receipt@1
          - l9.contract/assurance-and-verification@1
          - l9.contract/provenance-and-coordinate@1
          - l9.contract/validation-and-correctness@1
        purpose:
          type: string
        scope:
          type: string
          const: global
        owner:
          type: string
          const: Quantum-L9/.github
        source_invariants:
          type: string_list
          min_items: 3
        applies_to:
          type: string_list
          min_items: 3
        requires:
          type: string_list
          min_items: 3
        guarantees:
          type: string_list
          min_items: 3
        forbidden:
          type: string_list
          min_items: 3
        outcomes:
          type: object
          properties:
            attested:
              type: string
              const: claim_is_bound_and_independently_verifiable
            unverified:
              type: string
            invalid_binding:
              type: string
              const: claim_does_not_bind_the_subject_or_coordinates_it_asserts
            supported:
              type: string
              const: claim_has_current_sufficient_independently_verifiable_evidence
            unsupported:
              type: string
              const: evidence_proves_the_claim_is_not_satisfied
            current:
              type: string
              const: declared_coordinates_match_or_compatibility_is_proven
            non_current:
              type: string
              const: a_material_governing_coordinate_changed_without_compatibility_proof
            unresolved:
              type: string
            satisfied:
              type: string
              const: every_applicable_required_criterion_was_evaluated_and_evidence_supports_the_candidate_against_each
            rejected:
              type: string
              const: evidence_refutes_the_candidate_against_declared_criteria
  global_rules:
    type: object
    properties:
      receipt_is_evidence:
        type: boolean
        const: true
      receipt_does_not_grant_semantic_authority:
        type: boolean
        const: true
      receipt_does_not_grant_execution_authority:
        type: boolean
        const: true
      receipt_claim_scope_must_be_explicit:
        type: boolean
        const: true
      exact_subject_binding_is_required:
        type: boolean
        const: true
      materially_governing_coordinates_must_be_bound:
        type: boolean
        const: true
      declared_observation_or_outcome_is_required:
        type: boolean
        const: true
      verification_must_not_depend_only_on_the_recorded_verdict:
        type: boolean
        const: true
      receipt_digest_is_required:
        type: boolean
        const: true
      receipt_content_is_immutable_by_digest:
        type: boolean
        const: true
      material_subject_change_makes_prior_receipt_non_current_unless_compatibility_preserves_it:
        type: boolean
        const: true
      result_semantics_remain_owned_by_the_applicable_contract_or_taxonomy:
        type: boolean
        const: true
      receipt_family_registration_does_not_transfer_domain_semantic_ownership:
        type: boolean
        const: true
      receipt_presence_does_not_imply_capability_admission_availability_authorization_or_invocability:
        type: boolean
        const: true
      receipt_lifecycle_is_defined_separately:
        type: boolean
        const: true
      proof_obligations_preexist_candidate_implementation:
        type: boolean
        const: true
      every_conformance_requirement_traces_to_governing_semantics:
        type: boolean
        const: true
      fixture_or_test_must_not_invent_law:
        type: boolean
        const: true
      system_under_test_must_not_define_expected_result:
        type: boolean
        const: true
      unresolved_semantics_do_not_compile_to_false_conformance:
        type: boolean
        const: true
      conformance_evidence_does_not_grant_authority:
        type: boolean
        const: true
  receipt_kernel:
    type: object
    required:
    - required_semantics
    - field_semantics
    - authority
    - currentness
    - forbidden
    properties:
      required_semantics:
        type: string_list
        min_items: 9
      field_semantics:
        type: object
        required:
        - receipt_type
        - receipt_identity
        - exact_subject_ref
        - claim
        - governing_coordinates
        - observation_or_outcome
        - verification_basis
        - producer_identity
        - receipt_digest
        properties:
          receipt_type:
            type: string
          receipt_identity:
            type: string
          exact_subject_ref:
            type: string
          claim:
            type: string
          governing_coordinates:
            type: string
          observation_or_outcome:
            type: string
          verification_basis:
            type: string
          producer_identity:
            type: string
          receipt_digest:
            type: string
      authority:
        type: object
        required:
        - class
        - grants_semantic_authority
        - grants_execution_authority
        - may_replace_admission_decision
        properties:
          class:
            type: string
            const: evidence
          grants_semantic_authority:
            type: boolean
            const: false
          grants_execution_authority:
            type: boolean
            const: false
          may_replace_admission_decision:
            type: boolean
            const: false
      currentness:
        type: object
        required:
        - rule
        - currentness_is_authority
        properties:
          rule:
            type: string
          currentness_is_authority:
            type: boolean
            const: false
      forbidden:
        type: string_list
        min_items: 6
  receipts:
    type: object
    required:
    - validation
    - compilation
    - conformance
    - admission
    - distribution
    - reconciliation
    properties:
      validation:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - rules
        - forbidden
        properties:
          family_id:
            type: string
            const: l9.receipt/validation@1
          semantic_owner:
            type: string
            const: applicable_validation_semantic_owner
          purpose:
            type: string
          additional_required_semantics:
            type: string_list
            min_items: 8
          result_semantics_source:
            type: string
            const: error_taxonomy.result_domains.validation
          rules:
            type: string_list
            min_items: 3
          forbidden:
            type: string_list
            min_items: 3
      compilation:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - schema_ref
        - rules
        - forbidden
        properties:
          family_id:
            type: string
            const: l9.receipt/compilation@1
          semantic_owner:
            type: string
            const: l9-semantic-compiler
          purpose:
            type: string
          additional_required_semantics:
            type: string_list
            min_items: 6
          result_semantics_source:
            type: string
            const: compiler_contract.yaml
          schema_ref:
            type: string
            const: compiler_receipt.schema.yaml
          rules:
            type: string_list
            min_items: 3
          forbidden:
            type: string_list
            min_items: 3
      conformance:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - rules
        - forbidden
        properties:
          family_id:
            type: string
            const: l9.receipt/conformance@1
          semantic_owner:
            type: string
            const: l9-conformance
          purpose:
            type: string
          additional_required_semantics:
            type: string_list
            min_items: 6
          result_semantics_source:
            type: string
            const: l9-conformance
          rules:
            type: string_list
            min_items: 3
          forbidden:
            type: string_list
            min_items: 3
      admission:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - rules
        - forbidden
        properties:
          family_id:
            type: string
            const: l9.receipt/admission@1
          semantic_owner:
            type: string
            const: applicable_target_class_authority
          purpose:
            type: string
          additional_required_semantics:
            type: string_list
            min_items: 6
          result_semantics_source:
            type: string
            const: l9.contract/admission-and-promotion@1
          rules:
            type: string_list
            min_items: 2
          forbidden:
            type: string_list
            min_items: 3
      distribution:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - rules
        - forbidden
        properties:
          family_id:
            type: string
            const: l9.receipt/distribution@1
          semantic_owner:
            type: string
            const: Quantum-L9/.github
          purpose:
            type: string
          additional_required_semantics:
            type: string_list
            min_items: 5
          result_semantics_source:
            type: string
            const: applicable_distribution_contract
          rules:
            type: string_list
            min_items: 2
          forbidden:
            type: string_list
            min_items: 2
      reconciliation:
        type: object
        required:
        - family_id
        - semantic_owner
        - purpose
        - additional_required_semantics
        - result_semantics_source
        - rules
        - forbidden
        properties:
          family_id:
            type: string
            const: l9.receipt/reconciliation@1
          semantic_owner:
            type: string
            const: applicable_reconciliation_semantic_owner
          purpose:
            type: string
          additional_required_semantics:
            type: string_list
            min_items: 4
          result_semantics_source:
            type: string
            const: applicable_reconciliation_contract
          rules:
            type: string_list
            min_items: 2
          forbidden:
            type: string_list
            min_items: 2
  ownership_boundary:
    type: object
    required:
    - this_file_owns
    - l9_conformance_owns
    properties:
      this_file_owns:
        type: string
        const: global_semantics_for_deriving_conformance_requirements
      l9_conformance_owns:
        type: string_list
        min_items: 5
  conformance_requirement_shape:
    type: object
    required:
    - required
    - optional
    properties:
      required:
        type: string_list
        min_items: 5
      optional:
        type: string_list
        min_items: 3
