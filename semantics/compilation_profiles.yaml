schema: l9.compilation-profiles/v1
artifact_id: l9.compilation-profiles/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_compilation_profiles
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: compilation_profiles.yaml
global_rules:
  stages_are_ordered: true
  downstream_stage_requires_validated_upstream_state: true
  stage_context_is_projected_from_validated_state: true
  stage_solver_is_projected_from_compilation_profile: true
  validation_is_mechanical: true
  historical_stage_artifacts_are_immutable: true
  corrections_create_new_revisions: true
  failed_stage_blocks_downstream_advancement: true
  upstream_semantic_change_invalidates_affected_dependents: true
  compiler_must_not_select_solver_ad_hoc: true
  compiler_must_not_expand_authority: true
profiles:
  - id: l9.compilation/node-build@1
    purpose: >
      Compile an L9 node or dependency incrementally through validated
      semantic stages from global baseline to final target artifacts.
    stages:
      - ordinal: 1
        id: global_baseline
        consumes:
          - global_authority
          - global_invariants
          - global_contracts
          - global_capability_semantics
          - canonical_l9_vocabulary
        operations:
          - projection
        produces:
          - validated_global_baseline
        validation:
          required: true
          solver_ref: predicate-validator/v1
      - ordinal: 2
        id: project_contracts
        consumes:
          - validated_global_baseline
          - project_spec
          - project_requirements
          - project_boundaries
          - desired_capabilities
        operations:
          - projection
          - synthesis
        produces:
          - project_contract_ir
        validation:
          required: true
          solver_ref: schema-contract-validator/v1
      - ordinal: 3
        id: laws
        consumes:
          - applicable_invariants
          - global_contracts
          - admitted_project_contracts
        operations:
          - projection
          - derivation
        produces:
          - semantic_law_ir
        validation:
          required: true
          solver_ref: logic-sat/v1
      - ordinal: 4
        id: fixtures
        consumes:
          - semantic_law_ir
          - law_provenance
        operations:
          - projection
          - derivation
        produces:
          - fixture_ir
          - fixture_candidate_packets
        validation:
          required: true
          solver_ref: fixture-derivation-validator/v1
      - ordinal: 5
        id: conformance
        consumes:
          - fixture_ir
          - applicable_conformance_bindings
          - fixture_profiles
        operations:
          - binding_selection
          - lowering
        produces:
          - conformance_ir
          - executable_conformance_cases
        validation:
          required: true
          solver_ref: reference-conformance/v1
      - ordinal: 6
        id: architecture
        consumes:
          - validated_semantic_baseline_projection
          - admitted_contract_projection
          - semantic_law_projection
          - applicable_conformance_projection
          - desired_capabilities
          - project_constraints
          - applicable_architecture_patterns
          - node_archetype
          - technology_capabilities
        operations:
          - projection
          - synthesis
        produces:
          - architecture_ir
          - selected_pattern_refs
        validation:
          required: true
          solver_ref: graph-constraint-validator/v1
      - ordinal: 7
        id: ports
        consumes:
          - architecture_ir
          - applicable_contract_projection
          - applicable_conformance_projection
        operations:
          - projection
          - synthesis
        produces:
          - port_ir
        validation:
          required: true
          solver_ref: interface-compatibility/v1
      - ordinal: 8
        id: provider_bindings
        consumes:
          - port_ir
          - technology_capabilities
          - provider_constraints
        operations:
          - projection
          - binding_selection
        produces:
          - provider_binding_ir
        validation:
          required: true
          solver_ref: capability-set-validator/v1
      - ordinal: 9
        id: implementation
        consumes:
          - port_ir
          - provider_binding_ir
          - applicable_conformance_projection
          - implementation_constraints
        operations:
          - projection
          - synthesis
          - lowering
        produces:
          - implementation_ir
        validation:
          required: true
          solver_ref: implementation-contract-validator/v1
      - ordinal: 10
        id: target_artifacts
        consumes:
          - implementation_ir
          - target_binding
          - rendering_profile
          - final_conformance_projection
        operations:
          - binding_selection
          - lowering
          - rendering
        produces:
          - final_artifacts
          - final_conformance_receipt
        validation:
          required: true
          final_conformance_required: true
          solver_ref: final-conformance/v1
  - id: l9.compilation/node-build@2
    purpose: |
      Compile a node from minimal declarative intent through requirement closure, semantic resolution, contracts, laws, fixtures, architecture, ports, provider bindings, conformance, a proof-carrying NodeManifest, implementation IR, and target artifacts.
    input_contract: l9.contract/node-spec@1
    input_schema: l9.schema/node-spec@1
    resolved_output_contract: l9.contract/node-manifest@1
    resolved_output_schema: l9.schema/node-manifest@1
    stages:
      - ordinal: 1
        id: node_spec
        consumes:
          - node_spec
        operations:
          - validation
        produces:
          - node_spec_ir
        validation:
          required: true
          solver_ref: node-spec-validator/v1
      - ordinal: 2
        id: global_baseline
        consumes:
          - node_spec_ir
          - global_authority
          - global_invariants
          - global_contracts
          - global_capability_semantics
          - canonical_l9_vocabulary
        operations:
          - projection
        produces:
          - validated_global_baseline
        validation:
          required: true
          solver_ref: predicate-validator/v1
      - ordinal: 3
        id: requirement_resolution
        consumes:
          - node_spec_ir
          - validated_global_baseline
          - requirement_model
          - authority_model
        operations:
          - projection
          - derivation
          - resolution
        produces:
          - requirement_ir
        validation:
          required: true
          solver_ref: requirement-closure-validator/v1
      - ordinal: 4
        id: semantic_resolution
        consumes:
          - requirement_ir
          - capability_resolution
          - capabilities
          - architecture_rules
          - node_archetypes
          - applicable_contracts
        operations:
          - projection
          - derivation
          - resolution
        produces:
          - capability_closure_ir
          - architecture_obligations
          - port_requirements
        validation:
          required: true
          solver_ref: semantic-resolution-validator/v1
      - ordinal: 5
        id: project_contracts
        consumes:
          - validated_global_baseline
          - requirement_ir
          - capability_closure_ir
          - project_spec
          - domain_contract_refs
        operations:
          - projection
          - synthesis
        produces:
          - project_contract_ir
        validation:
          required: true
          solver_ref: schema-contract-validator/v1
      - ordinal: 6
        id: laws
        consumes:
          - applicable_invariants
          - global_contracts
          - admitted_project_contracts
        operations:
          - projection
          - derivation
        produces:
          - semantic_law_ir
        validation:
          required: true
          solver_ref: logic-sat/v1
      - ordinal: 7
        id: fixtures
        consumes:
          - semantic_law_ir
          - law_provenance
        operations:
          - projection
          - derivation
        produces:
          - fixture_ir
          - fixture_candidate_packets
        validation:
          required: true
          solver_ref: fixture-derivation-validator/v1
      - ordinal: 8
        id: architecture
        consumes:
          - requirement_ir
          - capability_closure_ir
          - architecture_obligations
          - admitted_project_contracts
          - applicable_conformance_projection
          - applicable_architecture_patterns
          - node_archetype
        operations:
          - projection
          - synthesis
        produces:
          - architecture_ir
          - selected_pattern_refs
        validation:
          required: true
          solver_ref: graph-constraint-validator/v1
      - ordinal: 9
        id: ports
        consumes:
          - architecture_ir
          - port_requirements
          - port_catalog
          - applicable_contract_projection
          - applicable_conformance_projection
        operations:
          - projection
          - synthesis
        produces:
          - port_ir
        validation:
          required: true
          solver_ref: interface-compatibility/v1
      - ordinal: 10
        id: provider_bindings
        consumes:
          - port_ir
          - technology_profile
          - technology_capabilities
          - binding_catalog
        operations:
          - projection
          - binding_selection
        produces:
          - provider_binding_ir
        validation:
          required: true
          solver_ref: capability-set-validator/v1
      - ordinal: 11
        id: conformance
        consumes:
          - fixture_ir
          - conformance_model
          - capability_closure_ir
          - architecture_ir
          - selected_pattern_refs
          - port_ir
          - provider_binding_ir
          - applicable_conformance_bindings
          - fixture_profiles
        operations:
          - projection
          - derivation
          - binding_selection
          - lowering
        produces:
          - conformance_requirement_ir
          - conformance_ir
          - executable_conformance_cases
        validation:
          required: true
          solver_ref: reference-conformance/v1
      - ordinal: 12
        id: node_manifest
        consumes:
          - node_spec_ir
          - requirement_ir
          - capability_closure_ir
          - architecture_ir
          - port_ir
          - provider_binding_ir
          - conformance_requirement_ir
          - compiler_coordinates
        operations:
          - derivation
          - validation
        produces:
          - node_manifest_ir
          - node_manifest
        validation:
          required: true
          solver_ref: node-manifest-validator/v1
          resolved_manifest_gate_required: true
      - ordinal: 13
        id: implementation
        consumes:
          - node_manifest_ir
          - applicable_conformance_projection
          - implementation_constraints
        operations:
          - projection
          - synthesis
          - lowering
        produces:
          - implementation_ir
        validation:
          required: true
          solver_ref: implementation-contract-validator/v1
      - ordinal: 14
        id: target_artifacts
        consumes:
          - implementation_ir
          - target_binding
          - rendering_profile
          - final_conformance_projection
        operations:
          - binding_selection
          - lowering
          - rendering
        produces:
          - final_artifacts
          - final_conformance_receipt
        validation:
          required: true
          final_conformance_required: true
          solver_ref: final-conformance/v1
stage_rules:
  context:
    expression: "StageContext_n = π_stage(ValidatedState_n)"
  solver:
    expression: "Solver(Stage_n) = π_solver(CanonicalCompilationProfile, Stage_n)"
  compile:
    expression: >
      Candidate_(n+1) =
      Compile_(n+1)(
        Project_(n+1)(S_n),
        Input_(n+1)
      )
  validate:
    expression: >
      Receipt_(n+1) =
      Validate_(Solver(n+1))(
        Candidate_(n+1),
        Project_(n+1)(S_n)
      )
  advance:
    expression: >
      Advance(n -> n+1)
      iff
      AuthorityValid
      ∧ UpstreamValid(n)
      ∧ OutputValid(n+1)
      ∧ PreconditionsSatisfied
  commit:
    expression: >
      S_(n+1) =
      Commit(
        S_n,
        Candidate_(n+1),
        Receipt_(n+1)
      )
      iff Receipt_(n+1) = PASS
  failure:
    default_action: repair_current_stage
    upstream_exception: >
      When mechanical evidence proves an admitted upstream semantic
      assumption invalid or unsatisfiable, create a new upstream revision
      and invalidate only its affected transitive dependents.
  historical_state:
    mutate_previous_revision: false
  recompilation:
    expression: >
      Affected(change) =
      TransitiveDependents(changed_semantics)
validation_results:
  - pass
  - fail
  - unsat
  - invalid
  - unknown
