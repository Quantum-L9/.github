schema: l9.architecture-patterns/v1
artifact_id: l9.architecture-patterns/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_architecture_patterns
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: architecture_patterns.yaml
global_rules:
  patterns_are_not_complete_architectures: true
  patterns_do_not_create_semantic_ownership: true
  provider_identity_does_not_define_pattern_identity: true
  patterns_must_be_composable: true
  patterns_must_declare_preconditions: true
  patterns_must_declare_guarantees: true
  patterns_must_declare_forbidden_uses: true
  patterns_must_reference_canonical_vocabulary: true
  patterns_must_not_expand_authority: true
  architecture_synthesis_may_only_select_admitted_patterns: true
pattern_classes:
  semantic_structure:
    definition: >
      Pattern governing semantic ownership, domain boundaries,
      and canonical implementation structure.
  deployment:
    definition: >
      Pattern governing process, package, service, or node topology.
  integration:
    definition: >
      Pattern governing how independently owned semantic components interact.
  projection:
    definition: >
      Pattern governing derived views of canonical semantics.
  execution:
    definition: >
      Pattern governing controlled execution, validation, receipts, and state.
  compiler:
    definition: >
      Pattern governing staged semantic transformation and intermediate
      representations.
  persistence:
    definition: >
      Pattern governing authoritative state, storage adapters, journals,
      caches, and derived materializations.
  governance:
    definition: >
      Pattern governing authority, admission, distribution, and control-plane
      separation.
patterns:
  - id: l9.pattern/semantic-core-provider-adapter@1
    class: semantic_structure
    purpose: >
      Preserve semantic ownership independently of implementation technology
      by isolating canonical domain semantics behind a provider-neutral port.
    structure:
      nodes:
        - semantic_core
        - semantic_port
        - provider_adapter
        - provider
      edges:
        - from: semantic_core
          relation: exposes
          to: semantic_port
        - from: provider_adapter
          relation: implements
          to: semantic_port
        - from: provider_adapter
          relation: binds
          to: provider
    preconditions:
      - semantic_owner_is_explicit
      - semantic_contract_exists
      - provider_capabilities_are_machine_readable
    guarantees:
      - provider_is_replaceable_without_semantic_owner_change
      - provider_specific_details_do_not_define_public_semantics
      - conformance_can_be_applied_independently_of_provider
    required_capabilities:
      - contract_versioning
      - provider_binding
      - provider_conformance
    forbidden:
      - provider_becomes_semantic_owner
      - provider_native_contract_exposed_as_domain_contract
      - implementation_details_define_semantics
    common_examples:
      - l9-state_to_mongodb
      - l9-memory_to_graph_provider
      - l9-numerical-reasoning_to_numpy
    compatible_with:
      - l9.pattern/semantic-core-gate-adapter@1
      - l9.pattern/reference-model-conformance@1
      - l9.pattern/dependency-package@1
      - l9.pattern/runnable-node@1
  - id: l9.pattern/semantic-core-gate-adapter@1
    class: integration
    purpose: >
      Expose a semantic owner through the L9 constellation without coupling
      domain semantics to transport or routing mechanics.
    structure:
      nodes:
        - semantic_core
        - capability_adapter
        - gate_sdk
        - gate
      edges:
        - from: capability_adapter
          relation: invokes
          to: semantic_core
        - from: capability_adapter
          relation: uses
          to: gate_sdk
        - from: gate_sdk
          relation: routes_through
          to: gate
    preconditions:
      - semantic_capability_contract_exists
      - gate_sdk_contract_is_available
      - capability_identity_is_registered
    guarantees:
      - transport_does_not_become_semantic_owner
      - node_does_not_require_peer_urls
      - gate_remains_routing_authority
      - TransportPacket_is_used_for_routed_work
    forbidden:
      - direct_peer_routing_when_gate_is_required
      - transport_specific_semantics_in_domain_core
      - application_constructs_transport_authority
    compatible_with:
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/runnable-node@1
  - id: l9.pattern/dependency-package@1
    class: deployment
    purpose: >
      Package canonical semantic implementation for in-process reuse without
      assigning the package an independent constellation runtime identity.
    structure:
      nodes:
        - semantic_core
        - public_api
        - consuming_process
      edges:
        - from: consuming_process
          relation: imports
          to: public_api
        - from: public_api
          relation: exposes
          to: semantic_core
    lifecycle:
      expression: "Lifecycle(package_instance) ⊆ Lifecycle(consumer)"
    runtime_identity:
      expression: "RuntimeIdentity(package_instance) = RuntimeIdentity(consumer)"
    preconditions:
      - public_programmatic_contract_exists
      - independent_deployment_not_required
    guarantees:
      - no_independent_constellation_identity
      - consumer_owns_process_lifecycle
      - semantic_owner_can_remain_independent_of_consumer
    forbidden:
      - implicit_gate_registration
      - separate_runtime_identity_without_explicit_node_binding
    compatible_with:
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/runnable-node@1
  - id: l9.pattern/runnable-node@1
    class: deployment
    purpose: >
      Realize an independently admitted semantic capability as a routable
      constellation runtime identity.
    structure:
      nodes:
        - semantic_core
        - node_adapter
        - gate_sdk
        - runtime_identity
        - health_surface
    preconditions:
      - semantic_capability_contract_exists
      - runtime_identity_is_declared
      - gate_admission_is_supported
      - health_contract_exists
    guarantees:
      - independent_deployment
      - independent_health_and_readiness
      - independent_runtime_identity
      - independent_scaling_boundary
      - explicit_gate_admission
    required_capabilities:
      - gate_transport
      - health_readiness
      - capability_manifest
      - receipt_support
    forbidden:
      - peer_import_of_server_implementation
      - implicit_authority_inheritance
    compatible_with:
      - l9.pattern/semantic-core-gate-adapter@1
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/dependency-package@1
  - id: l9.pattern/dual-surface-sdk-node@1
    class: deployment
    purpose: >
      Allow one semantic implementation to be consumed both in-process as a
      dependency package and independently through a constellation node.
    structure:
      nodes:
        - semantic_core
        - sdk_surface
        - node_surface
        - gate_adapter
      edges:
        - from: sdk_surface
          relation: exposes
          to: semantic_core
        - from: node_surface
          relation: exposes
          to: semantic_core
        - from: node_surface
          relation: uses
          to: gate_adapter
    preconditions:
      - semantic_core_is_transport_independent
      - sdk_and_node_share_same_semantic_contract
    guarantees:
      - one_semantic_implementation
      - multiple_deployment_topologies
      - semantic_identity_preserved_across_surfaces
    forbidden:
      - duplicate_semantic_implementations
      - sdk_and_node_behavioral_drift
    examples:
      - numerical_reasoning_sdk_plus_numerical_reasoning_node
  - id: l9.pattern/reference-model-conformance@1
    class: execution
    purpose: >
      Validate a candidate implementation against independently owned semantic
      behavior rather than allowing the implementation or its generated tests
      to define correctness.
    structure:
      nodes:
        - semantic_contract
        - reference_model
        - candidate_implementation
        - conformance_runner
        - conformance_receipt
      edges:
        - from: semantic_contract
          relation: governs
          to: reference_model
        - from: semantic_contract
          relation: governs
          to: candidate_implementation
        - from: conformance_runner
          relation: compares
          to:
            - reference_model
            - candidate_implementation
    preconditions:
      - independent_semantic_contract_exists
      - comparable_observable_behavior_exists
    guarantees:
      - candidate_does_not_define_its_own_correctness
      - provider_substitution_is_testable
      - generated_implementation_can_be_independently_validated
    forbidden:
      - generated_code_and_generated_tests_as_only_authority
      - validator_reuses_same_buggy_interpretation_path_when_independence_is_required
    compatible_with:
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/fixture-backed-conformance@1
  - id: l9.pattern/fixture-backed-conformance@1
    class: execution
    purpose: >
      Convert formal laws into concrete reusable semantic cases and execute
      them consistently across implementations.
    structure:
      nodes:
        - semantic_law_ir
        - fixture_ir
        - conformance_ir
        - target_binding
        - executable_cases
      edges:
        - from: semantic_law_ir
          relation: derives
          to: fixture_ir
        - from: fixture_ir
          relation: compiles_with
          to: target_binding
        - from: fixture_ir
          relation: lowers_to
          to: conformance_ir
        - from: conformance_ir
          relation: renders_to
          to: executable_cases
    preconditions:
      - applicable_laws_are_admitted
      - fixture_derivation_is_valid
      - target_binding_is_available
    guarantees:
      - fixtures_trace_to_law
      - implementation_is_not_source_of_expected_result
      - same_fixture_semantics_can_target_multiple_test_frameworks
    forbidden:
      - orphan_fixture
      - fixture_creates_new_law
      - test_framework_semantics_override_fixture_semantics
  - id: l9.pattern/canonical-source-derived-projections@1
    class: projection
    purpose: >
      Maintain one authoritative semantic source and compile multiple
      consumer-specific representations without creating competing truth.
    structure:
      nodes:
        - canonical_source
        - projection_compiler
        - derived_projection
      edges:
        - from: projection_compiler
          relation: reads
          to: canonical_source
        - from: projection_compiler
          relation: emits
          to: derived_projection
    preconditions:
      - canonical_source_is_explicit
      - projection_profile_exists
    guarantees:
      - projection_authority_is_less_than_or_equal_to_source_authority
      - staleness_is_digest_detectable
      - multiple_consumers_share_one_semantic_ledger
    required_metadata:
      - source_semantic_digest
      - compiler_version
      - projection_profile_version
      - generated_digest
    forbidden:
      - derived_projection_becomes_independent_source_of_truth
      - separately_maintained_duplicate_semantics
    examples:
      - vocabulary_yaml_to_vocabulary_md
      - vocabulary_yaml_to_vocabulary_json
      - canonical_workflow_to_skill_and_claude_projection
      - repository_semantics_to_AGENTS_and_CLAUDE
  - id: l9.pattern/global-plus-domain-layering@1
    class: semantic_structure
    purpose: >
      Reuse an L9-wide semantic baseline while allowing each domain to add
      specialized laws, fixtures, contracts, and capabilities.
    structure:
      layers:
        - global_baseline
        - domain_semantics
    composition:
      expression: "ResolvedSemantics(domain) = GlobalBaseline ∪ DomainLayer"
    preconditions:
      - global_baseline_is_versioned
      - domain_owner_is_explicit
    guarantees:
      - global_law_is_not_duplicated_in_each_domain
      - domain_can_specialize_without_mutating_global_semantics
    examples:
      - global_fixture_profiles_plus_l9_state_fixtures
      - global_contracts_plus_state_contracts
  - id: l9.pattern/control-plane-execution-plane-separation@1
    class: governance
    purpose: >
      Separate authority and distribution control from executable semantic
      systems and user/agent operating surfaces.
    canonical_roles:
      organization_governance_distribution:
        owner: Quantum-L9/.github
      executable_conformance:
        owner: l9-conformance
      user_agent_operating_plane:
        owner: Cursor-Governance
    guarantees:
      - distribution_does_not_reinterpret_artifacts
      - conformance_does_not_create_global_law
      - operating_plane_consumes_governance_and_conformance
    forbidden:
      - conformance_self_defines_constitutional_law
      - distribution_plane_mutates_payload_semantics
      - operating_plane_becomes_hidden_global_ssot
  - id: l9.pattern/authority-candidate-admission@1
    class: governance
    purpose: >
      Separate candidate generation from authoritative admission using
      immutable digest-bound decisions.
    lifecycle:
      - candidate
      - admission_evaluated
      - awaiting_authority
      - admitted
      - published
    admission_rule:
      expression: >
        Admit(candidate) iff
        AuthorityValid
        ∧ CandidateDigestMatches
        ∧ AdmissionChecksPass
    guarantees:
      - candidate_generation_does_not_equal_authority
      - approval_is_bound_to_exact_candidate_revision
      - changed_candidate_requires_new_authority_decision
    forbidden:
      - floating_approval
      - self_admission_without_grant
  - id: l9.pattern/immutable-revisioned-state@1
    class: persistence
    purpose: >
      Preserve authoritative history by committing new revisions rather than
      mutating previously admitted semantic or operational state.
    structure:
      nodes:
        - current_revision
        - operation_receipt
        - journal
        - historical_revisions
    rules:
      - expected_revision_required_for_transition
      - historical_revision_immutable
      - correction_creates_new_revision
    guarantees:
      - reproducible_history
      - resumable_work
      - surgical_repair_without_history_loss
  - id: l9.pattern/atomic-state-receipt-journal-outbox@1
    class: persistence
    purpose: >
      Ensure authoritative state mutation and its supporting execution evidence
      become externally visible atomically.
    atomic_unit:
      - state_revision
      - operation_receipt
      - journal_event
      - outbox_intent
    invariant:
      expression: >
        Commit =>
        StateRevision
        ∧ OperationReceipt
        ∧ JournalEvent
        ∧ OutboxIntent
    guarantees:
      - no_state_without_receipt
      - no_receipt_without_committed_state
      - event_delivery_can_recover_from_outbox
    compatible_with:
      - l9.pattern/immutable-revisioned-state@1
      - l9.pattern/provider-neutral-persistence@1
  - id: l9.pattern/provider-neutral-persistence@1
    class: persistence
    purpose: >
      Keep semantic persistence law independent of database technology through
      a canonical storage port and conformance requirements.
    structure:
      nodes:
        - semantic_owner
        - storage_port
        - storage_adapter
        - database_provider
    guarantees:
      - database_is_not_semantic_owner
      - backend_replacement_is_conformance_problem
      - public_contract_is_provider_neutral
    examples:
      - l9-state_to_mongodb
      - future_l9-state_to_postgres
  - id: l9.pattern/read-model-non-authority@1
    class: persistence
    purpose: >
      Allow rich materialized views, graphs, indexes, or caches without
      allowing them to manufacture authority.
    structure:
      nodes:
        - authoritative_owner
        - materialized_read_model
    invariant:
      expression: "Authority(ReadModel) < Authority(SourceOwner)"
    guarantees:
      - rich_querying_without_truth_centralization
      - cache_or_graph_failure_does_not_redefine_authority
    examples:
      - Graphiti_world_model
      - Redis_projection_cache
  - id: l9.pattern/facts-plus-lineage-compiled-views@1
    class: projection
    purpose: >
      Store canonical facts and their provenance once and generate multiple
      views rather than maintaining duplicated representations manually.
    invariant:
      expression: "Store(Facts + Lineage); Compile(Views)"
    guarantees:
      - fewer_duplicate_ledgers
      - mechanically_detectable_staleness
      - consumer_specific_views
    compatible_with:
      - l9.pattern/canonical-source-derived-projections@1
  - id: l9.pattern/capability-owner-admission-projection@1
    class: governance
    purpose: >
      Separate semantic capability declaration, runtime admission, and
      consumer-specific capability visibility.
    layers:
      - capability_owner_declaration
      - admission_runtime_state
      - capability_graph_projection
      - consumer_projection
    relations:
      declared:
        implication_to_available: false
      available:
        implication_to_authorized: false
      authorized:
        implication_to_available: false
    guarantees:
      - capability_existence_is_not_permission
      - unavailable_capability_remains_structurally_known
      - agent_views_are_derived_not_independent_truth
  - id: l9.pattern/session-projection-cache@1
    class: projection
    purpose: >
      Materialize digest-addressed derived projections for fast reuse while
      preserving authoritative source validation.
    structure:
      nodes:
        - canonical_inputs
        - projection_compiler
        - digest
        - cache
        - projected_view
    validity:
      expression: >
        ValidProjection iff
        GoverningInputDigests == ProjectionInputDigests
    guarantees:
      - cache_correctness_does_not_depend_on_ttl
      - changed_governing_input_yields_new_digest
      - cache_has_zero_authority
    examples:
      - agent_capability_projection
      - workflow_projection
      - context_bundle
  - id: l9.pattern/stage-scoped-semantic-compilation@1
    class: compiler
    purpose: >
      Build complex artifacts incrementally through ordered validated semantic
      stages, projecting only the minimum sufficient upstream semantics into
      each stage.
    formula:
      context:
        expression: "C_n = π_stage(S_n)"
      candidate:
        expression: "Candidate_(n+1) = Compile_(n+1)(C_n, Input_(n+1))"
      validation:
        expression: >
          Receipt_(n+1) =
          Validate_(Solver(n+1))(Candidate_(n+1), C_n)
      commit:
        expression: >
          S_(n+1) =
          Commit(S_n, Candidate_(n+1), Receipt_(n+1))
          iff Receipt_(n+1) = PASS
    guarantees:
      - bounded_stage_context
      - early_error_localization
      - validated_outputs_feed_next_stage
      - downstream_stage_cannot_advance_over_failed_stage
    compatible_with:
      - l9.pattern/proof-carrying-stage-state@1
      - l9.pattern/incremental-semantic-recompilation@1
  - id: l9.pattern/proof-carrying-stage-state@1
    class: compiler
    purpose: >
      Bind each admitted compilation-stage artifact to provenance, source
      digests, validation evidence, profile identity, and state revision.
    required_components:
      - artifact_digest
      - provenance
      - validation_receipt
      - source_digests
      - compilation_profile_digest
      - state_revision
    guarantees:
      - stage_can_resume_without_conversation_history
      - downstream_compilation_can_trust_exact_upstream_coordinates
  - id: l9.pattern/incremental-semantic-recompilation@1
    class: compiler
    purpose: >
      Repair changed semantics by creating new upstream revisions and
      recompiling only their transitive semantic dependents.
    formula:
      affected:
        expression: "Affected(change) = TransitiveDependents(change)"
    workflow:
      - validation_failure
      - identify_failure_or_unsat_core
      - resolve_provenance
      - revise_earliest_affected_semantic_artifact
      - invalidate_transitive_dependents
      - recompile_affected_subgraph
      - revalidate
    guarantees:
      - history_not_rewritten
      - unrelated_valid_artifacts_remain_valid
      - repair_surface_is_minimized
  - id: l9.pattern/stage-specific-mechanical-validation@1
    class: compiler
    purpose: >
      Validate each semantic compilation stage using only the solver declared
      for that stage by the canonical compilation profile.
    solver_selection:
      expression: >
        Solver(Stage_n) =
        π_solver(CanonicalCompilationProfile, Stage_n)
    allowed_results:
      - pass
      - fail
      - unsat
      - invalid
      - unknown
    forbidden:
      - ad_hoc_solver_selection
      - probably_ok
      - llm_opinion_as_mechanical_validation
    guarantees:
      - validator_identity_is_receiptable
      - validation_is_profile_bound
      - failures_are_stage_local_when_possible
  - id: l9.pattern/global-fixture-domain-binding@1
    class: projection
    purpose: >
      Define reusable global fixture templates and specialize them through
      domain-specific bindings without duplicating global semantic law.
    structure:
      nodes:
        - global_fixture_template
        - domain_binding
        - mixed_fixture
    composition:
      expression: >
        MixedFixture =
        Bind(GlobalFixtureTemplate, DomainBinding)
    guarantees:
      - global_template_stays_thin
      - domains_only_supply_specialization
      - global_law_remains_single_source
  - id: l9.pattern/harvest-promote-recompile@1
    class: governance
    purpose: >
      Harvest recurring domain semantics, propose higher-scope law, require
      authoritative promotion, and then recompile canonical global artifacts.
    workflow:
      - normalize_domain_laws
      - identify_repeated_semantics
      - emit_globalization_candidate
      - request_authorized_global_state_change
      - admit_global_invariant_or_contract
      - compile_global_law
      - derive_global_fixture
      - publish_global_profile
    guarantees:
      - repetition_does_not_self_create_global_authority
      - harvested_intelligence_can_propagate_constellation_wide_after_admission
composition_rules:
  - id: l9.compose/semantic-node@1
    when:
      node_type: semantic_node
    require_patterns:
      - l9.pattern/semantic-core-gate-adapter@1
      - l9.pattern/runnable-node@1
      - l9.pattern/authority-candidate-admission@1
    recommend_patterns:
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/reference-model-conformance@1
      - l9.pattern/fixture-backed-conformance@1
  - id: l9.compose/dependency-package@1
    when:
      node_type: dependency_package
    require_patterns:
      - l9.pattern/dependency-package@1
    recommend_patterns:
      - l9.pattern/semantic-core-provider-adapter@1
      - l9.pattern/reference-model-conformance@1
  - id: l9.compose/dual-surface-semantic-component@1
    when:
      deployment_modes:
        - dependency_package
        - runnable_node
    require_patterns:
      - l9.pattern/dual-surface-sdk-node@1
      - l9.pattern/semantic-core-gate-adapter@1
  - id: l9.compose/stateful-authoritative-node@1
    when:
      properties:
        - authoritative_state
        - durable_mutation
    require_patterns:
      - l9.pattern/immutable-revisioned-state@1
    recommend_patterns:
      - l9.pattern/atomic-state-receipt-journal-outbox@1
      - l9.pattern/provider-neutral-persistence@1
  - id: l9.compose/compiled-projection-owner@1
    when:
      properties:
        - canonical_source
        - multiple_derived_views
    require_patterns:
      - l9.pattern/canonical-source-derived-projections@1
    recommend_patterns:
      - l9.pattern/facts-plus-lineage-compiled-views@1
      - l9.pattern/session-projection-cache@1
architecture_synthesis:
  inputs:
    required:
      - project_spec
      - admitted_project_contracts
      - applicable_invariants
      - applicable_laws
      - applicable_conformance
      - desired_capabilities
      - technology_capabilities
      - node_archetype
    optional:
      - deployment_constraints
      - performance_constraints
      - availability_constraints
      - data_residency_constraints
      - cost_constraints
      - existing_architecture_ir
  process:
    - project_applicable_patterns
    - resolve_required_patterns_from_node_archetype
    - resolve_patterns_from_capability_requirements
    - reject_patterns_with_unsatisfied_preconditions
    - reject_forbidden_pattern_combinations
    - compose_candidate_pattern_graph
    - validate_required_guarantees
    - validate_capability_coverage
    - validate_authority_boundaries
    - compile_architecture_ir
  output:
    - architecture_ir
    - selected_pattern_refs
    - rejected_pattern_refs
    - unresolved_pattern_gaps
    - architecture_validation_requirements
projection_profiles:
  architecture_stage:
    include:
      - pattern_id
      - class
      - purpose
      - structure
      - preconditions
      - guarantees
      - required_capabilities
      - forbidden
      - compatible_with
      - composition_rules
  semantic_compiler:
    include:
      - pattern_id
      - structure
      - preconditions
      - guarantees
      - required_capabilities
      - forbidden
      - compatible_with
      - composition_rules
  architect_agent:
    include:
      - pattern_id
      - purpose
      - guarantees
      - forbidden
      - common_examples
      - compatible_with
  code_compilation:
    include:
      - selected_pattern_refs
      - required_structure
      - required_ports
      - provider_binding_requirements
      - required_conformance
  human_architecture_doc:
    include:
      - pattern_id
      - purpose
      - structure
      - guarantees
      - common_examples
  conformance:
    include:
      - pattern_id
      - preconditions
      - guarantees
      - forbidden
      - required_capabilities
  impact_analysis:
    include:
      - pattern_id
      - dependencies
      - compatible_with
      - composition_rules
validation_rules:
  - id: ARCH-PATTERN-001
    rule: every_pattern_has_unique_id
