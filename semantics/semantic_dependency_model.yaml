schema: l9.semantic-dependency-model/v1
artifact_id: l9.semantic-dependency-model/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_semantic_dependency_model
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: semantic_dependency_model.yaml
dependency_rules:
  fixture:
    depends_on:
    - source_law_identity
    - source_law_digest
    - derivation_profile_ref
    - derivation_profile_digest
    change_effect: fixture_stale
  fixture_profile:
    depends_on:
    - fixture_refs
    - fixture_digests
    membership_change_requires_new_profile_version: true
    existing_profile_versions_are_immutable: true
  conformance:
    depends_on:
    - resolved_profile_refs
    - resolved_profile_digests
    - fixture_refs
    - fixture_digests
    - binding_identity
    - implementation_or_repository_revision
    receipt_binds_exact_closure: true
  capability_declaration:
    depends_on:
    - semantic_owner
    - semantic_scope
    - effect_class
    - required_capability_refs
    - applicable_contract_refs
    - authorization_requirement_refs
    material_change_effect: new_admission_decision_required_unless_compatibility_preserves_prior_decision
    provider_realization_change_alone_does_not_change_semantic_identity: true
  receipt:
    depends_on:
    - exact_subject_ref
    - governing_coordinates
    - claim
    - verification_basis
    material_subject_or_coordinate_change_effect: non_current_unless_compatibility_preserves_applicability
    prior_receipt_remains_immutable: true
  product_topology:
    depends_on:
    - vocabulary
    - invariants
    - contracts
    - capability_semantics
    - product_kinds
    - node_archetypes
    - dependency_archetypes
    - technology_profile_semantics
    change_effect: product_kind_archetype_requirement_and_resolution_closure_stale
  requirement_closure:
    depends_on:
    - product_topology
    - identity_topology_resolution
    - product_kind_resolution
    - product_archetype_resolution
    - invariants
    - contracts
    - capabilities
    - authority_model
    - requirement_model
    change_effect: semantic_resolution_stale
  capability_closure:
    depends_on:
    - requirement_closure
    - capabilities
    - capability_resolution
    - contracts
    change_effect: architecture_and_conformance_resolution_stale
  architecture_resolution:
    depends_on:
    - requirement_closure
    - capability_closure
    - product_kind_resolution
    - product_archetype_resolution
    - architecture_rules
    - architecture_patterns
    - node_archetypes
    - dependency_archetypes
    change_effect: ports_and_product_manifest_stale
  port_resolution:
    depends_on:
    - architecture_resolution
    - port_catalog
    - contracts
    - capabilities
    change_effect: technology_binding_and_product_manifest_stale
  provider_binding_resolution:
    depends_on:
    - port_resolution
    - technology_profiles
    - technology_capabilities
    - binding_catalog
    change_effect: product_manifest_and_implementation_stale
  conformance_requirement_resolution:
    depends_on:
    - invariants
    - contracts
    - capabilities
    - architecture_resolution
    - port_resolution
    - conformance_model
    change_effect: product_manifest_and_conformance_closure_stale
  product_manifest:
    depends_on:
    - product_topology
    - identity_topology_resolution
    - product_kind_resolution
    - product_archetype_resolution
    - requirement_closure
    - capability_closure
    - architecture_resolution
    - port_resolution
    - provider_binding_resolution
    - conformance_requirement_resolution
    - compilation_profile
    - compiler_coordinates
    change_effect: implementation_and_target_artifacts_stale
  product_kind_resolution:
    depends_on:
    - product_topology
    - product_kinds
    change_effect: archetype_architecture_and_manifest_stale
  product_archetype_resolution:
    depends_on:
    - product_topology
    - product_kind_resolution
    - node_archetypes
    - dependency_archetypes
    change_effect: architecture_ports_and_manifest_stale
  identity_topology_resolution:
    depends_on:
    - product_topology
    - product_kind_resolution
    - product_archetype_resolution
    - identity_model
    - contracts
    - authority_model
    change_effect: requirement_product_manifest_and_identity_consumers_stale
invalidation_rules:
  source_digest_change: mark_transitive_dependents_stale
  profile_digest_change: mark_profile_dependents_stale
  upstream_revision_change: evaluate_dependency_impact
  historical_artifacts_are_immutable: true
  repair_default: repair_current_stage_when_upstream_assumptions_remain_valid
  upstream_conflict: create_new_upstream_revision_then_invalidate_transitive_dependents
  affected_expression: Affected(change) = TransitiveDependents(changed_semantics)
  silent_consumption_of_stale_input_forbidden: true
