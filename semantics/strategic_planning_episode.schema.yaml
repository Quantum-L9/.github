schema: l9.schema-definition/v1
artifact_id: l9.schema/strategic-planning-episode@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_strategic_planning_episode_schema
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: strategic_planning_episode.schema.yaml
governed_by:
  semantic_model_ref: strategic_cognition_model.yaml#reasoning_artifacts.strategic_planning_episode
  plan_graph_schema_ref: l9.schema/strategic-plan-graph@1
  authority_ref: authority_model.yaml#strategic_authority
purpose: >
  Define the minimum immutable record of one bounded Plan Keeper reasoning
  episode over exact planning inputs. The episode preserves observations,
  assumptions, candidate paths, evaluations, material Unknowns, and a
  recommendation without turning workspace content into Strategy or granting
  the episode authority to revise the Strategic Plan.
instance_semantics:
  authority_class: derived
  authoritative: false
  authority_effect: none
  producer_role: plan_keeper
type: object
required:
- schema
- episode_ref
- plan_ref
- plan_revision_ref
- plan_graph_digest
- strategic_authority_ref
- strategic_intent_refs
- objective_refs
- current_meta_view
- trigger_sources
- workspace
- recommendation
- provenance
- episode_digest
properties:
  schema:
    const: l9.strategic-planning-episode/v1
  episode_ref:
    type: semantic_ref
  plan_ref:
    type: semantic_ref
  plan_revision_ref:
    type: semantic_ref
  plan_graph_digest:
    type: semantic_digest
  strategic_authority_ref:
    type: semantic_ref
  strategic_intent_refs:
    type: semantic_ref_list
    min_items: 1
  objective_refs:
    type: semantic_ref_list
  current_meta_view:
    type: object
    required:
    - ref
    - digest
    fields:
      ref:
        type: semantic_ref
      digest:
        type: semantic_digest
  affected_closure:
    type: object
    required:
    - ref
    - digest
    fields:
      ref:
        type: semantic_ref
      digest:
        type: semantic_digest
  trigger_sources:
    type: array
    items:
      type: object
      required:
      - ref
      - digest
      fields:
        ref:
          type: semantic_ref
        digest:
          type: semantic_digest
        change_ref:
          type: semantic_ref
  workspace:
    type: object
    required:
    - decision_question
    - observations
    - assumptions
    - candidate_paths
    - evaluations
    - material_unknowns
    fields:
      decision_question:
        type: string
      observations:
        type: array
        items:
          type: object
          required:
          - ref
          - statement
          - source_refs
          fields:
            ref:
              type: semantic_ref
            statement:
              type: string
            source_refs:
              type: semantic_ref_list
              min_items: 1
      assumptions:
        type: array
        items:
          type: object
          required:
          - ref
          - statement
          fields:
            ref:
              type: semantic_ref
            statement:
              type: string
            basis_refs:
              type: semantic_ref_list
            status:
              enum:
              - provisional
              - challenged
              - retained_for_episode
      candidate_paths:
        type: array
        items:
          type: object
          required:
          - ref
          - statement
          - disposition
          fields:
            ref:
              type: semantic_ref
            statement:
              type: string
            rationale_refs:
              type: semantic_ref_list
            disposition:
              enum:
              - considered
              - rejected
              - recommended_for_candidate
      evaluations:
        type: array
        items:
          type: object
          required:
          - ref
          - subject_ref
          - result
          fields:
            ref:
              type: semantic_ref
            subject_ref:
              type: semantic_ref
            objective_refs:
              type: semantic_ref_list
            evidence_refs:
              type: semantic_ref_list
            result:
              enum:
              - favorable
              - unfavorable
              - mixed
              - unknown
            rationale:
              type: string
      material_unknowns:
        type: unknown_list
  recommendation:
    type: object
    required:
    - outcome
    - authority_effect
    fields:
      outcome:
        enum:
        - retain_current_plan
        - propose_revision
        - unresolved
      candidate_path_ref:
        type: semantic_ref_or_null
      rationale_refs:
        type: semantic_ref_list
      authority_effect:
        const: none
  provenance:
    type: object
  episode_digest:
    type: semantic_digest
workspace_rules:
  observations_reference_sources_but_do_not_take_truth_ownership: true
  assumptions_are_provisional_reasoning_objects_not_plan_owned_beliefs: true
  candidate_paths_are_not_strategic_commitments: true
  evaluations_do_not_create_objective_or_evidence_authority: true
  recommendation_is_not_a_strategic_decision: true
  propose_revision_outcome_requires_separate_revision_candidate_artifact: true
  changed_bound_input_digest_invalidates_episode_currentness: true
semantic_rules:
- planning_episode_is_non_authoritative_reasoning_record
- reasoning_workspace_content_is_not_strategic_plan_content_without_authorized_decision
- planning_episode_may_record_alternatives_without_committing_to_them
- material_unknown_must_remain_unknown
- episode_cannot_modify_strategic_plan
- episode_cannot_grant_or_expand_strategic_authority
- episode_is_provider_model_prompt_and_storage_neutral
