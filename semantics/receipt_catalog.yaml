schema: l9.receipt-catalog/v1
artifact_id: l9.receipt-catalog/global@1
status: active
canonical: true

authority:
  owner: Quantum-L9/.github
  scope: l9_global_receipt_semantics
  authority_class: canonical

canonical_source:
  format: yaml
  artifact: receipt_catalog.yaml

derivation:
  source_artifacts:
    - artifact: invariants.yaml
      artifact_id: l9.invariants/global@1
      sha256: 771e3509703ea7d177a4bbac965e126f77f390ec359d1544854d95ec4374082a
      admission: canonical_active
    - artifact: contracts.yaml
      artifact_id: l9.contracts/global@1
      sha256: f19481596e2ec75c46495158fa7a36f2a9f7b8eac4b0357cfb7a08ceb10e6034
      admission: canonical_active
    - artifact: capabilities.yaml
      artifact_id: l9.capabilities/global@1
      sha256: 64eeb55516e90d167990e20e16e5aeb455fc3548ef828c9b6aa94a74f8a03efd
      admission: canonical_active
  rule: >
    Define one global receipt kernel and a bounded family registry without
    absorbing domain-owned payload semantics, lifecycle transitions, or global
    error/result taxonomy.

global_rules:
  receipt_is_evidence: true
  receipt_does_not_grant_semantic_authority: true
  receipt_does_not_grant_execution_authority: true
  receipt_claim_scope_must_be_explicit: true
  exact_subject_binding_is_required: true
  materially_governing_coordinates_must_be_bound: true
  declared_observation_or_outcome_is_required: true
  verification_must_not_depend_only_on_the_recorded_verdict: true
  receipt_digest_is_required: true
  receipt_content_is_immutable_by_digest: true
  material_subject_change_makes_prior_receipt_non_current_unless_compatibility_preserves_it: true
  result_semantics_remain_owned_by_the_applicable_contract_or_taxonomy: true
  receipt_family_registration_does_not_transfer_domain_semantic_ownership: true
  receipt_presence_does_not_imply_capability_admission_availability_authorization_or_invocability:
    true
  receipt_lifecycle_is_defined_separately: true

receipt_kernel:
  required_semantics:
    - receipt_type
    - receipt_identity
    - exact_subject_ref
    - claim
    - governing_coordinates
    - observation_or_outcome
    - verification_basis
    - producer_identity
    - receipt_digest
  field_semantics:
    receipt_type: >
      Versioned receipt-family identity registered in this catalog or in an
      explicitly owned domain extension.
    receipt_identity: >
      Stable identity of the emitted evidence artifact. Identity is distinct
      from the subject being evidenced.
    exact_subject_ref: >
      Exact artifact, operation, decision, implementation, repository revision,
      or other subject to which the receipt's claim applies.
    claim: >
      Bounded assertion the receipt is evidence for. The claim must not exceed
      the observation, evaluation, or decision actually evidenced.
    governing_coordinates: >
      Revisions, digests, profiles, rulesets, bindings, source identities, or
      other coordinates material to the claim's validity.
    observation_or_outcome: >
      The observation or outcome recorded under the applicable family contract.
      This field does not create a global result taxonomy.
    verification_basis: >
      Evidence, criteria, references, proofs, or reproducible checks sufficient
      for an independent verifier to assess the receipt's bounded claim without
      relying only on the producer's recorded verdict.
    producer_identity: >
      Identity of the component, authority, validator, or executor that emitted
      the receipt. Producer identity does not imply semantic ownership.
    receipt_digest: >
      Deterministic content digest of the receipt under its applicable schema.
  authority:
    class: evidence
    grants_semantic_authority: false
    grants_execution_authority: false
    may_replace_admission_decision: false
  currentness:
    rule: >
      Currentness is evaluated against the receipt's governing coordinates. A
      material coordinate or subject change makes the receipt non-current unless
      an explicit compatibility contract preserves applicability.
    currentness_is_authority: false
  forbidden:
    - ambient_head_phase_or_flag_as_only_subject_binding
    - producer_verdict_as_only_verification_basis
    - receipt_as_authorization
    - receipt_as_canonical_semantic_source
    - receipt_rebinding_to_materially_changed_subject
    - silent_result_semantic_reinterpretation

specialization_contract:
  required:
    - family_id
    - semantic_owner
    - purpose
    - additional_required_semantics
    - result_semantics_source
    - forbidden
  rules:
    - specialization_inherits_receipt_kernel
    - specialization_may_narrow_or_strengthen_kernel_requirements
    - specialization_must_not_weaken_kernel_requirements
    - specialization_must_not_transfer_semantic_ownership
    - specialization_must_not_define_unowned_global_result_semantics

receipts:
  validation:
    family_id: l9.receipt/validation@1
    semantic_owner: applicable_validation_semantic_owner
    purpose: >
      Evidence that an exact candidate was mechanically evaluated against exact
      validation criteria and governing solver/profile coordinates.
    additional_required_semantics:
      - candidate_ref
      - candidate_digest
      - validator_or_solver_ref
      - validator_or_solver_version
      - validation_profile_or_ruleset_digest
      - applicable_constraint_refs
      - result
      - evidence
    result_semantics_source: error_taxonomy.result_domains.validation
    rules:
      - validation_receipt_is_observational_and_non_mutating
      - unknown_must_remain_explicit
      - compiler_validation_may_emit_a_compiler_receipt_conforming_to_this_family
    forbidden:
      - validation_receipt_as_admission
      - validation_receipt_as_authorization
      - validation_repair_hidden_inside_receipt

  compilation:
    family_id: l9.receipt/compilation@1
    semantic_owner: l9-semantic-compiler
    purpose: >
      Evidence of a declared Semantic Compiler operation executed against exact
      inputs, profiles, outputs, and compiler coordinates.
    additional_required_semantics:
      - operation
      - input_refs_and_digests
      - profile_ref_and_digest
      - output_ref_and_digest_when_applicable
      - compiler_identity_and_version
      - result
    result_semantics_source: compiler_contract.yaml
    schema_ref: compiler_receipt.schema.yaml
    rules:
      - compiler_receipt_does_not_admit_compiler_output
      - operation_validation_must_satisfy_validation_receipt_semantics
      - compiler_receipt_preserves_input_and_profile_provenance
    forbidden:
      - compiler_receipt_as_global_law
      - compiler_receipt_as_self_admission
      - silent_profile_or_operation_switch

  conformance:
    family_id: l9.receipt/conformance@1
    semantic_owner: l9-conformance
    purpose: >
      Evidence binding an exact implementation or repository revision to the
      exact conformance/profile closure executed and the observed conformance
      outcome.
    additional_required_semantics:
      - implementation_or_repository_revision
      - semantic_source_digests
      - resolved_profile_refs_and_digests
      - fixture_or_case_closure_digest
      - implementation_or_provider_identity
      - observed_results
    result_semantics_source: l9-conformance
    rules:
      - conformance_receipt_does_not_grant_authority
      - changed_subject_or_fixture_closure_requires_currentness_re_evaluation
      - system_under_test_must_not_define_expected_semantics
    forbidden:
      - conformance_receipt_as_execution_authorization
      - stale_receipt_as_current_evidence
      - implementation_defined_correctness

  admission:
    family_id: l9.receipt/admission@1
    semantic_owner: applicable_target_class_authority
    purpose: >
      Evidence that an admission or promotion decision was evaluated and issued
      for an exact subject under exact authority and decision coordinates.
    additional_required_semantics:
      - candidate_or_subject_ref
      - candidate_or_subject_digest
      - target_semantic_or_authority_class
      - decision_ref
      - decision_authority_ref
      - decision_result
    result_semantics_source: l9.contract/admission-and-promotion@1
    rules:
      - admission_receipt_is_evidence_of_decision_not_the_decision_authority_itself
      - changed_subject_requires_new_decision_or_explicit_compatibility
    forbidden:
      - receipt_as_admission_authority
      - floating_approval_across_revisions
      - producer_self_admission_without_target_class_authority

  distribution:
    family_id: l9.receipt/distribution@1
    semantic_owner: Quantum-L9/.github
    purpose: >
      Evidence that an exact published artifact/profile release was dispatched
      or materialized for declared consumers under exact distribution
      coordinates.
    additional_required_semantics:
      - published_artifact_or_profile_ref
      - published_digest
      - consumer_selector_or_target
      - distribution_coordinates
      - observed_distribution_result
    result_semantics_source: applicable_distribution_contract
    rules:
      - distribution_does_not_reinterpret_payload_semantics
      - distribution_receipt_does_not_prove_consumer_conformance
    forbidden:
      - payload_semantic_mutation
      - distribution_receipt_as_consumer_acceptance_without_reconciliation

  reconciliation:
    family_id: l9.receipt/reconciliation@1
    semantic_owner: applicable_reconciliation_semantic_owner
    purpose: >
      Evidence comparing an exact intended state or release coordinate against
      an exact observed target state and recording the bounded reconciliation
      result.
    additional_required_semantics:
      - intended_state_ref_or_digest
      - observed_target_ref_or_revision
      - reconciliation_contract_ref
      - observed_reconciliation_result
    result_semantics_source: applicable_reconciliation_contract
    rules:
      - reconciliation_evidence_is_bound_to_observed_target_coordinates
      - unknown_or_unobservable_target_state_remains_explicit
    forbidden:
      - reconciliation_receipt_as_semantic_authority
      - unobserved_target_state_as_reconciled

receipt_relations:
  verifies:
    subject: receipt
    object: bounded_claim
    semantics: receipt_supplies_evidence_for_claim_without_becoming_claim_authority
  specializes:
    subject: receipt_family
    object: receipt_kernel
    semantics: specialization_inherits_and_may_strengthen_global_kernel
  current_for:
    subject: receipt
    object: governing_coordinates
    semantics:
      receipt_is_current_only_when_declared_material_coordinates_match_or_compatibility_preserves_applicability
