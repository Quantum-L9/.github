schema: l9.authority-model/v1
artifact_id: l9.authority-model/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_authority_model
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: authority_model.yaml
authority_classes:
  global_governance:
    owner: Quantum-L9/.github
    roles:
    - organization_governance_plane
    - organization_control_plane
    - organization_distribution_plane
    - canonical_l9_vocabulary_owner
    does_not_own:
    - executable_conformance_semantics
  canonical:
    meaning: Authoritative within the declared semantic owner scope.
    implicit_derivation_allowed: false
  derived:
    meaning: Derived from upstream authority and cannot expand authority.
    may_self_promote: false
  candidate:
    meaning: Proposed artifact pending validation and authorized admission.
    authoritative: false
  evidence:
    meaning: Records an observed operation or validation result.
    grants_authority: false
admission_rules:
  global_requirements: &id001
  - exact_subject_identity
  - exact_subject_revision_or_digest_when_revisioned
  - target_semantic_or_authority_class
  - target_class_authority
  - explicit_decision_record
  - explicit_compatibility_contract_when_reusing_prior_decision_after_material_change
  candidate_generation_is_not_admission: true
  self_admission_without_target_class_authority_forbidden: true
  changed_material_subject_requires_new_decision_unless_compatibility_preserves_it: true
global_admission_rules:
  requirements: *id001
  requires_global_authority: true
  candidate_generation_is_not_admission: true
promotion_rules:
  sequence:
  - admitted_domain_laws
  - harvest
  - globalization_candidate
  - authorized_global_state_change
  - global_invariant_or_contract
  - canonical_global_law
  - global_fixture
  - published_global_profile
  globalization_candidate_is_not_global_authority: true
  authorized_global_state_change_required: true
compiler_authority:
  semantic_owner: l9-semantic-compiler
  may:
  - project
  - derive_when_profile_allows
  - synthesize_candidates
  - resolve_registered_bindings
  - lower
  - render
  - mechanically_validate
  - emit_receipts
  - mark_artifacts_stale
  - propose_recompilation
  may_not:
  - admit_global_law
  - admit_project_semantics_without_authority
  - self_expand_authority
  - redefine_canonical_vocabulary
  - redefine_canonical_profiles
  - reinterpret_failed_validation_as_success
fixture_admission:
  inherits_global_requirements: *id001
  hard_checks:
  - authority_valid
  - source_traceable
  - derivation_valid
  - deterministic
  - reproducible
  - non_vacuous
  - independent
  - executable
  - non_conflicting
  - version_valid
  results:
  - admitted_domain
  - admitted_global
  - admitted_mixed
  - propose_global_law
  - unresolved
  - rejected
global_promotion:
  candidate: globalization_candidate
  requires:
  - cross_domain_evidence
  - authorized_global_state_change
  automatic_promotion_forbidden: true
profile_publication:
  canonical_identity_required: true
  immutable_digest_required: true
  catalog_entry_required: true
  profile_membership_required: true
  distribution_availability_required: true
  existing_profile_versions_are_immutable: true
project_contract_admission:
  requires:
  - validated_global_baseline
  - product_topology_or_requirements
  - mechanical_validation
  - valid_authority
  downstream_use_requires_admission: true
agent_authority:
  rules:
  - authority_must_be_explicit
  - agent_must_not_self_expand_authority
  - bounded_autonomy_requires_explicit_scope
  - conformance_evidence_does_not_grant_authority
human_authority:
  rules:
  - authority_must_be_explicit
  - approval_binds_exact_candidate_digest
  - changed_candidate_requires_new_decision
escalation_rules:
  authority_missing: block
  semantic_conflict: block
  unknown: remain_unknown
  changed_candidate_after_decision: require_new_decision
distribution_authority:
  owner: Quantum-L9/.github
  roles:
  - organization_control_plane
  - organization_distribution_plane
  may_not:
  - reinterpret_payload_semantics
  - mutate_distributed_semantics
rollout_authority:
  owner: Quantum-L9/.github
  rule: distribution_does_not_reinterpret_artifacts
product_topology_authority:
  semantic_owner: product_semantic_owner
  global_schema_owner: Quantum-L9/.github
  status: candidate_until_admitted
  compiler_may:
  - validate_structure
  - normalize_representation
  - resolve_references
  - derive_governed_consequences
  - resolve_kind_and_archetype_obligations
  compiler_may_not:
  - invent_product_purpose
  - invent_product_boundary
  - invent_product_kind
  - invent_product_archetype
  - mutate_admitted_product_contract
  - infer_undeclared_authority
  - replace_product_owner_decisions
  rule: An admitted ProductTopology is the authoritative product contract. Compilation may derive consequences but
    may not reinterpret product-owned semantics.
product_manifest_authority:
  artifact_class: derived
  semantic_owner: l9-semantic-compiler
  product_authority: false
  implementation_gate: resolved_manifest_gate_must_pass_before_lowering
  rule: ProductManifest records the exact resolved realization closure and never becomes the owner of ProductTopology
    or domain semantics.
identity_authority:
  global_semantics_owner: Quantum-L9/.github
  product_identity_owner: product_semantic_owner
  actor_identity_source: admitted_actor_registry_or_authorized_identity_owner
  runtime_and_surface_resolution_owner: applicable_identity_resolution_contract
  governance_profile_owner: applicable_governance_owner
  rules:
  - identity_resolution_does_not_create_actor_authority
  - identity_assertion_does_not_grant_authorization
  - governance_profile_selection_does_not_rewrite_identity
  - memory_and_receipt_consumers_do_not_own_actor_identity_semantics
strategic_cognition_authority:
  global_semantics_owner: Quantum-L9/.github
  detailed_model: strategic_cognition_model.yaml
  invariant_ref: L9-STRATEGY-001
  strategic_plan_owner: plan_keeper
  strategic_plan_authority_source: explicitly_granted_strategic_authority
  strategic_plan_reasoning_analysis_owner: strategic_plan_metacognitive_reasoner
  metacognition_denied:
  - strategic_plan_mutation
  - strategic_plan_supersession
  - strategic_authority
  roles_are_actor_identities: false
  rules:
  - reasoning_capability_does_not_confer_strategic_authority
  - metacognitive_output_is_advisory_to_plan_keeper
  - projection_consumption_does_not_transfer_truth_source_ownership
  - semantic_compiler_does_not_own_strategic_cognition
