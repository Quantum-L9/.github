type: object
required:
- invariants
- contracts
- authority_model
- strategic_cognition_model
- strategic_plan_model
- strategic_plan_graph_schema
- affected_strategic_closure_schema
- strategic_planning_episode_schema
- strategic_plan_revision_candidate_schema
properties:
  schema:
    const: l9.composed-projection.strategic-planning-context/v1
  invariants:
    type: object
    required:
    - invariants
    properties:
      invariants:
        type: array
        min_items: 10
        items:
          type: object
          required:
          - id
          - statement
          - scope
          - owner
          properties:
            id:
              type: string
              enum:
              - L9-AUTH-001
              - L9-AUTH-002
              - L9-OWNER-001
              - L9-SEM-001
              - L9-SCOPE-001
              - L9-DERIVED-001
              - L9-UNKNOWN-001
              - L9-PROV-001
              - L9-PROJECTION-001
              - L9-STRATEGY-001
            statement:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
  contracts:
    type: object
    required:
    - contracts
    properties:
      contracts:
        type: array
        min_items: 3
        items:
          type: object
          required:
          - id
          - purpose
          - scope
          - owner
          - source_invariants
          - applies_to
          - requires
          - guarantees
          - forbidden
          - outcomes
          properties:
            id:
              type: string
              enum:
              - l9.contract/authority-boundary@1
              - l9.contract/semantic-ownership@1
              - l9.contract/projection@1
            purpose:
              type: string
            scope:
              type: string
              const: global
            owner:
              type: string
              const: Quantum-L9/.github
            source_invariants:
              type: string_list
              min_items: 2
            applies_to:
              type: string_list
              min_items: 3
            requires:
              type: string_list
              min_items: 2
            guarantees:
              type: string_list
              min_items: 3
            forbidden:
              type: string_list
              min_items: 4
            outcomes:
              type: object
              required:
              - unresolved
              properties:
                satisfied:
                  type: string
                violated:
                  type: string
                unresolved:
                  type: string
                valid_projection:
                  type: string
                  const: output_is_a_bounded_semantics_preserving_view
                invalid_projection:
                  type: string
                  const: output_invents_reinterprets_reconciles_or_expands_source_semantics
  authority_model:
    type: object
    required:
    - strategic_authority
    - strategic_cognition_authority
    properties:
      strategic_authority:
        type: object
        required:
        - definition
        - strategy_concept_ref
        - grant_must_be_explicit
        - may_not_be_inferred_from
        properties:
          definition:
            type: string
          strategy_concept_ref:
            type: string
            const: strategic_cognition_model.yaml#concepts.strategy
          grant_must_be_explicit:
            type: boolean
            const: true
          may_not_be_inferred_from:
            type: string_list
            min_items: 3
      strategic_cognition_authority:
        type: object
        required:
        - global_semantics_owner
        - detailed_model
        - invariant_ref
        - strategic_plan_owner
        - strategic_plan_authority_source
        - strategic_plan_reasoning_analysis_owner
        - metacognition_denied
        - roles_are_actor_identities
        - rules
        properties:
          global_semantics_owner:
            type: string
            const: Quantum-L9/.github
          detailed_model:
            type: string
            const: strategic_cognition_model.yaml
          invariant_ref:
            type: string
            const: L9-STRATEGY-001
          strategic_plan_owner:
            type: string
            const: plan_keeper
          strategic_plan_authority_source:
            type: string
            const: strategic_authority
          strategic_plan_reasoning_analysis_owner:
            type: string
            const: strategic_plan_metacognitive_reasoner
          metacognition_denied:
            type: string_list
            min_items: 3
          roles_are_actor_identities:
            type: boolean
            const: false
          rules:
            type: string_list
            min_items: 4
  strategic_cognition_model:
    type: object
    required:
    - global_rules
    - concepts
    - roles
    - reasoning_artifacts
    - authority_separation
    properties:
      global_rules:
        type: object
        required:
        - strategic_cognition_does_not_own_underlying_truth_sources
        - strategic_cognition_does_not_own_runtime_execution
        - reasoning_capability_does_not_confer_strategic_authority
        - projection_consumption_does_not_transfer_truth_source_ownership
        - strategic_roles_are_semantic_roles_not_actor_identities
        - strategic_label_does_not_create_authority_or_ownership
        - metacognition_is_advisory_to_strategic_authority
        - semantic_compiler_remains_independent_of_reasoning_plane
        - planning_episode_is_non_authoritative_reasoning_record
        - plan_revision_candidate_is_not_strategy_until_admitted_under_strategic_authority
        - metacognitive_analysis_is_advisory_and_cannot_mutate_strategy
        properties:
          strategic_cognition_does_not_own_underlying_truth_sources:
            type: boolean
            const: true
          strategic_cognition_does_not_own_runtime_execution:
            type: boolean
            const: true
          reasoning_capability_does_not_confer_strategic_authority:
            type: boolean
            const: true
          projection_consumption_does_not_transfer_truth_source_ownership:
            type: boolean
            const: true
          strategic_roles_are_semantic_roles_not_actor_identities:
            type: boolean
            const: true
          strategic_label_does_not_create_authority_or_ownership:
            type: boolean
            const: true
          metacognition_is_advisory_to_strategic_authority:
            type: boolean
            const: true
          semantic_compiler_remains_independent_of_reasoning_plane:
            type: boolean
            const: true
          planning_episode_is_non_authoritative_reasoning_record:
            type: boolean
            const: true
          plan_revision_candidate_is_not_strategy_until_admitted_under_strategic_authority:
            type: boolean
            const: true
          metacognitive_analysis_is_advisory_and_cannot_mutate_strategy:
            type: boolean
            const: true
      concepts:
        type: object
        required:
        - strategy
        - strategic_cognition
        - strategic_plan
        - current_meta_view
        - strategic_intent
        properties:
          strategy:
            type: object
            required:
            - definition
            properties:
              definition:
                type: string
          strategic_cognition:
            type: object
            required:
            - definition
            - consumes
            - maintains
            - does_not_own
            properties:
              definition:
                type: string
              consumes:
                type: string_list
                min_items: 3
              maintains:
                type: string_list
                min_items: 1
              does_not_own:
                type: string_list
                min_items: 7
          strategic_plan:
            type: object
            required:
            - definition
            - owner_role
            - content_defined_here
            - structure_defined_here
            properties:
              definition:
                type: string
              owner_role:
                type: string
                const: plan_keeper
              content_defined_here:
                type: boolean
                const: false
              structure_defined_here:
                type: boolean
                const: false
          current_meta_view:
            type: object
            required:
            - definition
            - authority_class
            - authoritative
            - canonical_source
            - artifact_class_ref
            - component_artifact_class_ref
            - schema_ref
            - properties
            properties:
              definition:
                type: string
              authority_class:
                type: string
                const: derived
              authoritative:
                type: boolean
                const: false
              canonical_source:
                type: boolean
                const: false
              artifact_class_ref:
                type: string
                const: composed_projection
              component_artifact_class_ref:
                type: string
                const: projection_artifact
              schema_ref:
                type: string
                const: l9.schema/composed-projection@1
              properties:
                type: object
                required:
                - derived
                - disposable
                - provenance_preserving
                - invalidated_when_source_truth_changes
                - may_reinterpret_source_truth
                - may_create_authority
                properties:
                  derived:
                    type: boolean
                    const: true
                  disposable:
                    type: boolean
                    const: true
                  provenance_preserving:
                    type: boolean
                    const: true
                  invalidated_when_source_truth_changes:
                    type: boolean
                    const: true
                  may_reinterpret_source_truth:
                    type: boolean
                    const: false
                  may_create_authority:
                    type: boolean
                    const: false
          strategic_intent:
            type: object
            required:
            - definition
            - owned_here
            - owner
            - authority_ref
            properties:
              definition:
                type: string
              owned_here:
                type: boolean
                const: false
              owner:
                type: string
                const: applicable_strategic_authority
              authority_ref:
                type: string
                const: authority_model.yaml#strategic_authority
      roles:
        type: object
        required:
        - plan_keeper
        properties:
          plan_keeper:
            type: object
            required:
            - role_kind
            - actor_identity_binding
            - definition
            - owns
            - reasons_over
            - may
            - authority_source
            - does_not_own
            - may_not
            properties:
              role_kind:
                type: string
                const: semantic_role
              actor_identity_binding:
                type: string
                const: none
              definition:
                type: string
              owns:
                type: string_list
                min_items: 1
              reasons_over:
                type: string_list
                min_items: 3
              may:
                type: string_list
                min_items: 4
              authority_source:
                type: string
                const: strategic_authority
              does_not_own:
                type: string_list
                min_items: 7
              may_not:
                type: string_list
                min_items: 6
      reasoning_artifacts:
        type: object
        required:
        - strategic_planning_episode
        - strategic_plan_revision_candidate
        properties:
          strategic_planning_episode:
            type: object
            required:
            - definition
            - producer_role
            - authority_class
            - schema_ref
            - authority_effect
            - may_not
            properties:
              definition:
                type: string
              producer_role:
                type: string
                const: plan_keeper
              authority_class:
                type: string
                const: derived
              schema_ref:
                type: string
                const: l9.schema/strategic-planning-episode@1
              authority_effect:
                type: string
                const: none
              may_not:
                type: string_list
                min_items: 3
          strategic_plan_revision_candidate:
            type: object
            required:
            - definition
            - producer_role
            - authority_class
            - schema_ref
            - authority_effect
            - may_not
            properties:
              definition:
                type: string
              producer_role:
                type: string
                const: plan_keeper
              authority_class:
                type: string
                const: candidate
              schema_ref:
                type: string
                const: l9.schema/strategic-plan-revision-candidate@1
              authority_effect:
                type: string
                const: none_until_admitted
              may_not:
                type: string_list
                min_items: 3
      authority_separation:
        type: object
        required:
        - invariant_ref
        - resolution_ref
        - strategic_plan_owner
        - strategic_plan_reasoning_analysis_owner
        - teaching_relation
        properties:
          invariant_ref:
            type: string
            const: L9-STRATEGY-001
          resolution_ref:
            type: string
            const: authority_model.yaml#strategic_cognition_authority
          strategic_plan_owner:
            type: string
            const: plan_keeper
          strategic_plan_reasoning_analysis_owner:
            type: string
            const: strategic_plan_metacognitive_reasoner
          teaching_relation:
            type: object
            required:
            - from
            - to
            - carries
            - authority_effect
            properties:
              from:
                type: string
                const: strategic_plan_metacognitive_reasoner
              to:
                type: string
                const: plan_keeper
              carries:
                type: string
                const: planning_cognition_lessons
              authority_effect:
                type: string
                const: none
  strategic_plan_model:
    type: object
    required:
    - global_rules
    - primitives
    - relations
    - relation_rules
    - reasoning_concepts
    properties:
      global_rules:
        type: object
        required:
        - strategic_plan_represents_strategy_without_absorbing_external_truth_ownership
        - strategic_hypothesis_is_plan_owned_belief_not_authoritative_truth
        - reality_change_may_require_reconsideration_but_never_directly_modifies_or_invalidates_strategic_plan
        - reasoning_workspace_content_is_not_strategic_plan_content_without_authorized_decision
        - planning_horizon_does_not_create_primitive_types
        - compound_causal_claims_are_expressible_by_one_strategic_hypothesis
        - outcome_of_one_primitive_does_not_establish_correctness_of_another
        properties:
          strategic_plan_represents_strategy_without_absorbing_external_truth_ownership:
            type: boolean
            const: true
          strategic_hypothesis_is_plan_owned_belief_not_authoritative_truth:
            type: boolean
            const: true
          reality_change_may_require_reconsideration_but_never_directly_modifies_or_invalidates_strategic_plan:
            type: boolean
            const: true
          reasoning_workspace_content_is_not_strategic_plan_content_without_authorized_decision:
            type: boolean
            const: true
          planning_horizon_does_not_create_primitive_types:
            type: boolean
            const: true
          compound_causal_claims_are_expressible_by_one_strategic_hypothesis:
            type: boolean
            const: true
          outcome_of_one_primitive_does_not_establish_correctness_of_another:
            type: boolean
            const: true
      primitives:
        type: object
        required:
        - strategic_goal
        - strategic_target
        - strategic_hypothesis
        - strategic_commitment
        properties:
          strategic_goal:
            type: object
            required:
            - definition
            - question
            properties:
              definition:
                type: string
              question:
                type: string
          strategic_target:
            type: object
            required:
            - definition
            - question
            properties:
              definition:
                type: string
              question:
                type: string
          strategic_hypothesis:
            type: object
            required:
            - definition
            - question
            properties:
              definition:
                type: string
              question:
                type: string
          strategic_commitment:
            type: object
            required:
            - definition
            - question
            properties:
              definition:
                type: string
              question:
                type: string
      relations:
        type: object
        required:
        - advances
        - enables
        - depends_on
        - conflicts_with
        - supersedes
        properties:
          advances:
            type: object
            required:
            - meaning
            properties:
              meaning:
                type: string
          enables:
            type: object
            required:
            - meaning
            properties:
              meaning:
                type: string
          depends_on:
            type: object
            required:
            - meaning
            properties:
              meaning:
                type: string
          conflicts_with:
            type: object
            required:
            - meaning
            properties:
              meaning:
                type: string
          supersedes:
            type: object
            required:
            - semantics_ref
            properties:
              semantics_ref:
                type: string
                const: lifecycle.yaml#lifecycle_relations.supersedes
      relation_rules:
        type: object
        required:
        - relations_do_not_transfer_ownership_or_authority
        - material_causal_enables_claims_remain_attributable_to_a_strategic_hypothesis
        properties:
          relations_do_not_transfer_ownership_or_authority:
            type: boolean
            const: true
          material_causal_enables_claims_remain_attributable_to_a_strategic_hypothesis:
            type: boolean
            const: true
      reasoning_concepts:
        type: object
        required:
        - affected_strategic_closure
        properties:
          affected_strategic_closure:
            type: object
            required:
            - definition
            - purpose
            - representation_schema_ref
            - authority_class
            - authoritative
            - representation_does_not_define_closure_algorithm
            - may_not
            properties:
              definition:
                type: string
              purpose:
                type: string
                const: selective_plan_reconsideration
              representation_schema_ref:
                type: string
                const: l9.schema/affected-strategic-closure@1
              authority_class:
                type: string
                const: derived
              authoritative:
                type: boolean
                const: false
              representation_does_not_define_closure_algorithm:
                type: boolean
                const: true
              may_not:
                type: string_list
                min_items: 4
  strategic_plan_graph_schema:
    type: object
    required:
    - artifact_id
    - canonical
    - authority
    - canonical_source
    - governed_by
    - purpose
    - type
    - required
    - properties
    - reference_rules
    - relation_constraints
    - revision_rules
    - semantic_rules
    properties:
      artifact_id:
        type: string
        const: l9.schema/strategic-plan-graph@1
      canonical:
        type: boolean
        const: true
      authority:
        type: object
        required:
        - owner
        - scope
        - authority_class
        properties:
          owner:
            type: string
            const: Quantum-L9/.github
          scope:
            type: string
            const: l9_global_strategic_plan_graph_schema
          authority_class:
            type: string
            const: canonical
      canonical_source:
        type: object
        required:
        - format
        - artifact
        properties:
          format:
            type: string
            const: yaml
          artifact:
            type: string
            const: strategic_plan_graph.schema.yaml
      governed_by:
        type: object
        required:
        - semantic_model_ref
        - strategic_cognition_ref
        - authority_ref
        - lifecycle_ref
        properties:
          semantic_model_ref:
            type: string
            const: strategic_plan_model.yaml
          strategic_cognition_ref:
            type: string
            const: strategic_cognition_model.yaml
          authority_ref:
            type: string
            const: authority_model.yaml#strategic_authority
          lifecycle_ref:
            type: string
            const: lifecycle.yaml
      purpose:
        type: string
      type:
        type: string
        const: object
      required:
        type: string_list
        min_items: 11
      properties:
        type: object
        required:
        - schema
        - plan_ref
        - revision_ref
        - predecessor_revision_ref
        - strategic_authority_ref
        - scope
        - strategic_intent_refs
        - objective_refs
        - nodes
        - relations
        - provenance
        - graph_digest
        properties:
          schema:
            type: object
            required:
            - const
            properties:
              const:
                type: string
                const: l9.strategic-plan-graph/v1
          plan_ref:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                const: semantic_ref
          revision_ref:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                const: semantic_ref
          predecessor_revision_ref:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                const: semantic_ref
          strategic_authority_ref:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                const: semantic_ref
          scope:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                const: semantic_ref_or_string
          strategic_intent_refs:
            type: object
            required:
            - type
            - min_items
            properties:
              type:
                type: string
                const: semantic_ref_list
              min_items:
