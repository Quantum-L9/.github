  purpose: 'Project the canonical ActorIdentity and SurfaceIdentity entries, their bounded kind and status
    vocabularies, and their typed historical aliases so the Cursor-Governance operating plane can resolve its
    local actor_ref and surface_ref coordinates against one upstream registry without redefining organization
    identity. The projection is derived, non-canonical, provenance-bearing, and invalidated by any material
    change to either registry.

    '
  sources:
    actor_registry:
      selectors:
      - $.schema
      - $.artifact_id
      - $.actor_kinds
      - $.actor_statuses
      - $.actors
      - $.aliases
    surface_registry:
