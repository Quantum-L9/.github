      - $.compiler_authority
      - $.escalation_rules
    artifact_model:
      selectors:
      - $.artifacts.compiled_artifact
      - $.artifacts.receipt
      - $.authority_classes
      - $.derivation_rules
    error_taxonomy:
      selectors:
      - $.errors.semantic
      - $.errors.compiler
      - $.errors.binding
