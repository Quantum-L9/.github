schema: l9.projection-profile-catalog/v1
artifact_id: l9.projection-profile-catalog/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_projection_profiles
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: projection_profiles.yaml
global_rules:
  projection_profiles_are_canonical: true
  projections_are_derived_artifacts: true
  projections_do_not_create_authority: true
  projections_must_preserve_relevant_source_semantics: true
  projections_must_preserve_provenance: true
  projections_must_be_digest_addressable: true
  projection_profiles_must_be_versioned: true
  profile_consumers_must_not_modify_projection_semantics: true
  composed_projections_are_downstream_artifacts: true
  composed_projections_are_not_canonical_projection_profiles: true
  derivation_must_be_declared_separately_from_projection: true
  projection_engine_must_be_deterministic: true
profile_classes:
  consumer:
    definition: 'Projection profile selecting canonical semantics for a specific long-lived L9 consumer.

      '
  stage:
    definition: 'Projection profile selecting the minimum sufficient validated semantics required by one semantic
      compilation stage.

      '
  documentation:
    definition: 'Projection profile selecting canonical semantics for human-readable derived documentation.

      '
  runtime:
    definition: 'Projection profile selecting semantics required by runtime components, admission surfaces, control
      planes, or execution systems.

      '
  governance:
    definition: 'Projection profile selecting semantics required for governance, authority, admission, distribution,
      or policy evaluation.

      '
  conformance:
    definition: 'Projection profile selecting semantics required for fixture resolution, validation, conformance
      execution, or receipt generation.

      '
source_classes:
  vocabulary:
    canonical_artifact: vocabulary.yaml
  invariants:
    canonical_artifact: invariants.yaml
  contracts:
    canonical_artifact: contracts.yaml
  capabilities:
    canonical_artifact: capabilities.yaml
  compilation_profiles:
    canonical_artifact: compilation_profiles.yaml
  architecture_patterns:
    canonical_artifact: architecture_patterns.yaml
  ir_catalog:
    canonical_artifact: ir_catalog.yaml
  solver_catalog:
    canonical_artifact: solver_catalog.yaml
  binding_catalog:
    canonical_artifact: binding_catalog.yaml
  authority_model:
    canonical_artifact: authority_model.yaml
  artifact_model:
    canonical_artifact: artifact_model.yaml
  lifecycle:
    canonical_artifact: lifecycle.yaml
  packet_catalog:
    canonical_artifact: packet_catalog.yaml
  product_kinds:
    canonical_artifact: product_kinds.yaml
  node_archetypes:
    canonical_artifact: node_archetypes.yaml
  dependency_archetypes:
    canonical_artifact: dependency_archetypes.yaml
  technology_capabilities:
    canonical_artifact: technology_capabilities.yaml
  error_taxonomy:
    canonical_artifact: error_taxonomy.yaml
  receipt_catalog:
    canonical_artifact: receipt_catalog.yaml
  semantic_dependency_model:
    canonical_artifact: semantic_dependency_model.yaml
  conformance_profiles:
    canonical_owner: l9-conformance
    # Reachable publication coordinate. The profile body is owned by
    # l9-conformance; this ledger does not admit fixtures or release law.
    admitted_profiles:
      - id: l9.fixture-profile/core@1
        conformance_class: core
        distribution_repository: Quantum-L9/l9-conformance
        distribution_path: catalog/fixture-profile-core-1.yaml
        digest: sha256:3d2cb01a2b872215a3e2298b4e3b3d7ae99ecf867d6486f5730a3f98aba2bb2f
  product_topology:
    canonical_artifact: product_topology.schema.yaml
  requirement_model:
    canonical_artifact: requirement_model.yaml
  resolution_model:
    canonical_artifact: resolution_model.yaml
  capability_resolution:
    canonical_artifact: capability_resolution.yaml
  architecture_rules:
    canonical_artifact: architecture_rules.yaml
  port_catalog:
    canonical_artifact: port_catalog.yaml
  technology_profiles:
    canonical_artifact: technology_profiles.yaml
  conformance_model:
    canonical_artifact: conformance_model.yaml
  product_manifest:
    canonical_artifact: product_manifest.schema.yaml
  identity_model:
    canonical_artifact: identity_model.yaml
  actor_registry:
    canonical_artifact: actor_registry.yaml
  surface_registry:
    canonical_artifact: surface_registry.yaml
  repository_registry:
    canonical_artifact: repository_registry.yaml
  repository_classes:
    canonical_artifact: repository_classes.yaml
