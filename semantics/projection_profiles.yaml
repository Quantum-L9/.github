  purpose: >-
    Supply a repository operations compiler with the minimum canonical IR identity,
    target bindings, target technology facts, authority boundaries, artifact classes,
    and failure semantics required to lower an authority-resolved repository operations
    IR into Python pyproject.toml and thin Makefile projections without exposing or
    globalizing unrelated repository semantics.
