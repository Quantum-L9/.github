- id: l9.projection/gar-architecture-observer@1
  class: consumer
  consumer: l9-global-architect
  purpose: 'Supply GAR with the minimum canonical architecture vocabulary, patterns, invariants, contracts, capabilities,
    authority rules, and lifecycle semantics needed to reason about architecture and observe candidate patterns
    for upstream graduation.

    '
  sources:
    vocabulary:
      selectors:
      - $.terms.projection
      - $.terms.derivation
      - $.terms.synthesis
      - $.terms.binding
      - $.terms.lowering
      - $.terms.rendering
      - $.terms.semantic_owner
      - $.terms.provider
      - $.terms.harvest
      - $.terms.globalization_candidate
      - $.terms.admission
      - $.terms.provenance
    invariants:
      selectors:
      - $.invariants[*].id
      - $.invariants[*].statement
      - $.invariants[*].scope
      - $.invariants[*].owner
    contracts:
      selectors:
      - $.contracts[*].id
      - $.contracts[*].purpose
      - $.contracts[*].scope
      - $.contracts[*].guarantees
      - $.contracts[*].forbidden
    capabilities:
      selectors:
      - $.global_rules
      - $.capability_entry_contract
      - $.capability_state_dimensions
      - $.invocability_contract
      - $.capability_relations
      - $.capabilities[*].id
      - $.capabilities[*].semantic_owner
      - $.capabilities[*].effect_class
      - $.capabilities[*].requires
    architecture_patterns:
      selectors:
      - $.patterns[*].id
      - $.patterns[*].class
      - $.patterns[*].purpose
      - $.patterns[*].preconditions
      - $.patterns[*].guarantees
      - $.patterns[*].forbidden
      - $.patterns[*].compatible_with
      - $.patterns[*].common_examples
      - $.composition_rules[*]
    authority_model:
      selectors:
      - $.authority_classes
      - $.admission_rules
      - $.promotion_rules
    lifecycle:
      selectors:
      - $.lifecycles.architecture_pattern
      - $.lifecycles.globalization_candidate
      - $.lifecycles.harvest_packet
  output:
    schema: l9.projection.gar-architecture-observer/v1
  forbidden:
  - provider_implementation_details
  - target_rendering_details
  - unrelated_domain_payloads
