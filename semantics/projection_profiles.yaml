  - dependency_constraint_invention
  - build_backend_invention
  - target_artifact_as_semantic_authority
  - node_or_package_json_semantics_in_first_version

projection_engine_contract_ref:
  artifact: projection_engine_contract.yaml
  artifact_id: l9.compiler/projection-engine@1
  rule: 'Projection-engine behavior is owned by the standalone canonical contract. This profile catalog selects
    projection semantics and MUST NOT redefine the engine contract.

    '
composed_projection_rules:
  canonical: false
  definition: 'A downstream projection artifact assembled from two or more independently produced canonical-source
    projections for one bounded consumer or compilation stage.

    '
  creation:
    expression: "ComposedProjection = Compose(\n  Projection_1,\n  Projection_2,\n  ...,\n  Projection_n\n)\n"
  requirements:
  - every_component_projection_is_valid
  - every_component_projection_has_provenance
  - composition_profile_is_declared
  - collisions_are_detected
  - conflicting_semantics_are_not_silently_reconciled
  - output_digest_is_computed
  - source_projection_digests_are_preserved
  authority:
    class: derived
  may_be_consumed_by:
  - semantic_compilation_stage
  - agent
  - runtime
  - conformance_system
  - documentation_renderer
  may_not:
  - become_canonical_source
  - modify_component_projection_semantics
  - hide_semantic_conflicts
validation_rules:
- id: PROJECTION-001
  rule: every_projection_profile_has_unique_versioned_id
- id: PROJECTION-002
  rule: every_source_reference_resolves_to_canonical_source_class
- id: PROJECTION-003
  rule: every_selector_is_deterministic
- id: PROJECTION-004
  rule: projection_must_not_create_new_semantic_authority
- id: PROJECTION-005
  rule: projection_must_preserve_source_provenance
- id: PROJECTION-006
  rule: projection_digest_must_be_deterministic
- id: PROJECTION-007
  rule: source_digest_change_marks_projection_stale
- id: PROJECTION-008
  rule: profile_digest_change_marks_projection_stale
- id: PROJECTION-009
  rule: undeclared_derivation_inside_projection_is_invalid
- id: PROJECTION-010
  rule: composed_projection_conflicts_must_fail_closed
- id: PROJECTION-011
  rule: composed_projection_is_downstream_and_noncanonical
- id: PROJECTION-012
  rule: stage_projection_must_be_minimum_sufficient_for_declared_stage
