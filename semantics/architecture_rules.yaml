schema: l9.architecture-rules/v1
artifact_id: l9.architecture-rules/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_architecture_entailment_rules
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: architecture_rules.yaml
governed_by:
  contracts:
    - l9.contract/semantic-resolution@1
    - l9.contract/hard-constraint@1
    - l9.contract/validation-and-correctness@1
global_rules:
  rules_derive_obligations_not_complete_architectures: true
  architecture_patterns_remain_separate_catalog: true
  provider_choice_does_not_define_semantic_structure: true
  architecture_synthesis_may_not_invent_domain_law: true
rule_shape:
  required:
    - id
    - when
    - derive
    - source_refs
  optional:
    - forbid
    - requires_patterns
    - compatible_patterns
    - evidence_requirements
rules:
  - id: l9.arch-rule/provider-backed-semantics@1
    when:
      requirement: replaceable_external_realization
    derive:
      architecture_obligations:
        - provider_neutral_port
        - provider_adapter_boundary
        - independent_conformance
    source_refs:
      - L9-SEM-001
      - L9-IDENTITY-001
      - L9-COMPAT-001
  - id: l9.arch-rule/consequential-capability@1
    when:
      effect_requirement: consequential
    derive:
      architecture_obligations:
        - explicit_authority_boundary
        - receipt_support
        - failure_semantics
        - reconciliation_or_unknown_handling
    source_refs:
      - L9-AUTH-001
      - L9-EVIDENCE-001
      - L9-UNKNOWN-001
  - id: l9.arch-rule/canonical-source-multiple-views@1
    when:
      requirement: multiple_consumer_views_of_same_semantics
    derive:
      architecture_obligations:
        - canonical_source
        - projection_profiles
        - digest_bound_provenance
    source_refs:
      - L9-OWNER-001
      - L9-PROJECTION-001
      - L9-PROV-001
resolution_rule: Applicable admitted patterns and derived obligations are composed only after all 
  rule preconditions and hard requirements are satisfied.
