schema: l9.schema-definition/v1
artifact_id: l9.schema/product-manifest@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_product_manifest_schema
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: product_manifest.schema.yaml
governed_by:
  contracts:
  - l9.contract/product-manifest@1
  - l9.contract/provenance-and-coordinate@1
  - l9.contract/revision-and-supersession@1
purpose: 'Define the proof-carrying derived realization closure compiled from one exact authoritative ProductTopology
  under pinned semantic and compiler coordinates.

  '
type: object
required:
- schema
- product
- source_topology
- authority
- identity
- requirements
- capabilities
- architecture
- ports
- adapters
- relationships
- technology
- bindings
- providers
- admission
- lifecycle
- conformance
- compiler
- provenance
- unresolved
- manifest_digest
properties:
  schema:
    const: l9.product-manifest/v1
  product:
    type: object
    required:
    - id
    - kind
    - archetype_ref
  source_topology:
    type: object
    required:
    - ref
    - digest
    fields:
      ref: semantic_ref
      digest: semantic_digest
  authority:
    type: object
  requirements:
    type: object
  capabilities:
    type: object
  architecture:
    type: object
  ports:
    type: object
  adapters:
    type: object
  relationships:
    type: object
  technology:
    type: object
  bindings:
    type: object
  providers:
    type: object
  runtime:
    type: object
  communication:
    type: object
  security:
    type: object
  state:
    type: object
  failure:
    type: object
  receipts:
    type: object
  observability:
    type: object
  admission:
    type: object
  lifecycle:
    type: object
  conformance:
    type: object
  compatibility:
    type: object
  distribution:
    type: object
  build:
    type: object
  compiler:
    type: object
    required:
    - profile_ref
    - profile_digest
    fields:
      profile_ref: semantic_ref
      profile_digest: semantic_digest
      compiler_version: semantic_ref_or_string
  provenance:
    type: object
  unresolved:
    type: array
  manifest_digest:
    type: semantic_digest
  identity:
    type: object
  governance:
    type: object
resolved_manifest_gate:
  all_of:
  - source_product_topology_valid
  - product_kind_resolved
  - product_archetype_resolved
  - governance_profile_separate_from_identity
  - identity_resolution_contract_resolved
  - identity_topology_resolved
  - hard_requirements_resolved
  - capability_closure_resolved
  - architecture_obligations_resolved
  - required_ports_resolved
  - required_adapters_resolved
  - product_relationships_resolved
  - provider_bindings_admissible
  - admission_requirements_resolved
  - conformance_requirements_resolved
  - authority_boundaries_valid
  - unresolved_hard_semantic_gaps_empty
  rule: 'A ProductManifest may exist while unresolved, but implementation lowering may consume only a manifest satisfying
    the resolved_manifest_gate.

    '
semantic_rules:
- manifest_is_proof_carrying_derived_semantics
- manifest_does_not_become_product_or_domain_owner
- manifest_preserves_exact_source_topology_and_profile_coordinates
- manifest_preserves_product_kind_and_archetype_identity
- material_upstream_change_invalidates_currentness_until_recompiled_or_compatibility_proven
- manifest_preserves_identity_dimension_semantics
- manifest_preserves_identity_resolution_and_assertion_contract_coordinates
- manifest_does_not_collapse_governance_profile_into_identity
