schema: l9.resolution-model/v1
artifact_id: l9.resolution-model/global@1
canonical: true
authority:
  owner: Quantum-L9/.github
  scope: l9_global_resolution_semantics
  authority_class: canonical
canonical_source:
  format: yaml
  artifact: resolution_model.yaml
governed_by:
  contracts:
    - l9.contract/semantic-resolution@1
    - l9.contract/unknown-and-degradation@1
    - l9.contract/provenance-and-coordinate@1
global_rules:
  all_resolvers_share_one_result_algebra: true
  resolution_is_evidence_bound: true
  resolution_does_not_admit_subjects: true
  unknown_is_not_resolved: true
  ambiguity_is_not_silently_collapsed: true
  incompatibility_is_not_optimization_failure: true
result_domain:
  resolved: Exactly one admissible resolution or an explicitly admitted equivalent set is 
    established.
  unresolved: Required information, authority, evidence, or semantic definition is insufficient.
  incompatible: Declared requirements and candidate realization are semantically incompatible.
  unsat: Applicable hard requirements admit no satisfying resolution.
  ambiguous: Multiple materially distinct resolutions remain and no canonical selection rule 
    resolves them.
resolution_record:
  required:
    - subject_ref
    - inputs
    - result
    - evidence_refs
    - provenance
    - coordinates
  optional:
    - selected
    - rejected
    - unresolved_refs
    - conflict_refs
    - compatibility_refs
    - optimization_receipt_ref
selection_rules:
  - selection_occurs_only_within_resolved_feasible_set
  - optimization_must_not_convert_incompatible_or_unsat_into_resolved
  - selected_realization_does_not_become_semantic_owner
