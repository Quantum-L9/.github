schema_version: "1.0"
kernel_provider: "Quantum-L9/l9-ci-core"
last_audited: "2026-10-22"

# Organization CI is Quantum-L9/l9-ci-core/.github/workflows/org-ci.yml,
# required directly by the organization ruleset "L9 canonical CI required"
# (rulesets/l9-canonical-ci-required.json). This repository distributes no
# CI caller, no governance pack and no Core pin; consumers reference no Core
# workflow for organization enforcement.
#
# History: the v1 reusable kernels this registry once catalogued
# (pr-pipeline, release-publish, nightly, pre-commit-ci, trio-governance,
# security, scorecard, sbom; interface frozen at 2b330a5 / 7148fc7) were
# retired from Core main on 2026-10-22 (l9-ci-core AGENTS.md §15). A consumer
# that still pins one at a full SHA keeps resolving that revision; none is a
# supported interface, and no new caller may be written. The `v1` moving tag
# is not a Core release and has no authorized writer.

v2:
  schema_version: "1.0"
  kernel_provider: "Quantum-L9/l9-ci-core"
  status: "released"
  canonical_workflow: ".github/workflows/org-ci.yml"
  enforcement: "organization required-workflow ruleset (L9 canonical CI required)"
  consumer_uses_reference: none
  reusable_workflows: []
  consumer_owned_templates: []
  governance_files: []
  excluded_from_pack:
    # Owned solely by this repo's own community-health files; never synced
    # from l9-ci-core.
    - ".github/ISSUE_TEMPLATE/*"
    - ".github/pull_request_template.md"
  no_v2_equivalent:
    # SDK does not implement these providers — do not re-add as Core
    # reusable workflows without an explicit, authorized scope change.
    - scorecard
    - sbom
    - gitleaks
    - pre-commit
    - dedicated-nightly-release-kernel

retired_kernels:
  retired_on: "2026-10-22"
  last_published_sha: "7148fc73dcbf41367f5c5401432dc997b1f4f869"
  names:
    - pr-pipeline
    - release-publish
    - nightly
    - pre-commit-ci
    - trio-governance
    - security   # still present in Core for Core's own self-security dogfood; not a consumer interface
    - scorecard
    - sbom
