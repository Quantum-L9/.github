proposal:
  recommended_term: incompatible_until_resolved
  rationale:
    - it names the binding outcome (compatibility), matching the RequiredCapabilities ⊆ ProviderCapabilities rule both sites state
    - it is the term the D2 two-tier evaluation uses
    - 'the word unsupported reads as a provider fact (not_provided); an unknown capability is not a known absence'
  successor_change: >
    In the D2 successor release, set binding_catalog.yaml compatibility.unknown_capability
    to incompatible_until_resolved; leave technology_capabilities.yaml unchanged; record that
    both map to error_taxonomy binding.unknown_capability result UNKNOWN and to
    l9.contract/technology-binding@1 outcome unresolved.
  validator: >
    A new semantic check fails if binding_catalog.yaml#compatibility.unknown_capability and
    technology_capabilities.yaml#binding_rules.unknown_capability.result differ.
  blast_radius: two YAML values in .github; vendored copies in the compiler refresh on its next authority sync; no executable reader found
  decision: owner (DR-D2-04)
