      - authority/admitted/.github/binding_catalog.yaml
      - authority/admitted/.github/technology_capabilities.yaml
      - 'tests/specimens/github-semantics-f9993ed1/semantics/{binding_catalog,technology_capabilities,error_taxonomy,contracts}.yaml'
