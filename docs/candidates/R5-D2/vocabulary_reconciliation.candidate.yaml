    - semantics/contracts.yaml L792 l9.contract/technology-binding@1 forbidden unknown_capability_treated_as_supported

consumers:
  Quantum-L9/.github:
    executable_readers: none   # grep of scripts/ and Repo.mk finds no reader of either value
    validators: none
  Quantum-L9/l9-semantic-compiler-engine:
    executable_readers: none_found
