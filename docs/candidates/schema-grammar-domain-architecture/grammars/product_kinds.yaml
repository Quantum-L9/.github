        product_kind_is_not_inferred_from_repository_shape:
          type: boolean
        product_kind_is_not_inferred_from_package_format:
          type: boolean
        product_kind_is_not_inferred_from_provider_identity:
          type: boolean
        product_kind_is_not_inferred_from_semantic_complexity:
          type: boolean
        product_kind_is_not_inferred_from_process_presence_alone:
          type: boolean
        product_kind_does_not_create_semantic_ownership:
          type: boolean
        every_admitted_product_has_exactly_one_primary_kind:
          type: boolean
        archetype_specializes_kind_without_redefining_kind:
          type: boolean
        product_kind_constrains_identity_obligations_without_redefining_identity_semantics:
          type: boolean
        identity_dimension_meaning_is_owned_by_identity_model:
          type: boolean
        kind_law_applies_unmodified_unless_an_admitted_product_kind_exception_binds_the_exact_product:
          type: boolean
        product_kind_exception_is_not_a_product_kind_archetype_or_waiver_class:
          type: boolean
        product_kind_exception_is_admitted_only_by_the_product_kind_owner:
