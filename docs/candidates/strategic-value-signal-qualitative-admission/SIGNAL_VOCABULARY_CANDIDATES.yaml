# ADMISSION CANDIDATE ONLY: terms to append to Quantum-L9/.github/semantics/vocabulary.yaml#terms.
# Comparator: Quantum-L9/.github@dc96a8ae9f31e359bb0e52a0b1d778fc8f265d99
# Baseline vocabulary blob: 22b04a8e6f97d661e30c1eb68a3281e086e74f88
# Distinct from existing bidirectional_value_propagation and value_propagation_mesh,
# which govern causal value topology, not movement of evidence-bearing information.
# No new signal transport, schema, memory, owner, projection, or permission is implied.
terms:
  signal:
    semantic_class: semantic_concept
    definition: >-
      Source-attributed information such as an observation, result, warning,
      correction, hypothesis, challenge, or learned constraint, capable of
      informing an eligible consumer. Its claim and any evidence, provenance,
      context, uncertainty, and semantic ownership remain distinguishable;
      the signal itself is not authoritative truth, permission, or proven value.
    question: >-
      What information is being communicated, from which source, under whose
      meaning, and with what supporting evidence and uncertainty?
  signal_propagation:
    semantic_class: semantic_concept
    definition: >-
      Governed movement or availability of a signal from its source to an
      authorized eligible consumer through an existing interface, preserving
      the meaning and lineage needed for its intended use. Sending, delivery,
      acceptance, retention, and later consumption are different observations.
      Signal propagation does not itself assert causal value propagation.
    question: >-
      Which authorized consumer received which meaning-preserving information,
      and what actual delivery stage is supported by evidence?
  signal_feedback_episode:
    semantic_class: semantic_concept
    definition: >-
      A risk-bounded sequence in which returned evidence-bearing information
      can challenge or change state available to a later eligible consumer,
      with appropriate control of replay and unjustified convergence claims.
      Circular message flow and finite hop count alone do not establish learning,
      mathematical convergence, authorized write-back, or realized Strategic Value.
    question: >-
      What changed or was challenged for a later eligible consumer, and what
      bounds prevent unjustified recurrence or convergence claims?
  signal_consumption:
    semantic_class: semantic_concept
    definition: >-
      Evidenced use of a previously delivered signal by an eligible actor or
      system in a later authorized decision, validation, or operation, distinct
      from receipt, storage, acknowledgement, or merely being technically
      reachable. Consumption alone does not prove a positive objective-relative
      result or transfer authority over the affected decision.
    question: >-
      Which later authorized action actually used the information, as opposed
      to merely receiving or storing it?
