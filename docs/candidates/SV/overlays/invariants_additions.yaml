invariants:
- id: L9-SV-001
  statement: For an assessment asserting quantified Strategic Value, declare the objective, compatible utility units, feasible counterfactual baseline,
    bounded horizon, applicable discount and utility-flow basis, model/evidence coordinates, and material uncertainty. When causal intervention effects
    are claimed, intervention and baseline must be defensibly comparable in their decision-relevant initial conditions, utility measure, exogenous context,
    and temporal and observation basis, or their divergence must be explicitly identified and justified under the selected method. Convenient scenario pairing
    or historical correlation alone does not establish a causal intervention effect. Unknown, incompatible, or materially unidentified inputs cannot establish
    a complete causally attributed Strategic Value ranking.
  scope: global
  owner: Quantum-L9/.github
- id: L9-SV-002
  statement: For an assessment asserting quantified Strategic Value, every material consequence must have an exhaustive, mutually exclusive accounting partition
    across IEV, SFV, DC, ERL and OC. Reconcile gross and net utility, common causal/time identities, separately subtracted versus embedded costs and losses,
    overlaps, attribution and probability weighting; conflicting or missing coverage remains Unknown or conditional, not zero.
  scope: global
  owner: Quantum-L9/.github
