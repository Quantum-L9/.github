  contract_obligation_refs:
  - explicit_objective_utility_units_and_feasible_baseline
  - defensible_counterfactual_comparability_under_selected_method
  - counterfactual_worlds_share_defensible_initial_conditions_time_basis_and_identification_assumptions
  falsifier_case_ref: SV015
  statement_change: VERBATIM_CONCATENATION_OF_DONOR_SV001_AND_SV015_OWNER_APPROVED_D1
  amended_statement: >-
    For an assessment asserting quantified Strategic Value, declare the objective, compatible utility units,
    feasible counterfactual baseline, bounded horizon, applicable discount and utility-flow basis, model/evidence
    coordinates and material uncertainty. Unknown or incompatible inputs cannot establish a complete Strategic Value
    ranking. For a Strategic Value claim, a counterfactual comparison must identify the same decision-relevant
    initial conditions, utility measure, exogenous context and time basis across intervention and baseline worlds,
    or explicitly quantify their divergence. A convenient scenario pairing or historical correlation is not evidence
    of an identifiable causal intervention effect.
  owner_review_resolution:
  - D1 Option B keeps the donor SV-001 text verbatim, including its unqualified consequence "cannot establish a
    complete Strategic Value ranking", and appends the donor SV-015 text verbatim, including its claim-wide scope
    and "explicitly quantify their divergence". Independent review findings 1-2 no longer apply.
  superseded_development_statement: >-
    For an assessment asserting quantified Strategic Value, declare the objective, compatible utility units,
    feasible counterfactual baseline, bounded horizon, applicable discount and utility-flow basis, model/evidence
    coordinates, and material uncertainty. When causal intervention effects are claimed, intervention and baseline
    must be defensibly comparable in their decision-relevant initial conditions, utility measure, exogenous context,
    and temporal and observation basis, or their divergence must be explicitly identified and justified under the
    selected method. Convenient scenario pairing or historical correlation alone does not establish a causal
    intervention effect. Unknown, incompatible, or materially unidentified inputs cannot establish a complete
    causally attributed Strategic Value ranking.
  owner_decision_status: approved
  owner_decision_ref: evidence/admission/owner-decision.yaml
  candidate_revision: 85531616cee2da94bbb7154418a78537549a4d76
