  falsifier_case_ref: SV015
  statement_change: AMENDED_MATERIAL_SEMANTIC_CHANGE_REQUIRES_OWNER_REVIEW
  amended_statement: >-
    For an assessment asserting quantified Strategic Value, declare the objective, compatible utility units, feasible
    counterfactual baseline, bounded horizon, applicable discount and utility-flow basis, model/evidence coordinates,
    and material uncertainty. When causal intervention effects are claimed, intervention and baseline must be
    defensibly comparable in their decision-relevant initial conditions, utility measure, exogenous context, and
    temporal and observation basis, or their divergence must be explicitly identified and justified under the
    selected method. Convenient scenario pairing or historical correlation alone does not establish a causal
    intervention effect. Unknown, incompatible, or materially unidentified inputs cannot establish a complete
    causally attributed Strategic Value ranking.
  owner_review_points:
  - The final sentence changes the original consequence clause from "a complete Strategic Value ranking" to "a
    complete causally attributed Strategic Value ranking"; the owner must decide whether that narrowing is intended.
  - The merged SV-015 safeguard says divergence must be "explicitly identified and justified under the selected
    method" where SV-015 said "explicitly quantify their divergence"; the original wording is preserved verbatim in
    the relocation ledger and the contract obligation is unchanged.
