schema: l9.sv-admission-owner-decision/v1
schema_note: >-
  Proposed record format, not an existing canonical schema. The binding record must follow the admission
  mechanism the repository already uses: semantics/authority_model.yaml admission_rules (exact subject identity,
  exact revision or digest, target class, target-class authority, explicit decision record) as realized by
  docs/adr/ADR-025 for v3.28.0. This file is a scaffold for that decision. It is not one.
decision_status: PENDING_UNTIL_AUTHORIZED
not_claimed:
- owner decision
- admission
- approval of any disposition, wording or provenance route
subject:
  repository: Quantum-L9/.github
  candidate_pr: 215
  candidate_revision: null
  candidate_revision_note: >-
    The exact final candidate SHA is fixed only after the owner selects the SV-001 wording and the provenance
    route, since either choice changes the subject. Bind it then; never to an intermediate head.
  candidate_digest: null
target:
  authority_class: canonical
  semantic_owner: Quantum-L9/.github
  admission_base: null
  admission_base_note: >-
    Re-resolve from freshly fetched origin/main at admission time. At this scaffold origin/main is 9488d8f, not the
    pack pin 020a94b; see ADMISSION_CLOSEOUT.md.
proposed_dispositions:
  L9-SV-001: KEEP
  L9-SV-002: KEEP
  L9-SV-015: MERGE
  L9-SV-016: CONTRACT
  L9-SV-017: CONTRACT
  L9-SV-018: CONTRACT
  L9-SV-019: REUSE
  L9-SV-020: REUSE
proposed_dispositions_ref: ../reduction-v1/owner-disposition-ledger.yaml
decisions_required:
- id: D1-sv001-wording
  question: Which L9-SV-001 statement is admitted?
  options:
    A-development-pack:
      status: in the pack today (overlays/invariants_additions.yaml)
      classification: independent review findings 1-2 classify it as a weakening of SV-001 and SV-015
      statement: >-
        For an assessment asserting quantified Strategic Value, declare the objective, compatible utility units,
        feasible counterfactual baseline, bounded horizon, applicable discount and utility-flow basis, model/evidence
        coordinates, and material uncertainty. When causal intervention effects are claimed, intervention and
        baseline must be defensibly comparable in their decision-relevant initial conditions, utility measure,
        exogenous context, and temporal and observation basis, or their divergence must be explicitly identified
        and justified under the selected method. Convenient scenario pairing or historical correlation alone does
        not establish a causal intervention effect. Unknown, incompatible, or materially unidentified inputs cannot
        establish a complete causally attributed Strategic Value ranking.
    B-non-weakening:
      status: not applied; the operator brief recommends it
      classification: >-
        original SV-001 (donor) verbatim followed by original SV-015 (donor) verbatim; keeps the unqualified ranking
        consequence, the claim-wide scope and "explicitly quantify their divergence"
      statement: >-
        For an assessment asserting quantified Strategic Value, declare the objective, compatible utility units,
        feasible counterfactual baseline, bounded horizon, applicable discount and utility-flow basis,
        model/evidence coordinates and material uncertainty. Unknown or incompatible inputs cannot establish a
        complete Strategic Value ranking. For a Strategic Value claim, a counterfactual comparison must identify the
        same decision-relevant initial conditions, utility measure, exogenous context and time basis across
        intervention and baseline worlds, or explicitly quantify their divergence. A convenient scenario pairing or
        historical correlation is not evidence of an identifiable causal intervention effect.
      consequences_if_selected:
      - rewrite overlays/invariants_additions.yaml L9-SV-001 and the SV-015 lineage meaning_preservation
      - update owner-disposition-ledger.yaml statement_change and the SV-015 MERGE record
      - regenerate both candidate schemas (synthesis/) and re-pin tests that freeze the statement
      - discard all projection evidence bound to the old text; rerun the producer at the new subject
  selected: null
- id: D2-composition-provenance
  question: How does l9.compose/strategic-planner-value@1 reach a genuine composition PASS?
  evidence: composition-provenance-equivalence.json
  options:
    R1-remove-redundant-stanza:
      effect: >-
        Drop the profile-local required_provenance list; the general composed-projection contract and the
        compiler's always-on criteria still enforce the same facts (proved independently, both runs, 16 negative
        controls).
      caution: >-
        Precedent on main is mixed: l9.compose/stage-context@1 declares the same four tokens; the other thirteen
        composition profiles (including pr-audit and architecture-intelligence) declare none. Requires an owner
        finding that the profile-local declarations are not independently normative.
    R2-implement-compiler-criteria:
      effect: >-
        Keep all four declarations and give l9-semantic-compiler-engine a mechanical criterion for each token,
        mapped onto component_provenance, composition_equivalence and composition_profile_currentness.
      caution: >-
        Separate compiler change and release; also resolves stage-context, which would hit the same UNKNOWN. Treat
        the declarations as normative.
  selected: null
- id: D3-derived-ledger-rebinding
  question: >-
    Confirm capabilities.yaml, lifecycle.yaml and receipt_catalog.yaml need only derivation-digest rebinding.
  selected: null
- id: D4-successor-release
  question: Which semantic-foundation release carries SV?
  facts:
  - v3.28.0 is admitted (ADR-025); the version the brief proposed is therefore taken.
  - v3.29.0 is an unadmitted candidate on main (ADR-026); validate-semantics.py SC-008 checks the highest numeric release
    directory regardless of admission status.
  options:
    V1: new successor v3.30.0 after v3.29.0 is admitted or withdrawn
    V2: fold SV into the v3.29.0 candidate before its admission
  selected: null
- id: D5-merge-order
  question: Order of SV admission relative to the open v3.29.0 candidate (ADR-026).
  selected: null
approved_sv001_statement_ref: null
authorized_decider_ref: null
decision_evidence_ref: null
decision_record_ref: null
decision_record_ref_note: >-
  Expected to be an ADR under docs/adr/ (next free number at admission time), naming the owner's instruction, the
  approved semantics tree hash and the qualified commit, as ADR-025 does. One properly scoped decision may bind all
  eight dispositions; do not manufacture eight approvals.
