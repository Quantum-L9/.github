          contracts:
            type: array
            min_items: 3
            items:
              type: string
      purpose:
        type: string
      identity:
        type: object
        required:
        - semantic_ref
        - canonical_term_ref
        - related_term_ref
        - assessment_contract_ref
        - numerical_owner
        - strategic_plan_owner_ref
