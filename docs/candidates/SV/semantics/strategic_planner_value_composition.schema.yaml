                  embedded_cost_handling:
                    type: string
                  zero_bucket_semantics:
                    type: string
                  incomplete_coverage_result:
                    type: string
              sign_and_expectation_discipline:
                type: array
                min_items: 4
                items:
                  type: string
              example_equivalence:
                type: object
                required:
