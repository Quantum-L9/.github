schema: l9.schema-definition/v1
canonical: true
authority:
  owner: Quantum-L9/.github
  authority_class: canonical
  scope: l9_global_strategic_planner_value_composed_payload_schema
artifact_id: l9.schema/strategic-planner-value-composition@1
canonical_source:
