            properties:
              source_candidate_id:
                const: L9-SV-015
              meaning:
                const: For a Strategic Value claim, a counterfactual comparison must identify the same decision-relevant
                  initial conditions, utility measure, exogenous context and time basis across intervention and
                  baseline worlds, or explicitly quantify their divergence. A convenient scenario pairing or historical
                  correlation is not evidence of an identifiable causal intervention effect.
              disposition:
                const: MERGE
              governing_invariants:
                type: array
                min_items: 1
                items:
                  type: string
                  enum:
                  - L9-SV-001
                  - L9-SV-002
                  - L9-AUTH-001
                  - L9-AUTH-002
                  - L9-HARD-001
                  - L9-UNKNOWN-001
                  - L9-STRATEGY-001
                  - L9-PROJECTION-001
                  - L9-PROV-001
                  - L9-EVIDENCE-001
                  - L9-ASSURANCE-001
                  - L9-COORD-001
              model_section:
