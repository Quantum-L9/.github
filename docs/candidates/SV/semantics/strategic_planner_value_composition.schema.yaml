schema: l9.schema-definition/v1
canonical: true
authority:
  owner: Quantum-L9/.github
  authority_class: canonical
  scope: l9_global_strategic_planner_value_composed_payload_schema
artifact_id: l9.schema/strategic-planner-value-composition@1
canonical_source:
  format: yaml
  artifact: strategic_planner_value_composition.schema.yaml
governed_by:
  composition_profile_ref: l9.compose/strategic-planner-value@1
  projection_profile_ref: l9.projection/strategic-planner-value@1
purpose: Validate one derived consumer view made of exactly five independently compiled per-source projections under
  their source-class names, without reinterpreting or merging source meanings. Exact source coverage and producer
  provenance remain separate composition/replay obligations.
type: object
required:
- strategic_value_model
- vocabulary
- invariants
- contracts
- authority_model
properties:
  schema:
    const: l9.composed-projection.strategic-planner-value/v1
  strategic_value_model:
    type: object
    required:
    - artifact_id
    - authority
    - canonical_source
    - governed_by
    - purpose
    - identity
    - valuation
    - counterfactual_mathematics
    - strategic_interaction_lookahead
    - assessment_claim_levels
    - evaluation_integrity
    - causal_accounting
    - forecast_and_realization
    - comparisons
    - explicit_non_ownership
    - assessment_applicability
    - retained_former_candidate_semantics
    properties:
