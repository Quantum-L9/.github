governed_by:
  composition_profile_ref: l9.compose/strategic-planner-value@1
  projection_profile_ref: l9.projection/strategic-planner-value@1
purpose: Validate one derived consumer view made of exactly five independently compiled per-source projections under
  their source-class names, without reinterpreting or merging source meanings. Exact source coverage and producer
  provenance remain separate composition/replay obligations.
type: object
required:
- strategic_value_model
- vocabulary
- invariants
- contracts
- authority_model
