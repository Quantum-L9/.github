                - mutually_exclusive_booking
                - exhaustive_material_consequence_coverage
                - each_effect_requires_stable_causal_and_period_identity
                - each_effect_requires_one_accounting_home_after_reconciliation
                - shared_or_overlapping_effects_require_explicit_attribution_and_exclusion
                - common_utility_units_time_basis_and_discount_treatment_required
                - losses_and_costs_already_reflected_in_utility_flows_cannot_be_subtracted_again
                - unknown_effect_booking_never_defaults_to_zero
