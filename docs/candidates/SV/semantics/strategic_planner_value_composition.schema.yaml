                    type: string
                  reconciled_net:
                    type: string
                  invalid:
                    type: string
              negative_witnesses:
                type: object
                required:
                - embedded_DC_subtracted_again
                - embedded_expected_risk_loss_subtracted_again
                - embedded_opportunity_cost_subtracted_again
                - unclassified_material_consequence
                - zero_subtraction_without_ledger_basis
                - same_effect_in_mutually_exclusive_scenarios
                - genuinely_distinct_recurring_period_effects
                properties:
                  embedded_DC_subtracted_again:
                    type: string
                  embedded_expected_risk_loss_subtracted_again:
                    type: string
                  embedded_opportunity_cost_subtracted_again:
                    type: string
                  unclassified_material_consequence:
                    type: string
                  zero_subtraction_without_ledger_basis:
