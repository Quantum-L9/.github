    relocated_additional_candidate_semantics:
      type: object
      fields:
        L9-SV-015:
          type: object
          fields:
            source_candidate_id:
              type: string
              const: L9-SV-015
            meaning:
              type: string
              const: For a Strategic Value claim, a counterfactual comparison must identify the same decision-relevant initial conditions, utility measure, exogenous context and time basis across intervention and baseline worlds, or explicitly quantify their divergence. A convenient scenario pairing or historical correlation is not evidence of an identifiable causal intervention effect.
            disposition:
              type: string
              const: MERGE
            governing_invariants:
              type: array
              items:
                type: string
                enum:
                - L9-SV-001
                - L9-SV-002
                - L9-AUTH-001
                - L9-AUTH-002
                - L9-HARD-001
                - L9-UNKNOWN-001
                - L9-STRATEGY-001
                - L9-PROJECTION-001
                - L9-PROV-001
                - L9-EVIDENCE-001
                - L9-ASSURANCE-001
                - L9-COORD-001
              min_items: 1
            model_section:
              type: string
              const: evaluation_integrity.counterfactual_identification
            contract_obligation:
              type: string
              const: counterfactual_worlds_share_defensible_initial_conditions_time_basis_and_identification_assumptions
            when:
              type: string
              const: causal_intervention_effect_is_claimed
            authority_status:
              type: string
              const: not_admitted_as_independent_invariant
          additional_properties: true
          required:
          - source_candidate_id
          - meaning
          - disposition
          - governing_invariants
          - model_section
          - contract_obligation
          - when
          - authority_status
        L9-SV-016:
          type: object
          fields:
            source_candidate_id:
              type: string
              const: L9-SV-016
            meaning:
              type: string
              const: For a Strategic Value claim, the assessment must declare the focal beneficiary or authorized social-welfare aggregation before combining outcomes across actors. Benefits to counterparties, externalities, transfers and costs cannot be credited to the focal objective twice or silently converted between actors with incompatible utilities.
            disposition:
              type: string
              const: CONTRACT
            governing_invariants:
              type: array
              items:
                type: string
                enum:
                - L9-SV-001
                - L9-SV-002
                - L9-AUTH-001
                - L9-AUTH-002
                - L9-HARD-001
                - L9-UNKNOWN-001
                - L9-STRATEGY-001
                - L9-PROJECTION-001
                - L9-PROV-001
                - L9-EVIDENCE-001
                - L9-ASSURANCE-001
                - L9-COORD-001
              min_items: 1
            model_section:
              type: string
              const: evaluation_integrity.beneficiary_scope
            contract_obligation:
              type: string
              const: beneficiary_scope_and_welfare_aggregation_when_cross_actor_effects_material
            when:
              type: string
              const: material_cross_actor_valuation
            authority_status:
              type: string
              const: not_admitted_as_independent_invariant
          additional_properties: true
          required:
          - source_candidate_id
          - meaning
          - disposition
          - governing_invariants
          - model_section
          - contract_obligation
          - when
          - authority_status
        L9-SV-017:
          type: object
          fields:
            source_candidate_id:
              type: string
              const: L9-SV-017
            meaning:
              type: string
              const: When a Strategic Value claim evaluates a sequential decision policy, the policy may condition each action only on observations and information available at the time of that action. A lookahead ranking must not exploit hindsight, future responses or post-action evidence as if they were known at decision time; posterior updates must preserve observation provenance.
            disposition:
              type: string
              const: CONTRACT
            governing_invariants:
              type: array
              items:
                type: string
                enum:
                - L9-SV-001
                - L9-SV-002
                - L9-AUTH-001
                - L9-AUTH-002
                - L9-HARD-001
                - L9-UNKNOWN-001
                - L9-STRATEGY-001
                - L9-PROJECTION-001
                - L9-PROV-001
                - L9-EVIDENCE-001
                - L9-ASSURANCE-001
                - L9-COORD-001
              min_items: 1
            model_section:
              type: string
              const: evaluation_integrity.nonanticipativity
            contract_obligation:
              type: string
              const: nonanticipative_conditional_policies_when_sequential_actions_are_evaluated
            when:
              type: string
