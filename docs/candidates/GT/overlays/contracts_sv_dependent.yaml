contracts:
- id: l9.contract/strategic-value-interaction-composition@1
  purpose: 'Govern a consumer''s interaction-conditioned evaluation using GT response semantics and the independently
    admitted l9.contract/strategic-value-assessment@1 plus l9.strategic.value@1, as proposed in .github PR
    #212. GT does not own valuation, create an SV model, or grant plan or execution authority.'
  scope: global
  owner: Quantum-L9/.github
  source_invariants:
  - L9-GT-001
  - L9-AUTH-002
  - L9-HARD-001
  - L9-UNKNOWN-001
  - L9-PROJECTION-001
  - L9-EVIDENCE-001
  applies_to:
  - assessments_claiming_combined_gt_and_strategic_value
  requires:
  - sv_source_l9_strategic_value_model_and_contract_are_separately_admitted_not_merely_staged_in_pr_212
  - sv_projection_l9_projection_strategic_planner_value_at_1_and_composition_l9_compose_strategic_planner_value_at_1_are_authentic_and_current
  - gt_projection_l9_projection_strategic_planner_interaction_at_1_and_composition_l9_compose_strategic_planner_interaction_at_1_are_authentic_and_current
  - five_source_sv_semantic_view_and_three_source_gt_semantic_view_are_independently_compiled_with_real_producer_provenance
  - combined_assessment_expressly_claims_interaction_conditioned_strategic_value_not_just_gt_only
  - one_explicit_compatible_objective_focal_beneficiary_or_authorized_welfare_aggregation_utility_units_and_feasible_baseline
  - common_initial_state_external_conditions_time_basis_horizon_discount_and_causal_identification_or_explicit_unresolved
  - focal_action_conditional_joint_response_trajectory_distribution_with_complete_probability_mass_or_explicit_unknown
  - model_and_evidence_revision_identity_plus_nonanticipative_actions_at_each_decision_time
  - one_question_appropriate_numerical_owner_method_for_canonical_sv_valuation_not_mandatory_qv
  - one_mutually_exclusive_exhaustive_iev_sfv_dc_erl_oc_accounting_ledger_owned_by_sv_model_with_embedded_cost_reconciliation
  - mutually_exclusive_branches_weighted_once_and_time_indexed_shared_effects_attributed_once
  - material_actors_response_or_unverified_model_adequacy_remain_conditional_or_unknown_under_sv_claim
  - changed_material_actor_model_probability_counterfactual_or_source_revision_invalidates_affected_claim
  - consumer_retains_candidate_selection_strategy_policy_plan_revision_and_action_authorization
  guarantees:
  - gt_only_remains_valid_without_sv_as_separate_unquantified_strategic_assessment
  - sv_only_remains_independent_without_gt_as_separate_mode
  - one_canonical_sv_claim_may_be_conditioned_on_adaptive_response_and_lower_higher_or_equal
  - sv_five_bucket_partition_and_counterfactual_method_are_reused_by_reference_not_redefined
  - unadmitted_incompatible_or_unknown_sv_dependency_cannot_produce_evaluated_numeric_result
  - semantic_projection_composition_does_not_execute_numerical_valuation
  - numerical_owner_result_and_empirical_validation_are_distinct_from_projection_provenance
  - sequential_and_portfolio_math_are_required_only_for_claims_that_use_those_methods
  forbidden:
  - adding_independent_gt_uplift_to_already_counted_sv_effect
  - duplicating_sv_five_bucket_definitions_in_gt
  - reusing_an_unverified_sv_candidate_as_if_admitted
  - silently_merging_conflicting_actor_or_value_assumptions
  - treating_merged_projection_payload_as_executed_numerical_assessment
  - ranking_infeasible_actions_by_soft_value
  - automatic_plan_revision_or_action_from_combined_assessment
  - claiming_sv_contract_is_admitted_because_pr_212_is_open_or_candidate_schemas_pass
  - constructing_gt_plus_sv_value_by_summing_standalone_sv_and_gt_uplift
  - pairing_arbitrary_baseline_and_intervention_worlds_as_causal_identification
  - counting_counterparty_benefits_without_declared_welfare_aggregation
  - mandatory_qv_method_for_all_gt_sv_combined_evaluations
  - ignoring_reversible_preference_under_material_response_uncertainty
  - numerical_ranking_before_five_bucket_causal_accounting_is_reconciled
  outcomes:
    satisfied: one_traceable_interaction_conditioned_canonical_sv_result
    violated: double_counted_incompatible_or_unauthorized_composed_claim
    unresolved: sv_dependency_unadmitted_or_comparison_model_unknown_or_unverified
  applicability:
    trigger: assessment_asserts_combined_gt_conditioned_quantitative_strategic_value
    does_not_apply_to:
    - gt_only_non_sv_assessment
    - sv_only_assessment
    - generic_numerical_reasoning_without_sv_claim
    sv_dependency: independently_admitted_sv_model_contract_projection_and_composition
    qv: only_when_question_appropriate_method_selected
    unknown_resolution: unresolved_without_numeric_claim
